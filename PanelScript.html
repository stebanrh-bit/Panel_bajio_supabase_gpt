<script>
(function () {
  // Set chico de iconos SVG (estilo Lucide) para los pocos lugares clave del rediseño visual
  // (header, sidebar, tarjetas de resumen) — en vez de emojis, para que se vean consistentes y
  // discretos en cualquier tamaño/pantalla.
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>';
  var ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>';
  var ICON_TRUCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="7" width="14" height="10" rx="1.5"></rect><path d="M15 10h4l3 3v4h-7z"></path><circle cx="6" cy="19" r="1.8"></circle><circle cx="17.5" cy="19" r="1.8"></circle></svg>';
  var ICON_ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.5v.01"></path></svg>';
  var ICON_DOCS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>';
  var ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>';
  var ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"></path></svg>';

  // Listas de estatus: vienen del servidor (configPanel_ en Code.gs, la página las mete en
  // window.PANEL_CONFIG). Así el panel y la Vista Gerencia usan exactamente las mismas.
  var PANEL_CONFIG = window.PANEL_CONFIG || {};
  var DONE_STATUSES = PANEL_CONFIG.DONE_STATUSES || [];

  function guardarConVerificacion_(onOk, onFail) {
    return google.script.run.withSuccessHandler(function (res) {
      if (res && res.ok === false) {
        if (onFail) onFail(new Error(res.error || 'El servidor rechazó el cambio'));
        return;
      }
      if (onOk) onOk(res);
    }).withFailureHandler(function (err) {
      if (onFail) onFail(err);
    });
  }
  var STATUS_OPTIONS = ['Cargando', 'En transito', 'En yarda MX', 'Descargando', 'Pte. Arrivo', 'TONU', 'DELIVERED', 'En AA', 'En Yarda US', 'Patio permisionario', 'Cancelado.', 'COMPLETED', '(HOS)', 'Cruzando', 'EN PLANTA', 'PATIO MTY', 'Recolectando', 'Descompuesta', 'En resguardo'];
  /* Chips traslúcidos "de neón" sobre el fondo oscuro: fondo = el mismo color del texto a
     baja opacidad (efecto de brillo), texto = el color saturado. */
  var STATUS_STYLES = {
    'Cargando': ['rgba(185,140,255,0.16)', '#c9a6ff'],
    'En transito': ['rgba(46,232,129,0.15)', '#4ade80'],
    'En yarda MX': ['rgba(255,217,61,0.15)', '#ffd93d'],
    'Descargando': ['rgba(255,159,67,0.15)', '#ff9f43'],
    'Pte. Arrivo': ['rgba(255,107,107,0.15)', '#ff8080'],
    'Pendiente arrivo': ['rgba(255,107,107,0.15)', '#ff8080'], // por si alguna carga vieja se guardó con el nombre largo
    'TONU': ['rgba(226,114,91,0.16)', '#e88a72'],
    'DELIVERED': ['rgba(45,226,200,0.15)', '#2de2c8'],
    'En AA': ['rgba(167,139,250,0.15)', '#a78bfa'],
    'En Yarda US': ['rgba(244,114,182,0.15)', '#f472b6'],
    'Patio permisionario': ['rgba(212,196,102,0.14)', '#d4c466'],
    'Cancelado.': ['rgba(255,92,92,0.17)', '#ff5c5c'],
    'COMPLETED': ['rgba(96,165,250,0.15)', '#60a5fa'],
    '(HOS)': ['rgba(147,162,201,0.14)', '#93a2c9'],
    'Cruzando': ['rgba(63,176,255,0.15)', '#3fb0ff'],
    'EN PLANTA': ['rgba(255,111,176,0.15)', '#ff6fb0'],
    'PATIO MTY': ['rgba(255,133,82,0.15)', '#ff8552'],
    'Recolectando': ['rgba(232,178,77,0.15)', '#e8b24d'],
    'Descompuesta': ['rgba(255,92,92,0.15)', '#ff5c5c'],
    'En resguardo': ['rgba(143,163,189,0.14)', '#8fa3bd']
  };

  /** Una carga solo se considera "Entregada" (y se mueve a esa sección) cuando su estatus es Delivered/Completed Y ya se compartió el POD con el cliente. */
  function isDoneStatus(status) {
    var s = statusNorm(status);
    return s === 'delivered' || s === 'completed' || s === 'entregado' || s === 'completado';
  }

  function isArchived(rec) {
    return isDoneStatus(rec.status) && !!rec.pod_sent;
  }

  /** True cuando el estatus ya es Delivered/Completed pero todavía falta marcar el POD como enviado. */
  function podPending(rec) {
    return isDoneStatus(rec.status) && !rec.pod_sent;
  }

  /** TONU = la carga no se usó. En cuanto se confirma que ya se ingresaron los recargos (cobro)
   * en VG, la carga se considera finalizada y se mueve a la sección "Canceladas/Finalizadas"
   * (no es una entrega real, así que nunca cuenta como "Entregadas"). */
  function isCanceladaFinalizada(rec) {
    return rec.status === 'TONU' && !!rec.recargos_vg;
  }

  /** True cuando el estatus ya es TONU pero todavía falta confirmar que se ingresaron los recargos. */
  function recargosPending(rec) {
    return rec.status === 'TONU' && !rec.recargos_vg;
  }

  // Estatus que usan el recordatorio MANUAL del panel: al entrar a cualquiera de estos tres el
  // panel exige programar una fecha a mano (ver openRecordatorioModal). Para Patio
  // permisionario, esa fecha es la fecha estimada de despacho. El aviso es solo visual dentro
  // del panel (no manda correo). Lista: REMINDER_STATUSES_GS de Code.gs.
  var REMINDER_STATUSES = PANEL_CONFIG.REMINDER_STATUSES || [];

  // Estatus con revisión AUTOMÁTICA de intervalo fijo: a diferencia de los de arriba (donde cada
  // quien elige la fecha), aquí la regla es siempre la misma — "En transito" hay que revisarlo
  // (confirmar ubicación, ver si cambió algo) cada AUTO_REVIEW_HOURS horas, forzosamente. Por
  // eso no se abre ningún modal: en cuanto el load entra a este estatus, el panel calcula solo
  // "ahora + AUTO_REVIEW_HOURS horas" (ver el manejador de .status-select), y cada vez que
  // alguien confirma que lo revisó (botón "Ya revisé", ver recordatorioTagHtml), se reinicia el
  // conteo otras AUTO_REVIEW_HOURS horas — así nunca pasa más de ese tiempo sin que alguien lo
  // vuelva a checar mientras siga en tránsito.
  var AUTO_REVIEW_STATUSES = PANEL_CONFIG.AUTO_REVIEW_STATUSES || [];
  var AUTO_REVIEW_HOURS = PANEL_CONFIG.AUTO_REVIEW_HOURS || 3;

  function pd(v) { return v ? new Date(v) : null; }

  function tieneRecordatorio(status) {
    return REMINDER_STATUSES.indexOf(status) !== -1 || AUTO_REVIEW_STATUSES.indexOf(status) !== -1;
  }

  /** True si la carga tiene una revisión pendiente (manual o automática) y ya se cumplió la
   * fecha. Para los de revisión automática, no tener fecha todavía también cuenta como vencido
   * (significa que nunca se ha revisado) — a diferencia de los manuales, donde no tener fecha
   * solo pasa mientras se está programando por primera vez y no se considera vencido. */
  function isRecordatorioVencido(rec) {
    var esAutoReview = AUTO_REVIEW_STATUSES.indexOf(rec.status) !== -1;
    if (!esAutoReview && REMINDER_STATUSES.indexOf(rec.status) === -1) return false;
    if (!rec.recordatorio_fecha) return esAutoReview;
    var fecha = new Date(rec.recordatorio_fecha);
    return !isNaN(fecha.getTime()) && fecha.getTime() <= Date.now();
  }


  function statusStyle(status) {
    var c = STATUS_STYLES[status];
    if (!c) return 'background:var(--surface-2);color:var(--ink-soft);';
    return 'background:' + c[0] + ';color:' + c[1] + ';';
  }

  function statusOptionsHtml(current) {
    var opts = STATUS_OPTIONS.slice();
    if (current && opts.indexOf(current) === -1) opts.unshift(current);
    if (!current) opts.unshift(''); // el status siempre es manual: una carga nueva empieza sin estatus
    return opts.map(function (s) {
      var label = s === '' ? 'Sin estatus' : s;
      return '<option value="' + s.replace(/"/g, '&quot;') + '"' + (s === current ? ' selected' : '') + '>' + label + '</option>';
    }).join('');
  }

  var currentData = [];
  var lastRenderedAt = null;

  function fmtDate(s) {
    if (!s) return '—';
    var str = String(s);
    var months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    if (/Z$/.test(str)) {
      var dtz = new Date(str);
      if (isNaN(dtz.getTime())) return str;
      var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
      return pad2(dtz.getDate()) + ' ' + months[dtz.getMonth()] + ', ' + pad2(dtz.getHours()) + ':' + pad2(dtz.getMinutes());
    }
    // Valores capturados a mano en el panel (datetime-local, sin "Z") ya vienen en hora local
    // en texto plano — se siguen leyendo tal cual, sin pasar por new Date(), como antes.
    var sep = str.indexOf('T') !== -1 ? 'T' : ' ';
    var parts = str.split(sep);
    var d = parts[0].split('-');
    if (d.length < 3) return str;
    var mon = months[parseInt(d[1],10)-1] || d[1];
    var time = parts[1] ? parts[1].replace('Z','').slice(0,5) : '';
    return d[2] + ' ' + mon + (time ? ', ' + time : '');
  }

  function fmtDateOnly(s) {
    if (!s) return '';
    var str = String(s);
    var months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    var y, mon, day;
    if (/Z$/.test(str)) {
      var dtz = new Date(str);
      if (isNaN(dtz.getTime())) return '';
      y = dtz.getFullYear(); mon = months[dtz.getMonth()]; day = dtz.getDate();
    } else {
      var sep = str.indexOf('T') !== -1 ? 'T' : ' ';
      var d = str.split(sep)[0].split('-');
      if (d.length < 3) return '';
      y = d[0]; mon = months[parseInt(d[1], 10) - 1] || d[1]; day = parseInt(d[2], 10);
    }
    return day + ' ' + mon + ' ' + y;
  }

  function computeLoadsPeriod(data) {
    var min = null, max = null;
    (data || []).forEach(function (r) {
      if (!r.pickup_appt) return;
      var t = new Date(r.pickup_appt).getTime();
      if (isNaN(t)) return;
      if (min === null || t < min) min = t;
      if (max === null || t > max) max = t;
    });
    if (min === null) return '';
    var minStr = fmtDateOnly(new Date(min).toISOString());
    var maxStr = fmtDateOnly(new Date(max).toISOString());
    return (minStr === maxStr) ? minStr : (minStr + ' – ' + maxStr);
  }

  var lastImportAt = '';
  function renderOperationMeta() {
    var el = document.getElementById('operation-meta');
    if (!el) return;
    var periodo = computeLoadsPeriod(currentData);
    var html = '';
    html += '<div>Periodo de cargas (pickup): <b>' + (periodo ? esc(periodo) : '—') + '</b></div>';
    html += '<div>Último Excel importado: <b>' + (lastImportAt ? esc(relativeTimeLabel(lastImportAt)) : 'sin registro') + '</b></div>';
    el.innerHTML = html;
  }

  function apptDatetimeLocalValue(s) {
    if (!s) return '';
    var str = String(s);
    var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
    if (/Z$/.test(str)) {
      var dtz = new Date(str);
      if (isNaN(dtz.getTime())) return '';
      return dtz.getFullYear() + '-' + pad2(dtz.getMonth() + 1) + '-' + pad2(dtz.getDate()) + 'T' + pad2(dtz.getHours()) + ':' + pad2(dtz.getMinutes());
    }
    var sep = str.indexOf('T') !== -1 ? 'T' : ' ';
    var parts = str.split(sep);
    var d = parts[0];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return '';
    var timeRaw = parts[1] ? parts[1].replace('Z', '').trim() : '';
    var tm = timeRaw.match(/^(\d{1,2}):(\d{1,2})/);
    var time = tm ? (pad2(parseInt(tm[1], 10)) + ':' + pad2(parseInt(tm[2], 10))) : '00:00';
    return d + 'T' + time;
  }

  function deltaClass(min) {
    if (min === null || min === undefined || min === '') return 'neutral';
    var abs = Math.abs(Number(min));
    if (abs <= 20) return 'good';
    if (abs <= 90) return 'warn';
    return 'critical';
  }

  function deltaLabel(min) {
    if (min === null || min === undefined || min === '') return 'pendiente';
    var n = Number(min);
    var abs = Math.abs(n);
    var h = Math.floor(abs / 60), m = Math.round(abs % 60);
    var txt = (h > 0 ? h + 'h ' : '') + m + 'm';
    return (n < 0 ? '−' : '+') + txt;
  }

  // Estatus que indican un problema real con la carga (no solo el flujo normal esperado).
  var PROBLEM_STATUSES = PANEL_CONFIG.PROBLEM_STATUSES || [];

  // Minutos de retraso (pickup o entrega) a partir de los cuales se considera que la carga
  // necesita atención.
  var ATTENTION_DELAY_MIN = PANEL_CONFIG.ATTENTION_DELAY_MIN || 90;

  // Días sin ningún comentario nuevo en una carga activa y ya iniciada (pickup ya pasó) para
  // considerarla "necesita atención" por falta de seguimiento.
  var ATTENTION_NO_COMMENT_DAYS = 2;

  function needsAttentionReasons(rec) {
    var reasons = [];
    if (DONE_STATUSES.indexOf(rec.status) !== -1) return reasons;
    if (isCanceladaFinalizada(rec)) return reasons;
    if (PROBLEM_STATUSES.indexOf(rec.status) !== -1) reasons.push('Estatus con problema: ' + rec.status);
    if (isRecordatorioVencido(rec)) reasons.push('Revisión/recordatorio vencido');
    if (rec.pickup_delta_min !== null && rec.pickup_delta_min !== '' && Math.abs(Number(rec.pickup_delta_min)) > ATTENTION_DELAY_MIN) reasons.push('Retraso de pickup: ' + Math.round(Math.abs(Number(rec.pickup_delta_min))) + ' min');
    if (rec.delivery_delta_min !== null && rec.delivery_delta_min !== '' && Math.abs(Number(rec.delivery_delta_min)) > ATTENTION_DELAY_MIN) reasons.push('Retraso de entrega: ' + Math.round(Math.abs(Number(rec.delivery_delta_min))) + ' min');
    if (!pickupIsFuture(rec.pickup_appt)) {
      var lc = ultimosComentarios[String(rec.load)];
      var lastTs = (lc && lc.ts) ? new Date(lc.ts).getTime() : null;
      var cutoff = Date.now() - ATTENTION_NO_COMMENT_DAYS * 24 * 60 * 60 * 1000;
      if (!lastTs) reasons.push('Sin ningún comentario registrado');
      else if (lastTs < cutoff) reasons.push('Sin comentarios en ' + Math.floor((Date.now() - lastTs) / (24 * 60 * 60 * 1000)) + '+ días');
    }
    return reasons;
  }
  function needsAttention(rec) {
    return needsAttentionReasons(rec).length > 0;
  }

  function cardBorderClass(rec) {
    // Un color elegido a mano manda sobre el cálculo automático y tiñe toda la tarjeta — las
    // señales de atención siguen visibles por los badges dentro de la tarjeta (recordatorio,
    // POD pendiente, etc).
    if (rec.color) return 's-' + rec.color + ' manual-color';
    if (needsAttention(rec)) return 's-critical';
    if (podPending(rec)) return 's-pod-pending';
    if (isCanceladaFinalizada(rec)) return 's-neutral';
    if (isArchived(rec)) {
      if (rec.delivery_delta_min !== null && rec.delivery_delta_min !== '' && Math.abs(Number(rec.delivery_delta_min)) > 90) return 's-warn';
      return 's-good';
    }
    return 's-neutral';
  }

  var CARD_COLOR_OPTS = [
    ['', 'Sin color', 'neutral'],
    ['critical', 'Urgente', 'critical'],
    ['warn', 'Atención', 'warn'],
    ['good', 'Resuelto / OK', 'good'],
    ['info', 'Informativo', 'info'],
    ['purple', 'Púrpura', 'purple'],
    ['teal', 'Turquesa', 'teal'],
    ['pink', 'Rosa', 'pink'],
    ['brown', 'Café', 'brown'],
    ['slate', 'Gris', 'slate']
  ];

  function colorSwatchesHtml(rec) {
    var current = rec.color || '';
    return '<div class="color-swatches color-swatches-compact" title="Color de la tarjeta"><span class="color-swatches-label">Color</span>' + CARD_COLOR_OPTS.map(function (o) {
      return '<button type="button" class="color-swatch sw-' + o[2] + (current === o[0] ? ' selected' : '') +
        '" data-set-color-load="' + rec.load + '" data-color="' + o[0] + '" title="' + o[1] + '"></button>';
    }).join('') + '</div>';
  }

  var DOC_ITEM_LABELS = { bol: 'BOL', doda: 'DODA', entry: 'Entry', sobre_listo: 'Sobre listo' };
  function docDots(rec) {
    if (rec.sobre_listo) {
      return '<span class="check-ok" data-doc-toggle="sobre_listo" data-doc-load="' + esc(rec.load) + '" data-tooltip="Clic para desmarcar">&#10003;</span>' +
        '<span class="label-ok" data-doc-toggle="sobre_listo" data-doc-load="' + esc(rec.load) + '">Ya se puede despachar</span>';
    }
    var items = [['bol', 'BOL', rec.bol], ['doda', 'DODA', rec.doda], ['entry', 'Entry', rec.entry], ['sobre_listo', 'Sobre listo', rec.sobre_listo]];
    return items.map(function (it) {
      var field = it[0], label = it[1], val = it[2];
      var manual = String(rec[field + '_source'] || '').toUpperCase() === 'MANUAL';
      var tip = label + ': ' + (val ? ('listo' + (manual ? ' · marcado a mano' : '')) : 'pendiente') + ' — clic para ' + (val ? 'desmarcar' : 'marcar');
      return '<span class="dot ' + (val ? 'on' : '') + '" data-tooltip="' + esc(tip) + '" data-doc-toggle="' + field + '" data-doc-load="' + esc(rec.load) + '"></span>';
    }).join('') + '<span class="label">' + esc(rec.doc_status || 'sin doc. status') + '</span>';
  }

  function notesHtml(rec) {
    var parts = [];
    if (rec.regresos) parts.push('<b style="color:var(--critical);">Regreso:</b> ' + rec.regresos);
    if (!parts.length) return '';
    return '<div class="notes has-content">' + parts.join(' &nbsp;·&nbsp; ') + '</div>';
  }

  // Registro de currentData con ese número de load (o undefined). Antes esta búsqueda estaba
  // copiada ~20 veces por todo el archivo.
  function recPorLoad_(load) {
    return currentData.filter(function (r) { return String(r.load) === String(load); })[0];
  }

  /** Si el servidor reinició la revisión de tránsito (comentar o avisar al cliente cuenta como
   * revisar la carga — ver reiniciarRevisionTransito_ en Code.gs), refleja la nueva fecha de
   * inmediato para que el aviso "Van más de 3h sin revisar" se quite sin esperar el refresco. */
  function aplicarRevision_(load, res) {
    if (!res || !res.recordatorio_fecha) return;
    var rec = recPorLoad_(load);
    if (!rec) return;
    rec.recordatorio_fecha = res.recordatorio_fecha;
    render(currentData);
    if (workspaceCurrentLoad === String(load)) renderWorkspace();
  }

  function esc(v) { return (v === null || v === undefined) ? '' : String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  /** Tag de recordatorio. Dos variantes:
   * - Manual (Descompuesta / En resguardo / Patio permisionario): muestra la fecha que alguien
   *   programó a mano (o invita a programarla si por algún motivo no tiene) y, si ya se venció,
   *   lo marca en rojo con un botón para reprogramarla.
   * - Automática (En transito): no se programa a mano — muestra cuándo toca la próxima revisión
   *   (o que ya toca revisar, si nunca se ha hecho) y un botón "Ya revisé" que reinicia el
   *   conteo otras AUTO_REVIEW_HOURS horas (ver el manejador de [data-recordatorio-revisar]). */
  function recordatorioTagHtml(rec) {
    if (AUTO_REVIEW_STATUSES.indexOf(rec.status) !== -1) {
      var revisarBtn = '<button type="button" data-recordatorio-revisar="' + rec.load + '">Ya revisé</button>';
      if (!rec.recordatorio_fecha) {
        return '<div class="pod-pending-tag tag-critical">&#9200; Pendiente de revisar (ubicación, estatus, etc.) &mdash; ' + revisarBtn + '</div>';
      }
      if (isRecordatorioVencido(rec)) {
        return '<div class="pod-pending-tag tag-critical" title="También cuenta como revisión agregar un comentario o registrar un aviso al cliente">&#9200; Van más de ' + AUTO_REVIEW_HOURS + 'h sin revisar (' + fmtDateTime(rec.recordatorio_fecha) + ') &mdash; ' + revisarBtn + ' <span style="font-weight:400;opacity:.8">o comenta / avisa al cliente</span></div>';
      }
      return '<div class="recordatorio-tag">Próxima revisión: ' + fmtDateTime(rec.recordatorio_fecha) + ' ' + revisarBtn + '</div>';
    }
    var label = rec.status === 'Patio permisionario' ? 'Despacho estimado' : 'Recordatorio';
    var editBtn = '<button type="button" data-recordatorio-edit="' + rec.load + '" data-recordatorio-status="' + esc(rec.status) + '">';
    if (!rec.recordatorio_fecha) {
      return '<div class="pod-pending-tag tag-critical">Falta programar recordatorio &mdash; ' + editBtn + 'programar</button></div>';
    }
    if (isRecordatorioVencido(rec)) {
      return '<div class="pod-pending-tag tag-critical">&#9200; ' + label + ' vencido (' + fmtDateTime(rec.recordatorio_fecha) + ') &mdash; ' + editBtn + 'reprogramar</button></div>';
    }
    return '<div class="recordatorio-tag">' + label + ': ' + fmtDateTime(rec.recordatorio_fecha) + ' ' + editBtn + 'editar</button></div>';
  }

  function showToast(message, type) {
    var container = document.getElementById('toast-container');
    if (!container) return;
    var el = document.createElement('div');
    el.className = 'toast' + (type ? ' toast-' + type : '');
    el.textContent = message;
    container.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    setTimeout(function () {
      el.classList.remove('show');
      setTimeout(function () { el.remove(); }, 250);
    }, 2800);
  }

  var DESHACER_MS = 6000;
  var accionesConDeshacer_ = {}, accionesConDeshacerSeq_ = 0;
  function accionConDeshacer_(mensaje, commit, revertir) {
    var id = ++accionesConDeshacerSeq_, terminado = false, timer;
    var container = document.getElementById('toast-container');
    var el = document.createElement('div');
    el.className = 'toast toast-undo';
    var txt = document.createElement('span');
    txt.textContent = mensaje;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast-undo-btn';
    btn.textContent = 'Deshacer';
    el.appendChild(txt);
    el.appendChild(btn);
    if (container) {
      container.appendChild(el);

    }
    function quitarAviso() {
      el.classList.remove('show');
      setTimeout(function () { el.remove(); }, 250);
    }
    function ejecutar() {
      if (terminado) return;
      terminado = true;
      clearTimeout(timer);
      delete accionesConDeshacer_[id];
      quitarAviso();
      commit();
    }
    btn.addEventListener('click', function () {
      if (terminado) return;
      terminado = true;
      clearTimeout(timer);
      delete accionesConDeshacer_[id];
      quitarAviso();
      revertir();

  /** Texto relativo tipo "hace 22 min" / "hace 3h" para la línea de "última actualización" —
   * si ya pasó más de un día, cae a la fecha absoluta (fmtDateTime) porque "hace 2 días" ya no
   * es tan útil como saber exactamente cuándo fue. */
  function relativeTimeLabel(d) {
    if (!d) return '';
    var dt = (d instanceof Date) ? d : new Date(d);
    if (isNaN(dt.getTime())) return '';
    var minutos = Math.round((Date.now() - dt.getTime()) / 60000);
    if (minutos < 1) return 'justo ahora';
    if (minutos < 60) return 'hace ' + minutos + ' min';
    var horas = Math.round(minutos / 60);
    if (horas < 24) return 'hace ' + horas + 'h';
    return fmtDateTime(dt);
  }

  function alertBannerHtml(rec) {

  /** Recalcula el texto de cuenta regresiva de todos los banners de alerta visibles ahorita mismo
   * (".alert-countdown"), a partir de la cita de entrega guardada en data-alert-target. Se llama
   * después de cada render() y junto con autoRefresh — no hace falta un timer aparte, cada minuto
   * de diferencia visual es más que suficiente para esto. */
  function refreshAlertCountdowns() {
    document.querySelectorAll('.alert-banner-mini[data-alert-target]').forEach(function (el) {
      var raw = el.getAttribute('data-alert-target');
      var span = el.querySelector('.alert-countdown');
      if (!span) return;
      if (!raw) { span.textContent = ''; return; }
      var target = new Date(raw);
      if (isNaN(target.getTime())) { span.textContent = ''; return; }
      var diffMin = Math.round((target.getTime() - Date.now()) / 60000);
      if (diffMin >= 0) {
        var h = Math.floor(diffMin / 60), m = diffMin % 60;
        span.textContent = 'faltan ' + (h > 0 ? h + 'h ' : '') + m + 'm';
      } else {
        var atrasoMin = -diffMin;
        var ah = Math.floor(atrasoMin / 60), am = atrasoMin % 60;
        span.textContent = 'atrasado ' + (ah > 0 ? ah + 'h ' : '') + am + 'm';
      }
    });
  }

  // Solo se construye el HTML (pesado) de la vista que está visible en este momento;
  // la otra queda marcada como "pendiente" y se construye hasta que el usuario cambie a
  // ella. Evita dibujar el doble de tarjetas/filas en cada carga o cada edición.
  var viewDirty = { cards: true, table: true };

  // ---- Redibujado incremental (solo lo que realmente cambió) ----
  // Antes, cada actualización (autoRefresh cada 60s, o cualquier guardado optimista: estatus,
  // POD, recargos, color…) volvía a reconstruir TODO el HTML de la tabla/tarjetas/listas y a
  // reemplazarlo de golpe, aunque casi nada hubiera cambiado — eso significa reflow/repintado
  // del navegador sobre cientos de nodos por cada actualización. Ahora, para cada contenedor
  // (tabla, cada sección de tarjetas, pendientes, bitácora) se guarda el HTML que se dibujó por
  // último para cada elemento (por su "key" — el load, el id del pendiente, etc.). Si el orden
  // de los elementos no cambió, se compara elemento por elemento y solo se toca el DOM del que
  // de verdad cambió de contenido — el resto ni se vuelve a tocar. Si el orden sí cambió
  // (se agregó/quitó/reordenó algo — poco frecuente), se reconstruye ese contenedor completo,
  // igual que antes: es lo más simple y seguro para un caso raro, y no vale la pena complicar
  // el código para optimizar algo que casi no pasa. Como los eventos ya están delegados en
  // document (ver wireDelegatedEventsOnce), un elemento nuevo o reemplazado ya "funciona" solo,
  // sin necesitar reconectar nada.
  var lastRenderState = {}; // containerId -> { order: [keys], html: {key: htmlString} }

  function resetRenderState(containerId) {
    delete lastRenderState[containerId];
  }

  function diffRenderContainer(containerId, records, keyFn, htmlFn, opts) {
    var nodesPerItem = (opts && opts.nodesPerItem) || 1;
    var wrapperTag = (opts && opts.wrapperTag) || 'div';
    var container = document.getElementById(containerId);
    var keys = records.map(keyFn);
    var prev = lastRenderState[containerId];
    var sameOrder = !!prev && prev.order.length === keys.length &&
      prev.order.every(function (k, i) { return k === keys[i]; });

    if (!sameOrder) {
      var htmlMap = {};
      var parts = records.map(function (rec) {
        var key = keyFn(rec);
        var html = htmlFn(rec);
        htmlMap[key] = html;
        return html;
      });
      container.innerHTML = parts.join('');
      lastRenderState[containerId] = { order: keys, html: htmlMap };
      return;
    }

    var htmlMap = prev.html;
    var domIndex = 0;
    records.forEach(function (rec) {
      var key = keyFn(rec);
      var html = htmlFn(rec);
      if (html === htmlMap[key]) {
        domIndex += nodesPerItem; // sin cambios — no se toca el DOM de este elemento
        return;
      }
      htmlMap[key] = html;
      var wrapper = document.createElement(wrapperTag);
      wrapper.innerHTML = html;
      for (var n = 0; n < nodesPerItem; n++) {
        container.replaceChild(wrapper.firstChild, container.children[domIndex]);
        domIndex++;
      }
    });
  }

    viewDirty.cards = false;
  }

  function isSameLocalDay(a, b) {
    if (!a || !b) return false;
    var da = new Date(a), db = new Date(b);
    if (isNaN(da.getTime()) || isNaN(db.getTime())) return false;

  }

  function hoursSince(d) {
    if (!d) return Infinity;
    var dt = new Date(d);
    if (isNaN(dt.getTime())) return Infinity;
    return (Date.now() - dt.getTime()) / 3600000;
  }


  function computeActiveJourney(data){
    var scoped=actionCenterScope(data||[]);
    var active=scoped.filter(function(r){return !isArchived(r)&&!isCanceladaFinalizada(r)&&!isCancelledStatus(r.status);});
    var items=active.map(function(rec){var reasons=journeyReasons(rec),bucket=journeyBucket(reasons);return bucket?{rec:rec,reasons:reasons,bucket:bucket,score:reasons[0].score}:null;}).filter(Boolean).sort(function(a,b){return b.score-a.score;});
    return {scoped:scoped,active:active,items:items};
  }
  function shiftSnapshot(data,journey){
    var j=journey||computeActiveJourney(data);
    var active=j.active, items=j.items, now=Date.now();
    return {active:active,items:items,urgent:items.filter(function(x){return x.bucket==='now';}),client:active.filter(function(r){return !!r.client_notify_pending;}),today:active.filter(function(r){return isSameLocalDay(r.delivery_appt,new Date());}),overdue:active.filter(function(r){if(!r.next_review_at)return false;var t=new Date(r.next_review_at).getTime();return !isNaN(t)&&t<=now;})};

  // Turnos del equipo: 07–16, 16–24 y 00–07 (los mismos de turnoActual_ en Code.gs).
  function inicioTurnoActual_(){

  /** "LO QUE HICE EN MI TURNO" para el cierre: lo que cambió desde que empezó el turno y lo hizo
   * quien tiene la sesión (estatus/campos, avisos al cliente, comentarios, bitácora, apartados). */
  function cambiosDelTurnoLineas_(){
    var yo=myRealIdentity;if(!yo)return[];
    var desde=inicioTurnoActual_(),out=[];
    var enTurno=function(v){var t=v?new Date(v).getTime():NaN;return !isNaN(t)&&t>=desde;};
    var avisados=(currentData||[]).filter(function(r){return r.client_notified_by===yo&&enTurno(r.client_notified_at);});
    var editadas=(currentData||[]).filter(function(r){return r.updated_by===yo&&enTurno(r.updated_at)&&avisados.indexOf(r)===-1;});
    var comentadas=Object.keys(ultimosComentarios||{}).filter(function(k){var c=ultimosComentarios[k];return c&&c.usuario===yo&&enTurno(c.ts)&&recPorLoad_(k);});
    var bitResueltas=(bitacora||[]).filter(function(b){return b.resuelto&&enTurno(b.resuelto_en);});
    var aps=(apartados||[]).filter(function(a){return a.actualizado_por===yo&&enTurno(a.actualizado_en);});
    if(!avisados.length&&!editadas.length&&!comentadas.length&&!bitResueltas.length&&!aps.length)return['','LO QUE HICE EN MI TURNO','- (Nada registrado en el panel desde las '+new Date(desde).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+')'];

// FIX: "Carga de trabajo por CSR" — a petición de Esteban. A propósito NO usa "scoped" (que ya
// viene acotado a los clientes del CSR activo) ni actionCenterScope: aquí el punto es comparar
// entre TODOS los CSR, así que siempre mira el operativo completo sin importar quién esté viendo
// el panel. Reutiliza clientesDeCsr (ya usada por currentCsrClienteFiltro) más "Seguir load" —
// el mismo criterio de alcance que el resto del panel — para saber qué cargas le tocan a cada
// quien, y needsAttention (ya usado por el borde rojo de las tarjetas) para contar cuántas de
// esas necesitan atención.
function loadsOfCsr(csrNombre){
  var clientes=clientesDeCsr(csrNombre);
  var seguidos=loadSeguimientos.filter(function(s){return s.csr===csrNombre;}).map(function(s){return String(s.load).trim();});
  return (currentData||[]).filter(function(r){
    if(isArchived(r)||isCanceladaFinalizada(r))return false;
    var cust=String(r.customer||'').toLowerCase();
    return (cust&&clientes.indexOf(cust)!==-1)||seguidos.indexOf(String(r.load).trim())!==-1;
  });
}

function renderCargaPorCsr(){
  var section=document.getElementById('group-carga-csr');
  var box=document.getElementById('home-carga-csr');
  if(!box)return;
  if(!currentWhoEsSupervisor_()){
    if(section)section.hidden=true;
    return;
  }
  if(section)section.hidden=false;
  var csrs=(personas||[]).filter(function(p){return p.rol==='CSR';});
  var countEl=document.getElementById('home-carga-csr-count');if(countEl)countEl.textContent=csrs.length+' CSR';
  if(!csrs.length){box.innerHTML='<div class="action-empty">No hay CSR configurados todavía.</div>';return;}
  // FIX: Esteban — "no podemos entrar a investigar a qué le movemos" con solo el número de
  // "necesitan atención". Ahora cada fila con atención>0 trae un botón "Ver" que despliega, por
  // cada load, EL MOTIVO exacto (reutiliza needsAttentionReasons — mismo criterio que ya pinta el
  // borde rojo de la tarjeta y el ⚠ de la tabla, no uno nuevo inventado aparte) sin tener que
  // abrir la carga ni adivinar.
  var rows=csrs.map(function(p){
    var cargas=loadsOfCsr(p.nombre);
    var atencionCargas=cargas.filter(needsAttention);
    return {nombre:p.nombre,total:cargas.length,atencion:atencionCargas.length,atencionCargas:atencionCargas};
  }).sort(function(a,b){return (b.atencion-a.atencion)||(b.total-a.total);});
  box.innerHTML=rows.map(function(r,idx){
    var sev=r.atencion>0?(r.atencion>=3?'sev-critical':'sev-warn'):'sev-good';
    var verBtn=r.atencion>0?'<button class="ws-btn" data-carga-csr-toggle="'+idx+'">Ver</button>':'';
    var row='<div class="home-mini-row csr-row"><span class="hm-load">'+esc(r.nombre)+'</span><span class="hm-soft">'+r.total+(r.total===1?' carga activa':' cargas activas')+'</span><span class="'+sev+'">'+r.atencion+(r.atencion===1?' necesita atención':' necesitan atención')+'</span>'+verBtn+'</div>';
    if(!r.atencion)return row;
    var detail=r.atencionCargas.map(function(rec){
      return '<div class="carga-csr-detail-row"><span class="hm-load">Load '+esc(rec.load)+'</span><span class="hm-soft">'+esc(rec.customer||'Sin cliente')+'</span><span class="sev-warn">'+esc(needsAttentionReasons(rec).join(' · '))+'</span></div>';
    }).join('');
    return row+'<div class="carga-csr-detail" id="carga-csr-detail-'+idx+'" hidden>'+detail+'</div>';
  }).join('');
}

function fmtMinutesSla(min){
  min=Math.round(min);

  function statusNorm(v){return String(v||'').trim().toLowerCase().replace(/\.$/,'');}
  function hoursBetween(from,to){if(!from)return null;var d=new Date(from);if(isNaN(d.getTime()))return null;return ((to||Date.now())-d.getTime())/3600000;}
  function isCancelledStatus(status){return statusNorm(status)==='cancelado';}
  function isPteArriboStatus(status){var s=statusNorm(status);return s==='pte. arrivo'||s==='pte. arribo'||s==='pendiente arrivo'||s==='pendiente arribo';}

  function journeyReasons(rec) {
    var reasons=[], now=Date.now(), st=statusNorm(rec.status);
    function add(level,score,text,kind){reasons.push({level:level,score:score,text:text,kind:kind||''});}
    if(isCancelledStatus(rec.status)) return reasons;
    if(rec.client_notify_pending){
      var notifyParts=String(rec.client_notify_reason||'actualización').split(' · ').map(function(s){return s.trim();}).filter(Boolean);
      notifyParts.forEach(function(p,i){add('critical',110-i*0.01,(i===0?'Cliente pendiente: ':'')+p,'notify');});
    }
    if(rec.next_review_at){var rt=new Date(rec.next_review_at).getTime();if(!isNaN(rt)&&rt<=now)add('critical',105,'Próxima revisión vencida');else if(!isNaN(rt)&&rt>now)add('monitor',50,'Próxima revisión '+relativeTimeLabel(rec.next_review_at));}
    if(st==='tonu'){
      if(!rec.recargos_vg)add('warn',88,'TONU · aplicar/confirmar cargo USD $350');
    } else if(st==='delivered'||st==='completed'||st==='entregado'||st==='completado'){
      if(!rec.pod_sent)add('warn',88,'POD pendiente de compartir');
    } else if(isPteArriboStatus(rec.status) || pickupIsFuture(rec.pickup_appt)){
      // Excepción acordada: no forzar revisión cada 3h antes del arribo/pickup futuro.
    } else if(st==='en transito'){
      var commAge=hoursBetween(rec.client_notified_at);
      if(commAge===null)add('warn',82,'Falta registrar estatus enviado al cliente','comm');
      else if(commAge>=3)add('critical',108,'Más de 3h sin estatus al cliente','comm');
      else if(commAge>=2.5)add('warn',80,'Próximo estatus al cliente en '+Math.max(0,Math.round((3-commAge)*60))+' min','comm');
      else add('monitor',49,'Cliente actualizado hace '+Math.max(0,Math.floor(commAge*60))+' min','comm');
    } else {
      if(PROBLEM_STATUSES.indexOf(rec.status)!==-1)add('critical',100,'Estatus con incidencia: '+rec.status);
    }
    if(rec.incidenciasCount && Number(rec.incidenciasCount)>0)add('warn',76,Number(rec.incidenciasCount)+' incidencia(s)');
    reasons.sort(function(a,b){return b.score-a.score;});return reasons;
  }
  function journeyBucket(reasons){if(!reasons.length)return null;var top=reasons[0];if(top.score>=90)return 'now';if(top.score>=60)return 'review';return 'monitor';}

    // tarjetas que se acaban de crear o reemplazar.
    diffRenderContainer('pendientes-list', pendientes, function (p) { return String(p.id); }, pendienteCardHtml);
  }

  function loadPendientes() {
    if (!myRealIdentity) { pendientes = []; renderPendientes(); return; }
    google.script.run.withSuccessHandler(aplicarPendientes_).getPendientes(myRealIdentity, myPassword);
  }
  function aplicarPendientes_(json) {
    pendientes = sinBorrandose_(JSON.parse(json));
    renderPendientes();
  }

  // ---- Bitácora de turno ----
  // Notas libres que un turno le deja al siguiente (07:00–16:00 / 16:00–00:00 / 00:00–07:00,
  // aplica igual en fin de semana), o que alguien deja para quien vaya a cubrirlo un sábado o
  // domingo. Es independiente de "Pendientes de load" (esa es solo para cargas que el cliente
  // todavía no confirma). El turno se calcula solo, en el servidor, según la hora en que se
  // registra (ver turnoActual_ en Code.gs) — aquí no hay que elegirlo a mano.
  var bitacora = [];

  // Una vez marcada como atendida, una nota se deja de mostrar después de este tiempo, para que
  // la bitácora no se llene de cosas ya resueltas — el registro completo se queda en la hoja
  // "BitacoraTurno" de todas formas, esto solo controla qué se ve en el panel.
  var BITACORA_HIDE_RESUELTOS_AFTER_DAYS = 2;

  function bitacoraCardHtml(b) {
    var paraTexto = b.asignado_a ? esc(b.asignado_a) : (b.asignado_csr ? 'quien siga a ' + esc(b.asignado_csr) : '—');
    var meta = 'De ' + (b.creado_por ? esc(b.creado_por) : '—') +
      ' · Para ' + paraTexto +
      (b.creado_en ? ' · ' + fmtDateTime(b.creado_en) : '');
    // FIX: chip de "fecha de seguimiento" — cuándo hay que darle seguimiento a este pendiente
    // (p. ej. al asignar varios loads al cierre de turno). Se muestra aparte de los recordatorios
    // normales del load, y se pone en rojo si ya se venció y sigue sin resolverse.
    var followupHtml = '';
    if (b.fecha_seguimiento) {
      var fsDate = new Date(b.fecha_seguimiento);
      if (!isNaN(fsDate.getTime())) {
        var vencido = !b.resuelto && fsDate.getTime() < new Date().setHours(0, 0, 0, 0);
        followupHtml = '<span class="bitacora-followup' + (vencido ? ' overdue' : '') + '">' + (vencido ? '⚠ ' : '') +
          'Seguimiento: ' + esc(fsDate.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' })) + '</span>';
      }
    }
    return (
      '<article class="card s-' + (b.color || 'neutral') + (b.color ? ' manual-color' : '') + (b.resuelto ? ' bitacora-resuelto' : '') + '" data-bitacora-id="' + esc(b.id) + '">' +
        '<div class="card-top">' +
          '<div>' +
            '<span class="customer">Turno ' + esc(b.turno) + '</span>' +
            '<div class="route">' + meta + '</div>' +
            (b.load ? '<button type="button" class="pod-pending-tag bitacora-load-link" style="background:var(--surface-2); color:var(--ink-faint);" data-open-bitacora-load="' + esc(b.load) + '" title="Abrir esta carga para editarla o comentar">Load ' + esc(b.load) + '</button>' : '') +
            followupHtml +
          '</div>' +
          '<div class="bitacora-card-actions">' +
            '<button type="button" class="icon-btn" data-edit-bitacora="' + esc(b.id) + '" title="Editar">' + ICON_EDIT + '</button>' +
            '<button type="button" class="csr-remove" data-remove-bitacora="' + esc(b.id) + '" title="Eliminar">&times;</button>' +
          '</div>' +
        '</div>' +
        '<div class="notes has-content">' + escHtml(b.nota) + '</div>' +
        '<label class="pod-check" style="margin-top:0.6rem;">' +
          '<input type="checkbox" data-resolver-bitacora="' + esc(b.id) + '"' + (b.resuelto ? ' checked' : '') + '>' +
          '<span>Ya se le dio seguimiento</span>' +
        '</label>' +
      '</article>'
    );
  }

  function renderBitacora() {
    var abiertos = bitacora.filter(function (b) { return !b.resuelto; }).length;
    document.getElementById('count-bitacora').textContent = abiertos;
    var badgeB = document.getElementById('sidebar-badge-bitacora');
    if (badgeB) {
      badgeB.textContent = abiertos > 99 ? '99+' : String(abiertos);
      badgeB.classList.toggle('show', abiertos > 0);
    }
    var cutoff = Date.now() - BITACORA_HIDE_RESUELTOS_AFTER_DAYS * 24 * 60 * 60 * 1000;
    var visibles = bitacora.filter(function (b) {
      if (!b.resuelto) return true;
      var ts = b.resuelto_en ? new Date(b.resuelto_en).getTime() : new Date(b.creado_en).getTime();
      return ts >= cutoff;
    });
    visibles.sort(function (a, b) {
      if (!!a.resuelto !== !!b.resuelto) return a.resuelto ? 1 : -1;
      if (!a.resuelto) {
        var fa = a.fecha_seguimiento ? new Date(a.fecha_seguimiento).getTime() : Infinity;
        var fb = b.fecha_seguimiento ? new Date(b.fecha_seguimiento).getTime() : Infinity;
        if (fa !== fb) return fa - fb;
      }
      return new Date(b.creado_en) - new Date(a.creado_en);
    });
    var asignados = visibles.filter(function (b) { return b.creado_por && b.creado_por !== myRealIdentity; });
    var propios = visibles.filter(function (b) { return !b.creado_por || b.creado_por === myRealIdentity; });

    var elAsig = document.getElementById('bitacora-asignados-list');
    var countAsig = document.getElementById('count-bitacora-asignados');
    var abiertosAsig = asignados.filter(function (b) { return !b.resuelto; }).length;
    if (countAsig) countAsig.textContent = abiertosAsig;
    if (!asignados.length) {
      elAsig.innerHTML = '<div class="comments-empty">Nadie te ha asignado pendientes de turno.</div>';
      resetRenderState('bitacora-asignados-list');
    } else {
      diffRenderContainer('bitacora-asignados-list', asignados, function (b) { return String(b.id); }, bitacoraCardHtml);
    }

    var el = document.getElementById('bitacora-list');
    if (!propios.length) {
      el.innerHTML = '<div class="comments-empty">' +
        (myRealIdentity ? 'Sin pendientes de turno propios.' : 'Verifica tu identidad para ver tus pendientes de turno.') +
        '</div>';
      resetRenderState('bitacora-list');
    } else {
      // Los botones (eliminar/marcar atendido) están delegados en document (ver
      // wireDelegatedEventsOnce) — no hace falta reconectar nada aquí.
      diffRenderContainer('bitacora-list', propios, function (b) { return String(b.id); }, bitacoraCardHtml);
    }
    if (typeof currentData !== 'undefined') renderShiftBrief(currentData);
  }

  var bitacoraRequestSeq = 0;
  function loadBitacora() {
    // Solo trae los pendientes asignados a quien tiene la identidad verificada en este
    // navegador — a nadie le aparecen los de los demás, para no saturar de información que no
    // le toca (ver getBitacoraTurno en Code.gs). Si todavía nadie ha verificado su identidad,
    // el servidor regresa vacío.
    var seq = ++bitacoraRequestSeq;
    google.script.run.withSuccessHandler(function (json) {
      if (seq !== bitacoraRequestSeq) return; // respuesta de una petición vieja — ya no aplica
      aplicarBitacora_(json);
    }).getBitacoraTurno(myRealIdentity, myPassword);
  }
  function aplicarBitacora_(json) {
    bitacoraRequestSeq++; // lo que venga de una petición anterior ya no aplica
    bitacora = sinBorrandose_(JSON.parse(json));
    bitacoraCargada_ = true;
    renderBitacora();
    programarAvisos_();
  }

  var historico = [];
  function loadHistoricoPendientes() {
    var body = document.getElementById('historico-body');
    if (body) body.innerHTML = '<tr><td colspan="7" style="color:var(--ink-soft);">Cargando…</td></tr>';
    google.script.run.withSuccessHandler(function (res) {
      if (!res || !res.ok) {
        showToast((res && res.error) || 'No se pudo cargar el histórico', 'error');
        if (body) body.innerHTML = '';
        return;
      }
      historico = res.items || [];
      renderHistoricoFiltros();
      renderHistorico();
    }).withFailureHandler(function (err) {
      showToast('Error al cargar el histórico: ' + (err && err.message ? err.message : err), 'error');
      if (body) body.innerHTML = '';
    }).getBitacoraHistorico(myRealIdentity, myPassword);
  }

  // Llena los selects de "persona" y "CSR" con los nombres conocidos (de Personas) más cualquier
  // nombre que aparezca en el histórico y ya no esté en Personas (por si a alguien lo dieron de
  // baja) — así ningún registro viejo queda imposible de filtrar. Conserva la selección actual.
  function renderHistoricoFiltros() {
    var selPersona = document.getElementById('historico-persona');
    var selCsr = document.getElementById('historico-csr');
    if (!selPersona || !selCsr) return;
    var nombres = personas.map(function (p) { return p.nombre; }).slice();
    var csrNombres = personas.filter(function (p) { return p.rol === 'CSR'; }).map(function (p) { return p.nombre; }).slice();
    historico.forEach(function (h) {
      if (h.creado_por && nombres.indexOf(h.creado_por) === -1) nombres.push(h.creado_por);
      if (h.asignado_a && nombres.indexOf(h.asignado_a) === -1) nombres.push(h.asignado_a);
      if (h.asignado_csr && csrNombres.indexOf(h.asignado_csr) === -1) csrNombres.push(h.asignado_csr);
    });
    nombres.sort(function (a, b) { return a.localeCompare(b, 'es'); });
    csrNombres.sort(function (a, b) { return a.localeCompare(b, 'es'); });
    var curP = selPersona.value, curC = selCsr.value;
    selPersona.innerHTML = '<option value="">Todas las personas</option>' +
      nombres.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
    selCsr.innerHTML = '<option value="">Todos los CSR</option>' +
      csrNombres.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
    selPersona.value = curP;
    selCsr.value = curC;
  }

  function historicoRowHtml(b) {
    // Mismo criterio que bitacoraCardHtml: si no tiene asignado_a fijo pero sí asignado_csr, es un
    // pendiente "Marcar pendiente" (ruteo automático a quien siga a ese CSR ahorita).
    var paraTexto = b.asignado_a ? esc(b.asignado_a) : (b.asignado_csr ? 'Quien siga a ' + esc(b.asignado_csr) : '—');
    var tipoTexto = b.asignado_a ? 'Asignado directo' : (b.asignado_csr ? 'Ruteo por CSR' : '');
    var estadoHtml = b.resuelto
      ? '<span class="historico-badge good">Atendido' + (b.resuelto_en ? ' · ' + fmtDateTime(b.resuelto_en) : '') + '</span>'
      : '<span class="historico-badge warn">Pendiente</span>';
    return (
      '<tr class="historico-row' + (b.resuelto ? ' historico-row-resuelto' : '') + '">' +
        '<td>' + esc(b.turno) + '</td>' +
        '<td class="historico-nota">' + escHtml(b.nota) + '</td>' +
        '<td>' + (b.load ? '<button type="button" class="pod-pending-tag bitacora-load-link" style="background:var(--surface-2); color:var(--ink-faint);" data-open-bitacora-load="' + esc(b.load) + '" title="Abrir esta carga">' + esc(b.load) + '</button>' : '—') + '</td>' +
        '<td>' + esc(b.creado_por || '—') + '</td>' +
        '<td>' + paraTexto + (tipoTexto ? '<div class="historico-tipo">' + tipoTexto + '</div>' : '') + '</td>' +
        '<td>' + (b.creado_en ? fmtDateTime(b.creado_en) : '—') + '</td>' +
        '<td>' + estadoHtml + '</td>' +
      '</tr>'
    );
  }

  function renderHistorico() {
    var persona = (document.getElementById('historico-persona') || {}).value || '';
    var csr = (document.getElementById('historico-csr') || {}).value || '';
    var estado = (document.getElementById('historico-estado') || {}).value || '';
    var desde = (document.getElementById('historico-desde') || {}).value || '';
    var hasta = (document.getElementById('historico-hasta') || {}).value || '';
    var desdeTs = desde ? new Date(desde + 'T00:00:00').getTime() : null;
    var hastaTs = hasta ? new Date(hasta + 'T23:59:59').getTime() : null;
    var filtrados = historico.filter(function (b) {
      if (persona && b.creado_por !== persona && b.asignado_a !== persona) return false;
      if (csr && b.asignado_csr !== csr) return false;
      if (estado === 'abiertos' && b.resuelto) return false;
      if (estado === 'resueltos' && !b.resuelto) return false;
      if (desdeTs !== null || hastaTs !== null) {
        var t = b.creado_en ? new Date(b.creado_en).getTime() : NaN;
        if (isNaN(t)) return false;
        if (desdeTs !== null && t < desdeTs) return false;
        if (hastaTs !== null && t > hastaTs) return false;
      }
      return true;
    });
    var body = document.getElementById('historico-body');
    var empty = document.getElementById('historico-empty');
    var count = document.getElementById('historico-count');
    if (count) count.textContent = filtrados.length;
    if (!body) return;
    if (!filtrados.length) {
      body.innerHTML = '';
      if (empty) empty.style.display = '';
      return;
    }
    if (empty) empty.style.display = 'none';
    body.innerHTML = filtrados.map(historicoRowHtml).join('');
  }

  function resetHistoricoFiltros() {
    ['historico-persona', 'historico-csr', 'historico-estado', 'historico-desde', 'historico-hasta'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = '';
    });
    renderHistorico();
  }

  ['historico-persona', 'historico-csr', 'historico-estado', 'historico-desde', 'historico-hasta'].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('change', renderHistorico);
  });
  var historicoLimpiarBtn = document.getElementById('historico-limpiar-btn');
  if (historicoLimpiarBtn) historicoLimpiarBtn.addEventListener('click', resetHistoricoFiltros);

  // Lista completa de loads candidatos para el buscador de "Load" del pendiente de turno (se
  // filtra en el navegador, sin volver a pedirle nada al servidor — mismo mecanismo que el
  // buscador de "Vincular a load").
  var bitacoraLoadOpciones = [];
  var bitacoraColorSeleccionado = '';

  var bitacoraLoadsSeleccionados = [];

  function renderBitacoraLoadOpciones(filtro) {
    var box = document.getElementById('bitacora-load-select');
    filtro = (filtro || '').trim().toLowerCase();
    var filtradas = !filtro ? bitacoraLoadOpciones : bitacoraLoadOpciones.filter(function (r) {
      return String(r.load).toLowerCase().indexOf(filtro) !== -1 || (r.customer || '').toLowerCase().indexOf(filtro) !== -1;
    });
    if (!filtradas.length) {
      box.innerHTML = '<div class="bitacora-load-empty">Sin resultados…</div>';
      return;
    }
    box.innerHTML = filtradas.slice(0, 60).map(function (r) {
      var checked = bitacoraLoadsSeleccionados.indexOf(String(r.load)) !== -1;
      return '<label class="bitacora-load-option' + (checked ? ' checked' : '') + '" data-bitacora-load-option="' + esc(r.load) + '">' +
        '<input type="checkbox"' + (checked ? ' checked' : '') + '>' +
        '<span>' + esc(r.load) + ' — ' + esc(shortCustomerName(r.customer)) + (r.trailer ? ' — ' + esc(r.trailer) : '') + '</span>' +
      '</label>';
    }).join('');
  }

  function renderBitacoraLoadSelected() {
    var wrap = document.getElementById('bitacora-load-selected');
    if (!bitacoraLoadsSeleccionados.length) {
      wrap.innerHTML = '<span class="bitacora-load-selected-empty">Sin loads elegidos todavía.</span>';
      return;
    }
    wrap.innerHTML = bitacoraLoadsSeleccionados.map(function (l) {
      return '<span class="bitacora-load-chip">Load ' + esc(l) + '<button type="button" data-bitacora-load-remove="' + esc(l) + '" title="Quitar">&times;</button></span>';
    }).join('');
  }

  function toggleBitacoraLoadSeleccionado(load) {
    load = String(load);
    var idx = bitacoraLoadsSeleccionados.indexOf(load);
    if (bitacoraEditingId) {
      // Al editar, el pendiente sigue ligado a un solo load — elegir otro reemplaza al anterior.
      bitacoraLoadsSeleccionados = (idx === -1) ? [load] : [];
    } else if (idx === -1) {
      bitacoraLoadsSeleccionados.push(load);
    } else {
      bitacoraLoadsSeleccionados.splice(idx, 1);
    }
    renderBitacoraLoadSelected();
    renderBitacoraLoadOpciones(document.getElementById('bitacora-load-search').value);
  }

  document.getElementById('bitacora-load-select').addEventListener('click', function (e) {
    var opt = e.target.closest('[data-bitacora-load-option]');
    if (!opt) return;
    toggleBitacoraLoadSeleccionado(opt.getAttribute('data-bitacora-load-option'));
  });
  document.getElementById('bitacora-load-selected').addEventListener('click', function (e) {
    var rm = e.target.closest('[data-bitacora-load-remove]');
    if (!rm) return;
    var idx = bitacoraLoadsSeleccionados.indexOf(rm.getAttribute('data-bitacora-load-remove'));
    if (idx !== -1) bitacoraLoadsSeleccionados.splice(idx, 1);
    renderBitacoraLoadSelected();
    renderBitacoraLoadOpciones(document.getElementById('bitacora-load-search').value);
  });

  function setBitacoraColor(color) {
    bitacoraColorSeleccionado = color || '';
    document.querySelectorAll('#bitacora-color-swatches .color-swatch').forEach(function (sw) {
      sw.classList.toggle('selected', sw.getAttribute('data-color') === bitacoraColorSeleccionado);
    });
  }

  document.querySelectorAll('#bitacora-color-swatches .color-swatch').forEach(function (sw) {
    sw.addEventListener('click', function () { setBitacoraColor(sw.getAttribute('data-color')); });
  });

  document.getElementById('bitacora-load-search').addEventListener('input', function (e) {
    renderBitacoraLoadOpciones(e.target.value);
  });

  // Si "existing" viene con datos, el modal entra en modo edición: la nota, el load y el color
  // parten de lo que ya tenía guardado ese pendiente, y a quién está asignado ya no se puede
  // tocar (queda fijo, mostrado como texto) — así lo puede editar quien lo creó o la persona a
  // la que se lo asignaron, sin que se pueda "robar" reasignándoselo a otra persona a media edición.
  var bitacoraEditingId = null;

  var bitacoraAutoAssignCsr = '';

  function openBitacoraModal(existing, preselectLoad, autoAssignCsr) {
    bitacoraEditingId = existing ? String(existing.id) : null;
    bitacoraAutoAssignCsr = (!existing && autoAssignCsr) ? String(autoAssignCsr) : '';
    document.getElementById('bitacora-modal-title').textContent = existing ? 'Editar pendiente de turno' : (bitacoraAutoAssignCsr ? 'Marcar pendiente de turno' : 'Nuevo pendiente de turno');
    document.getElementById('bitacora-nota').value = existing ? existing.nota : '';
    bitacoraLoadOpciones = currentData.slice();
    bitacoraLoadsSeleccionados = existing && existing.load ? [String(existing.load)] : (preselectLoad ? [String(preselectLoad)] : []);
    var loadBuscado = existing ? String(existing.load || '') : (preselectLoad ? String(preselectLoad) : '');
    document.getElementById('bitacora-load-search').value = loadBuscado;
    renderBitacoraLoadSelected();
    renderBitacoraLoadOpciones(loadBuscado);
    document.getElementById('bitacora-fecha-seguimiento').value = existing && existing.fecha_seguimiento ? String(existing.fecha_seguimiento).slice(0, 10) : '';
    setBitacoraColor(existing ? (existing.color || '') : '');
    document.getElementById('bitacora-asignado-wrap').style.display = (existing || bitacoraAutoAssignCsr) ? 'none' : '';
    document.getElementById('bitacora-asignado-fixed-label').style.display = existing ? '' : 'none';
    document.getElementById('bitacora-asignado-auto-label').style.display = bitacoraAutoAssignCsr ? '' : 'none';
    if (existing) {
      document.getElementById('bitacora-asignado-fixed').textContent = existing.asignado_a || '—';
    } else if (bitacoraAutoAssignCsr) {
      document.getElementById('bitacora-asignado-auto-csr').textContent = bitacoraAutoAssignCsr;
    } else {
      var sel = document.getElementById('bitacora-asignado');
      sel.innerHTML = personas.map(function (p) {
        return '<option value="' + esc(p.nombre) + '">' + esc(p.nombre) + (p.nombre === myRealIdentity ? ' (tú)' : '') + '</option>';
      }).join('');
      if (myRealIdentity) sel.value = myRealIdentity;
    }
    document.getElementById('bitacora-turno-note').textContent = existing
      ? 'El turno y a quién está asignado se quedan igual que cuando se creó — solo se edita la nota, el load, la fecha de seguimiento y el color.'
      : (bitacoraAutoAssignCsr
        ? 'El turno se anota solo, según la hora en que guardes esto.'
        : 'El turno se anota solo, según la hora en que guardes esto. Déjatelo a ti mismo si es algo urgente que tienes que hacer hoy, o asígnaselo a quien le toque el siguiente turno (o a quien vaya a cubrir el fin de semana). Puedes elegir varios loads a la vez — por ejemplo al cerrar tu turno — y se crea un pendiente por cada uno, con la misma nota, fecha de seguimiento y persona asignada, para que se puedan ir resolviendo por separado.');
    document.getElementById('bitacora-error').style.display = 'none';
    document.getElementById('bitacora-backdrop').classList.add('show');
    document.getElementById('bitacora-nota').focus();
    recordarFotoModal_('bitacora-backdrop');
  }

  function closeBitacoraModal() {
    document.getElementById('bitacora-backdrop').classList.remove('show');
    bitacoraEditingId = null;
    bitacoraLoadsSeleccionados = [];
    bitacoraAutoAssignCsr = '';
  }

  // ---- Aviso de cambios sin guardar (modales de bitácora y de load apartado) ----
  // Al abrir se toma una "foto" de los campos; si al cerrar con ×, Esc o clic afuera algo cambió,
  // se pregunta antes de perderlo. Guardar cierra directo, sin preguntar. La foto se toma un
  // instante después de abrir para incluir lo que se llena solo (por ejemplo, desde el Radar).
  var fotosModal_ = {};
  function fotoModal_(id) {
    var campos = Array.prototype.map.call(document.getElementById(id).querySelectorAll('input:not([type=hidden]):not([id$="-search"]), textarea, select'),
      function (x) { return x.type === 'checkbox' ? String(x.checked) : x.value; });
    if (id === 'bitacora-backdrop') campos.push((bitacoraLoadsSeleccionados || []).join(','), bitacoraColorSeleccionado || '');
    return campos.join('\u0001');
  }
  function recordarFotoModal_(id) { setTimeout(function () { fotosModal_[id] = fotoModal_(id); }, 0); }
  function cerrarSiNoHayCambios_(id, cerrar) {
    var antes = fotosModal_[id];
    if (antes === undefined || fotoModal_(id) === antes) { delete fotosModal_[id]; cerrar(); return; }
    confirmarModal_('¿Descartar los cambios?', 'Escribiste algo que todavía no se guarda. Si cierras ahora, se pierde.', 'Descartar',
      function () { delete fotosModal_[id]; cerrar(); });
  }
  function cerrarBitacoraConAviso_() { cerrarSiNoHayCambios_('bitacora-backdrop', closeBitacoraModal); }

  document.getElementById('bitacora-add-btn').addEventListener('click', function () {

  // ---- Vincular un "Pendiente de load" con el load real, una vez importado ----
  // Cuando el cliente confirma y el load ya se capturó por Excel, esto combina en uno solo el
  // historial: la nota libre (si tenía) y todos sus comentarios se pasan al load real (ver
  // vincularPendiente en Code.gs), y el registro pendiente se borra.
  var vincularCtx = null; // { pendienteId }
  var vincularOpciones = []; // lista completa de loads candidatos, para filtrar sin volver a pedirle nada al servidor

  /** Redibuja las <option> del selector según lo que se haya escrito en el buscador (por load
   * o por cliente). Conserva la selección actual si sigue apareciendo en el resultado filtrado. */
  function renderVincularOpciones(filtro) {
    var sel = document.getElementById('vincular-load-select');
    var previaSeleccion = sel.value;
    filtro = (filtro || '').trim().toLowerCase();
    var filtradas = !filtro ? vincularOpciones : vincularOpciones.filter(function (r) {
      return String(r.load).toLowerCase().indexOf(filtro) !== -1 || (r.customer || '').toLowerCase().indexOf(filtro) !== -1;
    });
    if (!filtradas.length) {
      sel.innerHTML = '<option value="">Sin resultados…</option>';
      return;
    }
    sel.innerHTML = filtradas.map(function (r) {
      return '<option value="' + esc(r.load) + '">' + esc(r.load) + ' — ' + esc(shortCustomerName(r.customer)) + '</option>';
    }).join('');
    if (filtradas.some(function (r) { return String(r.load) === previaSeleccion; })) sel.value = previaSeleccion;
  }

  function openVincularModal(pendienteId) {
    var p = pendientes.filter(function (x) { return String(x.id) === String(pendienteId); })[0];
    if (!p) return;
    vincularCtx = { pendienteId: pendienteId };
    document.getElementById('vincular-note').textContent =
      'Busca y elige el load real de ' + (p.cliente || 'este cliente') + '. Su nota y sus comentarios se van a combinar con el historial de ese load, y este registro pendiente se va a eliminar.';
    var clienteLower = (p.cliente || '').toLowerCase();
    var mismoCliente = currentData.filter(function (r) { return (r.customer || '').toLowerCase() === clienteLower; });
    var resto = currentData.filter(function (r) { return (r.customer || '').toLowerCase() !== clienteLower; });
    vincularOpciones = mismoCliente.concat(resto);
    var search = document.getElementById('vincular-load-search');
    search.value = '';
    renderVincularOpciones('');
    document.getElementById('vincular-error').style.display = 'none';
    document.getElementById('vincular-backdrop').classList.add('show');
    search.focus();
  }

  function aplicarComentarios_(json) {
    // Mismo mapa para loads y para pendientes: los comentarios de un pendiente se guardan en
    // la misma hoja "Comentarios", solo que bajo su id en vez de un número de load, así que
    // getUltimosComentarios() ya regresa ambos juntos sin nada especial.
    ultimosComentarios = JSON.parse(json);
    // "Necesita atención" ahora depende también de si hay comentarios recientes, así que hay
    // que reconstruir la vista actual completa (no solo la tabla) para que el resaltado se
    // actualice en tarjetas también, no solo en la tabla.

    viewDirty.table = true;
    if (currentView === 'table') { buildTableView(); } else { buildCardsView(); }
    wireCardEvents();
    applyFilters();
    renderPendientes();

  function sortValue(rec, col) {
    switch (col) {
      case 'load': return Number(rec.load) || 0;
      case 'customer': return (rec.customer || '').toLowerCase();
      case 'trailer': return (rec.trailer || '').toLowerCase();
      case 'status': return (rec.status || '').toLowerCase();
      case 'origin_city': return (rec.origin_city || '').toLowerCase();
      case 'dest_city': return (rec.dest_city || '').toLowerCase();
      case 'pickup_appt': return rec.pickup_appt ? new Date(rec.pickup_appt).getTime() : 0;
      case 'delivery_appt': return rec.delivery_appt ? new Date(rec.delivery_appt).getTime() : 0;
      default: return '';
    }
  }
