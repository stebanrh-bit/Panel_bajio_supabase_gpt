  /** Dibuja (o esconde) el panel de detalle fijo debajo de la tabla, según cuál load esté
   * seleccionado (selectedTableLoad). Se llama después de cada renderTable() — incluidos los
   * refrescos de fondo (autoRefresh) — para que el panel siempre muestre datos vigentes del load
   * que se está viendo, sin que un refresco lo cierre de golpe. */
  function renderTableDetailPanel() {
    var panel = document.getElementById('table-detail-panel');
    if (!panel) return;
    var rec = selectedTableLoad ? recPorLoad_(selectedTableLoad) : null;
    if (!rec) {
      selectedTableLoad = null;
      panel.hidden = true;
      document.querySelectorAll('#table-body tr.t-row.selected').forEach(function (r) { r.classList.remove('selected'); });
      return;
    }
    document.getElementById('table-detail-load-label').textContent =
      'Load ' + rec.load + (rec.trailer ? ' — ' + rec.trailer : '') + ' — ' + rec.customer;
    document.getElementById('table-detail-body').innerHTML = detailPanelHtml(rec);
    panel.hidden = false;
    document.querySelectorAll('#table-body tr.t-row').forEach(function (r) {
      r.classList.toggle('selected', r.getAttribute('data-load') === String(selectedTableLoad));
    });
  }

  function renderTable(data) {
    data = data || [];
    var sorted = data.slice();
    if (tableSort.col) {
      sorted.sort(function (a, b) {
        var va = sortValue(a, tableSort.col), vb = sortValue(b, tableSort.col);
        if (va < vb) return -1 * tableSort.dir;
        if (va > vb) return 1 * tableSort.dir;
        return 0;
      });
    }
    diffRenderContainer('table-body', sorted, loadKeyFn, tableRowHtml, { nodesPerItem: 1, wrapperTag: 'tbody' });
    document.getElementById('table-empty').style.display = sorted.length ? 'none' : '';
    document.querySelectorAll('.loads-table th[data-sort]').forEach(function (th) {
      var col = th.getAttribute('data-sort');
      th.classList.toggle('sorted', tableSort.col === col);
      th.setAttribute('data-arrow', (tableSort.col === col && tableSort.dir === -1) ? '▲' : '▼');
    });
    renderTableDetailPanel();
  }

  document.querySelectorAll('.loads-table th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var col = th.getAttribute('data-sort');
      if (tableSort.col === col) { tableSort.dir *= -1; } else { tableSort.col = col; tableSort.dir = 1; }
      buildTableView();
      wireCardEvents();
      applyFilters();
    });
  });

  function applyView() {
    var cardsView = document.getElementById('cards-view');
    var tableView = document.getElementById('table-view');
    var btn = document.getElementById('view-toggle-btn');
    if (currentView === 'table') {
      cardsView.style.display = 'none';
      tableView.style.display = '';
      btn.textContent = 'Vista tarjetas';
      if (viewDirty.table) { buildTableView(); wireCardEvents(); applyFilters(); }
    } else {
      cardsView.style.display = '';
      tableView.style.display = 'none';
      btn.textContent = 'Vista tabla';
      if (viewDirty.cards) { buildCardsView(); wireCardEvents(); applyFilters(); }
    }
  }

  document.getElementById('view-toggle-btn').addEventListener('click', function () {
    currentView = (currentView === 'table') ? 'cards' : 'table';
    try { localStorage.setItem('bajio_view', currentView); } catch (e) {}
    applyView();
  });

  applyView();

  function clientesDeCsr(csr) {
    return asignaciones
      .filter(function (a) { return a.csr === csr; })
      .map(function (a) { return a.cliente.toLowerCase(); });
  }

  function loadSeguidoPorCsr(loadNum, csr) {
    if (!csr) return false;
    var key = String(loadNum || '').trim();
    return loadSeguimientos.some(function (s) { return String(s.load).trim() === key && s.csr === csr; });
  }

  function loadsSeguidosScope() {
    if (!currentWho) return [];
    var persona = personas.filter(function (p) { return p.nombre === currentWho; })[0];
    if (persona && persona.rol === 'CSR') {
      return loadSeguimientos.filter(function (s) { return s.csr === persona.nombre; }).map(function (s) { return String(s.load).trim(); });
    }
    if (persona && persona.rol === 'Seguimiento' && currentFollowCsrs.length) {
      return loadSeguimientos.filter(function (s) { return currentFollowCsrs.indexOf(s.csr) !== -1; }).map(function (s) { return String(s.load).trim(); });
    }
    return [];
  }

  function csrDeLoad(rec) {
    if (!rec) return '';
    var cust = String(rec.customer || '').trim().toLowerCase();
    if (!cust) return '';
    var a = asignaciones.filter(function (x) { return String(x.cliente || '').trim().toLowerCase() === cust; })[0];
    return a ? a.csr : '';
  }

  function workspaceFollowHtml(r) {
    if (!r || !myRealIdentity) return '';
    var dueño = csrDeLoad(r);
    if (dueño === myRealIdentity) return '';
    var siguiendo = loadSeguidoPorCsr(r.load, myRealIdentity);
    return '<button type="button" class="ws-btn' + (siguiendo ? ' primary' : '') + '" data-toggle-seguir-load="' + esc(r.load) + '">' +
      (siguiendo ? '★ Siguiendo este load' : '☆ Seguir este load') + '</button>';
  }

  /** Lista de clientes (en minúsculas) a los que currentWho tiene acceso, o null si no hay filtro (nadie seleccionado, o General viendo "Todos"). */
  function currentCsrClienteFiltro() {
    if (!currentWho) return null;
    var persona = personas.filter(function (p) { return p.nombre === currentWho; })[0];
    if (persona && persona.rol === 'CSR') {
      return clientesDeCsr(persona.nombre);
    }
    if (persona && persona.rol === 'Seguimiento' && currentFollowCsrs.length) {
      return currentFollowCsrs.reduce(function (acc, csr) { return acc.concat(clientesDeCsr(csr)); }, []);
    }
    return null;
  }

  /** Llena el selector de "filtrar por cliente" con el nombre completo de cada cliente visible
   * en el alcance actual (si hay un CSR/usuario seleccionado, solo sus clientes asignados; si es
   * "Todos", cualquier cliente que aparezca en las cargas cargadas). Conserva la selección actual
   * si sigue siendo válida; si ya no aplica (cambiaste de CSR), regresa a "Todos los clientes". */
  function renderClienteFilterOptions() {
    var sel = document.getElementById('cliente-filter');
    if (!sel) return;
    var csrClienteFiltro = currentCsrClienteFiltro();
    var loadsSeguidos = loadsSeguidosScope();
    var seen = {};
    var nombres = [];
    currentData.forEach(function (r) {
      var cust = String(r.customer || '').trim();
      if (!cust) return;
      var custLc = cust.toLowerCase();
      var esSeguido = loadsSeguidos.indexOf(String(r.load || '').trim()) !== -1;
      if (csrClienteFiltro && csrClienteFiltro.indexOf(custLc) === -1 && !esSeguido) return;
      if (!seen[custLc]) { seen[custLc] = true; nombres.push(cust); }
    });
    nombres.sort(function (a, b) { return a.localeCompare(b, 'es'); });

    if (currentClienteFiltro && seen[currentClienteFiltro] === undefined) {
      currentClienteFiltro = '';
    }

    sel.innerHTML = '<option value="">Todos los clientes</option>' + nombres.map(function (n) {
      var v = n.toLowerCase();
      return '<option value="' + esc(v) + '"' + (v === currentClienteFiltro ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
  }

  document.getElementById('cliente-filter').addEventListener('change', function () {
    currentClienteFiltro = this.value;
    applyFilters();
  });

  /** Actualiza los contadores "En curso"/"Entregadas" respetando el filtro de CSR/usuario actual.
   * Se calcula directo sobre currentData (no sobre el DOM) para que sea correcto aunque la vista
   * de tarjetas o de tabla todavía no se haya vuelto a dibujar. */
  function updateCounts(csrClienteFiltro) {
    var loadsSeguidos = loadsSeguidosScope();
    var matches = function (rec) {
      return !csrClienteFiltro || csrClienteFiltro.indexOf((rec.customer || '').toLowerCase()) !== -1 || loadsSeguidos.indexOf(String(rec.load || '').trim()) !== -1;
    };
    var activeCount = currentData.filter(function (r) { return !isArchived(r) && !isCanceladaFinalizada(r) && matches(r); }).length;
    var doneCount = currentData.filter(function (r) { return isArchived(r) && matches(r); }).length;
    var canceladaCount = currentData.filter(function (r) { return isCanceladaFinalizada(r) && matches(r); }).length;
    document.getElementById('count-active').textContent = activeCount;
    document.getElementById('count-done').textContent = doneCount;
    document.getElementById('count-cancelada').textContent = canceladaCount;
  }

  /** Actualiza las tarjetas de resumen (Cargas totales / En curso / Necesitan atención /
   * Docs completos / Recordatorios vencidos) respetando el filtro de CSR/usuario activo: un CSR
   * ve solo lo suyo, y un usuario de Seguimiento ve solo lo de los CSR que tiene marcados (o
   * todo si no marcó ninguno). */
  function updateStats(csrClienteFiltro) {
    var loadsSeguidos = loadsSeguidosScope();
    var scoped = csrClienteFiltro
      ? currentData.filter(function (r) { return csrClienteFiltro.indexOf(String(r.customer || '').toLowerCase()) !== -1 || loadsSeguidos.indexOf(String(r.load || '').trim()) !== -1; })
      : currentData;
    var active = scoped.filter(function (r) { return !isArchived(r) && !isCanceladaFinalizada(r); });
    var attentionCount = active.filter(needsAttention).length;
    // "Docs completos" solo cuenta cargas en curso (activas) — una vez entregada o
    // cancelada/finalizada ya no importa si le faltaba algún documento, así que no tiene caso
    // seguir contándola aquí.
    var docsReadyCount = active.filter(function (r) { return r.bol && r.doda && r.entry && r.sobre_listo; }).length;
    var recordatorioVencidoCount = scoped.filter(isRecordatorioVencido).length;
    var stats = [
      ['n', scoped.length, 'Cargas totales', ICON_TRUCK],
      ['n accent', active.length, 'En curso', ICON_CLOCK],
      ['n warn', attentionCount, 'Necesitan atención', ICON_ALERT, 'attention'],
      ['n', docsReadyCount + '/' + active.length, 'Docs completos', ICON_DOCS],
      ['n critical', recordatorioVencidoCount, 'Recordatorios vencidos', ICON_ALERT]
    ];
    document.getElementById('stats').innerHTML = stats.map(function (s) {
      var kind = s[4];
      var hint = kind ? '<span class="stat-hint">Ver detalle <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg></span>' : '';
      return '<div class="stat' + (kind ? ' stat-clickable' : '') + '"' + (kind ? ' data-kpi-detail="' + kind + '"' : '') + '><span class="stat-icon">' + s[3] + '</span><span class="' + s[0] + '">' + s[1] + '</span><span class="l">' + s[2] + '</span>' + hint + '</div>';
    }).join('');
  }

  /** "Activa" (para el chip "Activas") = el pickup ya llegó (hoy o antes) Y el viaje todavía
   * no termina (no es Delivered/Completed + POD confirmado). Si el pickup todavía es una
   * fecha futura, o si el viaje ya se completó y tiene su POD, no cuenta como activa. */
  function pickupIsFuture(dateStr) {
    if (!dateStr) return false;
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return false;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var pickupDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return pickupDay > today;
  }

  function cruceWithinDays(dateStr, daysAhead) {
    if (!dateStr) return false;
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return false;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var limit = new Date(today); limit.setDate(limit.getDate() + daysAhead);
    var cruceDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return cruceDay >= today && cruceDay <= limit;
  }

  function applyFilters() {
    renderActionCenter(currentData);
    renderHomeCommand(currentData);
    renderSinCsr_();
    var csrClienteFiltro = currentCsrClienteFiltro();
    var loadsSeguidos = loadsSeguidosScope();
    renderClienteFilterOptions();
    // :not([data-pendiente-id]):not([data-bitacora-id]) excluye las tarjetas de "Pendientes de
    // load" y de "Bitácora de turno": tienen clase .card (para heredar el mismo estilo visual)
    // pero no son loads — no tienen data-status, data-customer, etc., así que si no se excluyen
    // aquí, el filtro de CSR/cliente las trataba como si no coincidieran con ningún cliente y
    // las escondía (aparecían al agregarlas y desaparecían en cuanto corría cualquier
    // applyFilters() posterior — el mismo bug ya visto con "Pendientes de load").
    document.querySelectorAll('.card:not([data-pendiente-id]):not([data-bitacora-id]), #table-body tr.t-row').forEach(function (card) {
      var status = card.getAttribute('data-status');
      var isDone = isDoneStatus(status) && card.getAttribute('data-pod') === 'true';
      var isCancelada = statusNorm(status) === 'tonu' && card.getAttribute('data-recargos') === 'true';
      var isAttention = card.getAttribute('data-attention') === 'true';
      var isFuturePickup = pickupIsFuture(card.getAttribute('data-pickup'));
      var matchesFilter = currentFilter === 'all' ||
        (currentFilter === 'active' && !isFuturePickup && !isDone && !isCancelada) ||
        (currentFilter === 'done' && isDone) ||
        (currentFilter === 'cancelada' && isCancelada) ||
        (currentFilter === 'attention' && isAttention) ||
        (currentFilter === 'cruce-hoy' && cruceWithinDays(card.getAttribute('data-cruce'), 0)) ||
        (currentFilter === 'cruce-semana' && cruceWithinDays(card.getAttribute('data-cruce'), 6));
      var cardCustomer = card.getAttribute('data-customer');
      var haystack = card.getAttribute('data-load') + ' ' + cardCustomer + ' ' + card.getAttribute('data-city') + ' ' + (card.getAttribute('data-truck') || '') + ' ' + (card.getAttribute('data-trailer') || '') + ' ' + (card.getAttribute('data-extra') || '');
      var matchesSearch = !currentSearch || haystack.indexOf(currentSearch) !== -1;
      var matchesCsr = !csrClienteFiltro || csrClienteFiltro.indexOf(cardCustomer) !== -1 || loadsSeguidos.indexOf(String(card.getAttribute('data-load')).trim()) !== -1;
      var matchesCliente = !currentClienteFiltro || cardCustomer === currentClienteFiltro;
      // El load forzado (ver abrirLoadDesdeBitacora) siempre se muestra, sin importar de quién
      // sea el cliente ni si coincide con la búsqueda/pestaña activa — es una carga puntual a la
      // que alguien te mandó a propósito desde un pendiente de turno.
      var isForced = forcedVisibleLoad && String(card.getAttribute('data-load')) === forcedVisibleLoad;
      var visible = isForced || (matchesFilter && matchesSearch && matchesCsr && matchesCliente);
      card.style.display = visible ? '' : 'none';
      // Si el load que estaba seleccionado en el panel de detalle (ver renderTableDetailPanel)
      // queda escondido por el filtro/búsqueda actual, cerramos el panel — ya no tiene sentido
      // mostrar el detalle de una fila que ni siquiera se ve en la lista de arriba.
      if (card.classList.contains('t-row') && !visible && String(card.getAttribute('data-load')) === String(selectedTableLoad)) {
        selectedTableLoad = null;
        renderTableDetailPanel();
      }
    });
    var soloActivos = currentFilter === 'active' || currentFilter === 'attention' || currentFilter === 'cruce-hoy' || currentFilter === 'cruce-semana';
    document.getElementById('group-active').style.display = (currentFilter === 'done' || currentFilter === 'cancelada') ? 'none' : '';
    document.getElementById('group-done').style.display = (soloActivos || currentFilter === 'cancelada') ? 'none' : '';
    document.getElementById('group-cancelada').style.display = (soloActivos || currentFilter === 'done') ? 'none' : '';
    aplicarLimiteTabla_();
    marcarFilasMasivo_();
    updateCounts(csrClienteFiltro);
    updateStats(csrClienteFiltro);
  }

  // La tabla de Operación completa muestra de 200 en 200 (botón "Mostrar más"): con muchas
  // cargas, pintar todos los renglones a la vez hacía lenta la pantalla. Al cambiar de filtro,
  // búsqueda o persona se regresa a las primeras 200. La carga abierta en el detalle o a la que
  // te mandaron desde la bitácora siempre se ve.
  var TABLA_PASO_ = 200;
  var tablaLimite_ = TABLA_PASO_;
  var tablaFirmaFiltro_ = '';
  function aplicarLimiteTabla_() {
    var firma = [currentFilter, currentSearch, currentClienteFiltro, currentWho, currentFollowCsrs.join(',')].join('|');
    // (|| 200: applyFilters puede correr al arrancar, antes de que se asignen estas variables)
    if (firma !== tablaFirmaFiltro_ || !tablaLimite_) { tablaFirmaFiltro_ = firma; tablaLimite_ = TABLA_PASO_ || 200; }
    var visibles = 0, ocultas = 0;
    document.querySelectorAll('#table-body tr.t-row').forEach(function (tr) {
      if (tr.style.display === 'none') return;
      visibles++;
      var load = String(tr.getAttribute('data-load'));
      if (visibles > tablaLimite_ && load !== String(selectedTableLoad) && load !== String(forcedVisibleLoad)) { tr.style.display = 'none'; ocultas++; }
    });
    var btn = document.getElementById('tabla-mas');
    btn.hidden = !ocultas;
    if (ocultas) btn.textContent = 'Mostrar ' + Math.min(TABLA_PASO_ || 200, ocultas) + ' más · faltan ' + ocultas + ' de ' + visibles;
  }
  document.getElementById('tabla-mas').addEventListener('click', function () {
    tablaLimite_ += TABLA_PASO_ || 200;
    applyFilters();
  });

  /** Prende un destello breve en una tarjeta/fila para que sea obvio cuál es la que se acaba de
   * abrir (usado por abrirLoadDesdeBitacora). */
  function flashHighlight(el) {
    if (!el) return;
    el.classList.remove('flash-highlight');
    // Forzar reflow para poder reiniciar la animación aunque ya se haya usado en este elemento.
    void el.offsetWidth;
    el.classList.add('flash-highlight');
    setTimeout(function () { el.classList.remove('flash-highlight'); }, 2200);
  }

  /** Al hacer clic en el "Load XXXX" de una tarjeta de la Bitácora de turno, te lleva directo a
   * esa carga en el listado (tabla o tarjetas, según la vista activa) para poder editarla o
   * comentarla — aunque el load sea de un cliente/CSR fuera de tu filtro normal, no coincida con
   * tu búsqueda, o esté en una pestaña distinta a la activa (ver forcedVisibleLoad). No toca tu
   * selección de "¿quién eres?". */
  function abrirLoadDesdeBitacora(loadNum) {
    var histPage = document.getElementById('page-historico');
    if (histPage && !histPage.hidden) showMainPage('operation');
    var rec = recPorLoad_(loadNum);
    if (!rec) {
      showToast('No se encontró el load ' + loadNum + ' (puede que ya no esté en el sistema).', 'error');
      return;
    }
    forcedVisibleLoad = String(loadNum);
    currentSearch = '';
    var searchInput = document.getElementById('search');
    if (searchInput) searchInput.value = '';
    currentClienteFiltro = '';
    currentFilter = 'all';
    document.querySelectorAll('.chip').forEach(function (c) {
      c.setAttribute('aria-pressed', c.getAttribute('data-filter') === 'all' ? 'true' : 'false');
    });
    applyFilters();

    if (currentView === 'table') {
      selectedTableLoad = loadNum;
      renderTableDetailPanel();
      var row = null;
      document.querySelectorAll('#table-body tr.t-row').forEach(function (r) {
        if (String(r.getAttribute('data-load')) === String(loadNum)) row = r;
      });
      if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); flashHighlight(row); }
      var panel = document.getElementById('table-detail-panel');
      if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
      var card = null;
      document.querySelectorAll('.card[data-load]').forEach(function (c) {
        if (String(c.getAttribute('data-load')) === String(loadNum)) card = c;
      });
      if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); flashHighlight(card); }
    }
  }

  var whoDrawerOpenSeg = null;

  function whoToggleLabel() {
    if (!currentWho) return 'Usuario';
    var persona = personas.filter(function (p) { return p.nombre === currentWho; })[0];
    if (persona && persona.rol === 'Seguimiento') {
      if (!currentFollowCsrs.length) return currentWho + ' → Todos';
      if (currentFollowCsrs.length <= 2) return currentWho + ' → ' + currentFollowCsrs.join(', ');
      return currentWho + ' → ' + currentFollowCsrs.length + ' CSR';
    }
    return currentWho;
  }

  function updateWhoToggleLabel() {
    document.getElementById('who-toggle-label').textContent = whoToggleLabel();
    updatePanelOwnerCaption();
    schedulePanelAutoReturn();
  }

  /** Refleja en la leyenda de abajo de "Panel de control" a quién se tiene seleccionado en
   * "¿quién eres?" (currentWho) — el panel que se está viendo, no necesariamente quien verificó
   * su identidad con contraseña (myRealIdentity, usado solo para comentarios/pendientes). */
  function updatePanelOwnerCaption() {
    var ownerCaption = document.getElementById('panel-owner-caption');
    var ownerName = document.getElementById('panel-owner-name');
    if (!ownerCaption || !ownerName) return;
    if (currentWho) {
      ownerName.textContent = currentWho;
      ownerCaption.hidden = false;
    } else {
      ownerCaption.hidden = true;
    }
  }

  function selectWho(nombre, followCsr) {
    currentWho = nombre;
    currentFollowCsrs = followCsr ? [followCsr] : [];
    updateWhoToggleLabel();
    closeWhoDrawer();
    applyFilters();
    refreshOperationalAttention();
  }

  function renderWhoDrawer() {
    var body = document.getElementById('who-drawer-body');
    var csrList = personas.filter(function (p) { return p.rol === 'CSR'; });
    var segList = personas.filter(function (p) { return p.rol === 'Seguimiento'; });

    var html = '<button type="button" class="who-row' + (!currentWho ? ' active' : '') + '" data-who-all>Todos (sin filtro)</button>';

    html += '<div><div class="who-group-title">Usuario</div>';
    if (!csrList.length && !segList.length) {
      html += '<div class="comments-empty">Sin personas registradas</div>';
    } else {
      html += csrList.map(function (p) {
        return '<button type="button" class="who-row' + (currentWho === p.nombre ? ' active' : '') + '" data-who-csr="' + esc(p.nombre) + '">' + esc(p.nombre) + '</button>';
      }).join('');
      html += segList.map(function (p) {
        var isOpen = whoDrawerOpenSeg === p.nombre;
        var isSelected = currentWho === p.nombre;
        var sigueTexto = (p.sigueA && p.sigueA.length) ? p.sigueA.join(', ') : 'Todos (sin filtro)';
        return (
          '<button type="button" class="who-row' + (isSelected ? ' active' : '') + '" data-who-seg-toggle="' + esc(p.nombre) + '">' + esc(p.nombre) + '</button>' +
          '<div class="who-sub' + (isOpen ? ' open' : '') + '">' +
            '<div class="who-sub-readonly">Sigue a: <b>' + esc(sigueTexto) + '</b></div>' +
          '</div>'
        );
      }).join('');
    }
    html += '</div>';

    body.innerHTML = html;

    body.querySelectorAll('[data-who-all]').forEach(function (btn) {
      btn.addEventListener('click', function () { selectWho('', ''); });
    });
    body.querySelectorAll('[data-who-csr]').forEach(function (btn) {
      btn.addEventListener('click', function () { selectWho(btn.getAttribute('data-who-csr'), ''); });
    });
    body.querySelectorAll('[data-who-seg-toggle]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var nombre = btn.getAttribute('data-who-seg-toggle');
        if (currentWho !== nombre) {
          currentWho = nombre;
          var persona = personas.filter(function (pp) { return pp.nombre === nombre; })[0];
          currentFollowCsrs = (persona && persona.sigueA) ? persona.sigueA.slice() : [];
        }
        whoDrawerOpenSeg = (whoDrawerOpenSeg === nombre) ? null : nombre;
        updateWhoToggleLabel();
        renderWhoDrawer();
        applyFilters();
        refreshOperationalAttention();
      });
    });
  }

  function renderFollowDrawer() {
    var body = document.getElementById('who-drawer-body');
    var csrList = personas.filter(function (p) { return p.rol === 'CSR'; });
    var html = '<div><div class="who-group-title">A quién sigues</div>';
    html += '<button type="button" class="who-row' + (!currentFollowCsrs.length ? ' active' : '') + '" data-follow-all>Todos</button>';
    if (!csrList.length) {
      html += '<div class="comments-empty">Sin CSR registrados</div>';
    } else {
      html += csrList.map(function (c) {
        var isChecked = currentFollowCsrs.indexOf(c.nombre) !== -1;
        return '<button type="button" class="who-row' + (isChecked ? ' active' : '') + '" data-follow-csr="' + esc(c.nombre) + '">' + (isChecked ? '✓ ' : '') + esc(c.nombre) + '</button>';
      }).join('');
    }
    html += '</div>';
    body.innerHTML = html;

    body.querySelectorAll('[data-follow-all]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentFollowCsrs = [];
        updateWhoToggleLabel();
        renderFollowDrawer();
        applyFilters();
        saveMiSeguimiento();
      });
    });
    body.querySelectorAll('[data-follow-csr]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var csr = btn.getAttribute('data-follow-csr');
        var idx = currentFollowCsrs.indexOf(csr);
        if (idx === -1) { currentFollowCsrs.push(csr); } else { currentFollowCsrs.splice(idx, 1); }
        updateWhoToggleLabel();
        renderFollowDrawer();
        applyFilters();
        saveMiSeguimiento();
      });
    });
  }

  function saveMiSeguimiento() {
    if (!myRealIdentity || !myPassword) return;
    google.script.run.withFailureHandler(function (err) {
      showToast('No se pudo guardar "a quién sigues": ' + err.message, 'error');
    }).setMiSeguimiento(myRealIdentity, myPassword, currentFollowCsrs);
  }

  function openWhoDrawer() {
    var titleEl = document.getElementById('who-drawer-title');
    if (myRole() === 'Seguimiento') {
      if (titleEl) titleEl.textContent = 'A quién sigues';
      renderFollowDrawer();
    } else {
      if (titleEl) titleEl.textContent = '¿Quién eres?';
      var persona = personas.filter(function (p) { return p.nombre === currentWho; })[0];
      whoDrawerOpenSeg = (persona && persona.rol === 'Seguimiento') ? persona.nombre : null;
      renderWhoDrawer();
    }
    document.getElementById('who-drawer-backdrop').classList.add('show');
  }

  function closeWhoDrawer() {
    document.getElementById('who-drawer-backdrop').classList.remove('show');
  }

  document.getElementById('who-toggle-btn').addEventListener('click', openWhoDrawer);
  document.getElementById('who-drawer-close').addEventListener('click', closeWhoDrawer);
  document.getElementById('who-drawer-backdrop').addEventListener('click', function (e) {
    if (e.target.id === 'who-drawer-backdrop') closeWhoDrawer();
  });

  function rolLabel(rol) {
    return rol === 'Seguimiento' ? 'General' : rol;
  }

  function renderPersonasList() {
    var el = document.getElementById('csr-personas-list');
    if (!personas.length) { el.innerHTML = '<div class="comments-empty">Sin personas registradas</div>'; return; }
    el.innerHTML = personas.map(function (p) {
      var rolOpts = ['CSR', 'Seguimiento', 'Supervisor'].map(function (r) {
        return '<option value="' + r + '"' + (p.rol === r ? ' selected' : '') + '>' + esc(rolLabel(r)) + '</option>';
      }).join('');
      return '<div class="csr-list-item csr-list-item-persona"><span>' + esc(p.nombre) + '</span>' +
        '<select class="csr-correo-input" aria-label="Rol de ' + esc(p.nombre) + '" data-rol-nombre="' + esc(p.nombre) + '">' + rolOpts + '</select>' +
        '<input type="email" class="csr-correo-input" placeholder="correo@..." value="' + esc(p.correo || '') + '" data-correo-nombre="' + esc(p.nombre) + '">' +
        '<input type="text" class="csr-correo-input" placeholder="' + (p.passwordSet ? 'Contraseña ya asignada' : 'Asignar contraseña (mínimo 8 caracteres)') + '" data-password-nombre="' + esc(p.nombre) + '">' +
        '<button type="button" class="csr-remove" data-remove-persona="' + esc(p.nombre) + '">&times;</button></div>';
    }).join('');
    el.querySelectorAll('[data-rol-nombre]').forEach(function (sel) {
      sel.addEventListener('change', function () {
        var nombre = sel.getAttribute('data-rol-nombre');
        var rol = sel.value;
        google.script.run.withSuccessHandler(function (res) {
          if (res.ok) {
            var p = personas.filter(function (x) { return x.nombre === nombre; })[0];
            if (p) p.rol = rol;
            if (currentWho === nombre || myRealIdentity === nombre) { applyFilters(); refreshOperationalAttention(); }
            showToast('Rol actualizado: ' + nombre + ' → ' + rolLabel(rol), 'good');
          } else {
            showToast(res.error || 'No se pudo actualizar el rol', 'error');
          }
        }).withFailureHandler(function (err) {
          showToast('Error: ' + err.message, 'error');
        }).setPersonaRol(nombre, rol, adminCred_());
      });
    });
    el.querySelectorAll('[data-remove-persona]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var nombre = btn.getAttribute('data-remove-persona');
        personas = personas.filter(function (p) { return p.nombre !== nombre; });
        renderPersonasList();
        accionConDeshacer_('Persona eliminada: ' + nombre, function () {
          guardarConVerificacion_(function () {
            loadPersonasYAsignaciones();
          }, function (err) {
            loadPersonasYAsignaciones();
            showToast('No se pudo eliminar a ' + nombre + ': ' + err.message, 'error');
          }).removePersona(nombre, adminCred_());
        }, function () {
          loadPersonasYAsignaciones();
        });
      });
    });
    el.querySelectorAll('[data-correo-nombre]').forEach(function (input) {
      input.addEventListener('change', function () {
        var nombre = input.getAttribute('data-correo-nombre');
        var correo = input.value.trim();
        google.script.run.withSuccessHandler(function (res) {
          if (res.ok) {
            var p = personas.filter(function (x) { return x.nombre === nombre; })[0];
            if (p) p.correo = correo;
            showToast('Correo actualizado: ' + nombre, 'good');
          } else {
            showToast(res.error || 'No se pudo actualizar el correo', 'error');
          }
        }).setPersonaCorreo(nombre, correo, adminCred_());
      });
    });
    el.querySelectorAll('[data-password-nombre]').forEach(function (input) {
      input.addEventListener('change', function () {
        var nombre = input.getAttribute('data-password-nombre');
        var password = input.value.trim();
        if (!password) return;
        google.script.run.withSuccessHandler(function (res) {
          if (res.ok) {
            input.value = '';
            loadPersonasYAsignaciones();
            showToast('Contraseña actualizada: ' + nombre, 'good');
          } else {
            showToast(res.error || 'No se pudo actualizar la contraseña', 'error');
          }
        }).withFailureHandler(function (err) {
          showToast('Error: ' + err.message, 'error');
        }).setPersonaPassword(nombre, password, adminCred_());
      });
    });
  }

  // Identidad real de quien está usando el panel ahorita, verificada con su contraseña personal (nunca
  // por el selector de "usuario", que solo cambia qué se está VIENDO/filtrando). Los comentarios
  // siempre se firman con esto, para que nadie pueda "volverse" otro CSR al cambiar el filtro y
  // que sus comentarios salgan como si los hubiera puesto alguien más.
  //
  // Antes esto se detectaba automático con la cuenta de Google (Session.getActiveUser()), pero
  // eso requería compartir el Google Sheet directo con cada persona para que Google expusiera su
  // identidad al script — lo cual les hubiera dado acceso a ver todas las cargas de todos los CSR
  // en crudo, sin el filtrado del panel. Por eso se cambió a una contraseña personal: cada quien lo
  // verifica una vez por navegador (se guarda en localStorage) y el servidor lo vuelve a revisar
  // en cada comentario, sin depender de Google ni exponer el Sheet.
  var myRealIdentity = '';
  var myPassword = '';

  var myTemplates = {};
  var myTemplateLabels = {};

  var salidaMexicoDebounceTimers = {};
  var cruceUsaDebounceTimers = {};
  var pendingFieldFlush = {};
  function flushPendingFieldSaves(load, done) {
    var flushers = pendingFieldFlush[load];
    var keys = flushers ? Object.keys(flushers) : [];
    if (!keys.length) { done(); return; }
    var remaining = keys.length;
    keys.forEach(function (k) {
      var fn = flushers[k];
      fn(function () {
        remaining--;
        if (remaining <= 0) done();
      });
    });
  }

  // Si con tu identidad ya verificada te metes al panel de otro CSR (o a "Todos") para revisar
  // algo puntual, después de 1.5 minutos sin volver a tocar el selector de "¿quién eres?" se
  // regresa solo a tu propio panel — para que no se te quede viendo el de otra persona por
  // accidente. Se reprograma cada vez que cambias de panel (ver updateWhoToggleLabel).
  var panelAutoReturnTimer = null;
  var PANEL_AUTO_RETURN_MS = 90000; // 1.5 minutos

  function schedulePanelAutoReturn() {
    if (panelAutoReturnTimer) {
      clearTimeout(panelAutoReturnTimer);
      panelAutoReturnTimer = null;
    }
    if (!myRealIdentity || currentWho === myRealIdentity) return;
    panelAutoReturnTimer = setTimeout(function () {
      panelAutoReturnTimer = null;
      if (!myRealIdentity || currentWho === myRealIdentity) return;
      selectWho(myRealIdentity, '');
      showToast('Regresaste en automático a tu panel (' + myRealIdentity + ')', 'good');
    }, PANEL_AUTO_RETURN_MS);
  }

  // Callback pendiente de un intento de cambio que se detuvo porque nadie había iniciado sesión
  // todavía en este navegador — se ejecuta solo (una vez) en cuanto el login se completa. Ver
  // ensureLoggedIn(), que es el punto de entrada único usado por TODOS los cambios editables del
  // panel (estatus, POD, recargos, truck, trailer, fechas, color, comentarios, incidencias,
  // pendientes, bitácora) para exigir sesión iniciada antes de guardar cualquier cosa.
  var pendingAfterLogin = null;

  /** Punto de entrada único: si ya hay sesión iniciada, ejecuta "accion" de inmediato; si no,
   * abre el modal de login y deja "accion" pendiente para correrla sola en cuanto se inicie
   * sesión con éxito (ver el final de verifyIdentity()). */
  function ensureLoggedIn(accion) {
    if (myRealIdentity && myPassword) { accion(); return; }
    pendingAfterLogin = accion;
    openIdentityModal();
  }

  function renderIdentitySelect() {
    var sel = document.getElementById('identity-nombre-select');
    if (!sel) return;
    var actual = sel.value;
    sel.innerHTML = '<option value="" disabled' + (actual ? '' : ' selected') + '>' + (personas.length ? 'Elige tu nombre…' : 'Cargando nombres…') + '</option>' +
      personas.map(function (p) {
        return '<option value="' + esc(p.nombre) + '">' + esc(p.nombre) + '</option>';
      }).join('');
    if (actual) sel.value = actual;
  }

  function openIdentityModal() {
    renderIdentitySelect();
    if (myRealIdentity) document.getElementById('identity-nombre-select').value = myRealIdentity;
    document.getElementById('identity-password-input').value = '';
    document.getElementById('identity-error').style.display = 'none';
    document.getElementById('identity-change-pw-box').style.display = 'none';
    document.getElementById('identity-new-password-input').value = '';
    var isGate = !myRealIdentity;
    var box = document.getElementById('identity-modal-box');
    var backdrop = document.getElementById('identity-backdrop');
    box.classList.toggle('gate-mode', isGate);
    backdrop.classList.toggle('gate-active', isGate);
    document.getElementById('identity-modal-title').textContent = isGate ? 'Iniciar sesión' : 'Cambiar de sesión';
    backdrop.classList.add('show');
  }

  /** Atajo para el botón "Cambiar contraseña" del header: abre el mismo modal pero directo con el
   * bloque de nueva contraseña ya desplegado, para no obligar a dar clic dos veces. */
  function openChangePasswordModal() {
    openIdentityModal();
    if (myRealIdentity) document.getElementById('identity-change-pw-box').style.display = 'flex';
  }

  function closeIdentityModal() {
    if (!myRealIdentity) return;
    document.getElementById('identity-backdrop').classList.remove('show');
  }

  document.getElementById('identity-change-pw-link').addEventListener('click', function () {
    var box = document.getElementById('identity-change-pw-box');
    box.style.display = (box.style.display === 'none') ? 'flex' : 'none';
  });

  document.getElementById('identity-change-pw-submit').addEventListener('click', function () {
    var nombre = document.getElementById('identity-nombre-select').value;
    var currentPassword = document.getElementById('identity-password-input').value.trim();
    var newPassword = document.getElementById('identity-new-password-input').value.trim();
    var errEl = document.getElementById('identity-error');
    if (!nombre || !currentPassword) {
      errEl.textContent = 'Escribe tu contraseña actual arriba primero.';
      errEl.style.display = '';
      return;
    }
    if (!newPassword || newPassword.length < 8) {
      errEl.textContent = 'La nueva contraseña debe tener al menos 8 caracteres.';
      errEl.style.display = '';
      return;
    }
    var btn = document.getElementById('identity-change-pw-submit');
    btn.disabled = true;
    google.script.run.withSuccessHandler(function (res) {
      btn.disabled = false;
      if (res.ok) {
        // Con el Code.gs nuevo, cambiar la contraseña cierra las demás sesiones y regresa un
        // token nuevo para esta — se sigue trabajando sin volver a entrar.
        if (res.token && nombre === myRealIdentity) {
          myPassword = res.token;
          guardarSesionLocal_(nombre, res.token);
          showToast('Contraseña actualizada. Se cerró tu sesión en otras computadoras.', 'good');
          document.getElementById('identity-new-password-input').value = '';
          document.getElementById('identity-change-pw-box').style.display = 'none';
          closeIdentityModal();
          return;
        }
        showToast('Contraseña actualizada — vuelve a iniciar sesión con la nueva', 'good');
        document.getElementById('identity-new-password-input').value = '';
        document.getElementById('identity-change-pw-box').style.display = 'none';
      } else {
        errEl.textContent = res.error || 'No se pudo cambiar la contraseña';
        errEl.style.display = '';
      }
    }).withFailureHandler(function (err) {
      btn.disabled = false;
      errEl.textContent = 'Error: ' + err.message;
      errEl.style.display = '';
    }).changeMyPassword(nombre, currentPassword, newPassword);
  });

  /** Verifica nombre+contraseña contra el servidor. opts.silent evita mostrar toasts/errores (se usa al
   * restaurar la identidad guardada en localStorage al cargar la página); opts.onDone se llama
   * siempre al terminar (éxito o no), para poder reactivar botones. */
  function verifyIdentity(nombre, password, opts) {
    opts = opts || {};
    google.script.run.withSuccessHandler(function (res) {
      if (res && res.ok) {
        myRealIdentity = nombre;
        myPassword = (res.token) ? res.token : password;
        guardarSesionLocal_(nombre, res.token || '');
        if (!currentWho) {
          currentWho = nombre;
          var mePersonaLogin = personas.filter(function (p) { return p.nombre === nombre; })[0];
          currentFollowCsrs = (mePersonaLogin && mePersonaLogin.rol === 'Seguimiento') ? (mePersonaLogin.sigueA || []) : [];
          updateWhoToggleLabel();
          renderWhoDrawer();
          applyFilters();
          refreshOperationalAttention();
        } else {
          // currentWho ya estaba en algo (p. ej. el panel de otro CSR) desde antes de verificar
          // tu identidad — igual hay que (re)programar el regreso automático a tu panel, ya que
          // updateWhoToggleLabel() no se llama en este caso (currentWho no cambió).
          schedulePanelAutoReturn();
        }
        updateCommentsIdentityGate();
        // FIX: seguridad — todo lo que exige sesión se pide aquí, en cuanto se confirma (ver el
        // arranque al final del script, que ya no pide cargas sin sesión).
        // Una sola llamada trae todo lo que depende de quién eres: cargas, personas/asignaciones/
        // seguimientos, comentarios, bitácora, pendientes, apartados y cierres de turno.
        lastLoadsFetchTs = 0;
        autoRefreshBusy = false;
        autoRefresh(true);
        loadSlaMetrics();
        loadMisPlantillas(); // el Centro de mensajes también es de quien inició sesión
        renderVistas_(); // "Mis vistas" es de cada quien
        closeIdentityModal();
        if (!opts.silent) showToast('Sesión iniciada: ' + nombre, 'good');
        if (pendingAfterLogin) {
          var accion = pendingAfterLogin;
          pendingAfterLogin = null;
          accion();
        }
      } else {
        myRealIdentity = '';
        myPassword = '';
        borrarSesionLocal_();
        schedulePanelAutoReturn(); // sin identidad verificada, no hay a dónde regresar — cancela el temporizador
        updateCommentsIdentityGate();
        loadBitacora(); // sin identidad verificada, no debe quedar viendo pendientes de nadie
        loadPendientes(); // idem
        loadApartados_(); // idem
        loadMisPlantillas(); // idem — sin identidad, vuelve a las 4 plantillas default
        loadCierresRecibidos(); // idem — sin identidad, no debe quedar viendo cierres de nadie
        if (!opts.silent) {
          var errEl = document.getElementById('identity-error');
          errEl.textContent = (res && res.error) || 'Contraseña incorrecta.';
          errEl.style.display = '';
        }
      }
      if (opts.onDone) opts.onDone();
    }).withFailureHandler(function (err) {
      updateCommentsIdentityGate();
      if (!opts.silent) showToast('Error al verificar: ' + err.message, 'error');
      if (opts.onDone) opts.onDone();
    }).verifyIdentityLogin(nombre, password);
  }

  function submitIdentity() {
    var nombre = document.getElementById('identity-nombre-select').value;
    var password = document.getElementById('identity-password-input').value.trim();
    if (!nombre || !password) {
      var errEl = document.getElementById('identity-error');
      errEl.textContent = !nombre ? 'Elige tu nombre.' : 'Escribe tu contraseña.';
      errEl.style.display = '';
      return;
    }
    var btn = document.getElementById('identity-submit');
    btn.disabled = true;
    verifyIdentity(nombre, password, { onDone: function () { btn.disabled = false; } });
  }

  document.getElementById('identity-verify-btn').addEventListener('click', openIdentityModal);
  document.getElementById('identity-close').addEventListener('click', closeIdentityModal);
  document.getElementById('identity-backdrop').addEventListener('click', function (e) {
    if (e.target.id === 'identity-backdrop') closeIdentityModal();
  });
  document.getElementById('identity-submit').addEventListener('click', submitIdentity);
  document.getElementById('identity-password-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitIdentity();
  });

  /** Al cargar la página, intenta restaurar la identidad ya verificada antes en este navegador
   * (guardada en localStorage), revalidándola contra el servidor por si la contraseña cambió mientras
   * tanto. Si no hay nada guardado, se queda bloqueado hasta que alguien verifique su contraseña. */
  function guardarSesionLocal_(nombre, token) {
    try {
      localStorage.setItem('bajio_identity_nombre', nombre);
      if (token) localStorage.setItem('bajio_identity_token', token);
      else localStorage.removeItem('bajio_identity_token');
      localStorage.removeItem('bajio_identity_password'); // formato viejo: contraseña en claro
    } catch (e) {}
  }
  function borrarSesionLocal_() {
    try {
      localStorage.removeItem('bajio_identity_nombre');
      localStorage.removeItem('bajio_identity_token');
      localStorage.removeItem('bajio_identity_password');
    } catch (e) {}
  }

  function loadStoredIdentity() {
    var nombre = '', password = '';
    try {
      nombre = localStorage.getItem('bajio_identity_nombre') || '';
      // Token de sesión (formato nuevo). Si este navegador todavía trae la contraseña guardada
      // del formato viejo, se usa UNA vez para entrar: verifyIdentity la cambia por un token y la
      // borra del disco (ver guardarSesionLocal_).
      password = localStorage.getItem('bajio_identity_token') || localStorage.getItem('bajio_identity_password') || '';
    } catch (e) {}
    if (nombre && password) {
      verifyIdentity(nombre, password, { silent: true });
    } else {
      updateCommentsIdentityGate();
    }
  }

  // Bloquea (o desbloquea) el cuadro de comentarios según si ya se verificó la identidad real
  // de quien está usando el panel. Sin identidad verificada, no se permite escribir/guardar
  // comentarios, para que nunca se pueda guardar uno sin saber con certeza quién lo escribió.
  function updateCommentsIdentityGate() {
    var textarea = document.getElementById('comments-textarea');
    var btn = document.getElementById('comments-submit');
    var verifyBtn = document.getElementById('identity-verify-btn');
    if (textarea && btn) {
      if (myRealIdentity) {
        textarea.disabled = false;
        btn.disabled = false;
        textarea.placeholder = 'Escribe un comentario...';
        if (verifyBtn) verifyBtn.style.display = 'none';
      } else {
        textarea.disabled = true;
        btn.disabled = true;
        textarea.placeholder = 'Verifica tu identidad para poder comentar (botón de abajo).';
        if (verifyBtn) verifyBtn.style.display = '';
      }
    }
    updateHeaderSessionUI();
    updateWhoToggleBtnMeta();
  }

  function sessionInitials(nombre) {
    if (!nombre) return '';
    var parts = nombre.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  function updateHeaderSessionUI() {
    var avatar = document.getElementById('session-chip-avatar');
    var name = document.getElementById('session-chip-name');
    var chip = document.getElementById('session-chip');
    if (!avatar || !name || !chip) return;
    chip.hidden = !myRealIdentity;
    renderAvisos_();
    ['session-change-pw-btn', 'session-logout-btn'].forEach(function (id) {
      var b = document.getElementById(id);
      if (b) b.hidden = !myRealIdentity;
    });
    if (myRealIdentity) {
      var persona = personas.filter(function (p) { return p.nombre === myRealIdentity; })[0];
      avatar.textContent = sessionInitials(myRealIdentity);
      name.textContent = myRealIdentity;
      chip.title = persona ? rolLabel(persona.rol) : '';
    } else {
      avatar.textContent = '';
      name.textContent = 'Sin sesión';
      chip.title = '';
    }
  }

  /** A qué persona pertenece la sesión actualmente iniciada (CSR / Seguimiento), o '' si nadie ha
   * iniciado sesión todavía. Usado en Fase B para decidir qué versión de "¿Quién eres?" mostrar. */
  function myRole() {
    if (!myRealIdentity) return '';
    var p = personas.filter(function (p) { return p.nombre === myRealIdentity; })[0];
    return p ? p.rol : '';
  }

  /** El botón "¿Quién eres?"/"A quién sigues" del sidebar cambia de título según el rol de quien
   * inició sesión (ver Fase B: openWhoDrawer()). */
  function updateWhoToggleBtnMeta() {
    var btn = document.getElementById('who-toggle-btn');
    if (!btn) return;
    btn.title = (myRole() === 'Seguimiento') ? 'A quién sigues' : '¿Quién eres?';
  }

  function logout() {
    myRealIdentity = '';
    myPassword = '';
    csrAdminPw = '';
    borrarSesionLocal_();
    // Las cargas de quien cerró sesión no deben quedarse en memoria para el siguiente que entre.
    lastLoadsFetchTs = 0;
    marcasConocidas_ = {};
    if (masivo_.activo) activarMasivo_(false);
    renderVistas_();
    render([]);
    avisosEstado_ = null;
    bitacoraCargada_ = false;
    abrirAvisos_(false);
    currentWho = '';
    currentFollowCsrs = [];
    updateWhoToggleLabel();
    renderWhoDrawer();
    applyFilters();
    updateCommentsIdentityGate();
    loadBitacora();
    loadPendientes(); // idem — ya no debe quedar viendo los pendientes de load de quien cerró sesión
    loadApartados_(); // idem — ni sus loads apartados
    loadMisPlantillas(); // idem — ya no debe quedar viendo el Centro de mensajes de quien cerró sesión
    loadCierresRecibidos(); // idem — ya no debe quedar viendo los cierres de turno de quien cerró sesión
    showToast('Sesión cerrada', 'good');
    openIdentityModal();
  }

  document.getElementById('session-change-pw-btn').addEventListener('click', openChangePasswordModal);
  document.getElementById('session-logout-btn').addEventListener('click', logout);

  // ---- Sidebar: accesos rápidos (scroll a sección) y encabezado (última actualización + refresh) ----
  document.querySelectorAll('.sidebar-btn[data-scroll-to]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = document.getElementById(btn.getAttribute('data-scroll-to'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

  function updateHeaderTimestamp() {
    var el = document.getElementById('header-updated');
    if (!el || !lastRenderedAt) return;
    el.textContent = 'Actualizado ' + relativeTimeLabel(lastRenderedAt);
  }
  setInterval(updateHeaderTimestamp, 30000);

  document.getElementById('header-refresh-btn').addEventListener('click', function () {
    var btn = this;
    if (btn.classList.contains('spinning')) return;
    btn.classList.add('spinning');
    setTimeout(function () { btn.classList.remove('spinning'); }, 450);
    autoRefreshBusy = false;
    autoRefresh(true); // trae todo, aunque las marcas digan que no cambió nada
  });

  function loadPersonasYAsignaciones() {
    google.script.run.withSuccessHandler(aplicarPersonas_).getPersonas(myRealIdentity, myPassword);
    google.script.run.withSuccessHandler(aplicarAsignaciones_).getAsignaciones(myRealIdentity, myPassword);
    google.script.run.withSuccessHandler(aplicarSeguimientos_).getLoadSeguimientos(myRealIdentity, myPassword);
  }
  function aplicarPersonas_(json) {

  function fmtDateTime(d) {
    if (!d) return '';

    var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
    return dt.getDate() + ' ' + months[dt.getMonth()] + ', ' + pad2(dt.getHours()) + ':' + pad2(dt.getMinutes());
  }

  function workspaceJourneyHtml(r){

      { label: 'Salida planta', date: r.salida_mexico_fecha, done: journeyStageDone_(r.salida_mexico_fecha) }
    ];
    var salidaLista = journeyStageDone_(r.salida_mexico_fecha);
    var cruceLista = journeyStageDone_(r.cruce_usa_fecha);
    if (salidaLista && !cruceLista && TRANSIT_SUBSTAGE_STATUSES_.indexOf(r.status) !== -1) {
      stages.push({ label: r.status, date: '', done: false });
    }
    stages.push({ label: 'Cruce aduana', date: r.cruce_usa_fecha, done: cruceLista });
    stages.push({ label: 'Entrega', date: r.delivery_actual || r.delivery_appt, done: !!r.delivery_actual });
    var activeIdx = -1;
    for (var i = 0; i < stages.length; i++) { if (!stages[i].done) { activeIdx = i; break; } }
    var parts = [];
    stages.forEach(function (s, i) {
      if (i > 0) parts.push('<div class="ws-journey-line' + (stages[i - 1].done ? ' done' : '') + '"></div>');
      var cls = 'ws-journey-stage' + (s.done ? ' done' : (i === activeIdx ? ' active' : ' pending'));
      var dateLabel = s.date ? fmtDateTime(s.date) : (i === activeIdx ? 'En curso' : 'Pendiente');
      parts.push('<div class="' + cls + '"><div class="ws-journey-dot"></div><div class="ws-journey-label">' + esc(s.label) + '</div><div class="ws-journey-date">' + esc(dateLabel) + '</div></div>');
    });

  function esEstadoMexicano_(estado){ return /\.$/.test(String(estado||'').trim()); }
  function esLaredoTX_(ciudad,estado){ return /laredo/i.test(String(ciudad||'').trim()) && /^tx\.?$/i.test(String(estado||'').trim()); }
  function esNuevoLaredo_(ciudad){ return /nuevo\s*laredo/i.test(String(ciudad||'').trim()); }
  function loadDirection(r){
    var origenMx=esEstadoMexicano_(r.origin_state);
    var destinoMx=esEstadoMexicano_(r.dest_state);
    var destinoLaredoTX=esLaredoTX_(r.dest_city,r.dest_state);
    // Transload: sale de Nuevo Laredo hacia EE.UU., EXCEPTO cuando el destino es Laredo TX (ese
    // caso es un cruce normal, no transload) — cuenta con cualquier estatus, no solo Completed/
    // Delivered, mismo criterio que el dashboard TCI.
    var transload=esNuevoLaredo_(r.origin_city) && !destinoMx && !destinoLaredoTX;
    var code=null;
    if(origenMx && !destinoMx) code='NB'; // México -> EE.UU. = Exportación (incluye México -> Laredo TX)
    else if(!origenMx && destinoMx) code='SB'; // EE.UU. -> México = Importación
    else if(!origenMx && !destinoMx && destinoLaredoTX) code='SB'; // excepción: ambos lados EE.UU. pero el destino es Laredo TX
    return {code:code,transload:transload};
  }

  // ---- "¿Cuánto le falta?" (Load Workspace → Tracking) ----
  // Coordenadas de la unidad → millas por carretera (OSRM, gratis) hasta la ciudad destino de la
  // carga → hora de llegada con la regla del equipo (millas ÷ 48), comparada con la cita de entrega.
  // Si OSRM no responde, se estima con la línea recta × 1.2. El punto y el trayecto se guardan en la
  // base (Direcciones/Distancias) como en el Radar, para que el proceso de Google los certifique.
  var faltaUltimo_ = null; // { load, texto } del último cálculo, para copiarlo o guardarlo como comentario
  // El workspace se vuelve a dibujar con cada refresco: se guarda el último resultado para no perderlo.
  var faltaEstado_ = null; // { load, coords, html }
  function faltaDe_(load) { return faltaEstado_ && String(faltaEstado_.load) === String(load) ? faltaEstado_ : { coords: '', html: '' }; }
  function faltaCalcular_(load) {
    var r = recPorLoad_(load), out = document.getElementById('falta-resultado'), inp = document.getElementById('falta-coords');
    if (!r || !out || !inp) return;
    var c = parseCoords_(inp.value);
    if (!c) { out.innerHTML = '<span class="sev-warn">Pega las coordenadas así: 41.9237, -85.0186</span>'; return; }
    if (!r.dest_city) { out.innerHTML = '<span class="sev-warn">Esta carga no tiene ciudad de destino.</span>'; return; }
    var hacer = function () {
      var dKey = radarKey_(r.dest_city, r.dest_state), destino = radarLugar_(r.dest_city, r.dest_state);
      out.innerHTML = '<span class="hm-soft">Calculando…</span>';
      cargarCoordsP_().then(function () {
        if (radarCoords_[dKey]) return radarCoords_[dKey];
        return radarBuscarOSM_(r.dest_city, r.dest_state).then(function (d) {
          if (d) {
            radarCoords_[dKey] = d;
            gsr_('guardarCoordenadas', [{ key: dKey, ciudad: titleCity(r.dest_city), estado: String(r.dest_state || ''), lat: d[0], lon: d[1] }], myRealIdentity, myPassword).catch(function () {});
          }
          return d;
        });
      }).then(function (d) {
        if (!d) throw new Error('No encontré ' + destino + ' en el mapa.');
        var recta = radarMillas_(c, d);
        return radarPedirRuta_(c, d).catch(function () { return null; }).then(function (ruta) {
          if (!ruta) return { millas: recta * 1.2, fuente: 'estimado' };
          gsr_('guardarDistancias', [{ origen: coordsKey_(c), destino: dKey, millas: ruta.millas, horas: ruta.horas, recta: recta }], myRealIdentity, myPassword).catch(function () {});
          return { millas: ruta.millas, fuente: 'osm' };
        });
      }).then(function (x) {
        if (String(workspaceCurrentLoad) !== String(load)) return; // ya cambiaron de carga
        out = document.getElementById('falta-resultado') || out; // por si el workspace se redibujó mientras calculaba
        var h = horasUnidad_(x.millas), llega = new Date(Date.now() + h * 3600000), cita = pd(r.delivery_appt), vsCita = '';
        if (cita && !isNaN(cita.getTime())) {
          var dif = (cita.getTime() - llega.getTime()) / 3600000;
          vsCita = dif >= 0 ? '<span class="sev-good">✓ llega ' + fmtHorasUnidad_(dif) + ' antes de la cita</span>'
            : '<span class="sev-warn">✗ llega ' + fmtHorasUnidad_(-dif) + ' después de la cita (' + esc(fmtDateTime(cita)) + ')</span>';
        }
        var pintar = function (lugar) {
          out = document.getElementById('falta-resultado') || out;
          faltaUltimo_ ={ load: load, texto: 'Ubicación: ' + (lugar ? 'cerca de ' + lugar + ' ' : '') + '(' + coordsTxt_(c) + '). Faltan ' + Math.round(x.millas) +
            ' mi a ' + destino + '; llega aprox. ' + fmtDateTime(llega) + ' (millas ÷ ' + VELOCIDAD_UNIDAD_MPH + ').' };
          out.innerHTML = '<div><b>Faltan ' + Math.round(x.millas) + ' mi</b> a ' + esc(destino) + ' <small class="hm-soft">(' + esc(etiquetaFuente_(x.fuente)) + ')</small></div>' +
            '<div>🚛 Llega en ~<b>' + fmtHorasUnidad_(h) + '</b> · ' + esc(fmtDateTime(llega)) + '</div>' +
            (lugar ? '<div class="hm-soft">La unidad está cerca de ' + esc(lugar) + '</div>' : '') + (vsCita ? '<div>' + vsCita + '</div>' : '') +
            '<div class="tracking-actions"><button class="ws-btn" data-falta-copiar>Copiar</button><button class="ws-btn" data-falta-comentario>Guardar como comentario</button></div>';
          faltaEstado_ = { load: load, coords: coordsTxt_(c), html: out.innerHTML };
        };
        pintar('');
        radarReversa_(c).then(function (lugar) {
          guardarPunto_(c, lugar);
          if (lugar && String(workspaceCurrentLoad) === String(load)) pintar(lugar);
        });
      }).catch(function (err) {
        out.innerHTML = '<span class="sev-warn">' + esc(err && err.message ? err.message : String(err)) + '</span>';
      });
    };
    if (!myRealIdentity || !myPassword) { ensureLoggedIn(hacer); return; }
    hacer();
  }

  /** Trae del servidor las plantillas guardadas de quien acaba de iniciar sesión. Se llama
   * desde verifyIdentity() (incluida la restauración silenciosa al cargar la página), nunca
   * desde selectWho()/el toggle de "¿Quién eres?" — el Centro de mensajes es de quien redacta
   * (myRealIdentity), no del perfil que esté viendo en ese momento. */
  function loadMisPlantillas() {
    if (!myRealIdentity || !myPassword) { myTemplates = {}; myTemplateLabels = {}; return; }
    google.script.run.withSuccessHandler(function (res) {
      if (!res || res.ok === false) return; // silencioso: se quedan las 4 plantillas default
      myTemplates = res.templates || {};
      myTemplateLabels = res.labels || {};
      if (workspaceCurrentLoad) renderWorkspace(); // por si el panel de plantillas ya estaba abierto
    }).withFailureHandler(function () {
      // silencioso — sin conexión momentánea no debe bloquear el login, solo se quedan los
      // valores que ya hubiera en memoria (o los default si es la primera carga).
    }).getMisPlantillas(myRealIdentity, myPassword);
  }

  /** Guarda tus plantillas en el servidor (ligadas a myRealIdentity) y actualiza la copia en
   * memoria de inmediato, para que el panel se sienta instantáneo aunque el guardado en el
   * servidor tarde un poco. */
  function persistMisPlantillas(templatesObj, labelsObj) {
    myTemplates = templatesObj || {};

      if (!res || res.ok === false) showToast((res && res.error) || 'No se pudieron sincronizar tus plantillas', 'error');
    }).withFailureHandler(function (err) {
      showToast('No se pudo guardar tus plantillas: ' + (err && err.message ? err.message : err), 'error');
    }).guardarMisPlantillas(myRealIdentity, myPassword, JSON.stringify(myTemplates), JSON.stringify(myTemplateLabels));

  /** Inserta texto en la posición del cursor de un textarea (o al final si no hay selección),

  function insertAtCursor(textarea,text){
    if(!textarea)return;
    var start=(textarea.selectionStart!=null)?textarea.selectionStart:textarea.value.length;
    var end=(textarea.selectionEnd!=null)?textarea.selectionEnd:textarea.value.length;

  function dayGroupLabel_(dt) {
    var months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    var now = new Date();
    var startOfDay = function (d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
    var diffDays = Math.round((startOfDay(now) - startOfDay(dt)) / 86400000);
    if (diffDays === 0) return 'Hoy';
    if (diffDays === 1) return 'Ayer';
    return dt.getDate() + ' ' + months[dt.getMonth()] + (dt.getFullYear() !== now.getFullYear() ? ' ' + dt.getFullYear() : '');
  }
  function fmtTimeOnly_(v) {
    if (!v) return '';
    var dt = (v instanceof Date) ? v : new Date(v);
    if (isNaN(dt.getTime())) return '';
    var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
    return pad2(dt.getHours()) + ':' + pad2(dt.getMinutes());
  }

  function groupedTimelineHtml_(items, entryHtmlFn) {
    var html = '', lastLabel = null;
    items.forEach(function (x) {
      var dt = new Date(x.timestamp);
      var label = isNaN(dt.getTime()) ? '' : dayGroupLabel_(dt);
      if (label !== lastLabel) { html += '<div class="ws-day-group-label">' + esc(label) + '</div>'; lastLabel = label; }
      html += entryHtmlFn(x, dt);
    });
    return html;
  }

  function csvEscape_(v){

  function buildComunicacionesCsv_(cliente,items){

  function downloadTextFile_(filename,content,mime){

    var a=document.createElement('a');

  function buildReporteOperacionCsv_(){
    var lines=[];
    function addSection(title){ if(lines.length) lines.push(''); lines.push(csvEscape_(title)); }
    function addRow(arr){ lines.push(arr.map(csvEscape_).join(',')); }

    var all=currentData||[];
    var active=all.filter(function(r){return !isArchived(r)&&!isCanceladaFinalizada(r);});
    var attentionCount=active.filter(needsAttention).length;
    var docsReadyCount=active.filter(function(r){return r.bol&&r.doda&&r.entry&&r.sobre_listo;}).length;
    var recordatorioVencidoCount=all.filter(isRecordatorioVencido).length;

    addSection('RESUMEN OPERATIVO — '+fmtDateTime(new Date().toISOString()));
    addRow(['Cargas totales',all.length]);
    addRow(['En curso',active.length]);
    addRow(['Necesitan atención',attentionCount]);
    addRow(['Docs completos',docsReadyCount+'/'+active.length]);
    addRow(['Recordatorios vencidos',recordatorioVencidoCount]);

    addSection('CARGA DE TRABAJO POR CSR');
    addRow(['CSR','Cargas activas','Necesitan atención']);
    (personas||[]).filter(function(p){return p.rol==='CSR';}).forEach(function(p){
      var cargas=loadsOfCsr(p.nombre);
      addRow([p.nombre,cargas.length,cargas.filter(needsAttention).length]);
    });

    addSection('TIEMPO DE RESPUESTA AL CLIENTE (SLA, últimos '+SLA_LOOKBACK_DAYS+' días)');
    if(lastSlaPairs.length){
      var avgMin=lastSlaPairs.reduce(function(s,p){return s+p.minutes;},0)/lastSlaPairs.length;
      addRow(['Promedio',fmtMinutesSla(avgMin)]);
      addRow(['Avisos medidos',lastSlaPairs.length]);
    } else {
      addRow(['Sin comunicaciones registradas en el periodo.']);
    }

    addSection('DETALLE DE CARGAS ACTIVAS');
    addRow(['Load','Cliente','Estatus','Pickup cita','Entrega cita','Salida planta','Cruce aduana','Incidencias','Recordatorio vencido','Última actualización']);
    active.forEach(function(r){
      addRow([
        r.load,r.customer||'',r.status||'',
        r.pickup_appt?fmtDateTime(r.pickup_appt):'',
        r.delivery_appt?fmtDateTime(r.delivery_appt):'',
        r.salida_mexico_fecha?fmtDateTime(r.salida_mexico_fecha):'',
        r.cruce_usa_fecha?fmtDateTime(r.cruce_usa_fecha):'',
        Number(r.incidenciasCount)||0,
        isRecordatorioVencido(r)?'Sí':'No',
        r.updated_at?fmtDateTime(r.updated_at):''
      ]);
    });

    return '﻿'+lines.join('\r\n');
  }

  /* ---------------- Vista previa de comentarios al pasar el mouse ----------------
   * Al pasar el mouse sobre un botón "Comentarios" (en tarjetas, tabla, pendientes o bitácora)
   * O sobre la columna "Último comentario" del listado de cargas (vista tabla) se muestra,
   * tras un breve instante, una ventanita de solo lectura con el hilo completo de comentarios
   * de esa carga/pendiente (con su propio scroll). Se cierra sola cuando el mouse sale tanto
   * de la zona que la disparó como de la ventanita — con un pequeño margen de tiempo para poder
   * cruzar el espacio entre ambos sin que se cierre de golpe. El click en el botón "Comentarios"
   * sigue abriendo el modal de siempre para agregar comentarios nuevos; esto es solo para leer
   * rápido. La celda "Último comentario" de la tabla (.t-comment) no tiene su propio atributo
   * data-comments-load — usa el data-load de la fila (<tr class="t-row" data-load="...">). */
  var hoverPopupShowTimer = null;
  var hoverPopupHideTimer = null;
  var hoverPopupComboKey = null; // "load:48213" o "pendiente:xyz" — evita volver a pedir lo mismo

  /** Encuentra la zona de hover de comentarios más cercana a un elemento (botón "Comentarios")
   * y devuelve su ancla para posicionar la ventanita más la llave (load o pendiente) para pedir
   * sus comentarios — o null si no aplica. La celda "Último comentario" de la tabla YA NO usa
   * hover (detectaba mal la zona y a veces mostraba los comentarios de otro load) — ahora se
   * abre directo con un clic, ver el manejador de [data-load] en '.t-comment' más abajo. */
  function commentsHoverTargetFor(el) {
    if (!el || !el.closest) return null;
    var btn = el.closest('.comments-btn');
    if (btn) {
      var isLoad = btn.hasAttribute('data-comments-load');
      var key = isLoad ? btn.getAttribute('data-comments-load') : btn.getAttribute('data-comments-pendiente');
      return { anchor: btn, key: key, combo: (isLoad ? 'load:' : 'pendiente:') + key };
    }
    return null;
  }

  function positionCommentsHoverPopup(anchor) {
    var popup = document.getElementById('comments-hover-popup');
    var r = anchor.getBoundingClientRect();
    var margin = 8, width = popup.offsetWidth || 280;
    var left = Math.min(r.left, window.innerWidth - width - margin);
    left = Math.max(margin, left);
    var top = r.bottom + 6;
    var maxTop = window.innerHeight - margin - (popup.offsetHeight || 120);
    if (top > maxTop) top = Math.max(margin, r.top - 6 - (popup.offsetHeight || 120)); // no cabe abajo: mostrar arriba
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }

  function renderCommentsHoverList(raw) {
    var box = document.getElementById('comments-hover-list');
    var list;
    try { list = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { list = []; }
    if (!list || !list.length) {
      box.innerHTML = '<div class="comments-empty">Todavía no hay comentarios.</div>';
      return;
    }
    box.innerHTML = list.map(function (c) {
      var meta = fmtDateTime(c.ts) + (c.usuario ? ' · ' + escHtml(c.usuario) : '');
      return '<div class="comment-entry"><span class="ts">' + meta + '</span><span class="txt">' + escHtml(c.text) + '</span></div>';
    }).join('');
  }

  function showCommentsHoverPopup(target) {
    clearTimeout(hoverPopupHideTimer);
    hoverPopupComboKey = target.combo;
    var popup = document.getElementById('comments-hover-popup');
    document.getElementById('comments-hover-list').innerHTML = '<div class="comments-empty">Cargando…</div>';
    popup.hidden = false;
    positionCommentsHoverPopup(target.anchor);
    google.script.run.withSuccessHandler(function (raw) {
      if (hoverPopupComboKey !== target.combo) return; // el mouse ya se movió a otra carga
      renderCommentsHoverList(raw);
      positionCommentsHoverPopup(target.anchor);
    }).withFailureHandler(function (err) {
      if (hoverPopupComboKey !== target.combo) return;
      document.getElementById('comments-hover-list').innerHTML = '<div class="comments-empty">Error al cargar comentarios.</div>';
    }).getComments(target.key, myRealIdentity, myPassword);
  }

  function hideCommentsHoverPopupNow() {
    document.getElementById('comments-hover-popup').hidden = true;
    hoverPopupComboKey = null;
  }

  function scheduleHideCommentsHoverPopup() {
    clearTimeout(hoverPopupShowTimer);
    clearTimeout(hoverPopupHideTimer);
    hoverPopupHideTimer = setTimeout(hideCommentsHoverPopupNow, 180);
  }

  function withinCommentsHoverZone(el) {
    return !!(el && el.closest && (el.closest('.comments-btn') || el.closest('#comments-hover-popup')));
  }

  document.addEventListener('mouseover', function (e) {
    var target = commentsHoverTargetFor(e.target);
    if (target) {
      if (withinCommentsHoverZone(e.relatedTarget)) { clearTimeout(hoverPopupHideTimer); return; }
      clearTimeout(hoverPopupShowTimer);
      hoverPopupShowTimer = setTimeout(function () { showCommentsHoverPopup(target); }, 160);
      return;
    }
    if (e.target.closest('#comments-hover-popup')) { clearTimeout(hoverPopupHideTimer); }
  });
  document.addEventListener('mouseout', function (e) {
    if (!withinCommentsHoverZone(e.target)) return;
    if (withinCommentsHoverZone(e.relatedTarget)) return; // se mueve dentro de la misma zona combinada
    clearTimeout(hoverPopupShowTimer);
    scheduleHideCommentsHoverPopup();
  });
  // Si la página (o cualquier otro contenedor) se mueve (scroll) mientras la ventanita está
  // abierta, se esconde: su posición es relativa al botón y no vale la pena reposicionarla en
  // cada evento de scroll. Pero el scroll DENTRO de la propia ventanita (la rueda del mouse
  // sobre la lista de comentarios, que tiene su propio overflow-y:auto) no debe contar — como
  // "scroll" no burbujea pero sí se captura desde window, sin este filtro se cerraba sola en
  // cuanto empezabas a hacer scroll con la rueda dentro de ella.
  window.addEventListener('scroll', function (e) {
    var popup = document.getElementById('comments-hover-popup');
    if (popup.hidden) return;
    if (e.target && e.target.closest && e.target.closest('#comments-hover-popup')) return;
    hideCommentsHoverPopupNow();
  }, true);

  document.getElementById('comments-submit').addEventListener('click', function () {
    var textarea = document.getElementById('comments-textarea');
    var text = textarea.value.trim();
    if (!text || !commentsCurrentLoad) { textarea.focus(); return; }
    // Blindaje: sin identidad verificada (contraseña) no se guarda ningún comentario, para nunca
    // arriesgarnos a que quede firmado con el "usuario" que se tenga seleccionado solo para
    // ver/filtrar el panel (que puede ser cualquier CSR, no necesariamente quien escribe).
    if (!myRealIdentity || !myPassword) {
      updateCommentsIdentityGate();
      showToast('Verifica tu identidad antes de comentar (botón de abajo).', 'error');
      return;
    }
    var btn = document.getElementById('comments-submit');
    var btnOriginalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="comments-spinner"></span>Guardando…';
    var load = commentsCurrentLoad;
    var kind = commentsCurrentKind;
    // Siempre se firma con la identidad verificada por contraseña, nunca con el "usuario" que se tenga
    // seleccionado nada más para ver/filtrar el panel — así nadie puede entrar al filtro de otro
    // CSR y que sus comentarios salgan como si esa persona los hubiera puesto. El servidor vuelve
    // a checar la contraseña antes de guardar, así que tampoco sirve manipular esto desde el navegador.
    var usuario = myRealIdentity;
    var password = myPassword;

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.innerHTML = btnOriginalHtml;

        if (!res || !res.ok) {
          // La contraseña ya no es válida (por ejemplo, el administrador lo cambió) — hay que
          // verificar de nuevo antes de poder seguir comentando.
          myRealIdentity = '';
          myPassword = '';
          borrarSesionLocal_();
          updateCommentsIdentityGate();
          openIdentityModal();
          showToast((res && res.error) || 'No se pudo verificar tu identidad. Vuelve a verificarla.', 'error');

        textarea.value = '';

        // pedirle al servidor ni el historial completo ni todos los comentarios de nuevo.
        var box = document.getElementById('comments-list');
        if (box.querySelector('.comments-empty')) box.innerHTML = '';
        var meta = fmtDateTime(res.ts) + (res.usuario ? ' · ' + escHtml(res.usuario) : '');

        entry.innerHTML = '<span class="ts">' + meta + '</span><span class="txt">' + escHtml(text) + '</span>';
        box.insertBefore(entry, box.firstChild);

        ultimosComentarios[String(load)] = { ts: res.ts, text: text, usuario: res.usuario };
        if (kind === 'pendiente') {

        } else if (currentView === 'table') { buildTableView(); wireCardEvents(); applyFilters(); }
        else { viewDirty.table = true; }

        closeCommentsModal();
