  // ---- Recordatorio de Descompuesta / En resguardo / Patio permisionario ----
  // Al entrar a cualquiera de estos 3 estatus, el panel exige programar fecha/hora (para Patio
  // permisionario, es la fecha estimada de despacho). Si esa fecha se pasa y el load sigue en
  // ese estatus, se muestra en rojo aquí en el panel con opción de reprogramar (ver
  // recordatorioTagHtml) — es solo un aviso visual dentro del panel, no manda correo.
  var recordatorioCtx = null; // { load, status, mode: 'nuevo-estatus' | 'editar', prevStatus, selEl }

  function recordatorioNoteFor(status) {
    if (status === 'Patio permisionario') {
      return 'Si esta fecha se pasa y el load sigue en Patio permisionario, se va a marcar en rojo aquí en el panel para que lo revises.';
    }
    return 'Se va a marcar en rojo aquí en el panel cuando llegue esta fecha, para que vuelvas a revisar este load.';
  }

  function toDatetimeLocalValue(d) {
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function openRecordatorioModal(load, status, mode, prevStatus, selEl) {
    recordatorioCtx = { load: load, status: status, mode: mode, prevStatus: prevStatus, selEl: selEl };
    var verbo = mode === 'editar' ? 'Reprogramar' : 'Programar';
    document.getElementById('recordatorio-title').textContent = status === 'Patio permisionario' ? verbo + ' fecha de despacho' : verbo + ' recordatorio — ' + status;
    document.getElementById('recordatorio-note').textContent = recordatorioNoteFor(status);
    document.getElementById('recordatorio-error').style.display = 'none';
    var input = document.getElementById('recordatorio-fecha-input');
    var rec = recPorLoad_(load);
    input.value = (rec && rec.recordatorio_fecha) ? toDatetimeLocalValue(new Date(rec.recordatorio_fecha)) : '';
    document.getElementById('recordatorio-backdrop').classList.add('show');
    input.focus();
  }

  function cancelRecordatorioModal() {
    var ctx = recordatorioCtx;
    document.getElementById('recordatorio-backdrop').classList.remove('show');
    recordatorioCtx = null;
    // Si se abrió al elegir un estatus nuevo y se cancela, el select regresa a como estaba —
    // nunca se deja un estatus con recordatorio pendiente sin fecha.
    if (ctx && ctx.mode === 'nuevo-estatus' && ctx.selEl) {
      ctx.selEl.value = ctx.prevStatus || '';
    }
  }

  document.getElementById('recordatorio-close').addEventListener('click', cancelRecordatorioModal);
  document.getElementById('recordatorio-backdrop').addEventListener('click', function (e) {
    if (e.target.id === 'recordatorio-backdrop') cancelRecordatorioModal();
  });
  document.querySelectorAll('.recordatorio-quick-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var dias = Number(btn.getAttribute('data-quick'));
      document.getElementById('recordatorio-fecha-input').value = toDatetimeLocalValue(new Date(Date.now() + dias * 24 * 60 * 60 * 1000));
    });
  });

  document.getElementById('recordatorio-submit').addEventListener('click', function () {
    if (!recordatorioCtx) return;
    if (!myRealIdentity || !myPassword) {
      ensureLoggedIn(function () { document.getElementById('recordatorio-submit').click(); });
      return;
    }
    var input = document.getElementById('recordatorio-fecha-input');
    if (!input.value) {
      document.getElementById('recordatorio-error').style.display = '';
      return;
    }
    var ctx = recordatorioCtx;
    var fechaISO = new Date(input.value).toISOString();
    document.getElementById('recordatorio-backdrop').classList.remove('show');
    recordatorioCtx = null;

    var rec = recPorLoad_(ctx.load);
    var prev = rec ? { status: rec.status, recordatorio_fecha: rec.recordatorio_fecha } : null;

    if (ctx.mode === 'nuevo-estatus') {
      // Actualización optimista: estatus + recordatorio se guardan juntos, igual que POD/VG.
      if (rec) { rec.status = ctx.status; rec.recordatorio_fecha = fechaISO; }
      render(currentData);
      if (workspaceCurrentLoad === String(ctx.load)) renderWorkspace();
      showToast('Recordatorio programado — Load ' + ctx.load, 'good');
      guardarConVerificacion_(null, function (err) {
        if (rec && prev) { rec.status = prev.status; rec.recordatorio_fecha = prev.recordatorio_fecha; }
        render(currentData);
        showToast('No se pudo guardar el estatus: ' + err.message, 'error');
      }).saveStatusConRecordatorio(ctx.load, ctx.status, fechaISO, myRealIdentity, myPassword);
    } else {
      if (rec) { rec.recordatorio_fecha = fechaISO; }
      render(currentData);
      showToast('Recordatorio actualizado — Load ' + ctx.load, 'good');
      guardarConVerificacion_(null, function (err) {
        if (rec && prev) { rec.recordatorio_fecha = prev.recordatorio_fecha; }
        render(currentData);
        showToast('No se pudo guardar el recordatorio: ' + err.message, 'error');
      }).saveRecordatorio(ctx.load, fechaISO, myRealIdentity, myPassword);
    }
  });

  // Los manejadores delegados se dividen por tema. Cada sección regresa SIGUE_ si el evento no era
  // suyo; si lo atendió (cualquier "return" dentro), ya no se prueban las siguientes — exactamente
  // el mismo orden y comportamiento que cuando todo vivía en una sola función de 600 líneas.
  var SIGUE_ = {};
  /** Cambio en truck, trailer, citas de pickup/entrega, salida de México y cruce a USA. */
  function cambioCamposCarga_(e) {
    var input;

    // Truck y trailer se pueden capturar a mano aquí mismo (el Excel solo se sube una vez al
    // día — normalmente a mediodía — así que si a alguno se lo asignan después, no hay que
    // esperar hasta la importación del día siguiente para verlo reflejado). En el próximo
    // import, si el Excel SÍ trae un valor para ese load, gana sobre lo capturado a mano; si
    // no trae nada, se conserva esto (ver importLoads en Code.gs).
    if ((input = e.target.closest('[data-truck-load]'))) {
      if (!myRealIdentity || !myPassword) {
        ensureLoggedIn(function () { input.dispatchEvent(new Event('change', { bubbles: true })); });
        return;
      }
      var load = input.getAttribute('data-truck-load');
      var val = input.value.trim();
      var rec = recPorLoad_(load);
      var prev = rec ? rec.truck : null;
      if (rec) rec.truck = val;
      guardarConVerificacion_(function () {
        showToast('Truck actualizado — Load ' + load, 'good');
      }, function (err) {
        if (rec) rec.truck = prev;
        input.value = prev || '';
        showToast('No se pudo guardar el truck: ' + err.message, 'error');
      }).saveTruck(load, val, myRealIdentity, myPassword);
      return;
    }

    if ((input = e.target.closest('[data-trailer-load]'))) {
      if (!myRealIdentity || !myPassword) {
        ensureLoggedIn(function () { input.dispatchEvent(new Event('change', { bubbles: true })); });
        return;
      }
      var load = input.getAttribute('data-trailer-load');
      var val = input.value.trim();
      var rec = recPorLoad_(load);
      var prev = rec ? rec.trailer : null;
      if (rec) rec.trailer = val;
      guardarConVerificacion_(function () {
        showToast('Trailer actualizado — Load ' + load, 'good');
      }, function (err) {
        if (rec) rec.trailer = prev;
        input.value = prev || '';
        showToast('No se pudo guardar el trailer: ' + err.message, 'error');
      }).saveTrailer(load, val, myRealIdentity, myPassword);
      return;
    }

    // Pickup cita / Entrega cita: mismo mecanismo que truck/trailer — se pueden ajustar aquí
    // mismo (ej. el cliente mueve la cita) y el documento sigue mandando en el próximo import
    // si trae una fecha para ese load (ver savePickupAppt/saveDeliveryAppt e importLoads).
    if ((input = e.target.closest('[data-pickup-appt-load]'))) {
      if (!myRealIdentity || !myPassword) {
        ensureLoggedIn(function () { input.dispatchEvent(new Event('change', { bubbles: true })); });
        return;
      }
      var load = input.getAttribute('data-pickup-appt-load');
      var val = input.value ? input.value.replace('T', ' ') : '';
      var rec = recPorLoad_(load);
      var prev = rec ? rec.pickup_appt : null;
      if (rec) { rec.pickup_appt = val; setLocalNotifyPending(rec, 'Cambio en cita de pickup'); renderActionCenter(currentData); }
      document.querySelectorAll('tr.t-row[data-load="' + load + '"] .t-date-pickup').forEach(function (cell) {
        cell.textContent = fmtDate(val);
      });
      guardarConVerificacion_(function () {
        showToast('Pickup cita actualizada — Load ' + load, 'good');
      }, function (err) {
        if (rec) rec.pickup_appt = prev;
        input.value = apptDatetimeLocalValue(prev);
        document.querySelectorAll('tr.t-row[data-load="' + load + '"] .t-date-pickup').forEach(function (cell) {
          cell.textContent = fmtDate(prev);
        });
        showToast('No se pudo guardar el pickup cita: ' + err.message, 'error');
      }).savePickupAppt(load, val, myRealIdentity, myPassword);
      return;
    }

    if ((input = e.target.closest('[data-delivery-appt-load]'))) {
      if (!myRealIdentity || !myPassword) {
        ensureLoggedIn(function () { input.dispatchEvent(new Event('change', { bubbles: true })); });
        return;
      }
      var load = input.getAttribute('data-delivery-appt-load');
      var val = input.value ? input.value.replace('T', ' ') : '';
      var rec = recPorLoad_(load);
      var prev = rec ? rec.delivery_appt : null;
      if (rec) { rec.delivery_appt = val; setLocalNotifyPending(rec, 'Cambio en cita de entrega'); renderActionCenter(currentData); }
      document.querySelectorAll('tr.t-row[data-load="' + load + '"] .t-date-delivery').forEach(function (cell) {
        cell.textContent = fmtDate(val);
      });
      guardarConVerificacion_(function () {
        showToast('Entrega cita actualizada — Load ' + load, 'good');
      }, function (err) {
        if (rec) rec.delivery_appt = prev;
        input.value = apptDatetimeLocalValue(prev);
        document.querySelectorAll('tr.t-row[data-load="' + load + '"] .t-date-delivery').forEach(function (cell) {
          cell.textContent = fmtDate(prev);
        });
        showToast('No se pudo guardar la entrega cita: ' + err.message, 'error');
      }).saveDeliveryAppt(load, val, myRealIdentity, myPassword);
      return;
    }

    // Salida planta / Cruce USA: alimentan el timeline del Portal Cliente (ver
    // deriveTimelineStage_ en Code.gs). Mismo mecanismo que pickup/entrega cita.
    if ((input = e.target.closest('[data-salida-mexico-load]'))) {
      if (!myRealIdentity || !myPassword) {
        ensureLoggedIn(function () { input.dispatchEvent(new Event('change', { bubbles: true })); });
        return;
      }
      var load = input.getAttribute('data-salida-mexico-load');
      var val = input.value ? input.value.replace('T', ' ') : '';
      if (salidaMexicoDebounceTimers[load]) clearTimeout(salidaMexicoDebounceTimers[load]);
      var doSaveSalida = function (cb) {
        if (salidaMexicoDebounceTimers[load]) { clearTimeout(salidaMexicoDebounceTimers[load]); delete salidaMexicoDebounceTimers[load]; }
        delete pendingFieldFlush[load].salida;
        var rec = recPorLoad_(load);
        var prev = rec ? rec.salida_mexico_fecha : null;
        if (rec) { rec.salida_mexico_fecha = val; setLocalNotifyPending(rec, 'Salida de planta actualizada'); renderActionCenter(currentData); }
        guardarConVerificacion_(function () {
          showToast('Salida planta actualizada — Load ' + load, 'good');
          if (cb) cb();
        }, function (err) {
          if (rec) rec.salida_mexico_fecha = prev;
          input.value = apptDatetimeLocalValue(prev);
          showToast('No se pudo guardar la salida planta: ' + err.message, 'error');
          if (cb) cb();
        }).saveSalidaMexico(load, val, myRealIdentity, myPassword);
      };
      if (!pendingFieldFlush[load]) pendingFieldFlush[load] = {};
      pendingFieldFlush[load].salida = doSaveSalida;
      salidaMexicoDebounceTimers[load] = setTimeout(function () { doSaveSalida(); }, 600);
      return;
    }

    if ((input = e.target.closest('[data-cruce-usa-load]'))) {
      if (!myRealIdentity || !myPassword) {
        ensureLoggedIn(function () { input.dispatchEvent(new Event('change', { bubbles: true })); });
        return;
      }
      var load = input.getAttribute('data-cruce-usa-load');
      var val = input.value ? input.value.replace('T', ' ') : '';
      if (cruceUsaDebounceTimers[load]) clearTimeout(cruceUsaDebounceTimers[load]);
      var doSaveCruce = function (cb) {
        if (cruceUsaDebounceTimers[load]) { clearTimeout(cruceUsaDebounceTimers[load]); delete cruceUsaDebounceTimers[load]; }
        delete pendingFieldFlush[load].cruce;
        var rec = recPorLoad_(load);
        var prev = rec ? rec.cruce_usa_fecha : null;
        if (rec) { rec.cruce_usa_fecha = val; setLocalNotifyPending(rec, 'Cruce aduana actualizada'); renderActionCenter(currentData); }
        guardarConVerificacion_(function () {
          showToast('Cruce actualizado — Load ' + load, 'good');
          if (cb) cb();
        }, function (err) {
          if (rec) rec.cruce_usa_fecha = prev;
          input.value = apptDatetimeLocalValue(prev);
          showToast('No se pudo guardar el cruce USA: ' + err.message, 'error');
          if (cb) cb();
        }).saveCruceUsa(load, val, myRealIdentity, myPassword);
      };
      if (!pendingFieldFlush[load]) pendingFieldFlush[load] = {};
      pendingFieldFlush[load].cruce = doSaveCruce;
      cruceUsaDebounceTimers[load] = setTimeout(function () { doSaveCruce(); }, 600);
      return;
    }
    return SIGUE_;
  }

  /** Cambio en el selector de estatus (incluye recordatorios y la revisión de "En transito"). */
  function cambioEstatus_(e) {


    var sel;
    if ((sel = e.target.closest('.status-select'))) {
      if (!myRealIdentity || !myPassword) {
        ensureLoggedIn(function () { sel.dispatchEvent(new Event('change', { bubbles: true })); });
        return;
      }
      var load = sel.getAttribute('data-status-load');
      var val = sel.value;
      var rec = recPorLoad_(load);
      var prevStatus = rec ? rec.status : null;

      // Descompuesta / En resguardo / Patio permisionario exigen programar un recordatorio
      // antes de guardar el cambio — se abre el modal y el estatus no se guarda hasta que se
      // confirme una fecha (si se cancela, el select regresa al estatus anterior).
      if (REMINDER_STATUSES.indexOf(val) !== -1) {
        openRecordatorioModal(load, val, 'nuevo-estatus', prevStatus, sel);
        return;
      }

      // "En transito" no pide nada a mano — la regla es siempre la misma (revisar cada
      // AUTO_REVIEW_HOURS horas), así que en cuanto entra a este estatus se programa sola la
      // próxima revisión a "ahora + AUTO_REVIEW_HOURS horas". Importante: esto NUNCA debe caer
      // al saveStatus genérico de abajo — ese borra recordatorio_fecha para cualquier estatus
      // que no sea uno de los tres manuales (ver Code.gs), y aquí sí necesitamos conservarla.
      if (AUTO_REVIEW_STATUSES.indexOf(val) !== -1) {
        if (val === prevStatus) return; // ya estaba en "En transito" — no hay nada que guardar
        var prevSnapAuto = snapshotStatusFields_(rec);
        var fechaISO = new Date(Date.now() + AUTO_REVIEW_HOURS * 60 * 60 * 1000).toISOString();
        if (rec) { rec.status = val; rec.recordatorio_fecha = fechaISO; setLocalNotifyPending(rec, 'Cambio de estatus: ' + val); }
        render(currentData);
        if (workspaceCurrentLoad === String(load)) renderWorkspace();
        accionConDeshacer_('En tránsito (revisión en ' + AUTO_REVIEW_HOURS + 'h) — Load ' + load, function () {
          guardarConVerificacion_(null, function (err) {
            restoreStatusFields_(load, prevSnapAuto);
            showToast('No se pudo guardar el estatus: ' + err.message, 'error');
          }).saveStatusConRecordatorio(load, val, fechaISO, myRealIdentity, myPassword);
        }, function () {
          restoreStatusFields_(load, prevSnapAuto);
        });
        return;
      }

      // Actualización optimista: reflejamos el nuevo estatus al instante en el navegador
      // (incluye mover la carga de sección si aplica). El guardado real se manda cuando se
      // vence el "Deshacer" (ver accionConDeshacer_) — un clic equivocado en el selector ya no
      // cambia el estatus en la hoja ni deja marcado "pendiente avisar al cliente".
      var prevSnap = snapshotStatusFields_(rec);
      if (rec) { rec.status = val; setLocalNotifyPending(rec, 'Cambio de estatus: ' + val); }
      render(currentData);
      if (workspaceCurrentLoad === String(load)) renderWorkspace();

      accionConDeshacer_('Estatus: ' + val + ' — Load ' + load, function () {
        guardarConVerificacion_(null, function (err) {
          restoreStatusFields_(load, prevSnap);
          showToast('No se pudo guardar el estatus: ' + err.message, 'error');
        }).saveStatus(load, val, myRealIdentity, myPassword);
      }, function () {
        restoreStatusFields_(load, prevSnap);
      });
      return;
    }
    return SIGUE_;
  }

  /** Casillas: POD enviado, recargos en VG y "atendido" de la bitácora. */
  function cambioCasillas_(e) {

    var chk;

  var MANEJADORES_CAMBIO_ = [cambioCamposCarga_, cambioEstatus_, cambioCasillas_];
  var MANEJADORES_CLIC_ = [clicWorkspaceYAvisos_, clicRecordatoriosYColor_, clicAbrirModales_, clicEliminarEditar_, clicTabla_];
  function despachar_(manejadores, e) {
    for (var i = 0; i < manejadores.length; i++) if (manejadores[i](e) !== SIGUE_) return;
  }
  // wireCardEvents() se llamaba antes al final de CADA render() (cada 60s por autoRefresh, y
  // cada vez que se guarda un estatus/POD/recargos/color) y volvía a recorrer TODO el
  // documento —querySelectorAll + addEventListener por cada tarjeta/fila y por cada tipo de
  // campo— para reconectar los eventos desde cero. Con el panel ya lleno de campos editables
  // (truck, trailer, citas, status, POD, recargos, color…) eso significaba miles de listeners
  // creados una y otra vez en cada actualización, y era la causa principal de que el panel se
  // sintiera lento. Ahora los eventos se conectan UNA sola vez (delegados en document, usando
  // e.target.closest para saber a qué campo/tarjeta pertenece el click o change) y siguen
  // funcionando aunque el HTML de las tarjetas/filas se vuelva a dibujar por completo — ya no
  // hace falta "reconectar" nada.
  function wireDelegatedEventsOnce() {
    if (delegatedEventsWired) return;
    delegatedEventsWired = true;

    document.addEventListener('change', function (e) { despachar_(MANEJADORES_CAMBIO_, e); });
    document.addEventListener('click', function (e) { despachar_(MANEJADORES_CLIC_, e); });

    document.addEventListener('dblclick', function (e) {
      var el = e.target.closest('[data-load-copy]');
      if (!el) return;
      e.stopPropagation();
      copyLoadToClipboard(el.getAttribute('data-load-copy'));
    });

    var tableDetailClose = document.getElementById('table-detail-close');
    if (tableDetailClose) {
      tableDetailClose.addEventListener('click', function () {
        selectedTableLoad = null;
        renderTableDetailPanel();
      });
    }
  }

  function wireCardEvents() {
    wireDelegatedEventsOnce();
  }

  // ---- Excel import (SheetJS, client-side) ----

  function parseDelta(v) {
    if (v === null || v === undefined) return null;
    var s = String(v).trim();
    if (s === '') return null;
    if (s === '-00:00') return 0;
    var neg = s.charAt(0) === '-';
    var s2 = neg ? s.substring(1) : s;
    var bits = s2.split(':');
    if (bits.length !== 2) return null;
    var h = parseInt(bits[0], 10), m = parseInt(bits[1], 10);
    if (isNaN(h) || isNaN(m)) return null;
    var total = h * 60 + m;
    return neg ? -total : total;
  }

  function excelDateToStr(v) {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date) {
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      return v.getFullYear() + '-' + pad(v.getMonth() + 1) + '-' + pad(v.getDate()) + ' ' + pad(v.getHours()) + ':' + pad(v.getMinutes());
    }
    return String(v);
  }

  var xlsxLoadPromise = null;
  function ensureXlsxLoaded() {
    if (xlsxLoadPromise) return xlsxLoadPromise;
    xlsxLoadPromise = new Promise(function (resolve, reject) {
      if (window.XLSX) { resolve(); return; }
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.onload = function () { resolve(); };
      s.onerror = function () { xlsxLoadPromise = null; reject(new Error('No se pudo cargar la librería de Excel (revisa tu conexión)')); };
      document.head.appendChild(s);
    });
    return xlsxLoadPromise;
  }

  document.getElementById('file-input').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var statusEl = document.getElementById('import-status');
    statusEl.textContent = 'Leyendo archivo…';
    statusEl.className = 'import-status';

    ensureXlsxLoaded().then(function () {

    var reader = new FileReader();
    reader.onload = function (evt) {
      try {
        var wb = XLSX.read(evt.target.result, { type: 'array', cellDates: true });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
        // Row 0: title. Row 1: real headers. Row 2+: data.
        var headers = rows[1];

        // Se importan TODAS las filas del archivo (sin filtrar por cliente asignado ni por
        // quién la capturó). Lo único que se descarta es una fila sin número de load.
        var records = [];
        for (var i = 2; i < rows.length; i++) {
          var row = rows[i];
          if (!row) continue;
          var obj = {};
          headers.forEach(function (h, idx) { obj[h] = row[idx]; });
          if (obj['Load'] === null || obj['Load'] === undefined) continue;

          records.push({
            load: obj['Load'],
            customer: obj['Customers'] ? String(obj['Customers']).trim() : null,
            origin_city: obj['City O.'],
            origin_state: obj['State O.'],
            origin_address: obj['From'],
            dest_city: obj['City D.'],
            dest_state: obj['State D.'],
            dest_address: obj['To'],
            pickup_appt: excelDateToStr(obj['Pickup appt.']),
            pickup_actual: excelDateToStr(obj['Leg from In date']),
            pickup_delta_min: parseDelta(obj['On time pickup']),
            delivery_appt: excelDateToStr(obj['Delivery appt.']),
            delivery_actual: excelDateToStr(obj['Leg to In date']),
            delivery_delta_min: parseDelta(obj['On time']),
            truck: obj['Truck'],
            trailer: obj['Trailer'],
            // status: no se importa, siempre es manual (ver Code.gs importLoads)
            work_order: obj['Work order'] !== null && obj['Work order'] !== undefined ? String(obj['Work order']) : null,
            bol: !!obj['BOL'],

        var guardarImportacion = function () {
          statusEl.textContent = 'Guardando ' + records.length + ' cargas…';

            .withSuccessHandler(function (result) {

        };

        google.script.run
          .withSuccessHandler(function (p) {

              (p.duplicadosEnArchivo && p.duplicadosEnArchivo.length ? '<p class="aviso-fuerte">Loads repetidos en el archivo (se queda el último): ' + p.duplicadosEnArchivo.map(esc).join(', ') + '</p>' : '') +
              '<p>Si después necesitas regresar, en "Gestionar CSR" puedes deshacer la última importación.</p>';
            confirmarModal_('Importar ' + records.length + ' cargas', html, 'Importar', guardarImportacion);
            // Si se cierra sin confirmar, que la barra no se quede diciendo "Esperando…".
            var limpiarSiCancela = function () {

              } else setTimeout(limpiarSiCancela, 500);
            };
            setTimeout(limpiarSiCancela, 500);
          })
          .withFailureHandler(function (err) {
            statusEl.textContent = 'No se pudo revisar el archivo: ' + err.message;

          .previewImport(records, csrAdminPw);
      } catch (err) {
        statusEl.textContent = 'Error al leer el archivo: ' + err.message;
        statusEl.className = 'import-status err';

    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';

    }).catch(function (err) {
      // Solo puede fallar aquí si ensureXlsxLoaded() no consiguió cargar la librería (ej. sin
      // internet en ese momento) — el resto del proceso de import ya tiene su propio try/catch.

      statusEl.className = 'import-status err';

  var lastLoadsFetchTs = null;

  /** Combina el resultado de getLoadsDelta() con lo que el panel ya tenía en memoria (current).
   * result.full === true cuando el servidor decidió mandar todo de una vez (primera carga del
   * panel, hoja vacía, o demasiados cambios de golpe — ver getLoadsDelta en Code.gs): en ese caso
   * se usa result.loads tal cual, igual que la vieja getLoads(). Si no, se parte de lo que ya
   * había en el navegador, se reemplazan solo las cargas listadas en result.updated (por número
   * de load) y se quita cualquier carga que ya no aparezca en result.currentLoads (por ejemplo,
   * porque se archivó) — una carga que no cambió jamás se toca ni se vuelve a pedir. */
  function mergeLoadsDelta_(current, result) {
    if (!result || result.full) return (result && result.loads) || [];
    var byLoad = {};
    (current || []).forEach(function (r) { byLoad[String(r.load)] = r; });
    (result.updated || []).forEach(function (r) { byLoad[String(r.load)] = r; });
    var keep = {};
    (result.currentLoads || []).forEach(function (k) { keep[k] = true; });
    return Object.keys(byLoad).filter(function (k) { return keep[k]; }).map(function (k) { return byLoad[k]; });
  }

  // FIX: seguridad — getLoadsDelta ahora exige sesión y sin ella responde { ok:false, loads:[] }.
  // Ese "vacío" NO debe pintarse encima de lo que ya hay (una respuesta sin sesión que llega tarde,
  // después del login, borraría las cargas de la pantalla). Si ya había sesión y el servidor la
  // rechaza (token vencido o contraseña cambiada en otra computadora), se manda de vuelta al login.
  function respuestaSinSesion_(result) {
    if (!result || result.ok !== false) return false;
    if (myRealIdentity) {
      logout();
      showToast('Tu sesión expiró. Vuelve a iniciar sesión.', 'error');
    }
    return true;
  }

  function loadData() {
    if (!myRealIdentity || !myPassword) return; // sin sesión no hay nada que pedir — ver verifyIdentity
    google.script.run.withSuccessHandler(function (result) {
      if (respuestaSinSesion_(result)) return;
      lastLoadsFetchTs = result && typeof result.ts === 'number' ? result.ts : Date.now();
      render(mergeLoadsDelta_(currentData, result));
    }).withFailureHandler(function (err) {
      document.getElementById('header-updated').textContent = 'Error al cargar: ' + err.message;
    }).getLoadsDelta(lastLoadsFetchTs, myRealIdentity, myPassword);
  }

  // ===== Auto-actualización =====
  // El panel no se sincroniza solo entre navegadores — sin esto, si alguien más entra un
  // comentario o cambia un estatus, el resto del equipo no lo ve hasta que recargue la
  // página a mano. Con esto, cada quien recibe los cambios de los demás automáticamente,
  // sin tener que darle F5. No interrumpe si justo estás escribiendo en un campo (ETA,
  // comentario), para no perderte lo que llevas escrito a medio terminar.
  //
  // Todo el refresco es UNA sola llamada (getPanelCambios en Code.gs): el panel manda la "marca"
  // que ya conoce de cada área (loads, comentarios, pendientes, bitácora, apartados, cierres,
  // personas) y el servidor regresa solo los datos de las áreas que cambiaron. Si nadie tocó nada
  // (lo más común) regresa solo las marcas. Antes eran hasta 9 llamadas cada vez que alguien del
  // equipo cambiaba cualquier cosa. Loads, además, llega en modo incremental (getLoadsDelta).
  // Con la pestaña oculta se pregunta cada 5 min en vez de cada minuto; al volver, al instante.
  var AUTO_REFRESH_MS = 60000; // cada 60s
  var AUTO_REFRESH_OCULTO_MS = 300000; // cada 5 min con la pestaña oculta
  var autoRefreshBusy = false;
  var marcasConocidas_ = {};
  var ultimoRefresco_ = 0;
  var fallasSeguidas_ = 0;

  function isUserEditingField() {
    var el = document.activeElement;
    if (!el) return false;
    var tag = el.tagName;
    if (tag !== 'INPUT' && tag !== 'TEXTAREA') return false;
    return !!(el.closest('.card') || el.closest('#table-body') || el.closest('.t-detail-content') || el.id === 'comments-textarea');
  }

  /** Aplica lo que regresó getPanelCambios: cada área con su misma función de siempre. */
  function aplicarCambiosPanel_(res) {
    var d = res.datos || {};
    if (d.loads) {
      if (respuestaSinSesion_(d.loads)) return;
      lastLoadsFetchTs = typeof d.loads.ts === 'number' ? d.loads.ts : Date.now();
      render(mergeLoadsDelta_(currentData, d.loads));
    }
    if (d.personas) aplicarPersonas_(d.personas);
    if (d.asignaciones) aplicarAsignaciones_(d.asignaciones);
    if (d.seguimientos) aplicarSeguimientos_(d.seguimientos);
    if (d.comentarios) aplicarComentarios_(d.comentarios);
    if (d.pendientes) aplicarPendientes_(d.pendientes);
    if (d.bitacora) aplicarBitacora_(d.bitacora);
    if (d.apartados) aplicarApartados_(d.apartados);
    if (d.cierres) aplicarCierres_(d.cierres);
    marcasConocidas_ = res.marcas || {};
  }

  /** forzar = traer todo (login, botón de actualizar) aunque estés escribiendo en un campo. */
  function autoRefresh(forzar) {
    if (!myRealIdentity || !myPassword) return;
    if (autoRefreshBusy || (forzar !== true && isUserEditingField())) return;
    if (forzar !== true && document.hidden && Date.now() - ultimoRefresco_ < AUTO_REFRESH_OCULTO_MS) return;
    if (forzar === true) marcasConocidas_ = {};
    autoRefreshBusy = true;
    ultimoRefresco_ = Date.now();
    var quien = myRealIdentity;
    google.script.run.withSuccessHandler(function (res) {
      autoRefreshBusy = false;
      marcarConexion_(true);
      if (quien !== myRealIdentity) return; // cambió la sesión mientras tanto
      if (!res || res.ok === false) { respuestaSinSesion_({ ok: false }); return; }
      aplicarCambiosPanel_(res);
    }).withFailureHandler(function () {
      autoRefreshBusy = false; // si falla por algo transitorio, se reintenta solo en el siguiente ciclo
      marcarConexion_(false);
    }).getPanelCambios(marcasConocidas_, lastLoadsFetchTs, myRealIdentity, myPassword);
  }

  /** Aviso "Sin conexión" en el encabezado: aparece después de 2 fallas seguidas del refresco (una
   * sola puede ser algo pasajero) y se quita solo en cuanto el servidor vuelve a responder. */
  function marcarConexion_(bien) {

  // ===== Búsqueda global (Inicio) =====
  // Busca en load, cliente, trailer, truck, WO, estatus, ciudades, notas y último comentario de
  // las cargas de tu alcance, y muestra los resultados ahí mismo (antes copiaba el texto al
  // buscador de "Operación completa", que estaba oculto, y no se veía nada).
  function camposBusqueda_(r) {
    var lc = ultimosComentarios[String(r.load)];
    return [
      ['Load', r.load], ['Cliente', r.customer], ['Trailer', r.trailer], ['Truck', r.truck], ['WO', r.work_order],

      ['Próxima revisión', r.next_review_note], ['Pendiente de avisar', r.client_notify_reason], ['Comentario', lc && lc.text]
    ];
  }
  function textoBusqueda_(r) {
    return camposBusqueda_(r).map(function (c) { return c[1] || ''; }).join(' ');
  }
  function marcar_(texto, q) {
    var s = String(texto), i = s.toLowerCase().indexOf(q);
    if (i < 0) return esc(s);
    return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
  }
  var busquedaActiva_ = -1;
  function buscarGlobal_() {
    var input = document.getElementById('home-search'), box = document.getElementById('home-search-resultados');
    var q = input.value.trim().toLowerCase();

    if (q.length < 2) { box.hidden = true; box.innerHTML = ''; return; }
    var res = [];
    actionCenterScope(currentData).forEach(function (r) {
      var hit = camposBusqueda_(r).filter(function (c) { return c[1] && String(c[1]).toLowerCase().indexOf(q) !== -1; })[0];
      if (hit) res.push({ r: r, campo: hit });
    });
    var html = res.slice(0, 8).map(function (x, i) {
      var r = x.r, c = x.campo;
      return '<button type="button" class="search-item" role="option" data-search-load="' + esc(r.load) + '" data-idx="' + i + '">' +
        '<b>Load ' + marcar_(r.load, q) + '</b> · ' + marcar_(r.customer || 'Sin cliente', q) +
        '<small>' + esc(c[0]) + ': ' + marcar_(String(c[1]).slice(0, 140), q) + (r.status ? ' · ' + esc(r.status) : '') + '</small></button>';
    }).join('');
    box.innerHTML = res.length
      ? html + '<button type="button" class="search-todos" data-search-todos>Ver los ' + res.length + ' resultados en Operación completa ›</button>'
      : '<div class="avisos-vacio">Nada coincide con "' + esc(input.value.trim()) + '" en tus cargas.</div>';
    box.hidden = false;

  (function () {
    var input = document.getElementById('home-search'), box = document.getElementById('home-search-resultados');
    if (!input || !box) return;

      if (!items.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        busquedaActiva_ = (busquedaActiva_ + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        items.forEach(function (it, i) { it.classList.toggle('activo', i === busquedaActiva_); });
      } else if (e.key === 'Enter') {

    });
    box.addEventListener('click', function (e) {
      var b = e.target.closest('[data-search-load]');
      if (b) { box.hidden = true; openLoadWorkspace(b.getAttribute('data-search-load'), 'operacion'); return; }
      if (e.target.closest('[data-search-todos]')) {

  function clientesSinCsr_() {

    var t = document.getElementById('multimsg-texto').value;
    if (!t.trim()) return;
    var canal = document.getElementById('multimsg-canal').value;
    window.open(canal === 'Email'
      ? 'mailto:?subject=' + encodeURIComponent('Actualización de sus cargas') + '&body=' + encodeURIComponent(t)
      : 'https://wa.me/?text=' + encodeURIComponent(t), '_blank', 'noopener');
  });
  document.getElementById('multimsg-registrar').addEventListener('click', function () {
    var sel = multiMsgSeleccion_(), texto = document.getElementById('multimsg-texto').value.trim(), canal = document.getElementById('multimsg-canal').value;
    if (!sel.length || !texto) { showToast('Elige al menos una carga y escribe el mensaje', 'error'); return; }
    var btn = this; btn.disabled = true;
    var hechos = 0, fallas = [];
    var siguiente = function (i) {
      if (i >= sel.length) {
        btn.disabled = false;
        render(currentData);
        if (fallas.length) showToast('Se registraron ' + hechos + '; fallaron: ' + fallas.join(', '), 'error');
        else { showToast('Aviso registrado en ' + hechos + (hechos === 1 ? ' carga' : ' cargas'), 'good'); document.getElementById('multimsg-backdrop').classList.remove('show'); }
        return;
      }
      var r = sel[i];
      guardarConVerificacion_(function (res) {
        hechos++;
        if (res && res.recordatorio_fecha) r.recordatorio_fecha = res.recordatorio_fecha;
        r.client_notify_pending = false; r.client_notify_reason = ''; r.client_notify_since = '';
        r.client_notified_at = new Date().toISOString(); r.client_notified_by = myRealIdentity;
        siguiente(i + 1);
      }, function () { fallas.push(r.load); siguiente(i + 1); })
        .registrarComunicacionCliente(r.load, canal, 'Actualización de varias cargas', myRealIdentity, myPassword); // solo qué fue, no el texto
    };
    siguiente(0);
  });

  // ===== Calendario de la semana =====
  var calSemana_ = 0; // 0 = esta semana, -1 la anterior, +1 la siguiente
  function lunesDe_(d) {
    var x = new Date(d); x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function renderCalendario_() {
    var grid = document.getElementById('cal-grid');
    if (!grid) return;
    var inicio = lunesDe_(new Date()); inicio.setDate(inicio.getDate() + calSemana_ * 7);
    var dias = [], porDia = {};
    for (var i = 0; i < 7; i++) {
      var d = new Date(inicio); d.setDate(inicio.getDate() + i);
      dias.push(d); porDia[d.toDateString()] = [];
    }
    actionCenterScope(currentData).forEach(function (r) {
      if (isCancelledStatus(r.status)) return;
      [['pickup', r.pickup_appt, 'Pickup'], ['cruce', r.cruce_usa_fecha, 'Cruce'], ['entrega', r.delivery_appt, 'Entrega']].forEach(function (ev) {
        var f = pd(ev[1]);
        if (!f || isNaN(f.getTime())) return;
        var k = new Date(f.getFullYear(), f.getMonth(), f.getDate()).toDateString();
        if (porDia[k]) porDia[k].push({ tipo: ev[0], etiqueta: ev[2], fecha: f, r: r });
      });
    });
    // Loads apartados activos: cruce, entrega en destino y la fecha de mi carga.
    apartados.forEach(function (ap) {
      if (apartadoCerrado_(ap)) return;
      [[ap.fecha_cruce, 'Cruce apartado'], [ap.fecha_entrega, 'Entrega apartado'], [ap.fecha_mi_carga, 'Mi carga (apartado)']].forEach(function (ev) {
        var f = pd(ev[0]);
        if (!f || isNaN(f.getTime())) return;
        var k = new Date(f.getFullYear(), f.getMonth(), f.getDate()).toDateString();
        if (porDia[k]) porDia[k].push({ tipo: 'apartado', etiqueta: ev[1], fecha: f, ap: ap });
      });
    });
    var nombres = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'], hoy = new Date().toDateString();
    grid.innerHTML = dias.map(function (d, i) {
      var items = porDia[d.toDateString()].sort(function (a, b) { return a.fecha - b.fecha; });
      return '<div class="cal-dia' + (d.toDateString() === hoy ? ' hoy' : '') + '"><div class="cal-dia-head">' + nombres[i] + ' ' + d.getDate() +
        '<span>' + items.length + '</span></div><div class="cal-dia-body">' +
        (items.length ? items.map(function (x) {
          var hh = ('0' + x.fecha.getHours()).slice(-2) + ':' + ('0' + x.fecha.getMinutes()).slice(-2);
          if (x.ap) return '<button type="button" class="cal-chip t-apartado" data-cal-apartado="' + esc(x.ap.id) + '">' + hh + ' · ' + esc(x.etiqueta) + ' · Load ' + esc(x.ap.load) +
            '<small>' + esc(APARTADO_ESTADOS_[x.ap.estado] || '') + (x.ap.mi_carga ? ' · ' + esc(x.ap.mi_carga) : '') + '</small></button>';
          return '<button type="button" class="cal-chip t-' + x.tipo + '" data-cal-load="' + esc(x.r.load) + '">' + hh + ' · ' + esc(x.etiqueta) + ' · Load ' + esc(x.r.load) +
            '<small>' + esc(x.r.customer || '') + (x.r.status ? ' · ' + esc(x.r.status) : '') + '</small></button>';
        }).join('') : '<div class="cal-vacio">Sin movimientos</div>') + '</div></div>';
    }).join('');
  }
  document.getElementById('cal-prev').addEventListener('click', function () { calSemana_--; renderCalendario_(); });
  document.getElementById('cal-next').addEventListener('click', function () { calSemana_++; renderCalendario_(); });
  document.getElementById('cal-hoy').addEventListener('click', function () { calSemana_ = 0; renderCalendario_(); });
  document.getElementById('cal-grid').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cal-load]');
    if (b) { openLoadWorkspace(b.getAttribute('data-cal-load'), 'operacion'); return; }
    b = e.target.closest('[data-cal-apartado]');
    if (b) verApartado_(b.getAttribute('data-cal-apartado'));
  });

  // ===== Loads apartados (regreso cargado) =====
  // Loads de otros CSR (en Vanguard) que se apartan para regresar cargado. Pasos: monitorear que
  // cruce y sea despachado → revisar cuándo entrega en destino → decidir si sirve para mi carga
  // o se cambia a broker. El servidor calcula "proxima_revision" (fecha de cruce, fecha de
  // entrega o cada X horas) y la campana avisa cuando llega (ver candidatosAvisos_).
  var apartados = [];
  var apartadosCargados_ = false;
  var apartadoEditando_ = null;
  var APARTADO_ESTADOS_ = {
    cruce: 'Monitoreando cruce', transito: 'Cruzó — esperando entrega', entregado: 'Entregó en destino',
    broker: 'En broker', usado: 'Usado para mi carga', liberado: 'Liberado'
  };
  var APARTADO_CERRADOS_ = ['usado', 'liberado'];
  var APARTADO_PASO_ = { cruce: 1, transito: 2, entregado: 3, broker: 4, usado: 4, liberado: 0 };
  var APARTADO_ANTERIOR_ = { transito: 'cruce', entregado: 'transito', broker: 'entregado' };
  // Qué hay que hacer en cada paso (título del aviso de la campana).
  var APARTADO_PREGUNTA_ = {
    cruce: '¿Ya cruzó y fue despachado?', transito: '¿Ya entregó en destino?',
    entregado: '¿Te sirve para tu carga o va a broker?', broker: 'Sigue en broker: ¿ya hay carga?'
  };
  // Botón para avanzar de paso según dónde va: [estado destino, texto].
  var APARTADO_AVANCES_ = {
    cruce: [['transito', 'Ya cruzó / despachado']],
    transito: [['entregado', 'Ya entregó en destino']],
    entregado: [['usado', 'Me sirve para mi carga'], ['broker', 'No tengo carga → broker']],
    broker: [['usado', 'Ya hay carga (cerrar)']]
  };

  function apartadoCerrado_(ap) { return APARTADO_CERRADOS_.indexOf(ap.estado) !== -1; }
  function apartadoVencido_(ap) {
    var p = pd(ap.proxima_revision);
    return !apartadoCerrado_(ap) && !!p && !isNaN(p.getTime()) && p.getTime() <= Date.now();
  }
  /** Mi carga es en menos de 24 h (o ya pasó) y el apartado todavía no entrega. */
  function apartadoMiCargaEnRiesgo_(ap) {
    var m = pd(ap.fecha_mi_carga);
    return (ap.estado === 'cruce' || ap.estado === 'transito') && !!m && !isNaN(m.getTime()) && m.getTime() - Date.now() <= 24 * 3600000;
  }
  function fechaApartadoHtml_(v, vencida) {
    if (!v) return '<span style="color:var(--ink-faint)">—</span>';
    return '<span' + (vencida ? ' class="vencido"' : '') + '>' + (vencida ? '⚠ ' : '') + esc(fmtDateTime(v)) + '</span>';
  }

  function apartadoCardHtml_(ap) {
    var cerrado = apartadoCerrado_(ap), vence = apartadoVencido_(ap), ahora = Date.now();
    var pasada = function (v) { var d = pd(v); return !!d && !isNaN(d.getTime()) && d.getTime() < ahora; };
    var paso = APARTADO_PASO_[ap.estado] || 0, stepper = '';
    for (var i = 1; i <= 4; i++) stepper += '<i' + (i <= paso ? ' class="on"' : '') + '></i>';
    var ruta = [ap.origen, ap.destino].filter(Boolean).join(' → ');
    var sub = [ap.csr_dueno ? 'CSR: ' + ap.csr_dueno : '', ruta].filter(Boolean).join(' · ');
    if (ap.creado_por && ap.creado_por !== myRealIdentity) sub += (sub ? ' · ' : '') + 'Apartó: ' + ap.creado_por;
    // Si el load también está en "Loads" (importado de Vanguard), se muestra cómo va en vivo.
    var rec = recPorLoad_(ap.load), enLoads = '';
    if (rec) {
      enLoads = '<div class="ap-loads">En Loads: <b>' + esc(rec.status || 'sin estatus') + '</b>' +
        (rec.cruce_usa_fecha ? ' · cruzó ' + esc(fmtDateTime(rec.cruce_usa_fecha)) : '') +
        (rec.delivery_actual ? ' · entregó ' + esc(fmtDateTime(rec.delivery_actual)) : (rec.delivery_appt ? ' · cita entrega ' + esc(fmtDateTime(rec.delivery_appt)) : '')) +
        ' <button type="button" class="link-btn" data-ap-abrir-load="' + esc(ap.load) + '">Abrir</button></div>';
    }
    var prox = '';
    if (!cerrado) {
      prox = vence
        ? '<div class="ap-proxima vencido">⏰ Toca revisar (desde ' + esc(fmtDateTime(ap.proxima_revision)) + ') — ' + esc(APARTADO_PREGUNTA_[ap.estado] || '') + '</div>'
        : '<div class="ap-proxima">Próxima revisión: ' + esc(ap.proxima_revision ? fmtDateTime(ap.proxima_revision) : '—') + '</div>';
      if (apartadoMiCargaEnRiesgo_(ap)) prox += '<div class="ap-proxima vencido">⚠ Tu carga es ' + (pasada(ap.fecha_mi_carga) ? 'ya' : 'en menos de 24 h') + ' y este load todavía no entrega. ¿Lo cambias a broker?</div>';
    }
    var btn = function (accion, texto, primario) {
      return '<button type="button" class="ws-btn' + (primario ? ' primary' : '') + '" data-ap-accion="' + accion + '" data-ap-id="' + esc(ap.id) + '">' + esc(texto) + '</button>';
    };
    var acciones = '';
    if (!cerrado) {
      (APARTADO_AVANCES_[ap.estado] || []).forEach(function (x, idx) { acciones += btn(x[0], x[1], idx === 0); });
      if (apartadoMiCargaEnRiesgo_(ap)) acciones += btn('broker', 'Cambiar a broker');
      acciones += btn('revisar', 'Ya revisé (+' + ap.frecuencia_horas + ' h)');
      if (APARTADO_ANTERIOR_[ap.estado]) acciones += btn('atras', '↶ Paso anterior');
      if (ap.destino) acciones += btn('radar', 'Cargas en Broker cerca');
      acciones += btn('editar', 'Editar') + btn('liberado', 'Liberar');
    } else {
      acciones += btn('reabrir', 'Reabrir');
    }
    acciones += btn('eliminar', 'Eliminar');
    var hist = (ap.historial || []).slice().reverse();
    return '<article class="ap-card' + (vence || apartadoMiCargaEnRiesgo_(ap) ? ' ap-revisar' : '') + (cerrado ? ' ap-cerrado' : '') + '" data-apartado-id="' + esc(ap.id) + '">' +
      '<div class="ap-head"><div><b>Load ' + esc(ap.load) + '</b><small>' + esc(sub || 'Sin datos del viaje') + '</small></div>' +
      '<span class="ap-estado e-' + esc(ap.estado) + '">' + esc(APARTADO_ESTADOS_[ap.estado] || ap.estado) + '</span></div>' +
      '<div class="ap-stepper" title="Paso ' + paso + ' de 4">' + stepper + '</div>' +
      '<dl class="ap-datos">' +
        '<dt>Cruce</dt><dd>' + fechaApartadoHtml_(ap.fecha_cruce, ap.estado === 'cruce' && pasada(ap.fecha_cruce)) + '</dd>' +
        '<dt>Entrega destino</dt><dd>' + fechaApartadoHtml_(ap.fecha_entrega, (ap.estado === 'cruce' || ap.estado === 'transito') && pasada(ap.fecha_entrega)) + '</dd>' +
        '<dt>Mi carga</dt><dd>' + (ap.mi_carga ? esc(ap.mi_carga) + ' · ' : '') + fechaApartadoHtml_(ap.fecha_mi_carga, !cerrado && apartadoMiCargaEnRiesgo_(ap)) + '</dd>' +
        '<dt>Avisarme</dt><dd>cada ' + esc(ap.frecuencia_horas) + ' h</dd>' +
      '</dl>' + enLoads + prox +
      (ap.nota ? '<div class="ap-nota">' + esc(ap.nota) + '</div>' : '') +
      '<div class="ap-acciones">' + acciones + '</div>' +
      (hist.length ? '<details class="ap-hist"><summary>Historial (' + hist.length + ')</summary><ul>' + hist.map(function (h) {
        return '<li>' + esc(fmtDateTime(h.ts)) + ' · ' + esc(h.por || '') + ': ' + esc(h.txt || '') + '</li>';
      }).join('') + '</ul></details>' : '') +
    '</article>';
  }

  function badgeApartados_() {
    var porRevisar = apartados.filter(function (ap) { return apartadoVencido_(ap) || apartadoMiCargaEnRiesgo_(ap); }).length;
    var badge = document.getElementById('sidebar-badge-apartados');
    if (badge) { badge.textContent = porRevisar > 99 ? '99+' : String(porRevisar); badge.classList.toggle('show', porRevisar > 0); }
  }

  function renderApartados_() {
    badgeApartados_();
    var cont = document.getElementById('apartados-lista');
    if (!cont) return;
    var filtro = document.getElementById('apartados-filtro').value;
    var q = document.getElementById('apartados-buscar').value.trim().toLowerCase();
    var lista = apartados.filter(function (ap) {
      var cerrado = apartadoCerrado_(ap);
      if (filtro === 'activos' && cerrado) return false;
      if (filtro === 'cerrados' && !cerrado) return false;
      if (filtro === 'revisar' && !(apartadoVencido_(ap) || apartadoMiCargaEnRiesgo_(ap))) return false;
      if (!q) return true;
      return [ap.load, ap.csr_dueno, ap.origen, ap.destino, ap.mi_carga, ap.nota, ap.creado_por].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    lista.sort(function (a, b) {
      var ca = apartadoCerrado_(a), cb = apartadoCerrado_(b);
      if (ca !== cb) return ca ? 1 : -1;
      if (ca) return String(b.actualizado_en).localeCompare(String(a.actualizado_en));
      var ra = apartadoVencido_(a) || apartadoMiCargaEnRiesgo_(a), rb = apartadoVencido_(b) || apartadoMiCargaEnRiesgo_(b);
      if (ra !== rb) return ra ? -1 : 1;
      return String(a.proxima_revision || '9').localeCompare(String(b.proxima_revision || '9'));
    });
    if (!myRealIdentity) { cont.innerHTML = '<div class="ap-vacio">Inicia sesión para ver tus loads apartados.</div>'; return; }
    if (!apartadosCargados_) { cont.innerHTML = '<div class="ap-vacio">Cargando…</div>'; return; }
    cont.innerHTML = lista.length ? lista.map(apartadoCardHtml_).join('') :
      (apartados.length ? '<div class="ap-vacio">Nada con este filtro.</div>' : guiaHtml_('Así funcionan los loads apartados', [
        ['Aparta el load', 'Cuando otro CSR tiene un viaje que te sirve para regresar cargado, dale <b>+ Apartar load</b> (o <b>Apartar</b> desde el Radar). Pon fecha de cruce y de entrega.'],
        ['El panel te avisa', 'La campana te recuerda revisar cuando debería cruzar, cuando debería entregar y después cada las horas que elijas.'],
        ['Decide', 'Ya entregó: úsalo para tu carga, o si no tienes, pásalo a <b>broker</b>. Al cerrarlo deja de avisar.']
      ], '<button type="button" class="ws-btn primary" data-guia-accion="apartar">+ Apartar mi primer load</button>'));
  }

  /** Guía de primeros pasos para secciones vacías (Apartados, Radar). */
  function guiaHtml_(titulo, pasos, accionHtml) {
    return '<div class="guia"><b class="guia-titulo">' + esc(titulo) + '</b><ol class="guia-pasos">' +
      pasos.map(function (p) { return '<li><b>' + esc(p[0]) + '</b><span>' + p[1] + '</span></li>'; }).join('') +
      '</ol>' + (accionHtml || '') + '</div>';
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-guia-accion]');
    if (!b) return;
    var a = b.getAttribute('data-guia-accion');
    if (a === 'apartar') document.getElementById('apartado-nuevo').click();
    if (a === 'radar-subir') document.getElementById('radar-subir').click();
    if (a === 'radar-origen') document.getElementById('radar-origen').focus();
  });

  var apartadosSeq_ = 0;
  function loadApartados_() {
    var seq = ++apartadosSeq_;
    if (!myRealIdentity) { apartados = []; apartadosCargados_ = false; renderApartados_(); return; }
    google.script.run.withSuccessHandler(function (res) {
      if (seq !== apartadosSeq_) return; // respuesta de una petición vieja
      aplicarApartados_(res);
    }).getApartados(myRealIdentity, myPassword);
  }
  function aplicarApartados_(res) {
    if (!res || res.ok === false) return;
    apartadosSeq_++; // lo que venga de una petición anterior ya no aplica
    apartados = sinBorrandose_(res.items || []);
    apartadosCargados_ = true;
    renderApartados_();
    programarAvisos_();
  }

  function reemplazarApartado_(ap) {
    var hay = false;
    apartados = apartados.map(function (x) { if (x.id === ap.id) { hay = true; return ap; } return x; });
    if (!hay) apartados.unshift(ap);
    renderApartados_();
    if (!document.getElementById('page-radar').hidden) renderRadar_(); // "Apartar" → "Apartado ✓"
    programarAvisos_();
  }

  /** Cambia de paso / "Ya revisé" desde la tarjeta o desde la campana. */
  function accionApartado_(id, accion, boton, alTerminar) {
    var ap = apartados.filter(function (x) { return x.id === id; })[0];
    if (!ap) return;
    if (accion === 'atras') accion = APARTADO_ANTERIOR_[ap.estado];
    if (accion === 'reabrir') accion = 'cruce';
    if (!accion) return;
    if (boton) boton.disabled = true;
    var ok = function (res) {
      reemplazarApartado_(res.apartado);
      if (alTerminar) alTerminar();
      showToast(accion === 'revisar'
        ? 'Revisión registrada — próxima: ' + fmtDateTime(res.apartado.proxima_revision) + ' — Load ' + ap.load
        : 'Load ' + ap.load + ': ' + APARTADO_ESTADOS_[res.apartado.estado], 'good');
    };
    var fallo = function (err) { if (boton) boton.disabled = false; showToast('No se pudo guardar: ' + err.message, 'error'); };
    if (accion === 'revisar') guardarConVerificacion_(ok, fallo).revisarApartado(id, '', myRealIdentity, myPassword);
    else guardarConVerificacion_(ok, fallo).cambiarEstadoApartado(id, accion, '', myRealIdentity, myPassword);
  }

  function verApartado_(id) {
    showMainPage('apartados');
    var ap = apartados.filter(function (x) { return x.id === id; })[0];
    if (ap && apartadoCerrado_(ap)) document.getElementById('apartados-filtro').value = 'todos';
    document.getElementById('apartados-buscar').value = '';
    renderApartados_();
    setTimeout(function () {
      var el = document.querySelector('[data-apartado-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 30);
  }

  function abrirApartado_(ap) {
    apartadoEditando_ = ap ? ap.id : null;
    var aLocal = function (v) { var d = pd(v); return d && !isNaN(d.getTime()) ? toDatetimeLocalValue(d) : ''; };
    document.getElementById('apartado-titulo').textContent = ap ? 'Editar load apartado ' + ap.load : 'Apartar load para regreso';
    document.getElementById('ap-load').value = ap ? ap.load : '';
    document.getElementById('ap-csr').value = ap ? ap.csr_dueno : '';
    document.getElementById('ap-origen').value = ap ? ap.origen : '';
    document.getElementById('ap-destino').value = ap ? ap.destino : '';
    document.getElementById('ap-fecha-cruce').value = ap ? aLocal(ap.fecha_cruce) : '';
    document.getElementById('ap-fecha-entrega').value = ap ? aLocal(ap.fecha_entrega) : '';
    document.getElementById('ap-mi-carga').value = ap ? ap.mi_carga : '';
    document.getElementById('ap-fecha-mi-carga').value = ap ? aLocal(ap.fecha_mi_carga) : '';
    document.getElementById('ap-frecuencia').value = String(ap ? ap.frecuencia_horas : 3);
    if (!document.getElementById('ap-frecuencia').value) document.getElementById('ap-frecuencia').value = '3';
    document.getElementById('ap-nota').value = ap ? ap.nota : '';
    document.getElementById('apartado-error').style.display = 'none';
    document.getElementById('ap-csr-lista').innerHTML = (personas || []).map(function (p) { return '<option value="' + esc(p.nombre) + '">'; }).join('');
    document.getElementById('apartado-backdrop').classList.add('show');
    setTimeout(function () { document.getElementById('ap-load').focus(); }, 30);
    recordarFotoModal_('apartado-backdrop');
  }
  function cerrarApartadoModal_() { document.getElementById('apartado-backdrop').classList.remove('show'); }
  function cerrarApartadoConAviso_() { cerrarSiNoHayCambios_('apartado-backdrop', cerrarApartadoModal_); }

  /** Si el load ya está en "Loads", llena origen/destino/fechas que estén vacíos. */
  document.getElementById('ap-load').addEventListener('change', function () {
    var rec = recPorLoad_(this.value.trim());
    if (!rec) return;
    var poner = function (id, v) { var el = document.getElementById(id); if (el && !el.value && v) el.value = v; };
    poner('ap-origen', [rec.origin_city, rec.origin_state].filter(Boolean).join(', '));
    poner('ap-destino', [rec.dest_city, rec.dest_state].filter(Boolean).join(', '));
    var d = pd(rec.cruce_usa_fecha); if (d && !isNaN(d.getTime())) poner('ap-fecha-cruce', toDatetimeLocalValue(d));
    d = pd(rec.delivery_appt); if (d && !isNaN(d.getTime())) poner('ap-fecha-entrega', toDatetimeLocalValue(d));
    showToast('Datos tomados del Load ' + rec.load + ' en la hoja Loads', 'good');
  });

  document.getElementById('apartado-nuevo').addEventListener('click', function () {
    if (!myRealIdentity || !myPassword) { ensureLoggedIn(function () { abrirApartado_(null); }); return; }

    tamps: 'Tamaulipas', tlax: 'Tlaxcala', ver: 'Veracruz', yuc: 'Yucatán', zac: 'Zacatecas' };
  var RADAR_US_ = 'al ak az ar ca co ct de fl ga hi id il in ia ks ky la me md ma mi mn ms mo mt ne nv nh nj nm ny nc nd oh ok or pa ri sc sd tn tx ut vt va wa wv wi wy dc'.split(' ');
  var radarCoords_ = null;      // llave → [lat, lon] (conocidas + hoja Coordenadas + nuevas)

  function radarNorm_(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\./g, '').replace(/\s+/g, ' ').trim(); }
  function radarKey_(ciudad, estado) { return radarNorm_(ciudad) + '|' + radarNorm_(estado).replace(/\s/g, ''); }
  function radarLugar_(ciudad, estado) { return titleCity(ciudad) + (estado ? ', ' + String(estado).toUpperCase() : ''); }
  function radarMillas_(a, b) {
    var R = 3958.8, rad = function (d) { return d * Math.PI / 180; };
    var dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
    var h = Math.pow(Math.sin(dLat / 2), 2) + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.pow(Math.sin(dLon / 2), 2);
    return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  }
  function radarEstado_(txt, err) { var e = document.getElementById('radar-estado'); e.textContent = txt || ''; e.className = 'radar-estado' + (err ? ' err' : ''); }
  function radarProgreso_(pct) {
    var p = document.getElementById('radar-progreso');
    p.hidden = pct === null;
    if (pct !== null) document.getElementById('radar-progreso-barra').style.width = pct + '%';
  }

  function radarCargarCoords_(listo) {
    if (radarCoords_) { listo(); return; }
    google.script.run.withSuccessHandler(function (res) {
      radarCoords_ = Object.assign({}, RADAR_CONOCIDAS_, (res && res.items) || {});
      listo();
    }).withFailureHandler(function () {
      radarCoords_ = Object.assign({}, RADAR_CONOCIDAS_); // sin la hoja: igual funciona, solo consulta más
      listo();
    }).getCoordenadas(myRealIdentity, myPassword);
  }

  /** Pregunta a OpenStreetMap dónde está "ciudad, estado". Respeta 1 consulta por segundo. */
  function radarBuscarOSM_(ciudad, estado) {
    var st = radarNorm_(estado).replace(/\s/g, ''), p;
    if (RADAR_US_.indexOf(st) !== -1) p = 'city=' + encodeURIComponent(ciudad) + '&state=' + encodeURIComponent(st.toUpperCase()) + '&country=USA';
    else if (RADAR_MX_[st]) p = 'city=' + encodeURIComponent(ciudad) + '&state=' + encodeURIComponent(RADAR_MX_[st]) + '&country=Mexico';
    else p = 'q=' + encodeURIComponent(ciudad + (estado ? ', ' + estado : ''));
    var espera = Math.max(0, radarUltimaConsulta_ + 1100 - Date.now());
    return new Promise(function (ok) { setTimeout(ok, espera); }).then(function () {
      radarUltimaConsulta_ = Date.now();
      return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=es&' + p, { headers: { Accept: 'application/json' } });
    }).then(function (r) {
      if (!r.ok) throw new Error('OpenStreetMap respondió ' + r.status);
      return r.json();
    }).then(function (d) {
      return d && d.length ? [Number(d[0].lat), Number(d[0].lon)] : null;
    });
  }

  /** Ubica todas las llaves que falten (una tras otra), las guarda en la hoja y llama a listo(). */
  function radarUbicar_(pendientes, listo) {
    var nuevas = [], i = 0, errorRed = false;
    var siguiente = function () {
      if (i >= pendientes.length) {
        radarProgreso_(null);
        if (nuevas.length) google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {}).guardarCoordenadas(nuevas, myRealIdentity, myPassword);
        listo(errorRed);
        return;
      }
      var x = pendientes[i++];
      radarEstado_('Ubicando ciudades nuevas en OpenStreetMap… ' + i + ' de ' + pendientes.length + ' (' + radarLugar_(x.ciudad, x.estado) + ')');
      radarProgreso_(Math.round(i * 100 / pendientes.length));
      radarBuscarOSM_(x.ciudad, x.estado).then(function (c) {
        if (c) { radarCoords_[x.key] = c; nuevas.push({ key: x.key, ciudad: x.ciudad, estado: x.estado, lat: c[0], lon: c[1] }); }
        else radarFallidas_[x.key] = true;
      }).catch(function () { errorRed = true; }).then(siguiente);
    };
    siguiente();
  }

  // Fuente de cargas del Radar: el Excel de VanGuard que se sube aquí (el que importa el panel no
  // trae ciudad/estado de destino). Mismo formato que el Radar original: desde la fila 3,
  // A = load, I = ciudad, J = estado, L = Delivery appt., P = Regresos (solo filas con "Broker").
  // Se comparte con todo el equipo (hoja "RadarExcel", ver guardarRadarExcel en Code.gs): el último
  // que lo sube lo reemplaza para todos. En este navegador queda una copia para abrir más rápido.
  var radarExcel_ = null; // { nombre, cargado_en, por, compartido, filas: [{ load, ciudad, estado, regresos, entrega }] }

  function guardarRadarExcelLocal_() {
    try {
      if (radarExcel_) localStorage.setItem('bajio_radar_excel', JSON.stringify(radarExcel_));
      else localStorage.removeItem('bajio_radar_excel');

  /** Sube el Excel actual a la hoja del equipo. */
  function compartirRadarExcel_(avisar) {
    if (!radarExcel_ || !myRealIdentity || !myPassword) return;
    google.script.run.withSuccessHandler(function (res) {
      if (!res || res.ok === false) { if (avisar) showToast('No se pudo compartir el Excel: ' + ((res && res.error) || ''), 'error'); return; }
      radarExcel_.compartido = true;
      radarExcel_.por = res.por;
      radarExcel_.cargado_en = res.cargado_en;
      guardarRadarExcelLocal_();
      renderRadarFuente_();

    }).withFailureHandler(function (err) {

    }).guardarRadarExcel({ nombre: radarExcel_.nombre, filas: radarExcel_.filas }, myRealIdentity, myPassword);
  }
  /** Trae el Excel del equipo (una vez por sesión, al abrir el Radar). */
  function revisarRadarExcelEquipo_(listo) {
    if (Date.now() - radarExcelRevisadoEn_ < 300000 || !myRealIdentity || !myPassword) { if (listo) listo(); return; }
    google.script.run.withSuccessHandler(function (res) {
      radarExcelRevisadoEn_ = Date.now();
      if (res && res.ok !== false) {
        var x = res.excel;
        if (x) {

            radarExcel_ = { nombre: x.nombre, cargado_en: x.cargado_en, por: x.por, filas: x.filas, v: 2, compartido: true };
            radarResultados_ = null;

          radarExcel_ = null; // alguien lo quitó para el equipo

  function radarLeerExcel_(file) {
    radarEstado_('Leyendo ' + file.name + '…');
    ensureXlsxLoaded().then(function () {
      var reader = new FileReader();
      reader.onload = function (evt) {
        try {
          var wb = XLSX.read(evt.target.result, { type: 'array', cellDates: true });
          var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
          // Se guardan TODAS las filas con destino (también las que no están en Broker, para la
          // vista "No están en Broker"), con lo que diga Regresos.
          var filas = [], enBroker = 0;
          for (var i = 2; i < rows.length; i++) {
            var row = rows[i] || [];
            var ciudad = String(row[8] || '').trim(), estado = String(row[9] || '').trim();
            if (!ciudad || !estado) continue;
            var regresos = String(row[15] || '').trim();
            if (regresos.toLowerCase().indexOf('broker') !== -1) enBroker++;
            var ent = row[11], d = Object.prototype.toString.call(ent) === '[object Date]' ? ent : (ent ? new Date(ent) : null);
            filas.push({ load: String(row[0] || '').trim(), ciudad: ciudad, estado: estado, regresos: regresos, entrega: d && !isNaN(d.getTime()) ? d.toISOString() : '' });
          }
          if (!filas.length) { radarEstado_('No encontré ciudades en las columnas I/J a partir de la fila 3. ¿Es el Excel de VanGuard con destinos?', true); return; }
          radarExcel_ = { nombre: file.name, cargado_en: new Date().toISOString(), por: myRealIdentity, filas: filas, v: 2 };
          guardarRadarExcelLocal_();
          compartirRadarExcel_(true);
          radarResultados_ = null;
          radarEstado_('✓ ' + file.name + ' — ' + filas.length + ' cargas con destino: ' + enBroker + ' en Broker y ' + (filas.length - enBroker) + ' no.');

          radarEstado_('No se pudo leer el archivo: ' + err.message, true);

      };
      reader.readAsArrayBuffer(file);
    }).catch(function (err) { radarEstado_(err.message, true); });
  }

  /** Cargas a medir según "Ver" (En Broker / No están en Broker / Todas). Del Excel del Radar;
   * cliente/estatus se completan con la carga del panel si existe con ese número. Sin Excel, usa
   * las cargas del panel que sí traigan destino. */
  function radarCargas_(ver) {
    ver = ver || document.getElementById('radar-ver').value;
    var conEntregadas = document.getElementById('radar-entregadas').checked;
    var esBroker = function (txt) { return /broker/i.test(String(txt || '')); };
    var vale = function (r) {
      if (ver === 'broker' && !esBroker(r.regresos)) return false;
      if (ver === 'otras' && esBroker(r.regresos)) return false;
      if (isCancelledStatus(r.status)) return false;
      return conEntregadas || DONE_STATUSES.indexOf(String(r.status || '').trim()) === -1;
    };
    if (radarExcel_) {
      return radarExcel_.filas.map(function (f) {
        var p = f.load ? recPorLoad_(f.load) : null;
        return { load: f.load || '—', customer: p ? p.customer : '', status: p ? p.status : '', origin_city: p ? p.origin_city : '', origin_state: p ? p.origin_state : '',
          cruce_usa_fecha: p ? p.cruce_usa_fecha : '', dest_city: f.ciudad, dest_state: f.estado, delivery_appt: f.entrega, enPanel: !!p,
          regresos: radarExcel_.v === 2 ? f.regresos : 'Broker' }; // Excel subido antes de esta versión: solo traía Broker
      }).filter(vale);
    }
    return currentData.filter(function (r) { return r.dest_city && vale(r); });

  /** Solo las de Broker (para el mensaje de disponibilidad de WhatsApp). */

  function radarCalcular_() {
    if (radarOcupado_) return;
    var txt = document.getElementById('radar-origen').value.trim();
    if (!txt) { radarEstado_('Escribe tu origen: Ciudad, Estado (por ejemplo "Bellefontaine, OH").', true); return; }
    var coma = txt.lastIndexOf(',');
    var oCiudad = coma === -1 ? txt : txt.slice(0, coma).trim(), oEstado = coma === -1 ? '' : txt.slice(coma + 1).trim();
    var oPunto = parseCoords_(txt); // coordenadas de la unidad: se mide desde el punto exacto
    try { localStorage.setItem('bajio_radar_origen', txt); } catch (e) {}
    radarOcupado_ = true;
    document.getElementById('radar-calcular').disabled = true;
    radarEstado_('Preparando…');
    radarCargarCoords_(function () {
      var cargas = radarCargas_(), faltan = {}, oKey = oPunto ? coordsKey_(oPunto) : radarKey_(oCiudad, oEstado);
      if (oPunto) radarCoords_[oKey] = oPunto;
      if (!cargas.length) {
        radarOcupado_ = false; document.getElementById('radar-calcular').disabled = false;
        radarResultados_ = null; renderRadar_();
        radarEstado_(radarExcel_ ? 'No hay cargas con este filtro en el Excel.' : 'No hay cargas para medir. Sube el Excel de VanGuard con destinos.', true);
        return;
      }
      if (!radarCoords_[oKey]) faltan[oKey] = { key: oKey, ciudad: oCiudad, estado: oEstado };
      cargas.forEach(function (r) {
        var k = radarKey_(r.dest_city, r.dest_state);
        if (r.dest_city && !radarCoords_[k] && !radarFallidas_[k]) faltan[k] = { key: k, ciudad: titleCity(r.dest_city), estado: String(r.dest_state || '') };
      });
      radarUbicar_(Object.keys(faltan).map(function (k) { return faltan[k]; }), function (errorRed) {
