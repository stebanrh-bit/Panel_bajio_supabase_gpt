        if (!o) {
          radarResultados_ = null; renderRadar_();
          radarEstado_(errorRed ? 'No se pudo consultar OpenStreetMap (revisa tu conexión) y "' + txt + '" no está guardada todavía.' : 'No encontré "' + txt + '". Revisa el nombre: Ciudad, Estado.', true);
          return;
        }
        radarOrigenTxt_ = oPunto ? 'la unidad (' + coordsTxt_(oPunto) + ')' : radarLugar_(oCiudad, oEstado);
        radarOrigenKey_ = oKey;
        radarResultados_ = cargas.map(function (r) {
          var k = radarKey_(r.dest_city, r.dest_state), c = radarCoords_[k];
          return { r: r, key: k, dist: c ? radarMillas_(o, c) : null };
        });
        renderRadar_();
        radarEstado_('Listo — ' + cargas.length + ' cargas medidas desde ' + radarOrigenTxt_ + '.' + (errorRed ? ' Algunas ciudades no se pudieron consultar (revisa tu conexión).' : ''), errorRed);
        if (oPunto) {
          // ¿Dónde es? + el lugar de nuestra base más cercano; el punto se guarda para el proceso de Google.
          var cercano = puntoCercano_(oPunto);
          radarReversa_(oPunto).then(function (lugar) {
            guardarPunto_(oPunto, lugar);
            if (oKey !== radarOrigenKey_) return;
            radarOrigenTxt_ = 'la unidad' + (lugar ? ', cerca de ' + lugar : ' (' + coordsTxt_(oPunto) + ')');
            radarNotaPunto_ = cercano ? ' 📍 Punto más cercano en nuestra base: ' + cercano.nombre + ' (a ' + (Math.round(cercano.millas * 10) / 10) + ' mi).' : '';
            radarEstado_('Listo — medido desde ' + radarOrigenTxt_ + '.' + radarNotaPunto_);
            radarCarretera_();
          });
        } else {
          radarNotaPunto_ = '';
          radarCarretera_();
        }
      });
    });
  }

  // ---- Millas por carretera (OSRM, ruteo gratuito de OpenStreetMap) ----
  // Solo se piden para las ciudades que en línea recta ya quedan dentro del radio (por carretera
  // nunca es menos que en línea recta, así que las demás seguro quedan fuera). Cada trayecto se
  // guarda en la hoja "Distancias" y no se vuelve a consultar.
  var radarOrigenKey_ = '';
  var radarNotaPunto_ = ''; // "punto más cercano en nuestra base" cuando el origen son coordenadas
  var radarDist_ = {};          // llaveOrigen → { llaveDestino: { millas, horas } } (hoja + nuevas)
  var radarDistCargadas_ = {};  // llaveOrigen → true cuando ya se leyó la hoja para ese origen
  var radarRutaSinDato_ = {};   // 'o>d' que OSRM no pudo rutear en esta sesión
  var radarRutaOcupado_ = false;
  var radarUltimaRuta_ = 0;

  // Tiempo de NUESTRA unidad: la regla del equipo es millas ÷ 48 = horas que tarda el camión en
  // llegar (incluye paradas). Distinto de las horas "de manejo continuo" de Google/OSM.
  var VELOCIDAD_UNIDAD_MPH = 48;
  function horasUnidad_(millas) { return millas / VELOCIDAD_UNIDAD_MPH; }
  function fmtHorasUnidad_(h) {
    var min = Math.round(h * 60), hh = Math.floor(min / 60), mm = min % 60;
    return hh ? hh + ' h' + (mm ? ' ' + mm + ' min' : '') : mm + ' min';
  }
  function etiquetaFuente_(f) { return f === 'google' ? 'Google Maps' : f === 'estimado' ? 'estimado' : 'aprox. OSM'; }

  function radarEfectiva_(x) { return x.carretera != null ? x.carretera : x.dist; }
  function radarAplicarCarretera_() {
    var tabla = radarDist_[radarOrigenKey_] || {};
    (radarResultados_ || []).forEach(function (x) {
      var d = tabla[x.key];
      if (x.key === radarOrigenKey_) { x.carretera = 0; x.horas = 0; x.fuente = 'google'; }
      else if (d) { x.carretera = d.millas; x.horas = d.horas; x.fuente = d.fuente || 'osm'; }
    });
  }
  function radarPendientesCarretera_() {
    var radio = Number(document.getElementById('radar-radio').value) || 200, vistos = {};
    return (radarResultados_ || []).filter(function (x) {
      if (x.dist === null || x.dist > radio || x.carretera != null || vistos[x.key] || radarRutaSinDato_[radarOrigenKey_ + '>' + x.key]) return false;
      vistos[x.key] = true;
      return true;
    });
  }
  function radarPedirRuta_(o, d) {
    var espera = Math.max(0, radarUltimaRuta_ + 1100 - Date.now());
    return new Promise(function (ok) { setTimeout(ok, espera); }).then(function () {
      radarUltimaRuta_ = Date.now();
      return fetch('https://router.project-osrm.org/route/v1/driving/' + o[1] + ',' + o[0] + ';' + d[1] + ',' + d[0] + '?overview=false');
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || j.code !== 'Ok' || !j.routes || !j.routes.length) return null;
      return { millas: j.routes[0].distance / 1609.344, horas: j.routes[0].duration / 3600 };
    });
  }

  /** Completa las millas por carretera de lo que está dentro del radio: primero de la hoja, luego OSRM. */
  function radarCarretera_() {
    if (!radarResultados_ || radarRutaOcupado_ || !radarOrigenKey_) return;
    var oKey = radarOrigenKey_, o = radarCoords_[oKey];
    if (!o) return;
    var seguir = function () {
      radarAplicarCarretera_();
      var pend = radarPendientesCarretera_();
      if (!pend.length) { renderRadar_(); return; }
      radarRutaOcupado_ = true;
      var nuevas = [], i = 0, fallas = 0;
      var siguiente = function () {
        if (oKey !== radarOrigenKey_) { radarRutaOcupado_ = false; radarProgreso_(null); return; } // cambiaron el origen
        if (i >= pend.length) {
          radarRutaOcupado_ = false;
          radarProgreso_(null);
          if (nuevas.length) google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {}).guardarDistancias(nuevas, myRealIdentity, myPassword);
          radarAplicarCarretera_();
          renderRadar_();
          radarEstado_('Listo — millas por carretera desde ' + radarOrigenTxt_ + (nuevas.length ? ' (' + nuevas.length + ' trayectos nuevos guardados)' : '') +
            (fallas ? '. ' + fallas + ' sin ruta: se muestran en línea recta.' : '.') + radarNotaPunto_, false);
          return;
        }
        var x = pend[i++];
        radarEstado_('Calculando millas por carretera… ' + i + ' de ' + pend.length + ' (' + radarLugar_(x.r.dest_city, x.r.dest_state) + ')');
        radarProgreso_(Math.round(i * 100 / pend.length));
        radarPedirRuta_(o, radarCoords_[x.key]).then(function (res) {
          if (!res) { fallas++; radarRutaSinDato_[oKey + '>' + x.key] = true; return; }
          radarDist_[oKey] = radarDist_[oKey] || {};
          radarDist_[oKey][x.key] = { millas: res.millas, horas: res.horas, fuente: 'osm' };
          nuevas.push({ origen: oKey, destino: x.key, millas: res.millas, horas: res.horas, recta: x.dist });
        }).catch(function () { fallas++; radarRutaSinDato_[oKey + '>' + x.key] = true; }).then(function () {
          if (i % 5 === 0) { radarAplicarCarretera_(); renderRadar_(); } // se va viendo el avance
          siguiente();
        });
      };
      siguiente();
    };
    if (radarDistCargadas_[oKey]) { seguir(); return; }
    google.script.run.withSuccessHandler(function (res) {
      radarDistCargadas_[oKey] = true;
      radarDist_[oKey] = Object.assign(radarDist_[oKey] || {}, (res && res.items) || {});
      seguir();
    }).withFailureHandler(function () { radarDistCargadas_[oKey] = true; seguir(); }).getDistancias(oKey, myRealIdentity, myPassword);
  }

  function radarFechaKey_(v) { var d = pd(v); return d && !isNaN(d.getTime()) ? d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) : ''; }
  function radarCsrDe_(cliente) {
    var c = String(cliente || '').trim().toLowerCase();
    var a = asignaciones.filter(function (x) { return String(x.cliente || '').trim().toLowerCase() === c; })[0];
    return a ? a.csr : '';
  }
  function radarApartadoDe_(load) { return apartados.filter(function (a) { return String(a.load) === String(load) && !apartadoCerrado_(a); })[0]; }

  function radarDentro_(x, radio) { var e = radarEfectiva_(x); return e !== null && e !== undefined && e <= radio; }
  /** ¿Nuestra unidad, saliendo ahora desde el origen, llega antes de la cita de entrega de esa
   * carga? (regla del equipo: millas ÷ 48). Con línea recta es solo aproximado. null = no se sabe. */
  function radarATiempo_(x) {
    var millas = x.carretera != null ? x.carretera : x.dist;
    var cita = pd(x.r.delivery_appt);
    if (millas === null || millas === undefined || !cita || isNaN(cita.getTime())) return null;
    var llega = Date.now() + horasUnidad_(millas) * 3600000;
    return { ok: llega <= cita.getTime(), horas: Math.abs(cita.getTime() - llega) / 3600000, aprox: x.carretera == null };
  }
  function radarATiempoHtml_(x) {
    var t = radarATiempo_(x);
    if (!t) return '<br><small class="hm-soft">sin cita</small>';
    return '<br><small class="' + (t.ok ? 'sev-good' : 'sev-warn') + '" title="Comparado con la cita de entrega' + (t.aprox ? ' (aprox., en línea recta)' : '') + '">' +
      (t.ok ? '✓ alcanza, ' + fmtHorasUnidad_(t.horas) + ' antes' : '✗ llega ' + fmtHorasUnidad_(t.horas) + ' tarde') + (t.aprox ? ' ~' : '') + '</small>';
  }
  function radarVisibles_() {
    var radio = Number(document.getElementById('radar-radio').value) || 200;
    var fecha = document.getElementById('radar-fecha').value, fuera = document.getElementById('radar-fuera').checked;
    var soloATiempo = document.getElementById('radar-a-tiempo').checked;
    return (radarResultados_ || []).filter(function (x) {
      if (fecha && radarFechaKey_(x.r.delivery_appt) !== fecha) return false;
      if (soloATiempo) { var t = radarATiempo_(x); if (!t || !t.ok) return false; }
      return fuera || x.dist === null || radarDentro_(x, radio);
    }).sort(function (a, b) {
      if (a.dist === null) return 1;
      if (b.dist === null) return -1;
      return radarEfectiva_(a) - radarEfectiva_(b);
    });
  }
  function radarMillasTxt_(x) {
    return x.carretera != null
      ? Math.round(x.carretera) + ' mi (' + etiquetaFuente_(x.fuente) + ') · unidad llega en ~' + fmtHorasUnidad_(horasUnidad_(x.carretera))
      : Math.round(x.dist) + ' mi (línea recta)';
  }

  // ---- Mapa del Radar (Leaflet + mapas de OpenStreetMap; gratis, se carga solo al abrirlo) ----
  var radarMapa_ = null, radarCapa_ = null, leafletPromesa_ = null;
  function cargarLeaflet_() {
    if (window.L && window.L.map) return Promise.resolve();
    if (leafletPromesa_) return leafletPromesa_;
    var cargar = function (el) {
      return new Promise(function (ok, mal) {
        el.onload = function () { ok(); };
        el.onerror = function () { mal(new Error('No se pudo cargar el mapa (revisa tu conexión).')); };
        document.head.appendChild(el);
      });
    };
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    var js = document.createElement('script');
    js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    // Se espera también la hoja de estilos: sin ella el mapa no sabe su tamaño y se ve el mundo entero.
    leafletPromesa_ = Promise.all([cargar(css), cargar(js)]).catch(function (err) { leafletPromesa_ = null; throw err; });
    return leafletPromesa_;
  }
  function renderRadarMapa_() {
    var cont = document.getElementById('radar-mapa');
    if (!cont || cont.hidden || !window.L || !window.L.map) return;
    if (!radarMapa_) {
      radarMapa_ = L.map(cont, { scrollWheelZoom: false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(radarMapa_);
    }
    if (radarCapa_) radarCapa_.remove();
    radarCapa_ = L.layerGroup().addTo(radarMapa_);
    var radio = Number(document.getElementById('radar-radio').value) || 200, puntos = [];
    var o = radarResultados_ && radarOrigenKey_ && radarCoords_ ? radarCoords_[radarOrigenKey_] : null;
    if (o) {
      L.circle(o, { radius: radio * 1609.344, color: '#ff8a3d', weight: 1, fillOpacity: 0.05 }).addTo(radarCapa_);
      L.circleMarker(o, { radius: 8, color: '#ff8a3d', fillColor: '#ff8a3d', fillOpacity: 1 }).bindTooltip('Origen: ' + esc(radarOrigenTxt_)).addTo(radarCapa_);
      puntos.push(o);
    }
    var grupos = {};
    radarVisibles_().forEach(function (x) {
      var c = radarCoords_ && radarCoords_[x.key];
      if (!c) return;
      (grupos[x.key] = grupos[x.key] || { c: c, xs: [] }).xs.push(x);
    });
    Object.keys(grupos).forEach(function (k) {
      var g = grupos[k], x0 = g.xs[0], dentro = g.xs.some(function (x) { return radarDentro_(x, radio); });
      var color = dentro ? '#2fbf71' : '#8a94a8';
      L.circleMarker(g.c, { radius: 6 + Math.min(6, g.xs.length), color: color, fillColor: color, fillOpacity: 0.8 })
        .bindPopup('<b>' + esc(radarLugar_(x0.r.dest_city, x0.r.dest_state)) + '</b><br>' +
          g.xs.map(function (x) { return 'Load ' + esc(x.r.load) + ' · ' + esc(radarMillasTxt_(x)); }).join('<br>'))
        .addTo(radarCapa_);
      puntos.push(g.c);
    });
    var ajustar = function () {
      radarMapa_.invalidateSize();
      if (puntos.length) radarMapa_.fitBounds(L.latLngBounds(puntos).pad(0.15), { maxZoom: 9 });
      else radarMapa_.setView([32, -97], 4);
    };
    ajustar();
    setTimeout(ajustar, 200); // por si el contenedor apenas se acaba de mostrar
  }

  function renderRadar_() {
    renderRadarMapa_();
    var tabla = document.getElementById('radar-tabla'), resumen = document.getElementById('radar-resumen');
    var radio = Number(document.getElementById('radar-radio').value) || 200;
    try { localStorage.setItem('bajio_radar_radio', String(radio)); } catch (e) {}
    if (!radarResultados_) {
      resumen.innerHTML = '';
      var n = radarCargas_().length, ver = document.getElementById('radar-ver').value;
      if (!radarExcel_ && !n) {
        tabla.innerHTML = '<tbody><tr><td>' + guiaHtml_('Primeros pasos con el Radar', [
          ['Sube el Excel de VanGuard', 'El que trae destinos (ciudad y estado en I/J, entrega en L, Regresos en P). Se comparte con todo el equipo.'],
          ['Escribe dónde estás', 'Ciudad, Estado (por ejemplo "Laredo, TX") o pega las coordenadas de la unidad.'],
          ['Calcula', 'Verás las cargas en Broker más cercanas con millas por carretera, cuándo llega la unidad y si alcanza a llegar antes de la entrega.']
        ], '<button type="button" class="ws-btn primary" data-guia-accion="radar-subir">Subir Excel VanGuard</button>') + '</td></tr></tbody>';
        document.getElementById('radar-copiar').hidden = true;
        return;
      }
      tabla.innerHTML = '<tbody><tr><td class="radar-vacio">' + (n
        ? 'Escribe tu origen y da <b>Calcular</b>. Se miden las ' + n + ' cargas' + (ver === 'broker' ? ' con "Broker" en Regresos' : ver === 'otras' ? ' que no están en Broker' : '') + '.'
        : (radarExcel_ ? 'No hay cargas con este filtro en el Excel.' : 'Primero sube el Excel de VanGuard con <b>Subir Excel VanGuard</b>.')) + '</td></tr></tbody>';
      document.getElementById('radar-copiar').hidden = true;
      return;
    }
    var todos = radarResultados_;
    var dentro = todos.filter(function (x) { return radarDentro_(x, radio); }).length;
    var sinUbicar = todos.filter(function (x) { return x.dist === null; }).length;
    var faltanRuta = radarPendientesCarretera_().length;
    resumen.innerHTML = '<span class="r-in"><b>' + dentro + '</b>dentro de ' + radio + ' mi</span><span><b>' + (todos.length - dentro - sinUbicar) + '</b>fuera de rango</span>' +
      (sinUbicar ? '<span class="r-fail"><b>' + sinUbicar + '</b>no ubicadas</span>' : '') +
      (faltanRuta && !radarRutaOcupado_ ? '<button type="button" class="ws-btn" id="radar-pedir-ruta">Obtener millas por carretera (' + faltanRuta + ')</button>' : '');
    var filas = radarVisibles_();
    var conRegresos = document.getElementById('radar-ver').value !== 'broker';
    document.getElementById('radar-copiar').hidden = !dentro;
    if (!filas.length) { tabla.innerHTML = '<tbody><tr><td class="radar-vacio">Ninguna carga dentro de ' + radio + ' mi de ' + esc(radarOrigenTxt_) + ' con estos filtros.</td></tr></tbody>'; return; }
    tabla.innerHTML = '<thead><tr><th>Load</th><th>Cliente</th><th>Destino</th><th>Entrega cita</th>' + (conRegresos ? '<th>Regresos</th>' : '') + '<th>Estatus</th><th class="num">Millas</th><th class="num" title="Millas ÷ ' + VELOCIDAD_UNIDAD_MPH + '">🚛 Unidad llega en</th><th></th></tr></thead><tbody>' +
      filas.map(function (x) {
        var r = x.r, dentroR = radarDentro_(x, radio), ap = radarApartadoDe_(r.load);
        var millas = x.dist === null
          ? '<span class="sev-warn">no ubicada</span><br><input class="radar-alias" data-radar-alias="' + esc(x.key) + '" placeholder="Buscar como… (Ciudad, Edo)"><button type="button" class="link-btn" data-radar-buscar="' + esc(x.key) + '">Buscar</button>'
          : (x.carretera != null
            ? Math.round(x.carretera) + ' mi<br><small class="' + (x.fuente === 'google' ? 'sev-good' : 'hm-soft') + '" title="Por carretera. Línea recta: ' + Math.round(x.dist) + ' mi">' + etiquetaFuente_(x.fuente) + '</small>'
            : Math.round(x.dist) + ' mi<br><small class="hm-soft">línea recta</small>');
        var unidad = (x.carretera != null ? '<b>' + fmtHorasUnidad_(horasUnidad_(x.carretera)) + '</b>'
          : (x.dist !== null ? '<span class="hm-soft">~' + fmtHorasUnidad_(horasUnidad_(x.dist)) + '</span>' : '<span class="hm-soft">—</span>')) +
          (x.dist !== null ? radarATiempoHtml_(x) : '');
        return '<tr class="' + (dentroR ? 'dentro' : 'fuera') + '"><td><b>' + esc(r.load) + '</b></td><td>' + esc(shortCustomerName(r.customer || '')) +
          (radarCsrDe_(r.customer) ? '<br><small class="hm-soft">CSR ' + esc(radarCsrDe_(r.customer)) + '</small>' : '') + '</td>' +
          '<td>' + esc(radarLugar_(r.dest_city, r.dest_state)) + '</td><td>' + esc(r.delivery_appt ? fmtDateTime(r.delivery_appt) : '—') + '</td>' +
          (conRegresos ? '<td>' + esc(r.regresos || '—') + '</td>' : '') +
          '<td>' + esc(r.status || '—') + '</td><td class="num millas">' + millas + '</td><td class="num">' + unidad + '</td>' +
          '<td><div class="radar-acc">' + (recPorLoad_(r.load) ? '<button type="button" class="ws-btn" data-radar-abrir="' + esc(r.load) + '">Abrir</button>' : '') +
          (ap ? '<button type="button" class="ws-btn" data-radar-ver-apartado="' + esc(ap.id) + '" title="Ya lo tienes apartado">Apartado ✓</button>'
              : '<button type="button" class="ws-btn primary" data-radar-apartar="' + esc(r.load) + '">Apartar</button>') + '</div></td></tr>';
      }).join('') + '</tbody>';
  }

  function radarApartar_(load) {
    var x = (radarResultados_ || []).filter(function (y) { return String(y.r.load) === String(load); })[0];
    if (!x) return;
    var r = x.r;
    var abrir = function () {
      abrirApartado_(null);
      var poner = function (id, v) { document.getElementById(id).value = v || ''; };
      var d = pd(r.delivery_appt);
      poner('ap-load', r.load);
      poner('ap-csr', radarCsrDe_(r.customer));
      poner('ap-origen', radarLugar_(r.origin_city, r.origin_state));
      poner('ap-destino', radarLugar_(r.dest_city, r.dest_state));
      poner('ap-fecha-entrega', d && !isNaN(d.getTime()) ? toDatetimeLocalValue(d) : '');
      d = pd(r.cruce_usa_fecha);
      poner('ap-fecha-cruce', d && !isNaN(d.getTime()) ? toDatetimeLocalValue(d) : '');
      poner('ap-nota', x.dist !== null ? 'Del Radar: ' + radarMillasTxt_(x) + ' desde ' + radarOrigenTxt_ : 'Del Radar de millas');
    };
    if (!myRealIdentity || !myPassword) { ensureLoggedIn(abrir); return; }
    abrir();
  }

  function radarTextoWhatsApp_() {
    var grupos = {};
    radarCargasBroker_().forEach(function (r) {
      var k = radarFechaKey_(r.delivery_appt) || '9999-99-99';
      var etiqueta = k === '9999-99-99' ? 'Sin fecha' : k.slice(8, 10) + '/' + k.slice(5, 7);
      grupos[k] = grupos[k] || { etiqueta: etiqueta, lugares: {}, orden: [] };
      var lugar = radarLugar_(r.dest_city, r.dest_state);
      if (!grupos[k].lugares[lugar]) { grupos[k].lugares[lugar] = 0; grupos[k].orden.push(lugar); }
      grupos[k].lugares[lugar]++;
    });
    var lineas = ['*Disponibilidad de cargas USA*', 'les comparto la disponibilidad que aún tenemos team, por si les podemos apoyar con alguna carga.'];
    Object.keys(grupos).sort().forEach(function (k) {
      lineas.push('', '📅 *' + grupos[k].etiqueta + '*');
      grupos[k].orden.forEach(function (l) { lineas.push('• ' + l + ' — ' + grupos[k].lugares[l]); });
    });
    return lineas.join('\n');
  }

  function radarAlAbrir_() {
    if (Date.now() - radarExcelRevisadoEn_ >= 300000 && myRealIdentity && myPassword) {
      revisarRadarExcelEquipo_(function () { if (!document.getElementById('page-radar').hidden) radarAlAbrir_(); });
      return;
    }
    var o = document.getElementById('radar-origen');
    if (!o.value) { try { o.value = localStorage.getItem('bajio_radar_origen') || ''; } catch (e) {} }
    try { var rad = localStorage.getItem('bajio_radar_radio'); if (rad) document.getElementById('radar-radio').value = rad; } catch (e) {}
    renderRadarFuente_();
    var lugares = {};
    currentData.forEach(function (r) {
      if (r.dest_city) lugares[radarLugar_(r.dest_city, r.dest_state)] = true;
      if (r.origin_city) lugares[radarLugar_(r.origin_city, r.origin_state)] = true;
    });
    if (radarExcel_) radarExcel_.filas.forEach(function (f) { lugares[radarLugar_(f.ciudad, f.estado)] = true; });
    document.getElementById('radar-ciudades').innerHTML = Object.keys(lugares).sort().map(function (l) { return '<option value="' + esc(l) + '">'; }).join('');
    renderRadar_();

  // ===== Radar · Distancia exacta entre direcciones =====
  // Dirección → coordenadas con OpenStreetMap (Nominatim) y millas por carretera con OSRM; las dos
  // cosas se guardan (hojas "Direcciones" y "Distancias"), así que repetir una búsqueda — o que la
  // haga otro del equipo — sale de la base de datos sin consultar ningún servicio.
  var dirHistorial_ = [];
  function gsr_(fn) { // google.script.run como promesa: gsr_('nombre', arg1, …)
    var args = [].slice.call(arguments, 1);
    return new Promise(function (ok, ko) {
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ko);
      r[fn].apply(r, args);
    });
  }
  // ---- Coordenadas de la unidad (las que se copian de Samsara / Google Maps: "41.9237, -85.0186") ----
  // Se usan tal cual para la ruta (no hace falta adivinar la dirección). Se guarda el punto en
  // "Direcciones" (redondeado a ~10 m) con el lugar más cercano que diga OpenStreetMap, para que el
  // proceso de Google también pueda certificar esas millas.
  function parseCoords_(txt) {
    var m = String(txt || '').trim().match(/^\(?\s*(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*\)?$/);
    if (!m) return null;
    var lat = Number(m[1]), lon = Number(m[2]);
    return Math.abs(lat) <= 90 && Math.abs(lon) <= 180 ? [lat, lon] : null;
  }
  function coordsKey_(c) { return 'dir:' + c[0].toFixed(4) + ', ' + c[1].toFixed(4); }
  function coordsTxt_(c) { return c[0].toFixed(5) + ', ' + c[1].toFixed(5); }
  function nombreDeLlave_(k) { var p = String(k).split('|'); return radarLugar_(p[0], p[1] || ''); }

  /** ¿Qué lugar es este punto? (OpenStreetMap, gratis). Regresa "Coldwater, Michigan" o ''. */
  function radarReversa_(c) {
    var espera = Math.max(0, radarUltimaConsulta_ + 1100 - Date.now());
    return new Promise(function (ok) { setTimeout(ok, espera); }).then(function () {
      radarUltimaConsulta_ = Date.now();
      return fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=es&lat=' + c[0] + '&lon=' + c[1], { headers: { Accept: 'application/json' } });
    }).then(function (r) { return r.json(); }).then(function (d) {
      var a = (d && d.address) || {};
      var lugar = a.city || a.town || a.village || a.hamlet || a.municipality || a.county || '';
      return lugar ? lugar + (a.state ? ', ' + a.state : '') : String((d && d.display_name) || '');
    }).catch(function () { return ''; });
  }

  /** El lugar guardado en nuestra base (hoja Coordenadas + conocidas) más cercano a un punto. */
  function puntoCercano_(c) {
    var mejor = null;
    Object.keys(radarCoords_ || {}).forEach(function (k) {
      if (k.indexOf('|') === -1) return;
      var m = radarMillas_(c, radarCoords_[k]);
      if (!mejor || m < mejor.millas) mejor = { key: k, nombre: nombreDeLlave_(k), millas: m };
    });
    return mejor;
  }
  function cargarCoordsP_() { return new Promise(function (ok) { radarCargarCoords_(ok); }); }

  /** Guarda el punto de la unidad en "Direcciones" (en segundo plano). */
  function guardarPunto_(c, lugar) {
    gsr_('guardarDireccion', { key: coordsKey_(c), texto: coordsTxt_(c), direccion: lugar ? 'Cerca de ' + lugar : '', lat: c[0], lon: c[1] }, myRealIdentity, myPassword).catch(function () {});
  }

  function dirKey_(txt) { var c = parseCoords_(txt); return c ? coordsKey_(c) : 'dir:' + radarNorm_(txt).replace(/\s*,\s*/g, ', '); }
  function dirEstado_(txt, err) { var e = document.getElementById('dir-estado'); e.textContent = txt || ''; e.className = 'radar-estado' + (err ? ' err' : ''); }

  function dirBuscarOSM_(texto) {
    var espera = Math.max(0, radarUltimaConsulta_ + 1100 - Date.now());
    return new Promise(function (ok) { setTimeout(ok, espera); }).then(function () {
      radarUltimaConsulta_ = Date.now();
      return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=es&countrycodes=us,mx,ca&q=' + encodeURIComponent(texto), { headers: { Accept: 'application/json' } });
    }).then(function (r) {
      if (!r.ok) throw new Error('OpenStreetMap respondió ' + r.status);
      return r.json();
    }).then(function (d) {
      return d && d.length ? { lat: Number(d[0].lat), lon: Number(d[0].lon), direccion: String(d[0].display_name || '') } : null;
    });
  }

  /** Ubica una dirección: primero en la base ("Direcciones"), si no, en OpenStreetMap (y la guarda). */
  function dirUbicar_(texto, guardadas, etiqueta) {
    var key = dirKey_(texto), punto = parseCoords_(texto);
    if (guardadas[key]) return Promise.resolve(Object.assign({ key: key, deBase: true, esPunto: !!punto }, guardadas[key], punto ? { lat: punto[0], lon: punto[1] } : {}));
    if (punto) {
      // Coordenadas: se usan exactas; solo se pregunta qué lugar es (para mostrarlo) y se guarda.
      dirEstado_('Ubicando ' + etiqueta + ' (' + coordsTxt_(punto) + ')…');
      return radarReversa_(punto).then(function (lugar) {
        guardarPunto_(punto, lugar);
        return { key: key, texto: texto, lat: punto[0], lon: punto[1], direccion: (lugar ? 'Cerca de ' + lugar + ' · ' : '') + coordsTxt_(punto), deBase: false, esPunto: true };
      });
    }
    dirEstado_('Buscando ' + etiqueta + ' en OpenStreetMap…');
    return dirBuscarOSM_(texto).then(function (c) {
      if (!c) return null;
      gsr_('guardarDireccion', { key: key, texto: texto, direccion: c.direccion, lat: c.lat, lon: c.lon }, myRealIdentity, myPassword).catch(function () {});
      return Object.assign({ key: key, texto: texto, deBase: false }, c);
    });
  }

  function dirCalcular_() {
    var oTxt = document.getElementById('dir-origen').value.trim(), dTxt = document.getElementById('dir-destino').value.trim();
    if (!oTxt || !dTxt) { dirEstado_('Escribe origen y destino.', true); return; }
    if (!myRealIdentity || !myPassword) { ensureLoggedIn(dirCalcular_); return; }
    var btn = document.getElementById('dir-calcular'); btn.disabled = true;
    var res = document.getElementById('dir-resultado');
    var o, d;
    dirEstado_('Buscando en la base de datos…');
    gsr_('getDirecciones', [dirKey_(oTxt), dirKey_(dTxt)], myRealIdentity, myPassword).then(function (r) {
      var guardadas = (r && r.items) || {};
      return dirUbicar_(oTxt, guardadas, 'el origen').then(function (x) {
        if (!x) throw new Error('No encontré el origen "' + oTxt + '". Prueba con menos detalle (calle y ciudad, o solo Ciudad, Estado).');
        o = x;
        return dirUbicar_(dTxt, guardadas, 'el destino');
      });
    }).then(function (x) {
      if (!x) throw new Error('No encontré el destino "' + dTxt + '". Prueba con menos detalle (calle y ciudad, o solo Ciudad, Estado).');
      d = x;
      return gsr_('getDistancias', o.key, myRealIdentity, myPassword);
    }).then(function (r) {
      var recta = radarMillas_([o.lat, o.lon], [d.lat, d.lon]);
      var guardada = r && r.items && r.items[d.key];
      if (guardada) return { millas: guardada.millas, horas: guardada.horas, fuente: guardada.fuente || 'osm', key: guardada.key, recta: recta, deBase: true };
      dirEstado_('Calculando millas por carretera…');
      return radarPedirRuta_([o.lat, o.lon], [d.lat, d.lon]).catch(function () { return null; }).then(function (ruta) {
        if (!ruta) return dirEstimar_(o, d, recta);
        gsr_('guardarDistancias', [{ origen: o.key, destino: d.key, millas: ruta.millas, horas: ruta.horas, recta: recta }], myRealIdentity, myPassword)
          .then(dirCargarHistorial_).catch(function () {});
        return { millas: ruta.millas, horas: ruta.horas, fuente: 'osm', key: o.key + '>' + d.key, recta: recta, deBase: false };
      });
    }).then(function (m) {
      // Si el origen son coordenadas de la unidad: el lugar de nuestra base más cercano.
      return (o.esPunto ? cargarCoordsP_().then(function () { return puntoCercano_([o.lat, o.lon]); }) : Promise.resolve(null)).then(function (cercano) {
        btn.disabled = false;
        dirUltima_ = { m: m, o: o, d: d, oTxt: oTxt, dTxt: dTxt, cercano: cercano };
        dirEstado_('');
        renderDirResultado_();
      });
    }).catch(function (err) {
      btn.disabled = false;
      res.hidden = true;
      dirEstado_(err && err.message ? err.message : 'No se pudo calcular', true);
    });
  }

  /** Sin ruta por carretera (servicio caído o punto fuera de camino): estimado con el lugar de
   * nuestra base más cercano al origen. Si ya tenemos guardada la distancia de ese lugar al destino,
   * se usa esa + el tramo de la unidad a ese lugar; si no, línea recta × 1.2 (factor típico de
   * carretera). No se guarda en la base porque es aproximado. */
  function dirEstimar_(o, d, recta) {
    return cargarCoordsP_().then(function () {
      var c = puntoCercano_([o.lat, o.lon]);
      if (!c || c.millas > 40) return null;
      return gsr_('getDistancias', c.key, myRealIdentity, myPassword).then(function (r) {
        var g = r && r.items && r.items[d.key];
        return g ? { millas: g.millas + c.millas * 1.2, horas: 0, fuente: 'estimado', recta: recta, deBase: false, via: c } : null;
      }).catch(function () { return null; });
    }).then(function (est) {
      return est || { millas: recta * 1.2, horas: 0, fuente: 'estimado', recta: recta, deBase: false };
    });
  }

  var dirUltima_ = null; // último resultado mostrado (para recalcular / cambiar hora de salida)
  function renderDirResultado_() {
    var res = document.getElementById('dir-resultado'), u = dirUltima_;
    if (!u) { res.hidden = true; return; }
    var m = u.m, o = u.o, d = u.d, todoBase = m.deBase && o.deBase && d.deBase;
    var salidaTxt = document.getElementById('dir-salida').value;
    var salida = salidaTxt ? new Date(salidaTxt) : new Date();
    if (isNaN(salida.getTime())) salida = new Date();
    var hU = horasUnidad_(m.millas), llega = new Date(salida.getTime() + hU * 3600000);
    var llegaTxt = llega.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' + ('0' + llega.getHours()).slice(-2) + ':' + ('0' + llega.getMinutes()).slice(-2);
    res.hidden = false;
    res.innerHTML = '<div class="dir-millas">' + Math.round(m.millas) + ' mi<small>por carretera · ' + etiquetaFuente_(m.fuente) +
        (m.horas ? ' · ~' + fmtHorasUnidad_(m.horas) + ' de manejo continuo' : '') + ' · línea recta ' + Math.round(m.recta) + ' mi</small></div>' +
      '<div class="dir-unidad">🚛 Nuestra unidad llega en <b>~' + fmtHorasUnidad_(hU) + '</b>' +
        ' <small>(' + Math.round(m.millas) + ' mi ÷ ' + VELOCIDAD_UNIDAD_MPH + ')</small> · saliendo ' + (salidaTxt ? 'el ' + esc(fmtDateTime(salida)) : 'ahora') + ', llega el <b>' + esc(llegaTxt) + '</b></div>' +
      '<div class="dir-lugar"><b>' + (o.esPunto ? '📍 Unidad:' : 'Origen:') + '</b> ' + esc(o.direccion || o.texto) + '</div>' +
      (u.cercano ? '<div class="dir-lugar"><b>Punto más cercano en nuestra base:</b> ' + esc(u.cercano.nombre) + ' (a ' + (Math.round(u.cercano.millas * 10) / 10) + ' mi en línea recta)</div>' : '') +
      '<div class="dir-lugar"><b>Destino:</b> ' + esc(d.direccion || d.texto) + '</div>' +
      (m.fuente === 'estimado'
        ? '<span class="dir-fuente pendiente" title="El servicio de rutas no respondió">⚠ Estimado: ' + (m.via ? 'tramo hasta ' + esc(m.via.nombre) + ' + distancia guardada de ahí al destino' : 'línea recta × 1.2') + ' — no se guarda; vuelve a calcular más tarde</span> '
        : '<span class="dir-fuente ' + (todoBase ? 'base' : 'nueva') + '">' + (todoBase ? 'De la base de datos (sin consultar servicios)' : 'Búsqueda nueva — guardada en la base de datos') + '</span> ' +
          (m.fuente !== 'google' ? '<span class="dir-fuente pendiente" title="El proceso automático la completa con Google Maps y desde entonces queda fija">Millas de Google: pendientes</span> ' : '<span class="dir-fuente base">✓ Millas de Google (fijas)</span> ')) +
      '<a class="link-btn" target="_blank" rel="noopener" href="https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=' + o.lat + '%2C' + o.lon + '%3B' + d.lat + '%2C' + d.lon + '">Ver ruta en el mapa</a> ' +
      '<button type="button" class="link-btn" id="dir-copiar">Copiar</button>' +
      (myRole() === 'Supervisor' && m.key && m.fuente !== 'estimado' ? ' <button type="button" class="link-btn" id="dir-recalcular" title="Vuelve a pedir las millas a Google Maps (por si cambió la ruta)">Recalcular con Google</button>' : '');
    res.setAttribute('data-copiar', u.oTxt + ' → ' + u.dTxt + ': ' + Math.round(m.millas) + ' mi por carretera — nuestra unidad llega en ~' + fmtHorasUnidad_(hU) + ' (llega el ' + llegaTxt + ')');
  }

  function dirCargarHistorial_() {
    if (!myRealIdentity) return;
    gsr_('getBusquedasDirecciones', myRealIdentity, myPassword).then(function (r) {
      dirHistorial_ = (r && r.items) || [];
      renderDirHistorial_();
    }).catch(function () {});
  }
  function renderDirHistorial_() {
    var q = radarNorm_(document.getElementById('dir-filtro').value);
    var lista = dirHistorial_.filter(function (x) { return !q || radarNorm_(x.origenTxt + ' ' + x.destinoTxt).indexOf(q) !== -1; });
    document.getElementById('dir-historial').innerHTML = lista.length
      ? '<thead><tr><th>Origen</th><th>Destino</th><th class="num">Millas</th><th class="num">🚛 Unidad llega en</th><th>Quién</th><th>Cuándo</th></tr></thead><tbody>' +
        lista.map(function (x) {
          return '<tr data-dir-hist="' + dirHistorial_.indexOf(x) + '"><td>' + esc(x.origenTxt) + '</td><td>' + esc(x.destinoTxt) + '</td><td class="num"><b>' + Math.round(x.millas) + '</b>' +
            '<br><small class="' + (x.fuente === 'google' ? 'sev-good' : 'hm-soft') + '">' + etiquetaFuente_(x.fuente) + '</small></td>' +
            '<td class="num">' + fmtHorasUnidad_(horasUnidad_(x.millas)) + '</td><td>' + esc(x.por) + '</td><td>' + esc(x.en ? relativeTimeLabel(x.en) : '') + '</td></tr>';
        }).join('') + '</tbody>'
      : '<tbody><tr><td class="radar-vacio">' + (dirHistorial_.length ? 'Nada con ese filtro.' : 'Todavía no hay búsquedas guardadas.') + '</td></tr></tbody>';
  }

  function radarTab_(tab) {
    document.querySelectorAll('.radar-tab-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-radar-tab') === tab); });
    document.getElementById('radar-exacta').hidden = tab !== 'exacta';
    document.getElementById('radar-cargas').hidden = tab !== 'cargas';
    if (tab === 'exacta') dirCargarHistorial_();
  }
  document.querySelectorAll('.radar-tab-btn').forEach(function (b) { b.addEventListener('click', function () { radarTab_(b.getAttribute('data-radar-tab')); }); });
  document.getElementById('dir-calcular').addEventListener('click', dirCalcular_);
  ['dir-origen', 'dir-destino'].forEach(function (id) { document.getElementById(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') dirCalcular_(); }); });
  document.getElementById('dir-invertir').addEventListener('click', function () {
    var a = document.getElementById('dir-origen'), b = document.getElementById('dir-destino'), t = a.value;
    a.value = b.value; b.value = t;
  });
  document.getElementById('dir-filtro').addEventListener('input', renderDirHistorial_);
  document.getElementById('dir-historial').addEventListener('click', function (e) {
    var tr = e.target.closest('[data-dir-hist]');
    if (!tr) return;
    var x = dirHistorial_[Number(tr.getAttribute('data-dir-hist'))];
    if (!x) return;
    document.getElementById('dir-origen').value = x.origenTxt;
    document.getElementById('dir-destino').value = x.destinoTxt;
    dirCalcular_();
  });
  document.getElementById('dir-resultado').addEventListener('click', function (e) {
    if (e.target.closest('#dir-copiar')) { copyTextGeneric(this.getAttribute('data-copiar'), 'Copiado'); return; }
    var b = e.target.closest('#dir-recalcular');
    if (!b || !dirUltima_) return;
    b.disabled = true; b.textContent = 'Consultando Google…';
    gsr_('recalcularMillasGoogle', dirUltima_.m.key, myRealIdentity, myPassword).then(function (r) {
      if (!r || r.ok === false) throw new Error((r && r.error) || 'No se pudo recalcular');
      dirUltima_.m.millas = r.dato.millas; dirUltima_.m.horas = r.dato.horas; dirUltima_.m.fuente = 'google';
      renderDirResultado_(); dirCargarHistorial_();
      showToast('Millas de Google guardadas: ' + Math.round(r.dato.millas) + ' mi', 'good');

    var sinVer = avisosEstado_ ? avisosEstado_.lista.filter(function (a) { return a.nuevo; }).length : 0;

  function renderDeshacerImport_(info) {
    var box = document.getElementById('deshacer-import-box');
    var desde = info && info.deshacerDisponibleDesde;
    if (!desde) { box.innerHTML = 'No hay una importación reciente que se pueda deshacer.'; return; }
    box.innerHTML = 'Última importación: <b>' + esc(fmtDateTime(desde)) + '</b> (' + esc(relativeTimeLabel(desde)) + '). ' +
      '<button type="button" class="ws-btn" id="deshacer-import-btn" style="margin-left:.4rem">Deshacer esa importación</button>';
    document.getElementById('deshacer-import-btn').addEventListener('click', function () {
      confirmarModal_('Deshacer la última importación',
        '<p>Loads regresará a como estaba antes de la importación del <b>' + esc(fmtDateTime(desde)) + '</b>.</p>' +
        '<p class="aviso-fuerte">Ojo: cualquier cambio que el equipo haya hecho en las cargas después de esa hora (estatus, citas, truck, POD…) también se va a perder.</p>' +
        '<p>Los comentarios, comunicaciones e incidencias no se tocan.</p>',
        'Sí, deshacer', function () {
          guardarConVerificacion_(function (res) {
            showToast('Importación deshecha: ' + res.restauradas + ' cargas restauradas', 'good');
            lastImportAt = '';
            renderOperationMeta();
            lastLoadsFetchTs = 0;
            loadData();
            cargarAdminExtras_();
          }, function (err) { showToast('No se pudo deshacer: ' + err.message, 'error'); })
            .deshacerUltimaImportacion(adminCred_());
        });
    });
  }

  // ===== Centro de avisos =====
  // Para que a ningún CSR se le olvide nada. Dos tipos de aviso, siempre dentro del alcance de
  // quien inició sesión (mismas cargas que su Action Center):
  //  - EVENTOS (algo nuevo): carga que entra a "Atender ahora", cliente que queda pendiente de
  //    avisar, pendiente de turno que te asignan. No avisa lo que tú mismo provocaste, y la primera
  //    vez que alguien abre el panel con esta versión, lo que ya existía se toma como "visto".
  //  - RECORDATORIOS (se vence algo): próxima revisión, recordatorio de estatus, cliente sin
  //    avisar +1h, entrega en <2h sin llegar a planta, pendiente de turno en su fecha. Se revisan
  //    cada minuto aunque no cambie ningún dato.
  // Lo que ya se avisó se recuerda por usuario en este navegador (localStorage), así que recargar
  // la página no repite avisos. Un aviso sale de la lista solo cuando su motivo se resuelve.
  // No se usan título/ícono de la pestaña: Apps Script sirve el panel dentro de un iframe de otro
  // dominio y desde ahí no se pueden cambiar. Los avisos de escritorio (casilla "Escritorio") se
  // intentan con la API de notificaciones; si el navegador no los permite dentro de ese iframe,
  // la casilla se apaga sola y lo explica (el sonido sí funciona con la pestaña en segundo plano).
  var AVISO_EVENTO_ = { now: true, com: true, bit: true, sincsr: true };
  var AVISO_POSPONER_MS_ = 3600000; // "Posponer 1 h"
  var AVISOS_MAX_ = 80;
  var avisosEstado_ = null;
  var bitacoraCargada_ = false;
  var avisosTimer_ = null;
  var avisosSonido_ = false;
  try { avisosSonido_ = localStorage.getItem('bajio_avisos_sonido') === '1'; } catch (e) {}

  function avisosKey_() { return 'bajio_avisos_' + myRealIdentity; }
  function cargarAvisos_() {
    try {
      var s = JSON.parse(localStorage.getItem(avisosKey_()) || 'null');
      if (s && s.lista && s.activos && s.base) { s.pospuestos = s.pospuestos || {}; return s; }
    } catch (e) {}
    return { base: {}, activos: {}, lista: [], pospuestos: {} };
  }
  function guardarAvisos_() {
    try { localStorage.setItem(avisosKey_(), JSON.stringify({ base: avisosEstado_.base, activos: avisosEstado_.activos, lista: avisosEstado_.lista, pospuestos: avisosEstado_.pospuestos })); } catch (e) {}
  }

  function avisoLoad_(rec) { return 'Load ' + rec.load + (rec.customer ? ' · ' + rec.customer : ''); }

  /** Todo lo que hoy amerita un aviso, con un id estable (mismo motivo = mismo id). */
  function candidatosAvisos_() {
    var out = [], ahora = Date.now(), yo = myRealIdentity;
    var activas = computeActiveJourney(currentData).active;
    homeBuckets_(currentData).now.forEach(function (rec) {
      if (rec.updated_by === yo) return;
      var rs = journeyReasons(rec);
      // Si lo que la manda a "Atender ahora" es el cliente pendiente de avisar, ya lo cubre el
      // aviso de comunicación de abajo — no se duplica.
      if (rs.length && rs[0].kind === 'notify' && rec.client_notify_pending) return;
      out.push({ id: 'now:' + rec.load, tipo: 'now', sev: 'critical', load: rec.load, tab: 'operacion',
        titulo: 'Atender ahora · ' + avisoLoad_(rec), detalle: rs.length ? rs[0].text : 'Requiere acción inmediata' });
    });
    activas.forEach(function (rec) {
      var motivo = String(rec.client_notify_reason || 'Actualización operativa');
      if (rec.client_notify_pending && rec.updated_by !== yo) {
        out.push({ id: 'com:' + rec.load + ':' + motivo, tipo: 'com', sev: 'warn', load: rec.load, tab: 'comunicacion',
          titulo: 'Cliente pendiente de avisar · ' + avisoLoad_(rec), detalle: motivo });
      }
      if (rec.client_notify_pending && hoursSince(rec.client_notify_since || rec.updated_at) >= 1) {
        out.push({ id: 'com60:' + rec.load + ':' + motivo, tipo: 'com60', sev: 'critical', load: rec.load, tab: 'comunicacion',
          titulo: 'Cliente sin avisar hace más de 1 h · ' + avisoLoad_(rec), detalle: motivo });
      }
      var rev = pd(rec.next_review_at);
      if (rev && !isNaN(rev.getTime()) && rev.getTime() <= ahora) {
        out.push({ id: 'rev:' + rec.load + ':' + rec.next_review_at, tipo: 'rev', sev: 'warn', load: rec.load, tab: 'operacion',
          titulo: 'Hora de revisar · ' + avisoLoad_(rec), detalle: rec.next_review_note || 'Próxima revisión programada' });
      }
      if (isRecordatorioVencido(rec)) {
        out.push({ id: 'rec:' + rec.load + ':' + (rec.recordatorio_fecha || 'sin-fecha') + ':' + rec.status, tipo: 'rec', sev: 'warn', load: rec.load, tab: 'operacion',
          transito: AUTO_REVIEW_STATUSES.indexOf(rec.status) !== -1,
          titulo: (AUTO_REVIEW_STATUSES.indexOf(rec.status) !== -1 ? 'Revisión de tránsito pendiente · ' : 'Recordatorio vencido · ') + avisoLoad_(rec), detalle: (rec.status || '') + (rec.recordatorio_fecha ? ' · ' + fmtDateTime(rec.recordatorio_fecha) : ' · sin fecha programada') });
      }
      var ent = pd(rec.delivery_appt);
      if (ent && !isNaN(ent.getTime()) && ent.getTime() > ahora && ent.getTime() - ahora <= 2 * 3600000 && Number(rec.stageIndex) < 7) {
        out.push({ id: 'ent:' + rec.load + ':' + rec.delivery_appt, tipo: 'ent', sev: 'critical', load: rec.load, tab: 'operacion',
          titulo: 'Entrega en menos de 2 h · ' + avisoLoad_(rec), detalle: 'Cita ' + fmtDateTime(ent) + ' y todavía no llega a planta' });
      }
    });
    var finDeHoy = new Date(); finDeHoy.setHours(23, 59, 59, 999);
    (bitacora || []).forEach(function (b) {
      if (b.resuelto) return;
      var nota = String(b.nota || '').slice(0, 120);
      if (bitacoraCargada_ && b.creado_por && b.creado_por !== yo) {
        out.push({ id: 'bit:' + b.id, tipo: 'bit', sev: 'info', destino: 'bitacora',
          titulo: 'Nuevo pendiente de turno de ' + b.creado_por, detalle: nota });
      }
      var seg = pd(b.fecha_seguimiento);
      if (seg && !isNaN(seg.getTime()) && seg.getTime() <= finDeHoy.getTime()) {
        out.push({ id: 'bitseg:' + b.id + ':' + b.fecha_seguimiento, tipo: 'bitseg', sev: 'warn', destino: 'bitacora',
          titulo: 'Pendiente de turno para hoy', detalle: nota });
      }
    });
    apartados.forEach(function (ap) {
      if (apartadoCerrado_(ap)) return;
      var base = { destino: 'apartados', apartado: ap.id, estado: ap.estado, frecuencia: ap.frecuencia_horas };
      var detalle = [ap.csr_dueno ? 'CSR ' + ap.csr_dueno : '', ap.destino, ap.mi_carga ? 'Mi carga: ' + ap.mi_carga : ''].filter(Boolean).join(' · ');
      if (apartadoVencido_(ap)) {
        out.push(Object.assign({ id: 'apr:' + ap.id + ':' + ap.proxima_revision, tipo: 'apr', sev: ap.estado === 'broker' ? 'critical' : 'warn',
          titulo: 'Load apartado ' + ap.load + ' · ' + (APARTADO_PREGUNTA_[ap.estado] || 'Revisar'), detalle: detalle }, base));
      }
      if (apartadoMiCargaEnRiesgo_(ap)) {
        out.push(Object.assign({ id: 'apmia:' + ap.id + ':' + ap.fecha_mi_carga + ':' + ap.estado, tipo: 'apmia', sev: 'critical',
          titulo: 'Tu carga es pronto y el apartado ' + ap.load + ' no ha entregado',
          detalle: 'Mi carga: ' + fmtDateTime(ap.fecha_mi_carga) + (ap.mi_carga ? ' · ' + ap.mi_carga : '') + ' — ¿lo cambias a broker?' }, base));
      }
    });
    if (puedeVerTodo_()) {
      clientesSinCsr_().forEach(function (x) {
        out.push({ id: 'sincsr:' + x.cliente.toLowerCase(), tipo: 'sincsr', sev: 'warn', destino: 'gestionar',
          titulo: 'Cliente sin CSR asignado · ' + x.cliente, detalle: x.cargas + (x.cargas === 1 ? ' carga activa que nadie ve en su panel' : ' cargas activas que nadie ve en su panel') });
      });
    }
    return out;
  }

  function programarAvisos_() {
    if (avisosTimer_) clearTimeout(avisosTimer_);
    avisosTimer_ = setTimeout(detectarAvisos_, 400);
  }

  function detectarAvisos_() {
    avisosTimer_ = null;
    if (!myRealIdentity || !lastLoadsFetchTs) return; // sin sesión o sin cargas todavía
    if (!avisosEstado_ || avisosEstado_.usuario !== myRealIdentity) {
      avisosEstado_ = cargarAvisos_();
      avisosEstado_.usuario = myRealIdentity;
    }
    var est = avisosEstado_, vigentes = {}, nuevos = [], ahoraMs = Date.now();
    est.pospuestos = est.pospuestos || {};
    candidatosAvisos_().forEach(function (c) {
      if (vigentes[c.id]) return;
      vigentes[c.id] = c;
      var hasta = est.pospuestos[c.id];
      if (hasta) {
        if (hasta > ahoraMs) return; // sigue pospuesto: ni en la lista ni como nuevo
        delete est.pospuestos[c.id]; // se cumplió la hora: se vuelve a avisar
        delete est.activos[c.id];
      }
      if (est.activos[c.id]) return; // ya se avisó antes
      if (AVISO_EVENTO_[c.tipo] && !est.base[c.tipo]) return; // primera vez: lo existente cuenta como visto
      nuevos.push(c);
    });
    est.base.now = true; est.base.com = true;
    if (bitacoraCargada_) est.base.bit = true;
    if (puedeVerTodo_()) est.base.sincsr = true;
    est.activos = {};
    Object.keys(vigentes).forEach(function (id) { est.activos[id] = true; });
    Object.keys(est.pospuestos).forEach(function (id) { if (!vigentes[id]) delete est.pospuestos[id]; });
    var ts = new Date().toISOString();
    // Los avisos que siguen vigentes se refrescan con los datos actuales (texto, acciones), conservando
    // cuándo llegaron y si ya se vieron.
    est.lista = est.lista.filter(function (a) { return vigentes[a.id] && !(est.pospuestos[a.id] > ahoraMs); })
      .map(function (a) { var c = vigentes[a.id]; c.ts = a.ts; c.nuevo = a.nuevo; return c; });
    nuevos.forEach(function (c) { c.ts = ts; c.nuevo = true; est.lista.unshift(c); });
    if (est.lista.length > AVISOS_MAX_) est.lista.length = AVISOS_MAX_;
    guardarAvisos_();
    renderAvisos_();
    badgeApartados_(); // el conteo de "toca revisar" cambia con la hora, no solo con los datos
    if (nuevos.length) anunciarAvisos_(nuevos);
    mostrarInicioTurno_();
  }

  /** Botones de acción directa para cada aviso (ver avisos-lista): resolver sin abrir la carga. */
  function accionesAviso_(a) {
    var acc = [];
    if (a.tipo === 'com' || a.tipo === 'com60') acc.push(['avisado', 'Ya avisé al cliente']);
    if (a.tipo === 'rev') acc.push(['revisado', 'Ya revisé']);
    if (a.tipo === 'rec' && a.transito) acc.push(['transito', 'Ya revisé (+' + AUTO_REVIEW_HOURS + ' h)']);
    if (a.tipo === 'apr') {
      (APARTADO_AVANCES_[a.estado] || []).forEach(function (x) { acc.push(['ap:' + x[0], x[1]]); });
      acc.push(['ap:revisar', 'Ya revisé (+' + a.frecuencia + ' h)']);
    }
    if (a.tipo === 'apmia') acc.push(['ap:broker', 'Cambiar a broker']);
    if (!AVISO_EVENTO_[a.tipo]) acc.push(['posponer', 'Posponer 1 h']);
    return acc.map(function (x) { return '<button type="button" class="ws-btn" data-aviso-accion="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join('');
  }

  function quitarAviso_(id, posponer) {
    if (!avisosEstado_) return;
    if (posponer) avisosEstado_.pospuestos[id] = Date.now() + AVISO_POSPONER_MS_;
    avisosEstado_.lista = avisosEstado_.lista.filter(function (x) { return x.id !== id; });
    guardarAvisos_();
    renderAvisos_();
  }

  function ejecutarAccionAviso_(a, accion, boton) {
    if (accion === 'posponer') { quitarAviso_(a.id, true); showToast('Pospuesto 1 hora', 'good'); return; }
    if (accion.indexOf('ap:') === 0) { accionApartado_(a.apartado, accion.slice(3), boton, function () { quitarAviso_(a.id); }); return; }
    var rec = recPorLoad_(a.load);
    if (!rec) return;
    boton.disabled = true;
    var fallo = function (err) { boton.disabled = false; showToast('No se pudo guardar: ' + err.message, 'error'); };
    if (accion === 'avisado') {
      guardarConVerificacion_(function (res) {
        rec.client_notify_pending = false; rec.client_notify_reason = ''; rec.client_notify_since = '';
        rec.client_notified_at = new Date().toISOString(); rec.client_notified_by = myRealIdentity;
        if (res && res.recordatorio_fecha) rec.recordatorio_fecha = res.recordatorio_fecha;
        quitarAviso_(a.id); render(currentData);
        showToast('Cliente marcado como avisado — Load ' + rec.load, 'good');
      }, fallo).markClientNotified(rec.load, myRealIdentity, myPassword);
    } else if (accion === 'revisado') {
      guardarConVerificacion_(function () {
        rec.next_review_at = ''; rec.next_review_note = ''; rec.next_review_by = '';
        quitarAviso_(a.id); render(currentData);
        showToast('Revisión registrada — Load ' + rec.load, 'good');
      }, fallo).clearNextReview(rec.load, myRealIdentity, myPassword);
    } else if (accion === 'transito') {
      var fechaISO = new Date(Date.now() + AUTO_REVIEW_HOURS * 3600000).toISOString();
      guardarConVerificacion_(function () {
        rec.recordatorio_fecha = fechaISO;
        quitarAviso_(a.id); render(currentData);
        showToast('Revisión registrada — próxima en ' + AUTO_REVIEW_HOURS + ' h — Load ' + rec.load, 'good');
      }, fallo).saveRecordatorio(rec.load, fechaISO, myRealIdentity, myPassword);
    }
  }

  function anunciarAvisos_(nuevos) {
    var container = document.getElementById('toast-container');
    var mostrar = nuevos.length <= 3 ? nuevos : [{ titulo: 'Tienes ' + nuevos.length + ' avisos nuevos', detalle: 'Da clic para verlos' }];
    mostrar.forEach(function (c) {
      if (!container) return;
      var el = document.createElement('div');
      el.className = 'toast toast-aviso';
      var b = document.createElement('b'); b.textContent = '🔔 ' + c.titulo;
      var s = document.createElement('div'); s.textContent = c.detalle || '';
      el.appendChild(b); el.appendChild(s);
      el.addEventListener('click', function () { el.remove(); abrirAvisos_(true); });
      container.appendChild(el);
      requestAnimationFrame(function () { el.classList.add('show'); });
      setTimeout(function () { el.classList.remove('show'); setTimeout(function () { el.remove(); }, 250); }, 8000);
    });
    sonarAviso_();
    notificarEscritorio_(nuevos);
  }

  // ---- Avisos de escritorio (Windows) para lo urgente, solo con la pestaña en segundo plano ----
  var avisosEscritorio_ = false;
  try { avisosEscritorio_ = localStorage.getItem('bajio_avisos_escritorio') === '1'; } catch (e) {}
  function escritorioDisponible_() {
    return typeof Notification !== 'undefined' && Notification.permission === 'granted';
  }
  function notificarEscritorio_(nuevos) {
    if (!avisosEscritorio_ || !document.hidden || !escritorioDisponible_()) return;
    var urgentes = nuevos.filter(function (c) { return c.sev === 'critical'; });
    if (!urgentes.length) return;
    try {
      var c = urgentes[0];
      var n = new Notification(urgentes.length > 1 ? urgentes.length + ' avisos urgentes en el panel' : c.titulo, {
        body: urgentes.length > 1 ? urgentes.map(function (x) { return '• ' + x.titulo; }).slice(0, 4).join('\n') : (c.detalle || ''),
        tag: 'panel-bajio-avisos'
      });
      n.onclick = function () { try { window.focus(); } catch (e) {} abrirAvisos_(true); n.close(); };
    } catch (e) {}
  }
  function desactivarEscritorio_(motivo) {
    avisosEscritorio_ = false;
    document.getElementById('avisos-escritorio').checked = false;
    try { localStorage.setItem('bajio_avisos_escritorio', '0'); } catch (e) {}
    if (motivo) showToast(motivo, 'error');
  }
  document.getElementById('avisos-escritorio').checked = avisosEscritorio_;
  document.getElementById('avisos-escritorio').addEventListener('change', function (e) {
    if (!e.target.checked) { desactivarEscritorio_(''); return; }
    var NO_SE_PUEDE = 'Tu navegador no deja mostrar avisos de escritorio desde el panel (Apps Script lo abre dentro de otra página). Activa "Sonido": suena aunque estés en otra pestaña.';
    if (typeof Notification === 'undefined') { desactivarEscritorio_(NO_SE_PUEDE); return; }
    var respondio = false;
    var listo = function (permiso) {
      if (respondio) return; // navegadores viejos llaman el callback Y resuelven la promesa
      respondio = true;
      if (permiso !== 'granted') { desactivarEscritorio_(permiso === 'denied' ? 'Los avisos de escritorio están bloqueados para este sitio en tu navegador.' : NO_SE_PUEDE); return; }
      avisosEscritorio_ = true;
      try { localStorage.setItem('bajio_avisos_escritorio', '1'); } catch (err) {}
      showToast('Listo: lo urgente te llegará como aviso de Windows cuando estés en otra pestaña', 'good');
    };
    try {
      var p = Notification.requestPermission(listo);
      if (p && p.then) p.then(listo, function () { desactivarEscritorio_(NO_SE_PUEDE); });
    } catch (err) { desactivarEscritorio_(NO_SE_PUEDE); }
  });

  function sonarAviso_() {
    if (!avisosSonido_) return;
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      var ctx = sonarAviso_.ctx || (sonarAviso_.ctx = new C());
      var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.4);
    } catch (e) {}
  }

  var AVISO_ORDEN_SEV_ = { critical: 0, warn: 1, info: 2 };
  function renderAvisos_() {
    var btn = document.getElementById('avisos-btn'), badge = document.getElementById('avisos-badge'), lista = document.getElementById('avisos-lista');
    if (!btn) return;
    btn.hidden = !myRealIdentity;
    var items = (avisosEstado_ && myRealIdentity) ? avisosEstado_.lista.slice() : [];
    var sinVer = items.filter(function (a) { return a.nuevo; }).length;
    badge.hidden = !sinVer;
    badge.textContent = sinVer > 99 ? '99+' : String(sinVer);
    var movilBadge = document.getElementById('movil-badge');
    if (movilBadge) { movilBadge.hidden = !sinVer; movilBadge.textContent = badge.textContent; }
    btn.classList.toggle('tiene-nuevos', sinVer > 0);
    btn.title = sinVer ? sinVer + ' avisos sin ver' : 'Avisos y recordatorios';
    if (!lista) return;
    items.sort(function (a, b) {
      if (!!a.nuevo !== !!b.nuevo) return a.nuevo ? -1 : 1;
      var s = (AVISO_ORDEN_SEV_[a.sev] || 3) - (AVISO_ORDEN_SEV_[b.sev] || 3);
      return s || String(b.ts).localeCompare(String(a.ts));
    });
    lista.innerHTML = items.length ? items.map(function (a) {
      var acc = accionesAviso_(a);
      return '<div class="aviso-item t-' + esc(a.sev) + (a.nuevo ? ' nuevo' : '') + '" data-aviso-id="' + esc(a.id) + '" role="button" tabindex="0">' +
        '<span class="aviso-dot"></span><span class="aviso-texto"><b>' + esc(a.titulo) + '</b>' + esc(a.detalle || '') +
        '<br><small>' + esc(relativeTimeLabel(a.ts)) + '</small>' + (acc ? '<span class="aviso-acciones">' + acc + '</span>' : '') + '</span></div>';
    }).join('') : '<div class="avisos-vacio">✓ No tienes avisos pendientes.</div>';
  }

  function abrirAvisos_(abrir) {
    var panel = document.getElementById('avisos-panel'), btn = document.getElementById('avisos-btn');
    if (!panel) return;
    panel.hidden = !abrir;
    if (btn) btn.setAttribute('aria-expanded', String(!!abrir));
    if (abrir) renderAvisos_();
  }

  function marcarAvisosVistos_(id) {
    if (!avisosEstado_) return;
    avisosEstado_.lista.forEach(function (a) { if (!id || a.id === id) a.nuevo = false; });
    guardarAvisos_();
    renderAvisos_();
  }

  document.getElementById('avisos-btn').addEventListener('click', function (e) {
    e.stopPropagation();
    abrirAvisos_(document.getElementById('avisos-panel').hidden);
  });
  document.getElementById('avisos-leer-todo').addEventListener('click', function () { marcarAvisosVistos_(); });
  document.getElementById('avisos-sonido').checked = avisosSonido_;
  document.getElementById('avisos-sonido').addEventListener('change', function (e) {
    avisosSonido_ = e.target.checked;
    try { localStorage.setItem('bajio_avisos_sonido', avisosSonido_ ? '1' : '0'); } catch (err) {}
    if (avisosSonido_) sonarAviso_(); // prueba del tono (y desbloquea el audio con este clic)
  });
  function abrirDesdeAviso_(item) {
    var id = item.getAttribute('data-aviso-id');
    var a = (avisosEstado_ ? avisosEstado_.lista : []).filter(function (x) { return x.id === id; })[0];
    marcarAvisosVistos_(id);
    abrirAvisos_(false);
    if (!a) return;
    if (a.load) openLoadWorkspace(a.load, a.tab || 'operacion');
    else if (a.destino === 'bitacora') showMainPage('home', 'group-bitacora');
    else if (a.destino === 'gestionar') openCsrPasswordGate();
    else if (a.destino === 'apartados') verApartado_(a.apartado);
  }
  document.getElementById('avisos-lista').addEventListener('click', function (e) {
    var item = e.target.closest('[data-aviso-id]');
    if (!item) return;
    var accion = e.target.closest('[data-aviso-accion]');
    if (accion) {
      e.stopPropagation();
      var id = item.getAttribute('data-aviso-id');
      var a = avisosEstado_.lista.filter(function (x) { return x.id === id; })[0];
      if (a) ejecutarAccionAviso_(a, accion.getAttribute('data-aviso-accion'), accion);
      return;
    }
    abrirDesdeAviso_(item);
  });
  document.getElementById('avisos-lista').addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-aviso-id]')) { e.preventDefault(); abrirDesdeAviso_(e.target); }
  });
  document.addEventListener('click', function (e) {
    var panel = document.getElementById('avisos-panel');
    if (panel && !panel.hidden && !e.target.closest('#avisos-panel') && !e.target.closest('#avisos-btn')) abrirAvisos_(false);
  });

  setInterval(programarAvisos_, 60000); // recordatorios por tiempo aunque no cambie ningún dato

  setInterval(autoRefresh, AUTO_REFRESH_MS); // con la pestaña oculta, autoRefresh solo pregunta cada 5 min
  setInterval(function () { if (!document.hidden && myRealIdentity) loadSlaMetrics(); }, 300000);
  // Aparte de autoRefresh (que solo trae datos nuevos si de verdad cambió algo en el servidor),
  // la cuenta regresiva de los banners de alerta necesita refrescarse sola aunque no haya
  // cambiado nada — si no, se queda congelada mostrando "faltan 3h 40m" para siempre. Con la
  // pestaña oculta no se redibuja nada (nadie lo ve); al volver se pone al día de inmediato.
  setInterval(function () { if (!document.hidden) refreshAlertCountdowns(); }, AUTO_REFRESH_MS);
  setInterval(function () { if (!document.hidden) refreshOperationalAttention(); }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    autoRefresh();
    refreshAlertCountdowns();
    refreshOperationalAttention();
    updateHeaderTimestamp();
  });

  // Cierra con Esc el modal que esté abierto en ese momento (comentarios, verificar identidad,
  // nuevo pendiente, vincular pendiente a load, recordatorio, contraseña/gestión de CSR o el
  // cajón de "¿Quién eres?"), sea cual sea.
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (document.getElementById('confirmar-backdrop').classList.contains('show')) { cerrarConfirmar_(); return; }
    if (document.getElementById('multimsg-backdrop').classList.contains('show')) { document.getElementById('multimsg-backdrop').classList.remove('show'); return; }
    if (document.getElementById('apartado-backdrop').classList.contains('show')) { cerrarApartadoConAviso_(); return; }
    if (!document.getElementById('avisos-panel').hidden) { abrirAvisos_(false); return; }
    if (document.getElementById('comments-backdrop').classList.contains('show')) { closeCommentsModal(); return; }
    if (document.getElementById('incidencia-backdrop').classList.contains('show')) { closeIncidenciaModal(); return; }
    if (document.getElementById('workspace-backdrop').classList.contains('show')) { closeLoadWorkspace(); return; }
    if (document.getElementById('identity-backdrop').classList.contains('show')) { closeIdentityModal(); return; }
    if (document.getElementById('pendiente-backdrop').classList.contains('show')) { closePendienteModal(); return; }
    if (document.getElementById('bitacora-backdrop').classList.contains('show')) { cerrarBitacoraConAviso_(); return; }
    if (document.getElementById('vincular-backdrop').classList.contains('show')) { closeVincularModal(); return; }
    if (document.getElementById('recordatorio-backdrop').classList.contains('show')) { cancelRecordatorioModal(); return; }
    if (document.getElementById('csr-pw-backdrop').classList.contains('show')) { closeCsrPasswordGate(); return; }
    if (document.getElementById('csr-backdrop').classList.contains('show')) { document.getElementById('csr-backdrop').classList.remove('show'); return; }
    if (document.getElementById('who-drawer-backdrop').classList.contains('show')) { closeWhoDrawer(); return; }
  });

  // Atajos de teclado (no aplican mientras escribes en un campo):
  //   /  buscar (en Operación completa, su buscador; en cualquier otra página, la búsqueda global)
  //   N  nuevo comentario de la carga abierta (Load Workspace o detalle de la tabla)
  //   R  actualizar ahora      ?  ver esta lista      Esc  cerrar lo que esté abierto
  function hayModalAbierto_() { return !!document.querySelector('.modal-backdrop.show, .who-drawer-backdrop.show'); }
  function mostrarAtajos_() {
    confirmarModal_('Atajos de teclado',
      '<table class="atajos"><tr><td><kbd>/</kbd></td><td>Buscar</td></tr>' +
      '<tr><td><kbd>N</kbd></td><td>Nuevo comentario de la carga abierta</td></tr>' +
      '<tr><td><kbd>R</kbd></td><td>Actualizar ahora</td></tr>' +
      '<tr><td><kbd>Esc</kbd></td><td>Cerrar ventana o panel</td></tr>' +
      '<tr><td><kbd>?</kbd></td><td>Ver esta lista</td></tr></table>', '', null);
  }
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    if (e.key === '?') { e.preventDefault(); mostrarAtajos_(); return; }
    if (e.key === '/') {
      if (hayModalAbierto_()) return;
      e.preventDefault();
      var enOperacion = !document.getElementById('page-operation').hidden;
      if (!enOperacion) showMainPage('home');
      var campo = document.getElementById(enOperacion ? 'search' : 'home-search');
      if (campo) { campo.focus(); campo.select(); }
      return;
    }
    if (e.key === 'n' || e.key === 'N') {
      var wsAbierto = document.getElementById('workspace-backdrop').classList.contains('show');
      var load = wsAbierto ? workspaceCurrentLoad : (!hayModalAbierto_() ? selectedTableLoad : null);
      if (!load) return;
      e.preventDefault();
      openCommentsModal(load, 'load');
      setTimeout(function () { var ta = document.getElementById('comments-textarea'); if (ta) ta.focus(); }, 60);
      return;
    }
    if ((e.key === 'r' || e.key === 'R') && !hayModalAbierto_()) {
      e.preventDefault();
      document.getElementById('header-refresh-btn').click();
    }
  });

  // FIX: seguridad — las cargas, comentarios, SLA, pendientes, etc. ya solo se entregan con sesión
  // iniciada, así que se piden hasta que verifyIdentity() la confirma (con el token guardado o con
  // el login). Aquí solo se piden las personas, que hacen falta para el selector del login.
  loadStoredIdentity();
  loadPersonasYAsignaciones();

  google.script.run.withSuccessHandler(function (info) {
    lastImportAt = (info && info.lastImportAt) || '';
    renderOperationMeta();
  }).getImportInfo();
})();
</script>
