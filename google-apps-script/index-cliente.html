<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Portal de Seguimiento</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Public&#43;Sans:wght@400;500;600;700&amp;family=IBM&#43;Plex&#43;Mono:wght@400;500&amp;display=swap">
  <style>
  :root {
    --paper: #eef1f2; --surface: #ffffff; --surface-2: #e4e8e9;
    --ink: #1c2b34; --ink-soft: #56676f; --ink-faint: #8b979c; --line: #d6dbdc;
    --accent: #b8562f; --accent-soft: #f3ded3;
    --good: #2f7a4f; --good-soft: #dcefe1;
    --warn: #a5720f; --warn-soft: #f6e6c4;
    --critical: #b23b3a; --critical-soft: #f6dcdb;
    --info: #2f5f8a; --info-soft: #dbe6ee;
    --shadow: 0 1px 2px rgba(28,43,52,0.06), 0 8px 24px -12px rgba(28,43,52,0.18);
  }
  * { box-sizing: border-box; }

  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: "Oswald", sans-serif; margin: 0; color: var(--ink); }
  .eyebrow {
    font-family: "Oswald", sans-serif; font-weight: 600; font-size: 0.72rem;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 0.35rem;
  }
  .screen { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }


  .login-screen {
    min-height: 100vh; max-width: none; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .login-card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); padding: 2rem 1.85rem 1.85rem;
  }
  .login-card h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.35rem; }
  .login-sub { font-size: 0.88rem; color: var(--ink-soft); margin: 0 0 1.5rem; }
  .field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
  .field-label { font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); }
  .field input {
    font-family: "Public Sans", sans-serif; font-size: 0.95rem; padding: 0.65rem 0.75rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink);
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .login-error {
    font-size: 0.82rem; color: var(--critical); background: var(--critical-soft);
    border-radius: 7px; padding: 0.55rem 0.7rem; margin-bottom: 1rem;
  }
  .btn-primary {
    width: 100%; font-family: "Oswald", sans-serif; font-size: 0.85rem; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase; padding: 0.7rem 1rem; border-radius: 8px;
    background: var(--accent); color: #fff; border: none; cursor: pointer;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .btn-ghost {
    font-family: "Public Sans", sans-serif; font-size: 0.85rem; font-weight: 600; padding: 0.5rem 0.9rem;
    border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .back-btn { border: none; background: none; padding: 0 0 0.5rem; font-weight: 600; color: var(--ink-soft); }
  .back-btn:hover { color: var(--accent); }


  .portal-top {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end;
    gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--line);
  }
  #dashboard-greeting { font-size: clamp(1.4rem, 3.5vw, 2rem); font-weight: 700; }
  .search-bar { margin-bottom: 1.25rem; }
  .search-bar input {
    width: 100%; font-family: "Public Sans", sans-serif; font-size: 0.95rem; padding: 0.7rem 0.9rem;
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink);
  }
  .search-bar input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .summary-cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem;
    margin-bottom: 1.75rem;
  }
  .summary-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.9rem 1rem; box-shadow: var(--shadow);
  }
  .summary-card .num {
    font-family: "IBM Plex Mono", monospace; font-size: 1.6rem; font-weight: 500;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .summary-card .lbl { font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.25rem; }
  .summary-card.c-programado .num { color: var(--info); }
  .summary-card.c-transito .num { color: var(--warn); }
  .summary-card.c-frontera .num { color: var(--accent); }
  .summary-card.c-planta .num { color: var(--warn); }
  .summary-card.c-entregado .num { color: var(--good); }

  .shipments-table-wrap {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); overflow-x: auto;
  }
  .shipments-table { width: 100%; border-collapse: collapse; min-width: 560px; }
  .shipments-table th {
    text-align: left; font-family: "Oswald", sans-serif; font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft);
    padding: 0.85rem 1rem; border-bottom: 1px solid var(--line);
  }
  .shipments-table td {
    padding: 0.85rem 1rem; border-bottom: 1px solid var(--line); font-size: 0.9rem;
    vertical-align: middle;
  }
  .shipments-table tbody tr:last-child td { border-bottom: none; }
  .shipments-table tbody tr { cursor: pointer; }
  .shipments-table tbody tr:hover { background: var(--paper); }
  .po-num { font-family: "IBM Plex Mono", monospace; font-weight: 500; }
  .shipments-empty { padding: 2rem 1rem; text-align: center; color: var(--ink-soft); font-size: 0.9rem; }

  .stage-badge {
    display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 600;
    padding: 0.3rem 0.6rem; border-radius: 999px;
  }
  .stage-badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .stage-badge.s-programado { background: var(--info-soft); color: var(--info); }
  .stage-badge.s-programado .dot { background: var(--info); }
  .stage-badge.s-transito { background: var(--warn-soft); color: var(--warn); }
  .stage-badge.s-transito .dot { background: var(--warn); }
  .stage-badge.s-frontera { background: var(--accent-soft); color: var(--accent); }
  .stage-badge.s-frontera .dot { background: var(--accent); }
  .stage-badge.s-planta { background: var(--warn-soft); color: var(--warn); }
  .stage-badge.s-planta .dot { background: var(--warn); }
  .stage-badge.s-entregado { background: var(--good-soft); color: var(--good); }
  .stage-badge.s-entregado .dot { background: var(--good); }


  .route-strip {
    display: flex; align-items: center; gap: 0.75rem; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
    padding: 1.1rem 1.25rem; margin-bottom: 1.5rem; flex-wrap: wrap;
  }
  .route-point { display: flex; flex-direction: column; gap: 0.2rem; min-width: 90px; }
  .route-label {
    font-family: "Oswald", sans-serif; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .route-value { font-weight: 600; }
  .route-arrow { color: var(--ink-faint); font-size: 1.1rem; }

  .detail-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.25rem; }
  @media (max-width: 720px) { .detail-grid { grid-template-columns: 1fr; } }
  .detail-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 1.25rem 1.4rem;
  }
  .detail-card h2 {
    font-size: 0.95rem; font-weight: 600; letter-spacing: 0.02em; margin-bottom: 1rem;
    padding-bottom: 0.75rem; border-bottom: 1px solid var(--line);
  }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li {
    position: relative; padding: 0 0 1.15rem 1.6rem; font-size: 0.88rem;
  }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: ''; position: absolute; left: 0.28rem; top: 0.2rem; width: 10px; height: 10px;
    border-radius: 50%; background: var(--surface-2); border: 2px solid var(--ink-faint);
  }
  .timeline li::after {
    content: ''; position: absolute; left: 0.6rem; top: 1.15rem; bottom: -0.15rem; width: 2px;
    background: var(--line);
  }
  .timeline li:last-child::after { display: none; }
  .timeline li.done { color: var(--ink); }
  .timeline li.done::before { background: var(--good); border-color: var(--good); }
  .timeline li.current { color: var(--accent); font-weight: 600; }
  .timeline li.current::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .timeline li.pending { color: var(--ink-faint); }

  .facts-list { margin: 0; display: flex; flex-direction: column; gap: 0.85rem; }
  .facts-list div { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.88rem; }
  .facts-list dt { color: var(--ink-soft); }
  .facts-list dd { margin: 0; font-weight: 600; text-align: right; }


  .semaforo-dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.5rem;
    vertical-align: middle;
  }
  .semaforo-dot.l-critical { background: var(--critical); }
  .semaforo-dot.l-warn { background: var(--warn); }
  .semaforo-dot.l-good { background: var(--good); }


  .alert-banner {
    display: flex; align-items: center; gap: 0.6rem; border-radius: 10px; padding: 0.85rem 1.1rem;
    margin-bottom: 1.25rem; font-size: 0.88rem; font-weight: 600;
  }
  .alert-banner.l-critical { background: var(--critical-soft); color: var(--critical); }
  .alert-banner.l-warn { background: var(--warn-soft); color: var(--warn); }


  .docs-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .doc-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.88rem; }
  .doc-row .doc-name { color: var(--ink-soft); }
  .doc-status { display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 600; font-size: 0.82rem; }
  .doc-status.ok { color: var(--good); }
  .doc-status.pending { color: var(--ink-faint); }
  .doc-status .dot { width: 8px; height: 8px; border-radius: 50%; }
  .doc-status.ok .dot { background: var(--good); }
  .doc-status.pending .dot { background: var(--surface-2); border: 1px solid var(--ink-faint); }


  .incidencias-list { display: flex; flex-direction: column; gap: 0.9rem; max-height: 340px; overflow-y: auto; }
  .incidencia-empty { color: var(--ink-faint); font-size: 0.85rem; }
  .incidencia-item { border-left: 3px solid var(--line); padding: 0.15rem 0 0.15rem 0.75rem; }
  .incidencia-item.i-critical { border-left-color: var(--critical); }
  .incidencia-item.i-warn { border-left-color: var(--warn); }
  .incidencia-item.i-good { border-left-color: var(--good); }
  .incidencia-head { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 0.2rem; }
  .incidencia-cat { font-weight: 600; color: var(--ink); }
  .incidencia-desc { font-size: 0.88rem; }
  .incidencia-accion { font-size: 0.82rem; color: var(--ink-soft); margin-top: 0.2rem; }
  .incidencia-accion b { color: var(--ink); }
</style></head>
<body>


  <section id="login-screen" class="screen login-screen">
    <div class="login-card">
      <p class="eyebrow">CI-CSR-FD-007</p>
      <h1>Portal de Seguimiento</h1>
      <p class="login-sub">Consulta tus embarques en tiempo real.</p>
      <form id="login-form" autocomplete="off">
        <label class="field">
          <span class="field-label">Usuario</span>
          <input type="text" id="login-usuario" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="field-label">Contraseña</span>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <div id="login-error" class="login-error" hidden></div>
        <button type="submit" id="login-submit" class="btn-primary">Entrar</button>
      </form>
    </div>
  </section>


  <section id="dashboard-screen" class="screen dashboard-screen" hidden>
    <header class="portal-top">
      <div>
        <p class="eyebrow">Portal de Seguimiento</p>
        <h1 id="dashboard-greeting">Buenos días</h1>
      </div>
      <button type="button" id="logout-btn" class="btn-ghost">Cerrar sesión</button>
    </header>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Buscar por PO / número de embarque">
    </div>

    <div id="summary-cards" class="summary-cards"></div>

    <div class="shipments-table-wrap">
      <table class="shipments-table">
        <thead>
          <tr>
            <th>PO</th>
            <th>Origen</th>
            <th>Destino</th>
            <th>ETA</th>
            <th>Estatus</th>
          </tr>
        </thead>
        <tbody id="shipments-tbody"></tbody>
      </table>
      <div id="shipments-empty" class="shipments-empty" hidden>No se encontraron embarques.</div>
    </div>
  </section>


  <section id="detail-screen" class="screen detail-screen" hidden>
    <header class="portal-top">
      <div>
        <button type="button" id="back-btn" class="btn-ghost back-btn">&larr; Volver</button>

  <script>
  (function () {
    'use strict';

    var SESSION_KEY = 'portalClienteSesion';

    var TIMELINE_STAGES = window.TIMELINE_STAGES_GS || [];
    var STAGE_BUCKETS = {
      programado: 'programado',
      cargado: 'transito', documentos: 'transito', salida_mexico: 'transito', cruce_usa: 'transito',
      frontera: 'frontera',
      en_transito: 'transito',
      arribo_planta: 'planta', descarga: 'planta',
      pod: 'entregado'
    };
    var BUCKET_LABELS = {
      programado: 'Programados', transito: 'En tránsito', frontera: 'En frontera',
      planta: 'En planta', entregado: 'Entregados'
    };
    var BUCKET_ORDER = ['programado', 'transito', 'frontera', 'planta', 'entregado'];

    var currentSession = null;
    var currentLoads = [];

    function $(id) { return document.getElementById(id); }

    function escHtml(v) {
      return (v === null || v === undefined) ? '' : String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmtDateTime(d) { return window.panelFormatting.formatMoment(d); }

    function greeting() {
      var h = new Date().getHours();
      if (h < 12) return 'Buenos días';
      if (h < 19) return 'Buenas tardes';
      return 'Buenas noches';
    }

    function showScreen(id) {
      ['login-screen', 'dashboard-screen', 'detail-screen'].forEach(function (s) {
        $(s).hidden = (s !== id);
      });
    }



    function saveSession(session) {
      currentSession = session;
      try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {   }
    }

    function loadSession() {
      try {
        var raw = localStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    function clearSession() {
      currentSession = null;
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {   }
    }





    function sesionExpirada(res) {
      if (!res || res.ok !== false) return false;
      clearSession();
      showScreen('login-screen');
      $('login-error').textContent = res.error || 'Tu sesión expiró. Vuelve a entrar.';
      $('login-error').hidden = false;
      return true;
    }



    $('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var usuario = $('login-usuario').value.trim();
      var password = $('login-password').value;
      if (!usuario || !password) return;
      $('login-error').hidden = true;
      $('login-submit').disabled = true;
      $('login-submit').textContent = 'Entrando…';
      google.script.run
        .withSuccessHandler(function (res) {
          $('login-submit').disabled = false;
          $('login-submit').textContent = 'Entrar';
          if (!res.ok) {
            $('login-error').textContent = res.error || 'Usuario o contraseña incorrectos';
            $('login-error').hidden = false;
            return;
          }
          saveSession({ usuario: usuario, nombre: res.nombre, cliente: res.cliente, token: res.token });
          enterDashboard();
        })
        .withFailureHandler(function (err) {
          $('login-submit').disabled = false;
          $('login-submit').textContent = 'Entrar';
          $('login-error').textContent = 'No se pudo verificar: ' + err.message;
          $('login-error').hidden = false;
        })
        .checkClientLogin(usuario, password);
    });

    $('logout-btn').addEventListener('click', function () {
      window.panelApi.logout().catch(function () {});
      clearSession();
      $('login-usuario').value = '';
      $('login-password').value = '';
      showScreen('login-screen');
    });



    function enterDashboard() {
      $('dashboard-greeting').textContent = greeting() + ', ' + (currentSession.nombre || currentSession.cliente);
      showScreen('dashboard-screen');
      loadLoads();
    }

    function loadLoads() {
      google.script.run
        .withSuccessHandler(function (loads) {
          if (sesionExpirada(loads)) return;
          currentLoads = loads || [];
          renderSummary(currentLoads);
          renderTable(currentLoads);
        })
        .withFailureHandler(function (err) {
          $('shipments-tbody').innerHTML = '';
          $('shipments-empty').hidden = false;
          $('shipments-empty').textContent = 'No se pudieron cargar tus embarques: ' + err.message;
        })
        .getLoadsForCliente(currentSession.token);
    }

    function renderSummary(loads) {
      var counts = { programado: 0, transito: 0, frontera: 0, planta: 0, entregado: 0 };
      loads.forEach(function (rec) {
        var bucket = STAGE_BUCKETS[rec.stageKey] || 'programado';
        counts[bucket]++;
      });
      $('summary-cards').innerHTML = BUCKET_ORDER.map(function (b) {
        return '<div class="summary-card c-' + b + '"><div class="num">' + counts[b] + '</div><div class="lbl">' + BUCKET_LABELS[b] + '</div></div>';
      }).join('');
    }

    function stageBadgeHtml(rec) {
      var bucket = STAGE_BUCKETS[rec.stageKey] || 'programado';
      return '<span class="stage-badge s-' + bucket + '"><span class="dot"></span>' + escHtml(rec.stageLabel) + '</span>';
    }

    function renderTable(loads) {
      var q = ($('search-input').value || '').trim().toLowerCase();
      var filtered = q ? loads.filter(function (rec) { return String(rec.load).toLowerCase().indexOf(q) !== -1; }) : loads;


      filtered = filtered.slice().sort(function (a, b) {
        var ta = a.delivery_appt ? new Date(a.delivery_appt).getTime() : Infinity;
        var tb = b.delivery_appt ? new Date(b.delivery_appt).getTime() : Infinity;
        if (isNaN(ta)) ta = Infinity;
        if (isNaN(tb)) tb = Infinity;
        return ta - tb;
      });

      if (!filtered.length) {
        $('shipments-tbody').innerHTML = '';
        $('shipments-empty').hidden = false;
        $('shipments-empty').textContent = 'No se encontraron embarques.';
        return;
      }
      $('shipments-empty').hidden = true;
      $('shipments-tbody').innerHTML = filtered.map(function (rec) {
        var dot = '<span class="semaforo-dot l-' + (rec.alertLevel || 'good') + '" title="' + escHtml(rec.alertMessage || '') + '"></span>';
        return '<tr data-load="' + escHtml(rec.load) + '">' +
          '<td class="po-num">' + dot + escHtml(rec.load) + '</td>' +
          '<td>' + escHtml(rec.origin_city) + (rec.origin_state ? ', ' + escHtml(rec.origin_state) : '') + '</td>' +
          '<td>' + escHtml(rec.dest_city) + (rec.dest_state ? ', ' + escHtml(rec.dest_state) : '') + '</td>' +
          '<td>' + fmtDateTime(rec.delivery_appt) + '</td>' +
          '<td>' + stageBadgeHtml(rec) + '</td>' +
          '</tr>';
      }).join('');
    }

    $('search-input').addEventListener('input', function () { renderTable(currentLoads); });

    $('shipments-tbody').addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-load]');
      if (!tr) return;
      openDetail(tr.getAttribute('data-load'));
    });



    function openDetail(load) {
      showScreen('detail-screen');
      $('detail-po').textContent = 'PO ' + load;
      $('detail-origin').textContent = '';
      $('detail-dest').textContent = '';
      $('detail-alert').hidden = true;
      $('detail-timeline').innerHTML = '';
      $('detail-facts').innerHTML = '';
      $('detail-docs').innerHTML = '<div class="incidencia-empty">Cargando…</div>';
      $('detail-incidencias').innerHTML = '<div class="incidencia-empty">Cargando…</div>';

      google.script.run
        .withSuccessHandler(function (rec) {
          if (sesionExpirada(rec)) return;
          if (!rec) {
            $('detail-docs').innerHTML = '<div class="incidencia-empty">No se pudo cargar este embarque.</div>';
            $('detail-incidencias').innerHTML = '';
            return;
          }
          showDetail(rec);
        })
        .withFailureHandler(function (err) {
          $('detail-docs').innerHTML = '<div class="incidencia-empty">Error: ' + escHtml(err.message) + '</div>';
          $('detail-incidencias').innerHTML = '';
        })
        .getLoadDetailForCliente(load, currentSession.token);
    }

    function showDetail(rec) {
      $('detail-po').textContent = 'PO ' + rec.load;
      $('detail-origin').textContent = (rec.origin_city || '—') + (rec.origin_state ? ', ' + rec.origin_state : '');
      $('detail-dest').textContent = (rec.dest_city || '—') + (rec.dest_state ? ', ' + rec.dest_state : '');

      if (rec.alertLevel && rec.alertLevel !== 'good') {
        var icon = rec.alertLevel === 'critical' ? '⚠️ ' : '🟡 ';
        $('detail-alert').className = 'alert-banner l-' + rec.alertLevel;
        $('detail-alert').textContent = icon + rec.alertMessage;
        $('detail-alert').hidden = false;
      } else {
        $('detail-alert').hidden = true;
      }

      $('detail-timeline').innerHTML = TIMELINE_STAGES.map(function (stage, i) {
        var cls = i < rec.stageIndex ? 'done' : (i === rec.stageIndex ? 'current' : 'pending');
        return '<li class="' + cls + '">' + escHtml(stage.label) + '</li>';
      }).join('');

      var facts = [
        ['ETA', fmtDateTime(rec.delivery_appt) || 'Sin programar'],
        ['Cita de carga', fmtDateTime(rec.pickup_appt) || 'Sin programar'],
        ['Unidad', rec.truck || '—'],
        ['Trailer', rec.trailer || '—'],
        ['Estatus actual', rec.stageLabel]
      ];
      $('detail-facts').innerHTML = facts.map(function (f) {
        return '<div><dt>' + escHtml(f[0]) + '</dt><dd>' + escHtml(f[1]) + '</dd></div>';
      }).join('');

      var docs = rec.documentos || {};
      var docRows = [['BOL', docs.bol], ['DODA', docs.doda], ['Entry', docs.entry], ['Sobre listo', docs.sobreListo]];
      $('detail-docs').innerHTML = docRows.map(function (d) {
        var ok = !!d[1];
        return '<div class="doc-row"><span class="doc-name">' + escHtml(d[0]) + '</span>' +
          '<span class="doc-status ' + (ok ? 'ok' : 'pending') + '"><span class="dot"></span>' + (ok ? 'Listo' : 'Pendiente') + '</span></div>';
      }).join('');

      var incidencias = rec.incidencias || [];
      if (!incidencias.length) {
        $('detail-incidencias').innerHTML = '<div class="incidencia-empty">Sin incidencias registradas.</div>';
      } else {
        $('detail-incidencias').innerHTML = incidencias.map(function (inc) {
          return '<div class="incidencia-item i-' + escHtml(inc.severidad) + '">' +
            '<div class="incidencia-head"><span class="incidencia-cat">' + escHtml(inc.categoria) + '</span> · ' + fmtDateTime(inc.fecha) + '</div>' +
            '<div class="incidencia-desc">' + escHtml(inc.descripcion) + '</div>' +
            (inc.accion_tomada ? '<div class="incidencia-accion"><b>Acción tomada:</b> ' + escHtml(inc.accion_tomada) + '</div>' : '') +
            '</div>';
        }).join('');
      }
      renderAvisosCliente(rec.avisos);
    }




    function renderAvisosCliente(avisos) {
      var grid = document.querySelector('#detail-screen .detail-grid');
      if (!grid) return;
      var card = $('detail-avisos-card');
      if (!card) {
        card = document.createElement('div');
        card.className = 'detail-card';
        card.id = 'detail-avisos-card';
        card.innerHTML = '<h2>Avisos que te enviamos</h2><div id="detail-avisos" class="incidencias-list"></div>';
        grid.appendChild(card);
      }
      var lista = avisos || [];
      $('detail-avisos').innerHTML = lista.length ? lista.map(function (a) {
        return '<div class="incidencia-item i-info"><div class="incidencia-head">' + fmtDateTime(a.fecha) + (a.canal ? ' · ' + escHtml(a.canal) : '') + '</div>' +
          '<div class="incidencia-desc" style="white-space:pre-wrap">' + escHtml(a.mensaje) + '</div></div>';
      }).join('') : '<div class="incidencia-empty">Todavía no hay avisos registrados para este embarque.</div>';
    }

    $('back-btn').addEventListener('click', function () {
      showScreen('dashboard-screen');
    });



    var session = loadSession();
    if (session && session.token) {
      currentSession = session;
      enterDashboard();
    } else {


      if (session) clearSession();
      showScreen('login-screen');
    }
  })();
