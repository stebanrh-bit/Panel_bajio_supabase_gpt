<ul><li><b>Revisiones y seguimientos:</b> cuándo debes volver a revisar una carga. Vencer no borra el recordatorio.</li>
<li><b>Avisos al cliente:</b> información que debes comunicarle. Registra el aviso cuando ya lo enviaste.</li>
<li><b>Solicitudes y tareas:</b> solicitudes sin carga confirmada y trabajo que registraste o te asignaron.</li></ul>
<p>Las revisiones en tránsito se repiten cada 3 horas. Un seguimiento que programas tú se completa o cambia de fecha desde la carga.</p>

`,xa=`:root {
      /* Tema oscuro "control tower" — superficies casi negras con un ligero tinte azul,
         y colores de acento saturados/brillantes (estilo neón) que resaltan sobre el fondo. */
      --paper: #090c13; --surface: #10141d; --surface-2: #1b2130;
      --ink: #eef1f8; --ink-soft: #9aa7c2; --ink-faint: #5c6784; --line: #232a3c;
      --accent: #ff8a3d; --accent-soft: rgba(255,138,61,0.16);
      --good: #2ee881; --good-soft: rgba(46,232,129,0.15);
      --warn: #ffd93d; --warn-soft: rgba(255,217,61,0.15);
      --critical: #ff3d63; --critical-soft: rgba(255,61,99,0.16);
      --info: #3fb0ff; --info-soft: rgba(63,176,255,0.15);
      --purple: #b98cff; --purple-soft: rgba(185,140,255,0.16);
      --teal: #2de2c8; --teal-soft: rgba(45,226,200,0.15);
      --pink: #ff6fc4; --pink-soft: rgba(255,111,196,0.15);
      --brown: #d9a468; --brown-soft: rgba(217,164,104,0.14);
      --slate: #93a2c9; --slate-soft: rgba(147,162,201,0.14);
      --radius: 14px; --radius-sm: 8px;
      --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 1px 1px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 24px -6px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
      --glow-sm: 0 0 8px;
      --glow-md: 0 0 16px;
      --ease: 180ms cubic-bezier(.2,.7,.3,1);
      --font: "Inter", -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    /* Sin esto, el navegador sigue dibujando los controles nativos (el ícono de calendario de
       los campos de fecha/hora, su selector emergente, etc.) con los colores de un tema claro
       aunque el resto de la página ya sea oscuro — el ícono queda casi invisible sobre el fondo
       oscuro del campo, como si "se hubiera borrado". Esto le dice al navegador que dibuje esos
       controles nativos ya pensados para un fondo oscuro. */
    :root { color-scheme: dark; }
    /* Todo ícono SVG de la interfaz brilla con el color de su propio trazo — así se ve
       "neón" de forma consistente sin tener que ajustar cada ícono a mano. */
    svg { filter: drop-shadow(0 0 3px currentColor); }
    body {
      background: var(--paper); color: var(--ink);
      font-family: var(--font);
      line-height: 1.5; -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app-shell { display: flex; align-items: flex-start; min-height: 100vh; }

    .sidebar {
      flex: 0 0 60px; width: 60px; position: sticky; top: 0; height: 100vh;
      background: #070a10; border-right: 1px solid var(--line);
      display: flex; flex-direction: column; align-items: center; padding: 1rem 0; gap: 0.35rem; z-index: 20;
    }
    .sidebar-mark {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 0.75rem;
    }
    .sidebar-mark img {
      width: 30px; height: 30px; object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(255,138,61,0.65));
    }
    .sidebar-btn {
      width: 40px; height: 40px; border-radius: var(--radius-sm); border: none; background: none;
      color: var(--ink-faint); display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background var(--ease), color var(--ease);
    }
    .sidebar-btn svg { width: 19px; height: 19px; }
    .sidebar-btn:hover { background: var(--surface-2); color: var(--ink); }

    .sidebar-sep { width: 26px; height: 1px; background: var(--line); margin: 0.5rem 0; }
    .sidebar-tools { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }

    .wrap { flex: 1 1 auto; min-width: 0; max-width: 1240px; margin: 0 auto; padding: 1.5rem 1.75rem 4rem; }

    .meta strong { color: var(--ink); font-weight: 600; }
    .refresh-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background var(--ease), color var(--ease), border-color var(--ease);

    .file-btn {

      border-radius: var(--radius-sm); background: var(--accent); color: #fff;
      cursor: pointer; border: none; transition: filter var(--ease), transform var(--ease), box-shadow var(--ease);
      box-shadow: 0 0 12px rgba(255,138,61,0.35);
    }
    .file-btn:hover { filter: brightness(1.08); box-shadow: 0 0 18px rgba(255,138,61,0.55); }
    .file-btn:active { transform: scale(0.98); }
    #file-input { display: none; }
    /* Resultado de la importación: renglón propio bajo los botones del encabezado; no ocupa lugar si está vacío. */
    .import-status { font-size: 0.78rem; color: var(--ink-soft); flex: 1 0 100%; text-align: right; margin-top: -0.5rem; }
    .import-status:empty { display: none; }
    .import-btn { color: var(--accent); border-color: var(--accent-soft); }
    .import-status.ok { color: var(--good); }
    .import-status.err { color: var(--critical); }
    .who-toggle-btn {
      display: inline-flex; align-items: center; gap: 0.45rem; font-family: var(--font);
      font-size: 0.8rem; font-weight: 600; padding: 0.4rem 0.85rem 0.4rem 0.6rem; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
      transition: border-color var(--ease), color var(--ease);
    }
    .who-toggle-btn:hover { border-color: var(--accent); }
    .who-toggle-label { white-space: nowrap; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .session-chip {
      display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.3rem 0.7rem 0.3rem 0.3rem;
      border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    }
    .session-chip-avatar {
      width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
      display: inline-flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 800;
      font-family: var(--font); text-transform: uppercase; flex: none;
    }
    .session-chip-name { font-size: 0.78rem; font-weight: 600; color: var(--ink); white-space: nowrap; }
    .hdr-mini-btn {
      font-family: var(--font); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.01em;
      padding: 0.4rem 0.6rem; border-radius: 7px; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-soft); cursor: pointer; white-space: nowrap; transition: border-color var(--ease), color var(--ease);
    }
    .hdr-mini-btn:hover { border-color: var(--accent); color: var(--ink); }
    .hdr-mini-btn-danger { color: #ff8f8f; border-color: rgba(255,107,107,.35); }

    .who-drawer-backdrop {

    .who-drawer {
      position: fixed; top: 0; left: 0; bottom: 0; width: 300px; max-width: 85vw; background: var(--surface);
      box-shadow: var(--shadow); display: flex; flex-direction: column; padding: 1.1rem 1.1rem 1.25rem;
      transform: translateX(-100%); transition: transform 0.2s ease;
    }
    .who-drawer-backdrop.show .who-drawer { transform: translateX(0); }
    .who-drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.9rem; }

    .who-group-title { font-family: "Inter", sans-serif; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin: 0 0 0.4rem; }

    }
    .who-row:hover { background: var(--surface-2); }
    .who-row.active { background: var(--ink); color: var(--paper); font-weight: 600; }
    .who-sub { padding-left: 0.9rem; display: none; flex-direction: column; gap: 0.15rem; margin-top: 0.2rem; }
    .who-sub.open { display: flex; }
    .who-sub .who-row { font-size: 0.82rem; padding: 0.4rem 0.6rem; }

    .stat {

/* Operación completa: contadores (Cargas totales, En curso, Necesitan atención, Docs completos,
   Recordatorios vencidos) lo más compactos posible — una franja de píldoras número + texto. */
#stats{grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:.4rem;margin-bottom:.8rem}
#stats .stat{display:flex;align-items:center;gap:.45rem;padding:.32rem .65rem;border-radius:999px;box-shadow:none;min-height:0}
#stats .stat:hover{transform:none}
#stats .stat-icon,#stats .stat-hint,#stats .skeleton-stat .skeleton:first-child{display:none}
#stats .stat .n{font-size:.95rem;line-height:1}
#stats .stat .l{font-size:.6rem;margin:0;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stats .skeleton-stat .skeleton{margin:0!important;height:.9rem!important}

/* Operación completa · Vista tabla: lista a la izquierda y detalle de la carga a la derecha
   (fijo mientras se recorre la lista). Solo en pantallas anchas; en laptop chica / celular sigue
   la lista arriba y el detalle abajo. Con el detalle abierto se esconden Origen, Pickup cita y
   Comentario para que la lista no necesite scroll horizontal. */
@media(min-width:1180px){
  .wrap:has(#table-view #table-detail-panel:not([hidden])){max-width:1680px}

  #table-view:has(#table-detail-panel:not([hidden])) .table-section{margin-bottom:0}
  #table-view:has(#table-detail-panel:not([hidden])) .table-detail-section{position:sticky;top:.75rem;border-top:0;padding-top:0;margin-top:0;max-height:calc(100vh - 1.5rem);overflow:auto}
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table{min-width:0}
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table col:nth-child(7),
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table col:nth-child(8),
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table col:nth-child(9),
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table th:nth-child(7),
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table th:nth-child(8),
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table th:nth-child(9),
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table tr.t-row > td:nth-child(7),
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table tr.t-row > td:nth-child(8),
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table tr.t-row > td:nth-child(9){display:none}
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table td{padding:.6rem .7rem}
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table th{padding:.7rem .7rem}
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table colgroup .c-load{width:92px}
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table colgroup .c-trailer{width:82px}
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table colgroup .c-customer{width:auto}
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table colgroup .c-status{width:168px}
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table colgroup .c-city{width:100px}
  #table-view:has(#table-detail-panel:not([hidden])) .loads-table colgroup .c-date{width:106px}
  #table-view:has(#table-detail-panel:not([hidden])) .t-detail-content{grid-template-columns:repeat(2,minmax(0,1fr))}
}
body .lista-mas-btn{font-size:.74rem}
body .hdr-mini-btn{font-size:.74rem}

/* Búsqueda global de Inicio (resultados debajo del buscador). */
.home-global-search{position:relative}
.search-resultados{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.4);max-height:420px;overflow:auto}
.search-resultados[hidden]{display:none}
.search-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:.55rem .75rem;font:inherit;font-size:.78rem;cursor:pointer}
.search-item:hover,.search-item.activo{background:var(--surface-2)}
.search-item small{display:block;color:var(--ink-soft);font-size:.7rem;margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-item mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:inherit;border-radius:3px}
.search-todos{display:block;width:100%;border:0;background:transparent;color:var(--info);padding:.55rem .75rem;font:inherit;font-size:.74rem;font-weight:700;cursor:pointer;text-align:left}

/* Comentarios rápidos (frases que se insertan en el comentario). */
.quick-comments{display:flex;flex-wrap:wrap;gap:.3rem;margin:0 0 .4rem}
.quick-comment{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);border-radius:999px;padding:.2rem .6rem;font:inherit;font-size:.7rem;cursor:pointer}
.quick-comment:hover{color:var(--ink);border-color:var(--accent)}

/* Mensaje a cliente para varias cargas. */
.multimsg-loads{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:.3rem .5rem;font-size:.76rem}
.multimsg-loads label{display:flex;gap:.45rem;align-items:center;padding:.25rem 0;cursor:pointer}
.multimsg-loads .hm-soft{color:var(--ink-soft)}
.home-mini-head .ws-btn{margin-left:.5rem;padding:.25rem .5rem}

/* Acciones directas en la campana de avisos. */
.aviso-acciones{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.4rem}
.aviso-acciones .ws-btn{padding:.25rem .55rem}

/* Calendario de la semana. */
.cal-nav{display:flex;gap:.4rem;flex-wrap:wrap}
.cal-leyenda{display:flex;gap:.5rem;margin:.6rem 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}
.cal-dia{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:140px;display:flex;flex-direction:column}
.cal-dia.hoy{border-color:var(--accent)}
.cal-dia-head{padding:.45rem .55rem;border-bottom:1px solid var(--line);font-size:.74rem;font-weight:800;display:flex;justify-content:space-between}
.cal-dia-head span{color:var(--ink-faint);font-weight:600}
.cal-dia-body{padding:.35rem;display:flex;flex-direction:column;gap:.3rem;overflow:auto;max-height:420px}
.cal-chip{display:block;border:1px solid var(--line);border-left-width:3px;background:var(--surface-2);color:var(--ink);border-radius:6px;padding:.3rem .4rem;font:inherit;font-size:.7rem;text-align:left;cursor:pointer;width:100%}
.cal-leyenda .cal-chip{display:inline-block;width:auto;cursor:default}
.cal-chip.t-pickup{border-left-color:var(--info)}.cal-chip.t-cruce{border-left-color:var(--warn)}.cal-chip.t-entrega{border-left-color:var(--good)}
.cal-chip small{display:block;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-vacio{color:var(--ink-faint);font-size:.7rem;padding:.3rem}

.cal-chip.t-apartado{border-left-color:var(--purple);border-style:dashed solid dashed solid}

/* Radar de millas. */
.radar-toolbar{align-items:flex-end}
.radar-fuente{font-size:.74rem;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.45rem .7rem;margin:0 0 .8rem}
.radar-fuente.falta{border-color:var(--warn);color:var(--warn)}
.radar-fuente b{color:var(--ink)}
.radar-campo{display:flex;flex-direction:column;gap:.2rem;font-size:.68rem;color:var(--ink-soft);font-weight:700}
.radar-campo input{min-width:240px}
.radar-campo-chico input{min-width:0;width:130px}
.radar-check{font-size:.74rem;color:var(--ink-soft);display:flex;align-items:center;gap:.3rem}
.radar-estado{font-size:.76rem;color:var(--ink-soft);min-height:1.1rem;margin:0 0 .4rem}
.radar-estado.err{color:var(--critical)}
.radar-progreso{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 0 .6rem}

.radar-resumen{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .6rem}
.radar-resumen span{font-size:.7rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:.2rem .6rem;color:var(--ink-soft)}

.radar-resumen .r-in b{color:var(--good)}.radar-resumen .r-fail b{color:var(--warn)}

.radar-tabla tr.dentro td.millas{color:var(--good)}
.radar-tabla .radar-acc{display:flex;gap:.3rem;flex-wrap:wrap}
.radar-tabla .radar-acc .ws-btn{font-size:.68rem;padding:.25rem .55rem}
.radar-tabla input.radar-alias{width:150px;font-size:.72rem;padding:.2rem .4rem}
.radar-vacio{color:var(--ink-faint);font-size:.8rem;padding:1rem}
.radar-campo-chico select{width:150px}
.radar-tab-btn{border:1px solid var(--line);background:rgba(9,12,19,.55);color:var(--ink-soft);border-radius:999px;padding:.42rem .95rem;font:inherit;font-size:.72rem;font-weight:700;cursor:pointer}
.radar-tab-btn:hover{color:var(--ink)}
.radar-tab-btn.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(255,138,61,.42)}
.radar-campo-dir{flex:1 1 280px}.radar-campo-dir input{min-width:0;width:100%}
.dir-resultado{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.8rem 1rem;margin:.4rem 0 .6rem}
.dir-millas{font-size:1.6rem;font-weight:900;color:var(--good);line-height:1.1}
.dir-millas small{font-size:.75rem;color:var(--ink-soft);font-weight:600;margin-left:.4rem}
.dir-lugar{font-size:.74rem;color:var(--ink-soft);margin-top:.35rem;overflow-wrap:anywhere}

.dir-fuente.base{color:var(--info)}.dir-fuente.nueva{color:var(--good)}.dir-fuente.pendiente{color:var(--warn)}
.dir-unidad{font-size:.92rem;margin-top:.45rem;padding:.45rem .65rem;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--ink)}

.dir-unidad small{color:var(--ink-soft)}
#dir-historial tbody tr{cursor:pointer}
#dir-historial tbody tr:hover{background:var(--surface-2)}
@media(max-width:620px){.radar-campo input{min-width:0;width:100%}.radar-campo{flex:1 1 100%}}

/* Loads apartados (regreso cargado). */
.ap-pasos{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .8rem}
.ap-pasos span{font-size:.7rem;font-weight:700;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:.2rem .6rem}
.ap-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:.8rem}

.ap-head{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.ap-head b{font-size:.95rem}
.ap-head small{display:block;color:var(--ink-soft);font-size:.72rem;margin-top:.1rem}
.ap-estado{font-size:.66rem;font-weight:800;border-radius:999px;padding:.15rem .55rem;white-space:nowrap;border:1px solid currentColor}
.ap-estado.e-cruce{color:var(--warn)}.ap-estado.e-transito{color:var(--info)}.ap-estado.e-entregado{color:var(--good)}

.ap-loads{font-size:.72rem;color:var(--ink-soft);background:var(--surface-2);border-radius:6px;padding:.35rem .5rem}
.ap-proxima{font-size:.74rem;font-weight:700}
.ap-proxima.vencido{color:var(--critical)}
.ap-nota{font-size:.74rem;color:var(--ink-soft);white-space:pre-wrap;overflow-wrap:anywhere}
.ap-acciones{display:flex;flex-wrap:wrap;gap:.35rem}

.ap-fila{display:flex;gap:.6rem}

/* Indicadores. */

.incidencia-entry{position:relative}
.incidencia-del{position:absolute;top:.4rem;right:.4rem;border:0;background:transparent;color:var(--ink-faint);font-size:1rem;cursor:pointer;line-height:1}
.incidencia-del:hover{color:var(--critical)}

/* Centro de avisos (campana del encabezado) — ver detectarAvisos_. */
.avisos-btn{position:relative}
.avisos-btn[hidden]{display:none!important}
.avisos-btn.tiene-nuevos{color:var(--warn);border-color:var(--warn)}
.avisos-badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--critical);color:#fff;font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.avisos-badge[hidden]{display:none}
.avisos-panel{position:fixed;top:64px;right:16px;z-index:1500;width:min(420px,calc(100vw - 32px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.avisos-panel[hidden]{display:none}
.avisos-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.75rem .9rem;border-bottom:1px solid var(--line);font-size:.82rem}
.avisos-head-actions{display:flex;align-items:center;gap:.7rem;font-size:.72rem}
.avisos-sonido{display:flex;align-items:center;gap:.3rem;color:var(--ink-soft);cursor:pointer}
.avisos-lista{overflow:auto;padding:.3rem 0}
.aviso-item{display:flex;gap:.6rem;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:.65rem .9rem;font:inherit;font-size:.78rem;cursor:pointer}
.aviso-item:hover{background:var(--surface-2)}
.aviso-item.nuevo{background:color-mix(in srgb,var(--warn) 8%,transparent)}
.aviso-dot{flex-shrink:0;width:9px;height:9px;border-radius:50%;margin-top:.35rem;background:var(--info)}
.aviso-item.t-critical .aviso-dot{background:var(--critical)}
.aviso-item.t-warn .aviso-dot{background:var(--warn)}
.aviso-texto{flex:1;min-width:0}
.aviso-texto b{display:block;margin-bottom:.15rem}
.aviso-texto small{color:var(--ink-faint);font-size:.68rem}
.avisos-vacio{padding:1.2rem .9rem;color:var(--ink-soft);font-size:.78rem;text-align:center}
.toast.toast-aviso{background:var(--surface);color:var(--ink);border:1px solid var(--warn);cursor:pointer}

/* ===== Revisión general (oct 2026) ===== */
/* La confirmación siempre queda encima de cualquier otra ventana (workspace, apartado, bitácora…). */
#confirmar-backdrop{z-index:1700}
.atajos{border-collapse:collapse;font-size:.8rem}.atajos td{padding:.3rem .6rem .3rem 0}
kbd{display:inline-block;min-width:1.4em;padding:.1rem .4rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface-2);font:700 .72rem/1.3 var(--font);text-align:center;color:var(--ink)}

/* Aviso "Sin conexión" en el encabezado */
.conexion-aviso{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .6rem;border-radius:999px;border:1px solid var(--critical);color:var(--critical);background:var(--critical-soft);font-size:.7rem;font-weight:700;white-space:nowrap}
.conexion-aviso::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--critical);animation:conexionPulso 1.4s ease-in-out infinite}
.conexion-aviso[hidden]{display:none}
@keyframes conexionPulso{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.conexion-aviso::before{animation:none}}

/* Tabla de Operación completa: "Mostrar más", densidad, selección masiva */
.tabla-mas{display:block;margin:.6rem auto .2rem}
.tabla-mas[hidden]{display:none}
#table-view.tabla-compacta .loads-table td{padding:.42rem .7rem;font-size:.8rem}
#table-view.tabla-compacta .loads-table th{padding:.5rem .7rem}
.file-btn.file-btn-sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.file-btn.file-btn-sec:hover{border-color:var(--accent);color:var(--accent);filter:none;box-shadow:none}
.file-btn.file-btn-sec.activo{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.masivo-bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.55rem .75rem;margin:0 0 .6rem;border:1px solid var(--accent);border-radius:10px;background:var(--surface)}
.masivo-bar[hidden]{display:none}
.masivo-bar b{font-size:.8rem;color:var(--accent)}
.masivo-bar .link-btn,.vistas-bar .link-btn{width:auto;padding:0 .2rem;font-size:.74rem}
.masivo-sep{flex:1 1 auto}
.masivo-bar select{font:inherit;font-size:.75rem;padding:.4rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.masivo-bar .ws-btn:disabled{opacity:.45;cursor:not-allowed}
#table-view.modo-masivo .loads-table tbody tr.t-row td:first-child{box-shadow:inset 3px 0 0 var(--line)}
.loads-table tbody tr.t-row.sel-masivo{background:var(--accent-soft)}
.loads-table tbody tr.t-row.sel-masivo td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* Mis vistas */
.vistas-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin:-.25rem 0 .8rem}
.vistas-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700}
.vista-chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);overflow:hidden}
.vista-chip button{border:0;background:none;color:var(--ink);font:inherit;font-size:.72rem;font-weight:650;padding:.28rem .25rem .28rem .65rem;cursor:pointer}
.vista-chip button:hover{color:var(--accent)}
.vista-chip .vista-x{padding:.28rem .55rem .28rem .3rem;color:var(--ink-faint);font-size:.85rem;line-height:1}
.vista-chip .vista-x:hover{color:var(--critical)}

/* Guías de primeros pasos (secciones vacías) */
.guia{border:1px dashed var(--line);border-radius:12px;padding:1rem 1.1rem;background:var(--surface);max-width:640px}
.guia-titulo{display:block;font-size:.9rem;margin-bottom:.6rem}
.guia-pasos{margin:0 0 .85rem;padding-left:1.2rem;display:grid;gap:.5rem}
.guia-pasos li{font-size:.78rem;color:var(--ink-soft);line-height:1.45}
.guia-pasos li b{display:block;color:var(--ink);font-size:.8rem}

/* Bitácora de admin */
.admin-bitacora{max-height:260px;overflow:auto}
.admin-bitacora .admin-item{flex-wrap:wrap;gap:.2rem .6rem;font-size:.74rem}

/* Radar: mapa y "¿cuánto le falta?" */
.radar-mapa{height:380px;border:1px solid var(--line);border-radius:12px;margin:.2rem 0 .8rem;overflow:hidden;background:var(--surface-2)}
.radar-mapa[hidden]{display:none}
#radar-mapa-btn.activo{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.falta-card{margin-top:.8rem}
.falta-resultado{display:grid;gap:.25rem;margin-top:.55rem;font-size:.8rem}
.falta-resultado:empty{display:none}

/* Barra inferior en celular */
.barra-movil{display:none}
@media (max-width: 640px){
  .sidebar{display:none}
  .sidebar.abierta-movil{display:flex;position:fixed;left:0;top:0;bottom:64px;height:auto;z-index:1300;box-shadow:12px 0 30px rgba(0,0,0,.5);overflow-y:auto}
  .barra-movil{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1250;background:#070a10;border-top:1px solid var(--line);padding:.3rem .25rem calc(.3rem + env(safe-area-inset-bottom))}
  .barra-movil button{flex:1 1 0;position:relative;display:flex;flex-direction:column;align-items:center;gap:.15rem;border:0;background:none;color:var(--ink-faint);font:inherit;font-size:.62rem;font-weight:650;padding:.35rem 0;border-radius:8px;cursor:pointer}
  .barra-movil button svg{width:20px;height:20px}
  .barra-movil button.active{color:var(--accent)}
  .movil-badge{position:absolute;top:0;left:calc(50% + 4px);min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--critical);color:#fff;font-size:.58rem;line-height:15px;text-align:center}
  .movil-badge[hidden]{display:none}
  .wrap{padding-bottom:76px}
  .avisos-panel{top:auto;bottom:72px;right:8px;left:8px;width:auto}
}
`,Sa=`/* Paleta compartida por panel, Portal Cliente y Gerencia.
   Se carga después de sus estilos: cambia presentación y no reglas operativas. */
:root {
  color-scheme: light;
  --paper: #f3f6fa;
  --surface: #ffffff;
  --surface-2: #edf2f7;
  --panel: #ffffff;
  --ink: #26374c;
  --ink-soft: #53657a;
  --ink-faint: #586b80;
  --line: #d6e0ea;
  --accent: #285e91;
  --accent-soft: #e7f0fa;
  --info: #285e91;
  --info-soft: #e7f0fa;
  --good: #216c4a;
  --good-soft: #e5f3eb;
  --warn: #845600;
  --warn-soft: #fff2d7;
  --critical: #b33945;
  --critical-soft: #fbe9eb;
  --purple: #72539b;
  --purple-soft: #f0eaf8;
  --teal: #246e70;
  --teal-soft: #e6f3f1;
  --pink: #995479;
  --pink-soft: #f8e9f1;
  --brown: #8a5c35;
  --brown-soft: #f3ede5;
  --slate: #536b83;
  --slate-soft: #ebf0f5;
  --shadow: 0 1px 3px #26374c09;
  --shadow-md: 0 10px 30px -12px #26374c26;
}
body {
  background: var(--paper);
  color: var(--ink);
}
h1,
h2,
h3 {
  font-family:
    "Inter",
    "Public Sans",
    -apple-system,
    "Segoe UI",
    sans-serif;
}
button,
input,
select,
textarea {
  font: inherit;
}
input,
select,
textarea {
  accent-color: var(--accent);
}
:focus-visible {
  outline-color: var(--accent);
}
::placeholder {
  color: var(--ink-faint);
  opacity: 1;
}
.panel-internal svg,
.panel-internal img {
  filter: none;
}
.panel-internal
  :is(button, h1, h2, h3, strong, b, .n, .load-number, .status-select) {
  text-shadow: none;
}

/* Superficies que antes usaban colores oscuros fijos, fuera de las variables del tema. */
.panel-internal
  :is(
    .sidebar,
    .barra-movil,
    .home-command,
    .home-mini-panel,
    .home-priority-kpi,
    .action-row,
    .home-tab-btn,
    .radar-tab-btn,
    .home-global-search input
  ) {
  background: var(--surface);
  border-color: var(--line);
}
.panel-internal :is(.home-tab-btn.active, .radar-tab-btn.active) {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: #c4d7eb;
}
.panel-internal #action-center {
  background: var(--surface);
}
.panel-internal .action-row:hover {
  background: var(--surface-2);
  border-color: var(--line);
}
.panel-internal :is(.home-mini-row, .carga-csr-detail-row, .deliv-card) {
  border-color: var(--line);
}
.panel-internal
  :is(

    .sidebar-badge,

    .status-select,
    .card,

  ) {
  box-shadow: none;
}
.panel-internal :is(.file-btn:hover, .chip:hover, .card:hover) {
  box-shadow: var(--shadow);
  filter: none;
}
.panel-internal

  ) {

}
.panel-internal #identity-backdrop.gate-active {

}

}

.panel-internal #cal-grid .cal-day-more summary {

}

    #ux-advanced-filters
    .ux-advanced-content

  .panel-internal
    #cards-view
    :is(.workspace-open-btn, .comments-btn, .incidencias-btn) {
    min-height: 40px;
  }
}

/* Texto secundario sobre superficies claras: contraste de lectura, también en estados vacíos. */
.panel-internal #action-center .attention-open {
  background: var(--accent-soft);
  border-color: #c2d5ea;
  color: var(--accent);
}
.panel-internal #cal-grid .cal-chip .cal-event-client {
  color: var(--ink-soft);
}
.panel-internal :is(#operation-visible-count, .sheet-filter),
.panel-internal .sheet-view .operation-page-head p,
.panel-internal .organize-content > p {
  color: var(--ink-soft);
}
.panel-internal #page-operation #table-view .t-comment-empty {
  color: var(--ink-faint);
}
.panel-internal * {
  text-shadow: none;
}
.panel-internal .organize-content section > p {
  color: var(--ink-soft);
}
.panel-internal .skeleton {
  background: linear-gradient(
    90deg,
    var(--surface-2) 25%,
    #dfe7f0 37%,
    var(--surface-2) 63%
  );
}
.panel-internal .workspace-panel {
  box-shadow: -12px 0 36px #26374c20;
}

/* Quitar espacio duplicado entre secciones de las tarjetas, sin ocultar sus pendientes. */
.panel-internal #cards-view .card {
  gap: 8px;
}
.panel-internal #cards-view .card-commitment {
  margin: 4px 0;
  gap: 5px 12px;
  font-size: 13px;
}
.panel-internal #cards-view .card-extra {
  margin-top: 0;
  padding-top: 6px;
}
.panel-internal #cards-view .client-notify-bar {
  margin-top: 0;
  padding: 8px;
}
.panel-internal #cards-view .card-secondary-actions > summary {
  padding: 5px 4px;
  font-size: 12px;
  line-height: 1.4;
}

.sidebar {
  flex-basis: 164px;
  width: 164px;
  overflow-y: auto;
}
.sidebar-btn {
  width: calc(100% - 16px);
  justify-content: flex-start;
  gap: 10px;
  padding: 0 10px;
  flex-shrink: 0;
}
.sidebar-btn svg {
  flex-shrink: 0;
}
.nav-label {
  font:
    600 0.76rem "Inter",
    sans-serif;
  text-align: left;
  color: inherit;
}
.sidebar-tools {
  width: 100%;
  flex-shrink: 0;
}
.sidebar-mark {
  align-self: flex-start;
  margin-left: 15px;
}
.sidebar-sep {
  width: calc(100% - 28px);
  flex-shrink: 0;
}
button:focus-visible,
[role="button"]:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.home-guide {
  margin: 0.7rem 0 1rem;
  padding: 0.65rem 0.85rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink-soft);
  font-size: 0.8rem;
  line-height: 1.6;
}
.home-guide summary {
  cursor: pointer;
  color: var(--ink);
  font-weight: 600;
}
.home-guide p {
  margin: 0.45rem 0;
}
.home-guide ul {
  padding-left: 1.2rem;
  margin: 0.5rem 0;
}
.home-section-help {
  color: var(--ink-soft);
  font-size: 0.77rem;
  padding: 0.4rem 0.8rem;
  margin: 0;
  line-height: 1.6;
}
.home-more {
  margin: 1rem 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.8rem;
}
.home-more > summary {
  cursor: pointer;
  font-size: 0.86rem;
  font-weight: 600;
}
.home-more[open] > summary {
  margin-bottom: 1rem;
}
body .home-priority-kpis {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.home-summary-kpis {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.5rem;
  margin: 0.8rem 0;
}
.home-more .home-two-col {
  margin-top: 0.8rem;
}
.ux-reminder-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1rem;
  padding: 0.8rem 0.1rem;
  border-bottom: 1px solid var(--line);
  font-size: 0.8rem;
}
.ux-reminder-row:last-child {
  border-bottom: 0;
}
.ux-reminder-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem;
  margin-bottom: 0.35rem;
}
.ux-reminder-kind {
  font-weight: 600;
}
.ux-reminder-meta {
  color: var(--ink-soft);
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.ux-reminder-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.45rem;
}
.ux-state {
  border: 1px solid var(--line);
  padding: 0.1rem 0.4rem;
  border-radius: 5px;
  font-size: 0.71rem;
  white-space: nowrap;
}
.ux-state.vencido,
.ux-state.sinfecha {
  color: var(--critical);
}
.ux-state.programado {
  color: var(--info);
}
#group-recordatorios .home-mini-head {
  flex-wrap: wrap;
  gap: 0.5rem;
}
#group-recordatorios .home-mini-head h3 {
  font-size: 0.88rem;
}
#group-recordatorios .home-mini-head span {
  font-size: 0.76rem;
}
.home-reminders-upcoming > summary {
  padding: 0.65rem 0;
  cursor: pointer;
  font-size: 0.8rem;
  color: var(--ink-soft);
}
@media (max-width: 640px) {
  body .home-priority-kpis,
  .home-summary-kpis {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sidebar.abierta-movil {
    width: 178px;
  }
  .ux-reminder-row {
    grid-template-columns: 1fr;
    gap: 0.5rem;
  }
  .ux-reminder-actions button {
    min-height: 40px;
  }
  .home-guide {
    padding: 0.6rem;
  }
}

.panel-internal {
  font-size: 15px;
}
.panel-internal [hidden] {
  display: none !important;
}
.panel-internal .wrap,
.panel-internal .page-view,
.panel-internal .card,
.panel-internal .field,
.panel-internal .review-field {
  min-width: 0;
}
.panel-internal button,
.panel-internal input,
.panel-internal select,
.panel-internal textarea {
  font-size: 14px;
}
.panel-internal input:not([type="checkbox"]):not([type="radio"]),
.panel-internal select,
.panel-internal textarea {
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
}
.panel-internal .field-input {
  width: 100%;
}
.panel-internal .field .k,
.panel-internal .field-label,
.panel-internal .eyebrow,
.panel-internal .tracking-note,
.panel-internal .who-hint,
.panel-internal .home-section-help,
.panel-internal .nav-label,
.panel-internal .action-reason-chip,
.panel-internal .updated-line,
.panel-internal .ux-reminder-meta,
.panel-internal .ux-state {
  font-size: 13px;
  line-height: 1.5;
}
.panel-internal .ws-btn,
.panel-internal .chip,
.panel-internal .file-btn,
.panel-internal .comments-btn,
.panel-internal .incidencias-btn,
.panel-internal .workspace-open-btn,
.panel-internal .csr-btn,
.panel-internal .hdr-mini-btn {
  min-height: 40px;
  white-space: normal;
}
.panel-internal .status-select {
  min-height: 36px;
  font-size: 14px;
}
.panel-internal #sidebar .who-toggle-label {
  display: none;
}
.card-secondary-actions > summary {
  cursor: pointer;
  padding: 8px 4px;
  font-size: 14px;
}
#ux-account-menu > summary::after {
  content: " ▾";
  color: var(--ink-soft);
}
.panel-internal .modal-backdrop {
  padding: 16px;
  overflow: hidden;
  z-index: 1500;
}
.panel-internal .who-drawer-backdrop {
  z-index: 1500;
}
.panel-internal #toast-container {
  z-index: 2000;
}
.panel-internal .modal-box {
  box-sizing: border-box;
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
  min-height: 0;
}
.panel-internal .modal-box > * {
  flex-shrink: 0;
}
.panel-internal .modal-head {
  position: sticky;
  top: -1px;
  z-index: 2;
  background: var(--surface);
  padding: 10px 0;
  margin-top: -8px;
}
.panel-internal .modal-close {
  min-width: 40px;
  min-height: 40px;
}
.panel-internal #csr-backdrop .modal-box {
  max-width: 800px;
}
.ux-admin-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding-bottom: 16px;
}
.ux-admin-tabs [aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.panel-internal .csr-form {
  gap: 12px;
  align-items: flex-end;
}
.ux-form-field {
  display: flex;
  flex: 1 1 180px;
  min-width: 0;
  flex-direction: column;
  gap: 6px;
}
.ux-form-field > span {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.4;
}
.ux-form-field > input,
.ux-form-field > select,
.ux-form-field > textarea {
  width: 100%;
  min-height: 40px;
}
.panel-internal .csr-list {
  max-height: 40vh;
}
#ux-account-menu {
  position: relative;
}
#ux-account-menu > summary {
  cursor: pointer;
  list-style: none;
}
#ux-account-menu > summary::-webkit-details-marker {
  display: none;
}
#ux-account-menu .session-chip {
  border-radius: 10px;
  gap: 8px;
  min-height: 40px;
}
#session-chip-role {
  font-size: 13px;
  color: var(--accent);
}
.ux-account-actions {
  position: absolute;
  z-index: 30;
  display: grid;
  gap: 8px;
  top: calc(100% + 8px);
  left: 0;
  min-width: 210px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow-md);
}
#ux-save-feedback {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  margin: 0 0 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 14px;
  background: var(--surface);
}
#ux-save-feedback[data-state="error"] {
  border-color: var(--critical);
  color: var(--critical);
}
#ux-save-feedback[data-state="saving"] {
  color: var(--info);
}
#ux-save-feedback[data-state="saved"] {
  color: var(--good, #4ade80);
}
#ux-advanced-filters {
  margin: 12px 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
}
#ux-advanced-filters > summary {
  cursor: pointer;
  font-size: 14px;
}
.ux-advanced-content {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding-top: 12px;
}
.ux-advanced-content .vistas-bar {
  flex-basis: 100%;
}
.card-extra {
  margin-top: 12px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}
.card-extra > summary {
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink-soft);
  padding: 6px 0;
}
.card-extra .card-mid {
  margin-top: 12px;
}
.card-commitment {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  font-size: 14px;
  margin: 12px 0;
  color: var(--ink-soft);
}
.card-commitment > span {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
}
/* Listado de cargas: ajustar las columnas al espacio real, también con el detalle abierto.
   No ocultar un desbordamiento: texto y controles deben caber dentro de cada celda. */
.panel-internal #table-view .table-section {
  min-width: 0;
}
.panel-internal #table-view .table-wrap {
  overflow: visible;
  min-width: 0;
}
.panel-internal #table-view .loads-table,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table {
  width: 100%;
  min-width: 0;
  table-layout: fixed;
  --column-load: 7%;
  --column-customer: 14%;
  --column-status: 14%;
  --column-date: 10%;
  --column-trailer: 10%;
  --column-city: 9%;
  --column-comment: 27%;
}
/* Recuperar las columnas que la vista dividida antigua ocultaba por posición.
   Dentro de una fila grid/flex, el navegador convierte estas celdas en bloques. */
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col:nth-child(n + 7) {
  display: table-column;
}
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  th:nth-child(n + 7),
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  tr.t-row
  > td:nth-child(n + 7) {
  display: table-cell;
}
/* La regla con :has también reemplaza los anchos fijos de la vista dividida heredada. */
.panel-internal #table-view .loads-table col.c-load,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-load {
  width: var(--column-load);
}
.panel-internal #table-view .loads-table col.c-customer,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-customer {
  width: var(--column-customer);
}
.panel-internal #table-view .loads-table col.c-status,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-status {
  width: var(--column-status);
}
.panel-internal #table-view .loads-table col.c-date,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-date {
  width: var(--column-date);
}
.panel-internal #table-view .loads-table col.c-trailer,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-trailer {
  width: var(--column-trailer);
}
.panel-internal #table-view .loads-table col.c-city,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-city {
  width: var(--column-city);
}
.panel-internal #table-view .loads-table col.c-comment,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-comment {
  width: var(--column-comment);
}
.panel-internal #table-view .loads-table th,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  th {
  white-space: normal;
  overflow-wrap: anywhere;
  padding: 0.7rem 0.4rem;
}
.panel-internal #table-view .loads-table td,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  td {
  white-space: normal;
  overflow-wrap: anywhere;
  overflow: visible;
  padding: 0.7rem 0.4rem;
}
.panel-internal #table-view .t-comment-text {
  white-space: normal;
  overflow-wrap: anywhere;
}
.panel-internal #table-view .t-status-select {
  width: 100%;
  min-width: 0;
  font-size: 12px;
  letter-spacing: 0;
  padding-left: 0.35rem;
}
.panel-internal #table-view .table-detail-load {
  min-width: 0;
  overflow-wrap: anywhere;
}
.loads-table-caption {
  display: none;
}
.trailer-full-value {
  display: block;
  white-space: normal;
  overflow-wrap: anywhere;
  line-height: 1.5;
  font-size: 14px;
}
.table-trailer-edit {
  margin-top: 8px;
}
.table-trailer-edit > summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--accent);
  overflow-wrap: anywhere;
}
.panel-internal .table-trailer-edit .t-trailer-input {
  width: 100%;
  min-width: 0;
  font-size: 14px;
  min-height: 40px;
}
/* El ancho de la lista, incluso al abrir el detalle, decide cuándo agrupar los campos.
   Así se conservan las ocho columnas y se da una fila completa al comentario. */
.panel-internal #table-view .loads-list-section {
  container: loads-list / inline-size;
}
@container loads-list (max-width: 850px) {
  .panel-internal #table-view .loads-table,
  .panel-internal #table-view .loads-table thead,
  .panel-internal #table-view .loads-table tbody {
    display: block;
    width: 100%;
  }
  .panel-internal #table-view .loads-table colgroup {
    display: none;
  }
  .panel-internal #table-view .loads-table-caption {
    display: block;
    padding: 0.7rem;
    text-align: left;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .panel-internal #table-view .loads-table thead tr {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 0.7rem 0.7rem;
  }
  .panel-internal #table-view .loads-table th[data-sort] {
    display: block;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 0.45rem 0.55rem;
  }
  .panel-internal #table-view .loads-table th:not([data-sort]),
  .panel-internal
    #table-view:has(#table-detail-panel:not([hidden]))
    .loads-table
    th:not([data-sort]) {
    display: none;
  }
  .panel-internal #table-view .loads-table tr.t-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-areas:
      "load status"
      "customer customer"
      "trailer delivery"
      "origin destination"
      "comment comment";
    padding: 0.5rem;
    border-top: 1px solid var(--line);
  }
  .panel-internal #table-view .loads-table tr.t-row > td {
    display: block;
    min-width: 0;
    border: 0;
    padding: 0.6rem;
  }
  .panel-internal #table-view .loads-table tr.t-row > td::before {
    content: attr(data-label);
    display: block;
    margin-bottom: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-faint);
  }
  .panel-internal #table-view .loads-table .t-load {
    grid-area: load;
  }
  .panel-internal #table-view .loads-table .t-status {
    grid-area: status;
  }
  .panel-internal #table-view .loads-table .t-customer {
    grid-area: customer;
  }
  .panel-internal #table-view .loads-table .t-trailer {
    grid-area: trailer;
  }
  .panel-internal #table-view .loads-table .t-date-delivery {
    grid-area: delivery;
  }
  .panel-internal #table-view .loads-table .t-origin {
    grid-area: origin;
  }
  .panel-internal #table-view .loads-table .t-destination {
    grid-area: destination;
  }
  .panel-internal #table-view .loads-table .t-comment {
    grid-area: comment;
  }
  .panel-internal #table-view .loads-table .t-status-select {
    font-size: 14px;
  }
}
@container loads-list (min-width: 600px) and (max-width: 850px) {
  .panel-internal #table-view .loads-table tr.t-row {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-areas:
      "load status trailer"
      "customer customer customer"
      "origin destination delivery"
      "comment comment comment";
  }
}
.panel-internal .action-trailer {
  white-space: normal;
  overflow: visible;
  overflow-wrap: anywhere;
}
.history-change-values {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin: 12px 0 0;
}
.history-change-values > div {
  min-width: 0;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.history-change-values dt {
  color: var(--ink-soft);
  font-size: 13px;
  margin-bottom: 6px;
}
.history-change-values dd {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.5;
}
@media (max-width: 640px) {
  .history-change-values {
    grid-template-columns: minmax(0, 1fr);
  }
}
.panel-internal .card .comments-row {
  flex-wrap: wrap;
}
.attention-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 14px;
}
.attention-filters [aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
}
.attention-load {
  padding: 16px;
  border-top: 1px solid var(--line);
}
.attention-load-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.attention-load-header h3 {
  font-size: 16px;
  margin: 0;
}
.attention-load-header > .ws-btn {
  margin-left: auto;
}
.attention-load .ux-reminder-row {
  grid-template-columns: minmax(0, 1fr) auto;
  font-size: 14px;
  padding: 12px 0;
}
.attention-load .ux-reminder-kind {
  font-size: 14px;
}
.attention-load .action-reasons {
  padding: 10px 0 0;
}
.attention-notify {
  padding: 12px 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  color: var(--ink-soft);
}
.attention-notify > span {
  flex: 1 1 220px;
}
.panel-internal :is(input, select, textarea):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
@media (max-width: 640px) {
  .panel-internal .wrap {
    padding-left: 14px;
    padding-right: 14px;
    padding-bottom: 100px;
  }
  .panel-internal .card-mid,
  .panel-internal .review-row {
    grid-template-columns: minmax(0, 1fr);
  }
  .panel-internal .card-top {
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }
  .panel-internal .card-top > div {
    min-width: 0;
    max-width: 100%;
    overflow-wrap: anywhere;
  }

}
.panel-internal .home-secondary-grid .group-toggle {

}
.turno-group-title {

.panel-internal .home-secondary-grid .group-toggle-arrow {

}

.panel-internal .home-secondary-grid .comments-row {

.panel-internal .home-secondary-grid .comments-row > button {

/* La cuadrícula evita que flex-basis de las etiquetas agregue huecos verticales. */
.panel-internal .modal-box.turno-modal {

}
.panel-internal .csr-form.turno-form {

  grid-template-columns: repeat(2, minmax(0, 1fr));

}
.turno-form > * {

}
.turno-field {

}
.turno-field-wide {

}
.panel-internal .turno-field > :is(input, textarea, select) {

.turno-form-help {

}
.turno-load-picker,
.turno-colors {

  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.turno-load-picker > legend,
.turno-colors > legend {
  padding: 0 6px;
  font-size: 14px;
  color: var(--ink);

}
.turno-load-picker .bitacora-load-selected {
  margin: 12px 0;
}
.panel-internal .turno-load-picker .bitacora-load-option {
  min-height: 44px;
  padding: 10px;
  gap: 10px;
  font-size: 13px;
  line-height: 1.5;
}
.turno-load-picker .bitacora-load-option > span {
  min-width: 0;
  overflow-wrap: anywhere;
}
.turno-load-picker .bitacora-load-option > input {

}
.turno-assignment-note {

  line-height: 1.5;
}
.turno-colors .color-swatches {
  flex-wrap: wrap;
  gap: 10px;
}
.panel-internal .turno-colors .color-swatch {
  --task-color: var(--ink-faint);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: auto;
  height: auto;
  min-height: 40px;
  padding: 8px 10px;

  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);

}
.turno-colors .color-swatch::before {
  content: "";
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  border-radius: 50%;

}
.panel-internal .turno-colors .sw-critical {
  --task-color: var(--critical);
}
.panel-internal .turno-colors .sw-warn {
  --task-color: var(--warn);
}
.panel-internal .turno-colors .sw-good {
  --task-color: var(--good);
}
.panel-internal .turno-colors .sw-info {
  --task-color: var(--info);
}

}
.turno-form-actions {

  padding-top: 16px;

.panel-internal .turno-form-actions > .csr-btn {
  padding: 10px 20px;
  min-height: 44px;
}
@media (max-width: 900px) {

  }
}

    grid-template-columns: minmax(0, 1fr);
  }

    gap: 8px;
    padding: 10px 12px;
  }
  .panel-internal .home-secondary-grid .group-toggle {
    flex-basis: 100%;
  }
  .panel-internal .home-secondary-grid .add-btn {
    width: 100%;
  }
  .panel-internal .home-secondary-grid .cards {
    padding: 12px;
  }
  .panel-internal .turno-form-actions > .csr-btn {
    width: 100%;
  }
}

.panel-internal .home-secondary-grid .group-toggle .count {
  background: var(--surface);
  min-width: 26px;
  padding: 2px 8px;
  text-align: center;
}

/* En estos formularios el encabezado cubre el borde superior al desplazarse. */
.panel-internal .modal-box.turno-modal {
  padding: 0 22px 20px;
}
.panel-internal .turno-modal .modal-head {
  top: 0;
  margin-top: 0;
  padding: 16px 0 12px;
}

}

    padding: 0 16px 16px;
  }

/* Calendario: controles de filtrado separados de los movimientos que abren expedientes. */

.cal-type-field {

}
.cal-client-field {
  flex: 1 1 220px;
}
.panel-internal #cal-cliente {
  width: 100%;

.cal-summary h2 {

}
#cal-result {
  color: var(--ink-soft);

}
.cal-no-results {

.panel-internal #cal-grid .cal-chip {

.panel-internal #cal-grid .cal-chip small {

.panel-internal #cal-grid .cal-dia-head {

@media (max-width: 640px) {

/* Plan del día: tres grupos y tarjetas con identidad, ruta y equipo siempre visibles. */
#action-center .action-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));

}

  grid-template-columns: minmax(0, 1fr);
}
.attention-lane {
  min-width: 0;
  --lane-color: #92b1e8;
}
.attention-lane-now {
  --lane-color: #fb8a8a;
}
.attention-lane-today {
  --lane-color: #ffb469;
}
.attention-lane-future {
  --lane-color: #83c9c3;
}
.attention-lane-head {
  display: flex;

.attention-load-header h3 {

}
.attention-load-header .attention-customer {

  color: #b7c3d9;
  font-size: 12px;
  line-height: 1.5;

.attention-load-header .ux-state {
  margin: 0;
  color: var(--lane-color);

}
.attention-route {

  line-height: 1.6;
  color: var(--ink-soft);
}
.attention-route > span {
  color: var(--lane-color);
}
.attention-equipment {
  display: grid;

  margin: 5px 0 0;

  font-weight: 600;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.attention-card-content {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  line-height: 1.6;
}
.attention-card-content > p {
  color: var(--ink-soft);
}
.attention-load .ux-reminder-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12px;
  padding: 12px 0;
}
.attention-load .ux-reminder-kind {
  font-size: 12px;
}
.attention-load .ux-reminder-meta {

.attention-load .ux-reminder-actions {

.attention-load .ux-reminder-actions button,
.attention-load .attention-notify button {

.attention-load .attention-notify {

  border-radius: 8px;

.attention-load .attention-notify > span {

}
.attention-load .action-reason-chip {

.attention-load .attention-open {

  margin-top: 14px;

.attention-lane-empty {

.attention-lane-items .lista-mas-btn {

/* Agenda semanal: días en filas y tarjetas anchas; el exceso se despliega sin perder registros. */

  display: grid;
  grid-template-columns: minmax(0, 1fr);

  grid-template-columns: 136px minmax(0, 1fr);

  border-radius: 12px;
  background: #101620;

/* Plan compacto: un grupo por defecto y solo lo esencial en cada fila.
   Las acciones conservan sus controles dentro de un desplegable accesible con teclado. */
#action-center .action-list,
#action-center .action-list.attention-single-lane {
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
}
.attention-lane-items,
.attention-single-lane .attention-lane-items {
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
}
.attention-lane-head {
  padding: 11px 0;
  border-top-width: 2px;
}
.attention-lane-head p {
  display: none;
}
.attention-lane-count {
  min-width: 26px;
  height: 26px;
  font-size: 12px;
}
#action-center .attention-load {
  padding: 12px 14px;
  box-shadow: none;
  border-radius: 9px;
}
.attention-row-main {
  display: grid;
  grid-template-columns:
    minmax(140px, 1.2fr) minmax(170px, 1fr) minmax(150px, 1.2fr)
    auto;
  align-items: center;
  gap: 18px;
}
.attention-load-header {
  display: block;
}
.attention-load-header h3 {
  font-size: 14px;
}
.attention-load-header .attention-customer {
  display: block;
  margin-top: 4px;
  font-size: 11px;
}
.attention-equipment {
  margin: 0;
  padding: 0;
  gap: 14px;
  background: transparent;
  border: 0;
  border-radius: 0;
}
.attention-equipment dt {
  font-size: 10px;
}
.attention-equipment dd {
  font-size: 13px;
  margin-top: 3px;
}
.attention-focus {
  min-width: 0;
  font-size: 12px;
  line-height: 1.5;
}
.attention-focus strong {
  display: block;
  color: var(--lane-color);
  font-weight: 500;
}
.attention-focus > span {
  display: block;
  color: var(--ink-soft);
  margin-top: 4px;
  font-size: 11px;
}
.attention-load .attention-open {
  margin: 0;
  width: auto;
  gap: 14px;
  white-space: normal;
  padding: 8px 10px;
}
.attention-actions {
  margin-top: 8px;
}
.attention-actions > summary {
  cursor: pointer;
  width: fit-content;
  margin-left: auto;
  padding: 3px 0;
  color: #9dafc8;
  font-size: 11px;
}
.attention-actions[open] > summary {
  color: #ffb067;
}
.attention-actions > .attention-card-content {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.attention-actions .attention-route {
  margin-top: 0;
}
.attention-actions .attention-notify {
  padding: 10px 12px;
}
.attention-filters {
  align-items: center;
  gap: 8px;
}
.attention-filters [data-attention-count] {
  display: inline-block;
  min-width: 20px;
  margin-left: 6px;
  padding: 2px 5px;
  background: #ffffff0a;
  border-radius: 5px;
  font-size: 11px;
}
.attention-extra-filters > summary {
  padding: 9px 6px;
  cursor: pointer;
  color: var(--ink-soft);
  font-size: 12px;
}
.attention-extra-filters > div {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.attention-extra-filters[open] {
  flex-basis: 100%;
  order: 1;
}
.attention-actions > summary:focus-visible,
.attention-extra-filters > summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}
@media (max-width: 1050px) {
  .attention-row-main {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
    gap: 12px;
  }
  .attention-focus {
    grid-column: 1 / 3;
    grid-row: 2;
  }
  .attention-load .attention-open {
    grid-column: 3;
    grid-row: 1 / 3;
  }
}
@media (max-width: 600px) {
  .attention-row-main {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .attention-equipment {
    grid-column: 1 / -1;
    grid-row: 2;
  }
  .attention-focus {
    grid-column: 1 / -1;
    grid-row: 3;
  }
  .attention-load .attention-open {
    grid-column: 2;
    grid-row: 1;
  }
  .attention-actions > summary {
    margin-left: 0;

    flex: 1 1 85px;
    font-size: 11px;
    padding: 9px 6px;
  }

#action-center .action-center-count {
  white-space: nowrap;
  flex-shrink: 0;
}

  color: var(--accent);
}

/* El usuario elige la densidad del calendario sin cambiar la semana ni sus filtros. */

}

.panel-internal #page-operation #table-view .loads-table {
  /* La densidad cambia solo espacios, nunca las columnas ni el tamaño del texto. */
  --load-row-space: 12px;
  --load-heading-space: 11px;
  --column-load: 6%;
  --column-customer: 10%;
  --column-city: 7.5%;
  --column-date: 9%;
  --column-trailer: 7%;
  --column-status: 13%;
  --column-comment: 19%;
  border-collapse: collapse;
  background: #fff;
  color: #283548;
  border: 1px solid #dce3ed;
}
.panel-internal #page-operation #table-view .loads-table col.c-truck {

}
.panel-internal #page-operation #table-view .loads-table col.c-position {

}
.panel-internal #page-operation #table-view .loads-table .t-position {

.table-order-help {

}

  display: inline-flex;

  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-2);

  font-variant-numeric: tabular-nums;

  touch-action: none;
  user-select: none;
}

  color: var(--ink-soft);

  cursor: grabbing;
}
.panel-internal #page-operation #table-view .loads-table .load-dragging {
  opacity: 0.5;
}
.panel-internal #page-operation #table-view .load-drop-before > td {

.panel-internal #page-operation #table-view .load-drop-after > td {

}

.panel-internal

  background: #fff2cc !important;
  color: #806313 !important;
  border-color: #ecddae;
}
.panel-internal
  #page-operation
  #table-view
  tr:is(
    [data-status="Cancelado."],
    [data-status="Cancelado"],
    [data-status="Descompuesta"],
    [data-status="TONU"]
  )
  .t-status-select {
  background: #fbe8e8 !important;
  color: #963e3e !important;
  border-color: #edcccc;
}
.panel-internal #page-operation #table-view .t-status-select option {
  background: #fff;
  color: #283548;
}
/* El selector de la hoja prevalecía sobre el rosa del estatus original. */
.panel-internal
  #page-operation
  #table-view
  tr[data-plant="true"]
  .t-status-select {
  background: var(--pink-soft) !important;
  color: var(--pink) !important;
  border-color: #d9adc6;
}
.panel-internal .sheet-detail-dialog {
  width: min(720px, calc(100vw - 24px));
  max-width: none;
  max-height: calc(100dvh - 36px);
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--ink);
  background: var(--surface);
  box-shadow: 0 24px 80px #0008;
  overflow: auto;
}
.sheet-detail-dialog::backdrop {
  background: #0c142366;
}
.panel-internal
  #page-operation
  #table-view
  .sheet-detail-dialog
  .table-detail-section {
  position: static;
  width: auto;
  max-height: none;
  margin: 0;
  padding: 0;
  overflow: visible;
}
.sheet-detail-dialog .t-detail-content {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.sheet-detail-dialog .table-section-h2 {
  display: none;
}
.sheet-detail-dialog .table-detail-head {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--surface);
}
.sheet-load-link:focus-visible,
.sheet-comment-link:focus-visible {
  outline: 2px solid #3478c5;
  outline-offset: 3px;
  border-radius: 3px;
}
@container loads-list (max-width: 850px) {
  .panel-internal #page-operation #table-view .loads-table tr.t-row {
    grid-template-areas: "position status" "load load" "customer customer" "origin destination" "pickup delivery" "truck trailer" "comment comment";
  }
  .panel-internal #page-operation #table-view .loads-table .t-position {
    grid-area: position;
    text-align: left;
  }
  .panel-internal #page-operation #table-view .loads-table .t-position::before {
    display: none;
  }
  .load-order-handle {
    min-height: 40px;
    min-width: 40px;
  }
  .panel-internal #page-operation #table-view .loads-table .t-truck-number {
    grid-area: truck;
  }
  .panel-internal #page-operation #table-view .loads-table .t-date-pickup {
    grid-area: pickup;
  }
  .panel-internal #page-operation #table-view .loads-table tr.t-row > td {
    border: 0;
    padding: var(--load-row-space) 6px;
  }
  .panel-internal
    #page-operation
    #table-view
    .loads-table
    tr.t-row
    > td::before {
    color: #72839a;
    font-size: 10px;
  }
  .panel-internal #page-operation #table-view .loads-table-caption {
    color: #68788c;
  }
}
@container loads-list (min-width: 600px) and (max-width: 850px) {
  .panel-internal #page-operation #table-view .loads-table tr.t-row {
    grid-template-areas: "position load status" "customer customer customer" "origin destination truck" "pickup delivery trailer" "comment comment comment";
  }
}
@media (max-width: 600px) {
  #densidad-select {
    min-height: 40px;
  }
  .panel-internal #page-operation.sheet-view {
    padding: 12px;
  }
  .sheet-toolbar #cliente-filter,
  .sheet-toolbar .sheet-filter {
    flex: 1 1 120px;
  }
  .sheet-toolbar #operation-state-filter {
    width: 100%;
  }
  .sheet-toolbar #search {
    flex-basis: 100%;
  }
  .sheet-detail-dialog .t-detail-content {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Pendientes puntuales: notas breves y compartidas, sin ocupar otra columna en Cargas. */
.punctual-section {
  margin: 0 0 18px;
  padding: 16px;
  border: 1px solid #d6b461;
  border-radius: 12px;
  background: #fffaf0;
  color: #332a19;
}
.punctual-section[hidden],
.punctual-editor [hidden] {
  display: none !important;
}
.punctual-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.punctual-section-head h2 {
  margin: 0;
  font-size: 17px;
  color: #5f400a;
}
.punctual-section-head p,
.punctual-more {
  margin: 5px 0 0;
  font-size: 12px;
  color: #63543b;
}
.punctual-list {
  margin-top: 12px;
  display: grid;
  gap: 8px;
}
.punctual-item {
  display: grid;
  grid-template-columns: minmax(155px, 1fr) minmax(0, 2fr) auto;
  gap: 14px;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid #e5d8ba;
  border-radius: 8px;
  background: #fff;
  min-width: 0;
}
.punctual-item-unit {
  display: grid;
  gap: 3px;
  min-width: 0;
}
.punctual-item-unit strong {
  font-size: 13px;
}
.punctual-item-unit span,
.punctual-item-unit small {
  font-size: 12px;
  color: #566171;
  overflow-wrap: anywhere;
}
.punctual-item p {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.punctual-editor {
  grid-column: 1 / -1;
  margin: 12px 0;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg);
  min-width: 0;
}
.punctual-editor.is-active {
  border-color: #d6b461;
  background: #fffaf0;
}
.punctual-choice,
.punctual-fields label {
  display: grid;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
}
.punctual-choice {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
}
.punctual-editor select,
.punctual-editor textarea {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 8px;
  border: 1px solid #adb8c8;
  border-radius: 6px;
  background: #fff;
  color: #243247;
  font: inherit;
}
.punctual-fields {
  margin-top: 10px;
}
.punctual-editor textarea {
  resize: vertical;
  font-size: 13px;
  font-weight: 400;
}
.punctual-fields p,
.punctual-origin {
  margin: 6px 0;
  color: #63543b;
  font-size: 12px;
  line-height: 1.5;
}
.punctual-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.punctual-error {
  margin: 8px 0 0;
  color: #a32323;
  font-size: 13px;
}
.punctual-dot {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 14px;
  height: 14px;
  margin-left: 3px;
  border-radius: 50%;
  background: #815400;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}
.punctual-badge {
  display: inline-block;
  margin: 4px;
  padding: 3px 7px;
  background: #fff0c4;
  color: #654107;
  border-radius: 4px;
  font-size: 11px;
}
@media (max-width: 600px) {
  .punctual-section {
    padding: 12px;
  }
  .punctual-section-head {
    align-items: flex-start;
    flex-direction: column;
  }
  .punctual-item {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
  }
  .punctual-item p {
    grid-column: 1 / -1;
    grid-row: 2;
  }
  .punctual-choice {
    grid-template-columns: 1fr;
  }
}

/* Iconos locales de logística: debajo del trailer y con nombre accesible, nunca solo color. */
.load-signals-control {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 3px;
  max-width: 100%;
  width: fit-content;
  margin-top: 5px;
  padding: 2px;
  border: 1px dashed #a9b8cb;
  border-radius: 6px;
  background: #fff;
  color: #35516e;
  cursor: pointer;
  font: inherit;
}
.load-signals-control:hover {
  border-color: #366da2;
  background: #edf4fc;
}
.load-signals-control:focus-visible,
.signal-option:focus-within {
  outline: 2px solid #245d96;
  outline-offset: 2px;
}
.load-signals-empty {
  font-size: 10px;
  line-height: 18px;
  white-space: nowrap;
  padding: 0 3px;
}
.logistics-signal {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 23px;
  height: 23px;
  border-radius: 5px;
  background: #edf3fc;
  color: #245781;
}
.logistics-signal svg {
  display: block;
  width: 18px;
  height: 18px;
}
.signal-red {
  background: #ffe3e5;
  color: #b42332;
}
.signal-orange {
  background: #ffead8;
  color: #994708;
}
.signal-amber {
  background: #fff0c4;
  color: #795307;
}
.signal-blue {
  background: #e5efff;
  color: #245781;
}
.signal-purple {
  background: #f0e7ff;
  color: #6e3ea4;
}
.signal-teal {
  background: #dcf3ef;
  color: #146b60;
}
.load-signals-dialog {
  box-sizing: border-box;
  width: min(590px, calc(100vw - 24px));
  max-height: calc(100dvh - 32px);
  overflow: auto;
  border: 1px solid #c4d0df;
  border-radius: 13px;
  padding: 20px;
  color: #243247;
  background: #fff;
  box-shadow: 0 20px 80px #19283e30;
}
.load-signals-dialog::backdrop {
  background: #172b4780;
}
.load-signals-head {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.load-signals-head h2 {
  margin: 0;
  color: #243247;
  font-size: 18px;
  overflow-wrap: anywhere;
}
.signal-close {
  border: 0;
  background: transparent;
  color: #53647b;
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  font-size: 25px;
  cursor: pointer;
}
#load-signals-help {
  color: #53647b;
  line-height: 1.5;
  font-size: 13px;
  margin: 8px 0 16px;
}
.load-signals-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
.signal-option {
  display: flex;
  gap: 8px;
  align-items: center;
  min-width: 0;
  border: 1px solid #cbd6e3;
  border-radius: 9px;
  padding: 10px;
  background: #fff;
  cursor: pointer;
}
.signal-option:has(input:checked) {
  border-color: #3a70a8;
  background: #edf4ff;
  box-shadow: inset 0 0 0 1px #3a70a8;
}
.signal-option:has(input:disabled:not(:checked)) {
  opacity: 0.65;
  cursor: default;
}
.signal-option input {
  margin: 0;
  flex-shrink: 0;
  accent-color: #245d96;
}
.signal-option .logistics-signal {
  width: 31px;
  height: 31px;
}
.signal-option .logistics-signal svg {
  width: 23px;
  height: 23px;
}
.signal-option-text {
  display: grid;
  gap: 4px;
  min-width: 0;
}
.signal-option-text strong {
  font-size: 12px;
  line-height: 1.4;
  color: #243247;
}
.signal-option-text small {
  font-size: 11px;
  line-height: 1.4;
  color: #53647b;
}
.load-signals-summary,
.load-signals-footer {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  margin-top: 16px;
}
#load-signals-count {
  font-size: 12px;
  color: #53647b;
}
.signal-clear {
  border: 0;
  padding: 5px;
  background: transparent;
  color: #245d96;
  text-decoration: underline;
  font-size: 12px;
  cursor: pointer;
}
.load-signals-footer {
  justify-content: flex-end;
  border-top: 1px solid #dde5ee;
  padding-top: 14px;
}
.load-signals-error {
  color: #a32323;
  font-size: 13px;
  line-height: 1.5;
  margin: 12px 0 0;
}
.load-signals-dialog [hidden] {
  display: none !important;
}
@media (max-width: 480px) {
  .load-signals-dialog {
    padding: 14px;
  }
  .load-signals-options {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* En la columna de trailer, tres marcas ocupan una sola línea cuando hay espacio. */
.sheet-view .t-trailer .load-signals-control {
  gap: 2px;
  padding: 1px;
}
.sheet-view .t-trailer .logistics-signal {
  width: 20px;
  height: 20px;
}
.sheet-view .t-trailer .logistics-signal svg {
  width: 16px;
  height: 16px;
}

.panel-internal #cards-view .card-commitment .load-signals-control {
  display: inline-flex;
  vertical-align: middle;
  margin: 0 0 0 6px;
}

.organize-dialog {
  color: var(--ink, #e2e8f0);
  background: var(--panel, #10151e);
  border: 1px solid #44516a;
  border-radius: 14px;
  width: min(760px, 92vw);
  max-height: 88vh;
  padding: 0;
  box-sizing: border-box;
}
.organize-dialog::backdrop {
  background: #000b;
}
.organize-dialog form {
  padding: 20px;
}
.organize-dialog header,
.organize-dialog footer,
.organize-tabs {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
  flex-wrap: wrap;
}
.organize-dialog h2 {
  font-size: 19px;
  margin: 0;
}
.organize-dialog footer {
  margin-top: 20px;
  justify-content: flex-end;
}
.organize-dialog label {
  display: grid;
  gap: 7px;
  margin: 13px 0;
  font-size: 14px;
}
.organize-dialog input,
.organize-dialog textarea,
.organize-dialog select {
  width: 100%;
  box-sizing: border-box;
  background: #090e16;
  color: #e2e8f0;
  border: 1px solid #46516a;
  padding: 10px;
  border-radius: 7px;
  font: inherit;
}
.organize-dialog textarea {
  min-height: 84px;
}
.organize-dialog button,
.organize-toolbar button,
.organize-tabs button {
  cursor: pointer;
  background: #202b40;
  color: #e2e8f0;
  border: 1px solid #44516a;
  border-radius: 7px;
  padding: 9px 12px;
}
.organize-dialog [aria-invalid="true"] {
  border-color: #fa718b;
}
.organize-error {
  color: #ff99ab;
}
.organize-status {
  white-space: pre-wrap;
}
.organize-row {
  border-top: 1px solid #2b3547;
  padding: 12px 0;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.organize-row span {
  flex: 1;
  min-width: 180px;
}
.organize-row small {
  display: block;
  color: #a7b6cf;
}
.organize-toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 0;
}
.organize-chip {
  border: 1px solid #44516a;
  border-radius: 18px;
  padding: 4px 10px;
  font-size: 12px;
}
.organize-fields {
  overflow-wrap: anywhere;
}
.organize-dialog progress {
  width: 100%;
}
.organize-help {
  line-height: 1.7;
}
.organize-fields [data-check] {
  width: auto;
}
.organize-dialog details {
  margin: 12px 0;
}
/* Diálogos heredados comparten ritmo visual y mantienen el scroll dentro de su contenido. */
.panel-internal .modal-box {
  border-radius: 14px;
  max-height: 90vh;
  overflow: auto;
}
.panel-internal .modal-box input,
.panel-internal .modal-box select,
.panel-internal .modal-box textarea {
  box-sizing: border-box;
  min-height: 38px;
}
.panel-internal [aria-invalid="true"] {
  outline: 1px solid #fa718b;
}
.field-validation-error {
  display: block;
  color: #ff99ab;
  font-size: 12px;
  margin-top: 5px;
}
.decision-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 12px;
  background: #1b2130;
  border-radius: 9px;
}
.decision-summary div:last-child {
  grid-column: 1/-1;
}
.decision-summary dt {
  color: #9aa7c2;
  font-size: 12px;
}
.decision-summary dd {
  margin: 4px 0 0;
  overflow-wrap: anywhere;
}

/* Pestaña activa y checklist: mostrar selección y conservar casillas del tamaño de un control. */
.organize-tabs [aria-pressed="true"] {
  background: #234d7a;
  border-color: #7bb6ff;
  box-shadow: inset 0 0 0 1px #7bb6ff;
}
.organize-dialog input[type="checkbox"] {
  width: auto;
  justify-self: start;
}

/* Ventana principal: navegación estable a la izquierda y una sola sección de trabajo a la derecha.
   Los formularios secundarios conservan el ancho y los controles compartidos de organize-dialog. */
.organize-hub {
  width: min(1120px, 94vw);
  max-height: 90vh;
  border-color: #354158;
  border-radius: 18px;
  box-shadow: 0 24px 100px #0009;
}
.organize-hub > form {
  padding: 0;
}
.organize-hub .organize-hub-head {
  padding: 24px 28px;
  background: linear-gradient(115deg, #1d2738, #131b29);
  border-bottom: 1px solid #303c51;
  align-items: flex-start;
  flex-wrap: nowrap;
}
.organize-eyebrow {
  display: block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.13em;
  color: #c99462;
}
.organize-hub h2 {
  margin-top: 7px;
  font-size: 25px;
  letter-spacing: -0.03em;
}
.organize-hub-head p {
  margin: 8px 0 0;
  color: #a9b8cd;
  font-size: 13px;
  line-height: 1.6;
}
.organize-hub .organize-close {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 9px;
  background: #ffffff06;
  font-size: 24px;
}
.organize-layout {
  display: grid;
  grid-template-columns: 290px minmax(0, 1fr);
  min-height: 450px;
}
.organize-hub .organize-tabs {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  gap: 5px;
  padding: 18px 14px;
  background: #0c131e;
  border-right: 1px solid #29354a;
}
.organize-nav-label {
  margin: 6px 12px 8px;
  color: #8799b5;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.organize-nav-label:not(:first-child) {
  margin-top: 20px;
}
.organize-hub .organize-tabs button {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 13px 12px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9px;
  text-align: left;
}
.organize-tabs svg {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
  color: #97abc7;
}
.organize-tabs button > span:first-of-type {
  min-width: 0;
  flex: 1;
}
.organize-tabs strong {
  display: block;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
}
.organize-tabs small {
  display: block;
  color: #8fa3bf;
  font-size: 10px;
  line-height: 1.5;
  margin-top: 3px;
}
.organize-nav-arrow {
  color: #657791;
  font-size: 19px;
}
.organize-hub .organize-tabs button[aria-pressed="true"] {
  background: #f9941812;
  border-color: #f9941840;
  box-shadow: none;
  color: #ffc088;
}
.organize-tabs button[aria-pressed="true"] svg,
.organize-tabs button[aria-pressed="true"] .organize-nav-arrow {
  color: #ffae68;
}
.organize-hub .organize-tabs button:hover {
  background: #ffffff06;
}
.organize-hub .organize-tabs button[aria-pressed="true"]:hover {
  background: #f994181c;
}
.organize-content {
  min-width: 0;
  padding: 28px;
  overflow-wrap: anywhere;
}
.organize-content-head {
  padding-bottom: 18px;
  border-bottom: 1px solid #29354a;
  margin-bottom: 18px;
}
.organize-content-head .organize-eyebrow {
  color: #8da5c7;
}
.organize-content-head h3 {
  margin: 8px 0 0;
  font-size: 21px;
}
.organize-content section > p {
  font-size: 13px;
  line-height: 1.8;
  color: #aebdd3;
  margin: 0 0 20px;
}
.organize-content section > button {
  margin: 0 8px 18px 0;
  border-color: #f9941855;
  color: #ffbb7f;
  background: #ff8b1812;
}
.organize-content .organize-row {
  padding: 16px;
  margin: 0 0 10px;
  border: 1px solid #2c384e;
  border-radius: 10px;
  background: #182131;
  gap: 12px;
}
.organize-content .organize-row > span {
  font-size: 13px;
  line-height: 1.6;
  min-width: 0;
  flex: 1 1 200px;
}
.organize-content .organize-row small {
  font-size: 11px;
  margin-top: 6px;
  line-height: 1.6;
  color: #93a7c4;
}
.organize-content .organize-row button {
  flex-shrink: 0;
  font-size: 12px;
  background: #202d42;
}
.organize-content .organize-status:empty {
  display: none;
}
.organize-content .organize-status:not(:empty) {
  padding: 12px;
  border: 1px solid #556b8d;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
}
.organize-hub button:focus-visible,
.cal-day-more summary:focus-visible {
  outline: 2px solid #ffae68;
  outline-offset: 3px;
}
@media (max-width: 740px) {
  .organize-hub {
    width: 96vw;
    border-radius: 12px;
  }
  .organize-hub .organize-hub-head {
    padding: 20px 16px;
  }
  .organize-hub h2 {
    font-size: 22px;
  }
  .organize-layout {
    grid-template-columns: minmax(0, 1fr);
    min-height: 0;
  }
  .organize-hub .organize-tabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    padding: 12px;
    border-right: 0;
    border-bottom: 1px solid #29354a;
    gap: 6px;
  }
  .organize-nav-label {
    grid-column: 1 / -1;
    margin: 6px 4px;
  }
  .organize-nav-label:not(:first-child) {
    margin-top: 12px;
  }
  .organize-hub .organize-tabs button {
    gap: 8px;
    padding: 10px 8px;
    align-items: flex-start;
    border-color: #28344a;
  }
  .organize-tabs svg {
    width: 17px;
    height: 17px;
  }
  .organize-tabs strong {
    font-size: 11px;
  }
  .organize-tabs small,
  .organize-nav-arrow {
    display: none;
  }
  .organize-content {
    padding: 20px 16px;
  }
  .organize-content-head h3 {
    font-size: 19px;
  }
}

/* La apertura informa espera y fallo junto al botón y permite volver a intentarlo. */
.organize-load-status {
  flex: 1 1 100%;
  max-width: 520px;
  color: #ffb4a6;
  font-size: 12px;
  line-height: 1.6;
}
.organize-load-status:empty {
  display: none;
}
.organize-toolbar button:disabled {
  cursor: wait;
  opacity: 0.65;
}
