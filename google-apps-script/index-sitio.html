<ul><li><b>Revisiones y seguimientos:</b> cuándo debes volver a revisar una carga. Vencer no borra el recordatorio.</li>
<li><b>Avisos al cliente:</b> información que debes comunicarle. Registra el aviso cuando ya lo enviaste.</li>
<li><b>Solicitudes y tareas:</b> solicitudes sin carga confirmada y trabajo que registraste o te asignaron.</li></ul>
<p>Las revisiones en tránsito se repiten cada 3 horas. Un seguimiento que programas tú se completa o cambia de fecha desde la carga.</p>

`,xa=`:root {
      /* Tema oscuro "control tower" — superficies casi negras con un ligero tinte azul,
         y colores de acento saturados/brillantes (estilo neón) que resaltan sobre el fondo. */
      --paper: #090c13; --surface: #10141d; --surface-2: #1b2130;
      --ink: #eef1f8; --ink-soft: #9aa7c2; --ink-faint: #5c6784; --line: #232a3c;
      --accent: #ff8a3d; --accent-soft: rgba(255,138,61,0.16);
      --good: #2ee881; --good-soft: rgba(46,232,129,0.15);
      --warn: #ffd93d; --warn-soft: rgba(255,217,61,0.15);
      --critical: #ff3d63; --critical-soft: rgba(255,61,99,0.16);
      --info: #3fb0ff; --info-soft: rgba(63,176,255,0.15);
      --purple: #b98cff; --purple-soft: rgba(185,140,255,0.16);
      --teal: #2de2c8; --teal-soft: rgba(45,226,200,0.15);
      --pink: #ff6fc4; --pink-soft: rgba(255,111,196,0.15);
      --brown: #d9a468; --brown-soft: rgba(217,164,104,0.14);
      --slate: #93a2c9; --slate-soft: rgba(147,162,201,0.14);
      --radius: 14px; --radius-sm: 8px;
      --shadow: 0 1px 2px rgba(0,0,0,0.45), 0 1px 1px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 24px -6px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
      --glow-sm: 0 0 8px;
      --glow-md: 0 0 16px;
      --ease: 180ms cubic-bezier(.2,.7,.3,1);
      --font: "Inter", -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    /* Sin esto, el navegador sigue dibujando los controles nativos (el ícono de calendario de
       los campos de fecha/hora, su selector emergente, etc.) con los colores de un tema claro
       aunque el resto de la página ya sea oscuro — el ícono queda casi invisible sobre el fondo
       oscuro del campo, como si "se hubiera borrado". Esto le dice al navegador que dibuje esos
       controles nativos ya pensados para un fondo oscuro. */
    :root { color-scheme: dark; }
    /* Todo ícono SVG de la interfaz brilla con el color de su propio trazo — así se ve
       "neón" de forma consistente sin tener que ajustar cada ícono a mano. */
    svg { filter: drop-shadow(0 0 3px currentColor); }
    body {
      background: var(--paper); color: var(--ink);
      font-family: var(--font);
      line-height: 1.5; -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app-shell { display: flex; align-items: flex-start; min-height: 100vh; }

    .sidebar {
      flex: 0 0 60px; width: 60px; position: sticky; top: 0; height: 100vh;
      background: #070a10; border-right: 1px solid var(--line);
      display: flex; flex-direction: column; align-items: center; padding: 1rem 0; gap: 0.35rem; z-index: 20;
    }
    .sidebar-mark {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 0.75rem;
    }
    .sidebar-mark img {
      width: 30px; height: 30px; object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(255,138,61,0.65));
    }
    .sidebar-btn {
      width: 40px; height: 40px; border-radius: var(--radius-sm); border: none; background: none;
      color: var(--ink-faint); display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background var(--ease), color var(--ease);
    }
    .sidebar-btn svg { width: 19px; height: 19px; }
    .sidebar-btn:hover { background: var(--surface-2); color: var(--ink); }
    .sidebar-btn.active { background: var(--accent-soft); color: var(--accent); }
    .sidebar-sep { width: 26px; height: 1px; background: var(--line); margin: 0.5rem 0; }
    .sidebar-tools { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 0.35rem; }

    .wrap { flex: 1 1 auto; min-width: 0; max-width: 1240px; margin: 0 auto; padding: 1.5rem 1.75rem 4rem; }

    .refresh-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background var(--ease), color var(--ease), border-color var(--ease);

    .file-btn {

      border-radius: var(--radius-sm); background: var(--accent); color: #fff;
      cursor: pointer; border: none; transition: filter var(--ease), transform var(--ease), box-shadow var(--ease);
      box-shadow: 0 0 12px rgba(255,138,61,0.35);
    }
    .file-btn:hover { filter: brightness(1.08); box-shadow: 0 0 18px rgba(255,138,61,0.55); }
    .file-btn:active { transform: scale(0.98); }
    #file-input { display: none; }
    /* Resultado de la importación: renglón propio bajo los botones del encabezado; no ocupa lugar si está vacío. */
    .import-status { font-size: 0.78rem; color: var(--ink-soft); flex: 1 0 100%; text-align: right; margin-top: -0.5rem; }
    .import-status:empty { display: none; }
    .import-btn { color: var(--accent); border-color: var(--accent-soft); }
    .import-status.ok { color: var(--good); }
    .import-status.err { color: var(--critical); }
    .who-toggle-btn {
      display: inline-flex; align-items: center; gap: 0.45rem; font-family: var(--font);
      font-size: 0.8rem; font-weight: 600; padding: 0.4rem 0.85rem 0.4rem 0.6rem; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
      transition: border-color var(--ease), color var(--ease);
    }
    .who-toggle-btn:hover { border-color: var(--accent); }
    .who-toggle-label { white-space: nowrap; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .session-chip {
      display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.3rem 0.7rem 0.3rem 0.3rem;
      border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
    }
    .session-chip-avatar {
      width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
      display: inline-flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 800;
      font-family: var(--font); text-transform: uppercase; flex: none;
    }
    .session-chip-name { font-size: 0.78rem; font-weight: 600; color: var(--ink); white-space: nowrap; }
    .hdr-mini-btn {
      font-family: var(--font); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.01em;
      padding: 0.4rem 0.6rem; border-radius: 7px; border: 1px solid var(--line); background: var(--surface);
      color: var(--ink-soft); cursor: pointer; white-space: nowrap; transition: border-color var(--ease), color var(--ease);
    }
    .hdr-mini-btn:hover { border-color: var(--accent); color: var(--ink); }
    .hdr-mini-btn-danger { color: #ff8f8f; border-color: rgba(255,107,107,.35); }
    .hdr-mini-btn-danger:hover { border-color: #ff6b6b; }

    .who-drawer-backdrop {

    .who-drawer {
      position: fixed; top: 0; left: 0; bottom: 0; width: 300px; max-width: 85vw; background: var(--surface);
      box-shadow: var(--shadow); display: flex; flex-direction: column; padding: 1.1rem 1.1rem 1.25rem;
      transform: translateX(-100%); transition: transform 0.2s ease;
    }
    .who-drawer-backdrop.show .who-drawer { transform: translateX(0); }
    .who-drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.9rem; }
    .who-drawer-body { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    .who-group-title { font-family: "Inter", sans-serif; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin: 0 0 0.4rem; }
    .who-row {
      display: block; width: 100%; text-align: left; font-family: "Inter", sans-serif; font-size: 0.88rem;
      padding: 0.5rem 0.65rem; border-radius: 7px; border: none; background: none; color: var(--ink); cursor: pointer;
    }
    .who-row:hover { background: var(--surface-2); }
    .who-row.active { background: var(--ink); color: var(--paper); font-weight: 600; }
    .who-sub { padding-left: 0.9rem; display: none; flex-direction: column; gap: 0.15rem; margin-top: 0.2rem; }
    .who-sub.open { display: flex; }
    .who-sub .who-row { font-size: 0.82rem; padding: 0.4rem 0.6rem; }
    .who-sub-readonly { padding: 0.4rem 0.9rem; font-size: 0.78rem; color: var(--ink-soft); }
    .who-sub-readonly b { color: var(--ink); font-weight: 600; }
    .who-hint { font-size: 0.72rem; color: var(--ink-faint); font-style: italic; margin-top: 0.6rem; padding: 0 0.1rem; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.85rem; margin-bottom: 1.75rem; }
    .stat {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 1.1rem 1.25rem; box-shadow: var(--shadow); transition: box-shadow var(--ease), transform var(--ease);
    }
    .stat:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .stat-clickable { cursor: pointer; border-width: 1.5px; }
    .stat-clickable:active { transform: translateY(0); }
    .stat-clickable:has(.n.accent) { border-color: var(--accent); }
    .stat-clickable:has(.n.good) { border-color: var(--good); }
    .stat-clickable:has(.n.warn) { border-color: var(--warn); }
    .stat-clickable:has(.n.critical) { border-color: var(--critical); }
    .stat-hint {
      display: flex; align-items: center; gap: 0.2rem; margin-top: 0.4rem;
      font-family: "Inter", sans-serif; font-size: 0.66rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.9;
    }
    .stat-hint svg { width: 9px; height: 9px; transition: transform var(--ease); }
    .stat-clickable:hover .stat-hint svg { transform: translateX(2px); }
    .stat:has(.n.accent) .stat-hint { color: var(--accent); }
    .stat:has(.n.good) .stat-hint { color: var(--good); }
    .stat:has(.n.warn) .stat-hint { color: var(--warn); }
    .stat:has(.n.critical) .stat-hint { color: var(--critical); }
    .stat-icon {
      display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px;
      border-radius: 7px; background: var(--info-soft); color: var(--info); margin-bottom: 0.6rem;
    }
    .stat-icon svg { width: 14px; height: 14px; }
    /* El ícono de cada tarjeta toma el mismo color que su número, para que ambos "brillen" juntos. */
    .stat:has(.n.accent) .stat-icon { background: var(--accent-soft); color: var(--accent); }
    .stat:has(.n.good) .stat-icon { background: var(--good-soft); color: var(--good); }
    .stat:has(.n.warn) .stat-icon { background: var(--warn-soft); color: var(--warn); }
    .stat:has(.n.critical) .stat-icon { background: var(--critical-soft); color: var(--critical); }
    .stat .n {

      font-variant-numeric: tabular-nums; color: var(--ink); display: block; line-height: 1.15;
      text-shadow: 0 0 10px transparent; transition: text-shadow var(--ease);
    }
    .stat .n.accent { color: var(--accent); text-shadow: 0 0 12px rgba(255,138,61,0.45); }
    .stat .n.good { color: var(--good); text-shadow: 0 0 12px rgba(46,232,129,0.4); }
    .stat .n.warn { color: var(--warn); text-shadow: 0 0 12px rgba(255,217,61,0.4); }
    .stat .n.critical { color: var(--critical); text-shadow: 0 0 12px rgba(255,61,99,0.45); }
    .stat .l { font-size: 0.72rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-top: 0.3rem; display: block; }
    .skeleton {

    @keyframes skeleton-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1.1rem; }
    .chip {

    }
    .chip:hover { border-color: var(--accent); color: var(--ink); }

    .search {

    .table-section { margin-bottom: 2rem; }

    /* La sección de detalle se dibuja como una segunda sección aparte (su propio encabezado + tarjeta,

    .loads-table th {

    .loads-table td { padding: 1.05rem 1rem; border-bottom: 1px solid var(--line); vertical-align: middle; font-variant-numeric: tabular-nums; overflow: hidden; }
    .loads-table tbody tr.t-row { cursor: pointer; transition: background var(--ease); }
    .loads-table tbody tr.t-row:hover { background: var(--surface-2); }

    .loads-table tbody tr.t-color-purple, .loads-table tbody tr.t-color-purple + tr.t-detail-row { background: var(--purple-soft); }
    .loads-table tbody tr.t-color-teal, .loads-table tbody tr.t-color-teal + tr.t-detail-row { background: var(--teal-soft); }
    .loads-table tbody tr.t-color-pink, .loads-table tbody tr.t-color-pink + tr.t-detail-row { background: var(--pink-soft); }

    /* Panel fijo de detalle debajo de la tabla — se dibuja con el load que esté seleccionado

      box-shadow: var(--shadow); padding: 1.1rem 1.25rem; display: grid; grid-template-columns: 1fr; gap: 0.85rem;

    .card.manual-color.s-info { background: var(--info-soft); }
    .card.manual-color.s-purple { background: var(--purple-soft); }
    .card.manual-color.s-teal { background: var(--teal-soft); }

    .pod-pending-tag {

    /* Alerta automática (mismo motor que Portal Cliente/Vista Gerencia — ver deriveAlertLevel_

    }

    .card-mid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.85rem; padding-top: 0.75rem; border-top: 1px solid var(--line); }
    .field .k { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; margin-bottom: 0.2rem; }
    .field .v { font-family: "Inter", sans-serif; font-size: 0.86rem; font-variant-numeric: tabular-nums; color: var(--ink); }

    .docs { display: flex; gap: 0.45rem; align-items: center; }

      content: attr(data-tooltip); position: absolute; bottom: 145%; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--paper); font-family: "Inter", sans-serif; font-size: 0.7rem;
      font-weight: 500; white-space: nowrap; padding: 0.3rem 0.6rem; border-radius: 6px; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none; transition: opacity 0.12s ease; z-index: 20;
    }
    .dot::before {
      content: ''; position: absolute; bottom: 145%; left: 50%; transform: translateX(-50%) translateY(70%);
      border: 5px solid transparent; border-top-color: var(--ink); opacity: 0; pointer-events: none; transition: opacity 0.12s ease; z-index: 20;
    }

/* Comentarios rápidos (frases que se insertan en el comentario). */

/* Acciones directas en la campana de avisos. */

.cal-nav{display:flex;gap:.4rem;flex-wrap:wrap}

#confirmar-backdrop{z-index:1700}
.atajos{border-collapse:collapse;font-size:.8rem}.atajos td{padding:.3rem .6rem .3rem 0}
kbd{display:inline-block;min-width:1.4em;padding:.1rem .4rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface-2);font:700 .72rem/1.3 var(--font);text-align:center;color:var(--ink)}

/* Aviso "Sin conexión" en el encabezado */
.conexion-aviso{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .6rem;border-radius:999px;border:1px solid var(--critical);color:var(--critical);background:var(--critical-soft);font-size:.7rem;font-weight:700;white-space:nowrap}
.conexion-aviso::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--critical);animation:conexionPulso 1.4s ease-in-out infinite}
.conexion-aviso[hidden]{display:none}
@keyframes conexionPulso{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.conexion-aviso::before{animation:none}}

/* Tabla de Operación completa: "Mostrar más", densidad, selección masiva */
.tabla-mas{display:block;margin:.6rem auto .2rem}
.tabla-mas[hidden]{display:none}
#table-view.tabla-compacta .loads-table td{padding:.42rem .7rem;font-size:.8rem}
#table-view.tabla-compacta .loads-table th{padding:.5rem .7rem}
.file-btn.file-btn-sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.file-btn.file-btn-sec:hover{border-color:var(--accent);color:var(--accent);filter:none;box-shadow:none}
.file-btn.file-btn-sec.activo{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.masivo-bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.55rem .75rem;margin:0 0 .6rem;border:1px solid var(--accent);border-radius:10px;background:var(--surface)}
.masivo-bar[hidden]{display:none}
.masivo-bar b{font-size:.8rem;color:var(--accent)}
.masivo-bar .link-btn,.vistas-bar .link-btn{width:auto;padding:0 .2rem;font-size:.74rem}
.masivo-sep{flex:1 1 auto}
.masivo-bar select{font:inherit;font-size:.75rem;padding:.4rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.masivo-bar .ws-btn:disabled{opacity:.45;cursor:not-allowed}
#table-view.modo-masivo .loads-table tbody tr.t-row td:first-child{box-shadow:inset 3px 0 0 var(--line)}
.loads-table tbody tr.t-row.sel-masivo{background:var(--accent-soft)}
.loads-table tbody tr.t-row.sel-masivo td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* Mis vistas */
.vistas-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin:-.25rem 0 .8rem}
.vistas-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700}
.vista-chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);overflow:hidden}
.vista-chip button{border:0;background:none;color:var(--ink);font:inherit;font-size:.72rem;font-weight:650;padding:.28rem .25rem .28rem .65rem;cursor:pointer}
.vista-chip button:hover{color:var(--accent)}
.vista-chip .vista-x{padding:.28rem .55rem .28rem .3rem;color:var(--ink-faint);font-size:.85rem;line-height:1}
.vista-chip .vista-x:hover{color:var(--critical)}

/* Guías de primeros pasos (secciones vacías) */
.guia{border:1px dashed var(--line);border-radius:12px;padding:1rem 1.1rem;background:var(--surface);max-width:640px}
.guia-titulo{display:block;font-size:.9rem;margin-bottom:.6rem}
.guia-pasos{margin:0 0 .85rem;padding-left:1.2rem;display:grid;gap:.5rem}
.guia-pasos li{font-size:.78rem;color:var(--ink-soft);line-height:1.45}
.guia-pasos li b{display:block;color:var(--ink);font-size:.8rem}

/* Bitácora de admin */
.admin-bitacora{max-height:260px;overflow:auto}
.admin-bitacora .admin-item{flex-wrap:wrap;gap:.2rem .6rem;font-size:.74rem}

/* Radar: mapa y "¿cuánto le falta?" */
.radar-mapa{height:380px;border:1px solid var(--line);border-radius:12px;margin:.2rem 0 .8rem;overflow:hidden;background:var(--surface-2)}
.radar-mapa[hidden]{display:none}
#radar-mapa-btn.activo{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.falta-card{margin-top:.8rem}
.falta-resultado{display:grid;gap:.25rem;margin-top:.55rem;font-size:.8rem}
.falta-resultado:empty{display:none}

/* Barra inferior en celular */
.barra-movil{display:none}
@media (max-width: 640px){
  .sidebar{display:none}
  .sidebar.abierta-movil{display:flex;position:fixed;left:0;top:0;bottom:64px;height:auto;z-index:1300;box-shadow:12px 0 30px rgba(0,0,0,.5);overflow-y:auto}
  .barra-movil{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1250;background:#070a10;border-top:1px solid var(--line);padding:.3rem .25rem calc(.3rem + env(safe-area-inset-bottom))}
  .barra-movil button{flex:1 1 0;position:relative;display:flex;flex-direction:column;align-items:center;gap:.15rem;border:0;background:none;color:var(--ink-faint);font:inherit;font-size:.62rem;font-weight:650;padding:.35rem 0;border-radius:8px;cursor:pointer}
  .barra-movil button svg{width:20px;height:20px}
  .barra-movil button.active{color:var(--accent)}
  .movil-badge{position:absolute;top:0;left:calc(50% + 4px);min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--critical);color:#fff;font-size:.58rem;line-height:15px;text-align:center}
  .movil-badge[hidden]{display:none}
  .wrap{padding-bottom:76px}
  .avisos-panel{top:auto;bottom:72px;right:8px;left:8px;width:auto}
}

.sidebar {
  flex-basis: 164px;
  width: 164px;
  overflow-y: auto;
}
.sidebar-btn {
  width: calc(100% - 16px);
  justify-content: flex-start;
  gap: 10px;
  padding: 0 10px;
  flex-shrink: 0;
}
.sidebar-btn svg {
  flex-shrink: 0;
}
.nav-label {
  font:
    600 0.76rem "Inter",
    sans-serif;
  text-align: left;
  color: inherit;
}
.sidebar-tools {
  width: 100%;
  flex-shrink: 0;
}
.sidebar-mark {
  align-self: flex-start;
  margin-left: 15px;
}
.sidebar-sep {
  width: calc(100% - 28px);
  flex-shrink: 0;
}
button:focus-visible,
[role="button"]:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.home-guide {
  margin: 0.7rem 0 1rem;
  padding: 0.65rem 0.85rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink-soft);
  font-size: 0.8rem;
  line-height: 1.6;
}
.home-guide summary {
  cursor: pointer;
  color: var(--ink);
  font-weight: 600;
}
.home-guide p {
  margin: 0.45rem 0;
}
.home-guide ul {
  padding-left: 1.2rem;
  margin: 0.5rem 0;
}
.home-section-help {
  color: var(--ink-soft);
  font-size: 0.77rem;
  padding: 0.4rem 0.8rem;
  margin: 0;
  line-height: 1.6;
}
.home-more {
  margin: 1rem 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.8rem;
}
.home-more > summary {
  cursor: pointer;
  font-size: 0.86rem;
  font-weight: 600;
}
.home-more[open] > summary {
  margin-bottom: 1rem;
}
body .home-priority-kpis {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.home-summary-kpis {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.5rem;
  margin: 0.8rem 0;
}
.home-more .home-two-col {
  margin-top: 0.8rem;
}
.ux-reminder-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1rem;
  padding: 0.8rem 0.1rem;
  border-bottom: 1px solid var(--line);
  font-size: 0.8rem;
}
.ux-reminder-row:last-child {
  border-bottom: 0;
}
.ux-reminder-title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem;
  margin-bottom: 0.35rem;
}
.ux-reminder-kind {
  font-weight: 600;
}
.ux-reminder-meta {
  color: var(--ink-soft);
  line-height: 1.6;
  overflow-wrap: anywhere;
}
.ux-reminder-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.45rem;
}
.ux-state {
  border: 1px solid var(--line);
  padding: 0.1rem 0.4rem;
  border-radius: 5px;
  font-size: 0.71rem;
  white-space: nowrap;
}
.ux-state.vencido,
.ux-state.sinfecha {
  color: var(--critical);
}
.ux-state.programado {
  color: var(--info);
}
#group-recordatorios .home-mini-head {
  flex-wrap: wrap;
  gap: 0.5rem;
}
#group-recordatorios .home-mini-head h3 {
  font-size: 0.88rem;
}
#group-recordatorios .home-mini-head span {
  font-size: 0.76rem;
}
.home-reminders-upcoming > summary {
  padding: 0.65rem 0;
  cursor: pointer;
  font-size: 0.8rem;
  color: var(--ink-soft);
}
@media (max-width: 640px) {
  body .home-priority-kpis,
  .home-summary-kpis {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sidebar.abierta-movil {
    width: 178px;
  }
  .ux-reminder-row {
    grid-template-columns: 1fr;
    gap: 0.5rem;
  }
  .ux-reminder-actions button {
    min-height: 40px;
  }
  .home-guide {
    padding: 0.6rem;
  }
}

.panel-internal {
  font-size: 15px;
}
.panel-internal [hidden] {
  display: none !important;
}
.panel-internal .wrap,
.panel-internal .page-view,
.panel-internal .card,
.panel-internal .field,
.panel-internal .review-field {
  min-width: 0;
}
.panel-internal button,
.panel-internal input,
.panel-internal select,
.panel-internal textarea {
  font-size: 14px;
}
.panel-internal input:not([type="checkbox"]):not([type="radio"]),
.panel-internal select,
.panel-internal textarea {
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
}
.panel-internal .field-input {
  width: 100%;
}
.panel-internal .field .k,
.panel-internal .field-label,
.panel-internal .eyebrow,
.panel-internal .tracking-note,
.panel-internal .who-hint,
.panel-internal .home-section-help,
.panel-internal .nav-label,
.panel-internal .action-reason-chip,
.panel-internal .updated-line,
.panel-internal .ux-reminder-meta,
.panel-internal .ux-state {
  font-size: 13px;
  line-height: 1.5;
}
.panel-internal .ws-btn,
.panel-internal .chip,
.panel-internal .file-btn,
.panel-internal .comments-btn,
.panel-internal .incidencias-btn,
.panel-internal .workspace-open-btn,
.panel-internal .csr-btn,
.panel-internal .hdr-mini-btn {
  min-height: 40px;
  white-space: normal;
}
.panel-internal .status-select {
  min-height: 36px;
  font-size: 14px;
}
.panel-internal #sidebar .who-toggle-label {
  display: none;
}
.card-secondary-actions > summary {
  cursor: pointer;
  padding: 8px 4px;
  font-size: 14px;
}
#ux-account-menu > summary::after {
  content: " ▾";
  color: var(--ink-soft);
}
.panel-internal .modal-backdrop {
  padding: 16px;
  overflow: hidden;
  z-index: 1500;
}
.panel-internal .who-drawer-backdrop {
  z-index: 1500;
}
.panel-internal #toast-container {
  z-index: 2000;
}
.panel-internal .modal-box {
  box-sizing: border-box;
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
  min-height: 0;
}
.panel-internal .modal-box > * {
  flex-shrink: 0;
}
.panel-internal .modal-head {
  position: sticky;
  top: -1px;
  z-index: 2;
  background: var(--surface);
  padding: 10px 0;
  margin-top: -8px;
}
.panel-internal .modal-close {
  min-width: 40px;
  min-height: 40px;
}
.panel-internal #csr-backdrop .modal-box {
  max-width: 800px;
}
.ux-admin-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding-bottom: 16px;
}
.ux-admin-tabs [aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.panel-internal .csr-form {
  gap: 12px;
  align-items: flex-end;
}
.ux-form-field {
  display: flex;
  flex: 1 1 180px;
  min-width: 0;
  flex-direction: column;
  gap: 6px;
}
.ux-form-field > span {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.4;
}
.ux-form-field > input,
.ux-form-field > select,
.ux-form-field > textarea {
  width: 100%;
  min-height: 40px;
}
.panel-internal .csr-list {
  max-height: 40vh;
}
#ux-account-menu {
  position: relative;
}
#ux-account-menu > summary {
  cursor: pointer;
  list-style: none;
}
#ux-account-menu > summary::-webkit-details-marker {
  display: none;
}
#ux-account-menu .session-chip {
  border-radius: 10px;
  gap: 8px;
  min-height: 40px;
}
#session-chip-role {
  font-size: 13px;
  color: var(--accent);
}
.ux-account-actions {
  position: absolute;
  z-index: 30;
  display: grid;
  gap: 8px;
  top: calc(100% + 8px);
  left: 0;
  min-width: 210px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow-md);
}
#ux-save-feedback {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  margin: 0 0 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 14px;
  background: var(--surface);
}
#ux-save-feedback[data-state="error"] {
  border-color: var(--critical);
  color: var(--critical);
}
#ux-save-feedback[data-state="saving"] {
  color: var(--info);
}
#ux-save-feedback[data-state="saved"] {
  color: var(--good, #4ade80);
}
#ux-advanced-filters {
  margin: 12px 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
}
#ux-advanced-filters > summary {
  cursor: pointer;
  font-size: 14px;
}
.ux-advanced-content {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding-top: 12px;
}
.ux-advanced-content .vistas-bar {
  flex-basis: 100%;
}
.card-extra {
  margin-top: 12px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}
.card-extra > summary {
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink-soft);
  padding: 6px 0;
}
.card-extra .card-mid {
  margin-top: 12px;
}
.card-commitment {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  font-size: 14px;
  margin: 12px 0;
  color: var(--ink-soft);
}
.card-commitment > span {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
}
/* Listado de cargas: ajustar las columnas al espacio real, también con el detalle abierto.
   No ocultar un desbordamiento: texto y controles deben caber dentro de cada celda. */
.panel-internal #table-view .table-section {
  min-width: 0;
}
.panel-internal #table-view .table-wrap {
  overflow: visible;
  min-width: 0;
}
.panel-internal #table-view .loads-table,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table {
  width: 100%;
  min-width: 0;
  table-layout: fixed;
  --column-load: 7%;
  --column-customer: 14%;
  --column-status: 14%;
  --column-date: 10%;
  --column-trailer: 10%;
  --column-city: 9%;
  --column-comment: 27%;
}
/* Recuperar las columnas que la vista dividida antigua ocultaba por posición.
   Dentro de una fila grid/flex, el navegador convierte estas celdas en bloques. */
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col:nth-child(n + 7) {
  display: table-column;
}
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  th:nth-child(n + 7),
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  tr.t-row
  > td:nth-child(n + 7) {
  display: table-cell;
}
/* La regla con :has también reemplaza los anchos fijos de la vista dividida heredada. */
.panel-internal #table-view .loads-table col.c-load,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-load {
  width: var(--column-load);
}
.panel-internal #table-view .loads-table col.c-customer,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-customer {
  width: var(--column-customer);
}
.panel-internal #table-view .loads-table col.c-status,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-status {
  width: var(--column-status);
}
.panel-internal #table-view .loads-table col.c-date,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-date {
  width: var(--column-date);
}
.panel-internal #table-view .loads-table col.c-trailer,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-trailer {
  width: var(--column-trailer);
}
.panel-internal #table-view .loads-table col.c-city,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-city {
  width: var(--column-city);
}
.panel-internal #table-view .loads-table col.c-comment,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  col.c-comment {
  width: var(--column-comment);
}
.panel-internal #table-view .loads-table th,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  th {
  white-space: normal;
  overflow-wrap: anywhere;
  padding: 0.7rem 0.4rem;
}
.panel-internal #table-view .loads-table td,
.panel-internal
  #table-view:has(#table-detail-panel:not([hidden]))
  .loads-table
  td {
  white-space: normal;
  overflow-wrap: anywhere;
  overflow: visible;
  padding: 0.7rem 0.4rem;
}
.panel-internal #table-view .t-comment-text {
  white-space: normal;
  overflow-wrap: anywhere;
}
.panel-internal #table-view .t-status-select {
  width: 100%;
  min-width: 0;
  font-size: 12px;
  letter-spacing: 0;
  padding-left: 0.35rem;
}
.panel-internal #table-view .table-detail-load {
  min-width: 0;
  overflow-wrap: anywhere;
}
.loads-table-caption {
  display: none;
}
.trailer-full-value {
  display: block;
  white-space: normal;
  overflow-wrap: anywhere;
  line-height: 1.5;
  font-size: 14px;
}
.table-trailer-edit {
  margin-top: 8px;
}
.table-trailer-edit > summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--accent);
  overflow-wrap: anywhere;
}
.panel-internal .table-trailer-edit .t-trailer-input {
  width: 100%;
  min-width: 0;
  font-size: 14px;
  min-height: 40px;
}
/* El ancho de la lista, incluso al abrir el detalle, decide cuándo agrupar los campos.
   Así se conservan las ocho columnas y se da una fila completa al comentario. */
.panel-internal #table-view .loads-list-section {
  container: loads-list / inline-size;
}
@container loads-list (max-width: 850px) {
  .panel-internal #table-view .loads-table,
  .panel-internal #table-view .loads-table thead,
  .panel-internal #table-view .loads-table tbody {
    display: block;
    width: 100%;
  }
  .panel-internal #table-view .loads-table colgroup {
    display: none;
  }
  .panel-internal #table-view .loads-table-caption {
    display: block;
    padding: 0.7rem;
    text-align: left;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .panel-internal #table-view .loads-table thead tr {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 0.7rem 0.7rem;
  }
  .panel-internal #table-view .loads-table th[data-sort] {
    display: block;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 0.45rem 0.55rem;
  }
  .panel-internal #table-view .loads-table th:not([data-sort]),
  .panel-internal
    #table-view:has(#table-detail-panel:not([hidden]))
    .loads-table
    th:not([data-sort]) {
    display: none;
  }
  .panel-internal #table-view .loads-table tr.t-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-areas:
      "load status"
      "customer customer"
      "trailer delivery"
      "origin destination"
      "comment comment";
    padding: 0.5rem;
    border-top: 1px solid var(--line);
  }
  .panel-internal #table-view .loads-table tr.t-row > td {
    display: block;
    min-width: 0;
    border: 0;
    padding: 0.6rem;
  }
  .panel-internal #table-view .loads-table tr.t-row > td::before {
    content: attr(data-label);
    display: block;
    margin-bottom: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-faint);
  }
  .panel-internal #table-view .loads-table .t-load {
    grid-area: load;
  }
  .panel-internal #table-view .loads-table .t-status {
    grid-area: status;
  }
  .panel-internal #table-view .loads-table .t-customer {
    grid-area: customer;
  }
  .panel-internal #table-view .loads-table .t-trailer {
    grid-area: trailer;
  }
  .panel-internal #table-view .loads-table .t-date-delivery {
    grid-area: delivery;
  }
  .panel-internal #table-view .loads-table .t-origin {
    grid-area: origin;
  }
  .panel-internal #table-view .loads-table .t-destination {
    grid-area: destination;
  }
  .panel-internal #table-view .loads-table .t-comment {
    grid-area: comment;
  }
  .panel-internal #table-view .loads-table .t-status-select {
    font-size: 14px;
  }
}
@container loads-list (min-width: 600px) and (max-width: 850px) {
  .panel-internal #table-view .loads-table tr.t-row {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-areas:
      "load status trailer"
      "customer customer customer"
      "origin destination delivery"
      "comment comment comment";
  }
}
.panel-internal .action-trailer {
  white-space: normal;
  overflow: visible;
  overflow-wrap: anywhere;
}
.history-change-values {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin: 12px 0 0;
}
.history-change-values > div {
  min-width: 0;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.history-change-values dt {
  color: var(--ink-soft);
  font-size: 13px;
  margin-bottom: 6px;
}
.history-change-values dd {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px;
  line-height: 1.5;
}

  line-height: 1.5;

    border-color 0.15s,
    background 0.15s;
}
.cal-chip.t-pickup {
  --event-color: #67b4ff;
}
.cal-chip.t-cruce {
  --event-color: #ffbb68;
}
.cal-chip.t-entrega {
  --event-color: #7bdbb0;
}
.cal-chip.t-apartado {
  --event-color: #bd9aff;
}
.panel-internal #cal-grid .cal-chip:hover {
  background: #1e2b40;
  border-color: var(--event-color);
}
.cal-event-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 11px;
  color: var(--event-color);
}
.cal-event-top time {
  color: #edf2fa;
  font-weight: 700;
  font-size: 12px;
}
.cal-chip strong {
  font-size: 14px;
}
.panel-internal #cal-grid .cal-chip .cal-event-client {
  margin: 4px 0 10px;
  color: #acbdd4;
  font-size: 12px;
}
.cal-event-equipment {
  margin-top: auto;
  font-size: 11px;
  color: #becbdf;
}
.cal-event-status {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding-top: 8px;
  margin-top: 8px;
  border-top: 1px solid #ffffff0e;
  color: #96a8c2;
  font-size: 11px;
}
.cal-day-more {
  margin-top: 12px;
}
.cal-day-more summary {
  cursor: pointer;
  padding: 10px 12px;
  border: 1px dashed #465570;
  border-radius: 7px;
  font-size: 12px;
  color: #b9c9e1;
}
.cal-day-more summary span:last-child,
.cal-day-more[open] summary span:first-child {
  display: none;
}
.cal-day-more[open] summary span:last-child {
  display: inline;
}
.cal-day-more[open] summary {
  margin-bottom: 12px;
}
.panel-internal #cal-grid .cal-vacio {
  padding: 12px 0;
  margin: 0;
  color: #8fa0b9;
  font-size: 12px;
}
.panel-internal #cal-grid .cal-dia-empty .cal-dia-head {
  flex-direction: row;
  align-items: center;
  grid-column: 1 / -1;
  border: 0;
  padding: 10px 18px;
}
.cal-dia-empty .cal-dia-head > div {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.cal-dia-empty .cal-dia-head h3 {
  font-size: 17px;
  margin: 0;
}
.panel-internal #cal-grid .cal-dia-empty .cal-dia-body {
  display: none;
}
@media (max-width: 1250px) {
  #action-center .action-list {
    grid-template-columns: minmax(0, 1fr);
  }
  .attention-lane-items,
  .attention-single-lane .attention-lane-items {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .cal-day-events {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 700px) {
  #action-center .action-list {
    padding: 4px 12px 16px;
    gap: 20px;
  }
  .attention-lane-items,
  .attention-single-lane .attention-lane-items {
    grid-template-columns: minmax(0, 1fr);
  }
  .panel-internal #cal-grid .cal-dia {
    grid-template-columns: minmax(0, 1fr);
  }
  .panel-internal #cal-grid .cal-dia-head {
    flex-direction: row;
    align-items: center;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 12px;
  }
  .cal-dia-head > div {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cal-dia-head h3 {
    margin: 0;
    font-size: 22px;
  }
  .cal-day-events {
    grid-template-columns: minmax(0, 1fr);
  }
  .panel-internal #cal-grid .cal-dia-body {
    padding: 12px;
  }
}

/* Plan compacto: un grupo por defecto y solo lo esencial en cada fila.
   Las acciones conservan sus controles dentro de un desplegable accesible con teclado. */
#action-center .action-list,
#action-center .action-list.attention-single-lane {
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
}
.attention-lane-items,
.attention-single-lane .attention-lane-items {
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
}
.attention-lane-head {
  padding: 11px 0;
  border-top-width: 2px;
}
.attention-lane-head p {
  display: none;
}
.attention-lane-count {
  min-width: 26px;
  height: 26px;
  font-size: 12px;
}
#action-center .attention-load {
  padding: 12px 14px;
  box-shadow: none;
  border-radius: 9px;
}
.attention-row-main {
  display: grid;
  grid-template-columns:
    minmax(140px, 1.2fr) minmax(170px, 1fr) minmax(150px, 1.2fr)
    auto;
  align-items: center;
  gap: 18px;
}
.attention-load-header {
  display: block;
}
.attention-load-header h3 {
  font-size: 14px;
}
.attention-load-header .attention-customer {
  display: block;
  margin-top: 4px;
  font-size: 11px;
}
.attention-equipment {
  margin: 0;
  padding: 0;
  gap: 14px;
  background: transparent;
  border: 0;
  border-radius: 0;
}
.attention-equipment dt {
  font-size: 10px;
}
.attention-equipment dd {
  font-size: 13px;
  margin-top: 3px;
}
.attention-focus {
  min-width: 0;
  font-size: 12px;
  line-height: 1.5;
}
.attention-focus strong {
  display: block;
  color: var(--lane-color);
  font-weight: 500;
}
.attention-focus > span {
  display: block;
  color: var(--ink-soft);
  margin-top: 4px;
  font-size: 11px;
}
.attention-load .attention-open {
  margin: 0;
  width: auto;
  gap: 14px;
  white-space: normal;
  padding: 8px 10px;
}
.attention-actions {
  margin-top: 8px;
}
.attention-actions > summary {
  cursor: pointer;
  width: fit-content;
  margin-left: auto;
  padding: 3px 0;
  color: #9dafc8;
  font-size: 11px;
}
.attention-actions[open] > summary {
  color: #ffb067;
}
.attention-actions > .attention-card-content {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.attention-actions .attention-route {
  margin-top: 0;
}
.attention-actions .attention-notify {
  padding: 10px 12px;
}
.attention-filters {
  align-items: center;
  gap: 8px;
}
.attention-filters [data-attention-count] {
  display: inline-block;
  min-width: 20px;
  margin-left: 6px;
  padding: 2px 5px;
  background: #ffffff0a;
  border-radius: 5px;
  font-size: 11px;
}
.attention-extra-filters > summary {
  padding: 9px 6px;
  cursor: pointer;
  color: var(--ink-soft);
  font-size: 12px;
}
.attention-extra-filters > div {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.attention-extra-filters[open] {
  flex-basis: 100%;
  order: 1;
}
.attention-actions > summary:focus-visible,
.attention-extra-filters > summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}
@media (max-width: 1050px) {
  .attention-row-main {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
    gap: 12px;
  }
  .attention-focus {
    grid-column: 1 / 3;
    grid-row: 2;
  }
  .attention-load .attention-open {
    grid-column: 3;
    grid-row: 1 / 3;
  }
}
@media (max-width: 600px) {
  .attention-row-main {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .attention-equipment {
    grid-column: 1 / -1;
    grid-row: 2;
  }
  .attention-focus {
    grid-column: 1 / -1;
    grid-row: 3;
  }
  .attention-load .attention-open {
    grid-column: 2;
    grid-row: 1;
  }
  .attention-actions > summary {
    margin-left: 0;
    padding: 6px 0;
  }
  .attention-filters > [data-attention-filter] {
    flex: 1 1 85px;
    font-size: 11px;
    padding: 9px 6px;
  }
}

#action-center .action-center-count {
  white-space: nowrap;
  flex-shrink: 0;
}
.attention-extra-filters.has-active-filter > summary {
  color: var(--accent);
}

/* El usuario elige la densidad del calendario sin cambiar la semana ni sus filtros. */
.cal-view-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px 24px;
  margin: 16px 0;
}
.cal-view-switch {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
}
.cal-view-switch > span {
  color: var(--ink-soft);
  font-size: 12px;
  margin-right: 3px;
}
.cal-view-switch [aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.cal-view-bar .cal-filter-help {
  flex: 1 1 320px;
  margin: 0;
}
.panel-internal #cal-grid[data-view="week"] {
  grid-template-columns: repeat(7, minmax(0, 1fr));
  align-items: start;
  gap: 9px;
}
.panel-internal #cal-grid[data-view="week"] .cal-dia {
  grid-template-columns: minmax(0, 1fr);
}
.panel-internal #cal-grid[data-view="week"] .cal-dia-head {
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 12px;
  border-right: 0;
  border-bottom: 1px solid var(--line);
}
.panel-internal #cal-grid[data-view="week"] .cal-day-events {
  grid-template-columns: minmax(0, 1fr);
}
.panel-internal #cal-grid[data-view="week"] .cal-dia-body {
  padding: 8px;
}
.panel-internal #cal-grid[data-view="week"] .cal-chip {
  padding: 9px;
}
.panel-internal #cal-grid[data-view="week"] .cal-dia-empty .cal-dia-head > div {
  display: block;
}
.panel-internal #cal-grid[data-view="list"] .cal-day-events {
  grid-template-columns: minmax(0, 1fr);
  gap: 6px;
}
.panel-internal #cal-grid[data-view="list"] .cal-chip {
  display: grid;
  grid-template-columns: 100px 110px minmax(0, 1.3fr) minmax(0, 1fr) minmax(
      0,
      0.8fr
    );
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-top-width: 1px;
  border-left: 3px solid var(--event-color);
}
.panel-internal #cal-grid[data-view="list"] .cal-event-top {
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  margin: 0;
}
.panel-internal #cal-grid[data-view="list"] .cal-event-client,
.panel-internal #cal-grid[data-view="list"] .cal-event-equipment,
.panel-internal #cal-grid[data-view="list"] .cal-event-status {
  margin: 0;
  padding: 0;
  border: 0;
}
.review-state {
  display: inline-block;
  color: var(--good);
  background: var(--good-soft);
  padding: 8px 10px;
  border-radius: 7px;
  margin: 0 0 10px;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.review-state.due {
  color: var(--warn);
  background: var(--warn-soft);
}
@media (max-width: 1350px) {
  .panel-internal #cal-grid[data-view="week"] {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .panel-internal #cal-grid[data-view="list"] .cal-chip {
    grid-template-columns: 100px 110px minmax(0, 1fr);
  }
}
@media (max-width: 950px) {
  .panel-internal #cal-grid[data-view="week"] {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 550px) {
  .panel-internal #cal-grid[data-view="week"] {
    grid-template-columns: minmax(0, 1fr);
  }
  .panel-internal #cal-grid[data-view="list"] .cal-chip {
    grid-template-columns: 80px minmax(0, 1fr);
  }
  .panel-internal #cal-grid[data-view="list"] .cal-event-client,
  .panel-internal #cal-grid[data-view="list"] .cal-event-equipment,
  .panel-internal #cal-grid[data-view="list"] .cal-event-status {
    grid-column: 1 / -1;
  }
}

.organize-dialog {

  border: 1px solid #44516a;
  border-radius: 14px;
  width: min(760px, 92vw);
  max-height: 88vh;
  padding: 0;
  box-sizing: border-box;
}
.organize-dialog::backdrop {
  background: #000b;
}
.organize-dialog form {
  padding: 20px;
}
.organize-dialog header,
.organize-dialog footer,
.organize-tabs {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
  flex-wrap: wrap;
}
.organize-dialog h2 {
  font-size: 19px;
  margin: 0;
}
.organize-dialog footer {
  margin-top: 20px;
  justify-content: flex-end;
}
.organize-dialog label {
  display: grid;
  gap: 7px;
  margin: 13px 0;
  font-size: 14px;
}
.organize-dialog input,
.organize-dialog textarea,
.organize-dialog select {
  width: 100%;
  box-sizing: border-box;
  background: #090e16;
  color: #e2e8f0;
  border: 1px solid #46516a;
  padding: 10px;
  border-radius: 7px;
  font: inherit;
}
.organize-dialog textarea {
  min-height: 84px;
}
.organize-dialog button,
.organize-toolbar button,
.organize-tabs button {
  cursor: pointer;
  background: #202b40;
  color: #e2e8f0;
  border: 1px solid #44516a;
  border-radius: 7px;
  padding: 9px 12px;
}
.organize-dialog [aria-invalid="true"] {
  border-color: #fa718b;
}
.organize-error {
  color: #ff99ab;
}
.organize-status {
  white-space: pre-wrap;
}
.organize-row {
  border-top: 1px solid #2b3547;
  padding: 12px 0;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.organize-row span {
  flex: 1;
  min-width: 180px;
}
.organize-row small {
  display: block;
  color: #a7b6cf;
}
.organize-toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 0;
}
.organize-chip {
  border: 1px solid #44516a;
  border-radius: 18px;
  padding: 4px 10px;
  font-size: 12px;
}
.organize-fields {
  overflow-wrap: anywhere;
}
.organize-dialog progress {
  width: 100%;
}
.organize-help {
  line-height: 1.7;
}
.organize-fields [data-check] {
  width: auto;
}
.organize-dialog details {
  margin: 12px 0;
}
/* Diálogos heredados comparten ritmo visual y mantienen el scroll dentro de su contenido. */
.panel-internal .modal-box {
  border-radius: 14px;
  max-height: 90vh;
  overflow: auto;
}
.panel-internal .modal-box input,
.panel-internal .modal-box select,
.panel-internal .modal-box textarea {
  box-sizing: border-box;
  min-height: 38px;
}
.panel-internal [aria-invalid="true"] {
  outline: 1px solid #fa718b;
}
.field-validation-error {
  display: block;
  color: #ff99ab;
  font-size: 12px;
  margin-top: 5px;
}
.decision-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 12px;
  background: #1b2130;
  border-radius: 9px;
}
.decision-summary div:last-child {
  grid-column: 1/-1;
}
.decision-summary dt {
  color: #9aa7c2;
  font-size: 12px;
}
.decision-summary dd {
  margin: 4px 0 0;
  overflow-wrap: anywhere;
}

/* Pestaña activa y checklist: mostrar selección y conservar casillas del tamaño de un control. */
.organize-tabs [aria-pressed="true"] {
  background: #234d7a;
  border-color: #7bb6ff;
  box-shadow: inset 0 0 0 1px #7bb6ff;
}
.organize-dialog input[type="checkbox"] {
  width: auto;
  justify-self: start;
}

/* Ventana principal: navegación estable a la izquierda y una sola sección de trabajo a la derecha.

.organize-hub {
  width: min(1120px, 94vw);
  max-height: 90vh;
  border-color: #354158;
  border-radius: 18px;
  box-shadow: 0 24px 100px #0009;
}
.organize-hub > form {
  padding: 0;
}

  align-items: flex-start;
  flex-wrap: nowrap;
}
.organize-eyebrow {
  display: block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.13em;

}
.organize-hub h2 {
  margin-top: 7px;
  font-size: 25px;
  letter-spacing: -0.03em;
}

  margin: 8px 0 0;
  color: #a9b8cd;
  font-size: 13px;
  line-height: 1.6;
}

  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 9px;
  background: #ffffff06;
  font-size: 24px;
}

  display: grid;
  grid-template-columns: 290px minmax(0, 1fr);

}

  display: flex;

  gap: 5px;
  padding: 18px 14px;
  background: #0c131e;

}
.organize-nav-label {
  margin: 6px 12px 8px;
  color: #8799b5;

.organize-nav-label:not(:first-child) {

}

}
.organize-hub .organize-tabs button[aria-pressed="true"] {

}
.organize-tabs button[aria-pressed="true"] svg,

}
.organize-hub .organize-tabs button:hover {
  background: #ffffff06;

.organize-hub .organize-tabs button[aria-pressed="true"]:hover {

}

.organize-content-head h3 {

}
.organize-content section > p {

.organize-content .organize-row button {
  flex-shrink: 0;
  font-size: 12px;
  background: #202d42;
}
.organize-content .organize-status:empty {
  display: none;
}
.organize-content .organize-status:not(:empty) {
  padding: 12px;
  border: 1px solid #556b8d;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
}
.organize-hub button:focus-visible,
.cal-day-more summary:focus-visible {
  outline: 2px solid #ffae68;
  outline-offset: 3px;
}
@media (max-width: 740px) {
  .organize-hub {
    width: 96vw;
    border-radius: 12px;
  }
  .organize-hub .organize-hub-head {
    padding: 20px 16px;
  }
  .organize-hub h2 {
    font-size: 22px;
  }
  .organize-layout {
    grid-template-columns: minmax(0, 1fr);
    min-height: 0;
  }
  .organize-hub .organize-tabs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    padding: 12px;
    border-right: 0;
    border-bottom: 1px solid #29354a;
    gap: 6px;
  }
  .organize-nav-label {
    grid-column: 1 / -1;
    margin: 6px 4px;
  }
  .organize-nav-label:not(:first-child) {
    margin-top: 12px;
  }
  .organize-hub .organize-tabs button {
    gap: 8px;
    padding: 10px 8px;
    align-items: flex-start;
    border-color: #28344a;
  }
  .organize-tabs svg {
    width: 17px;
    height: 17px;
  }
  .organize-tabs strong {
    font-size: 11px;
  }
  .organize-tabs small,
  .organize-nav-arrow {
    display: none;
  }
  .organize-content {
    padding: 20px 16px;
  }
  .organize-content-head h3 {
    font-size: 19px;
  }
}

/* La apertura informa espera y fallo junto al botón y permite volver a intentarlo. */
.organize-load-status {
  flex: 1 1 100%;
  max-width: 520px;
  color: #ffb4a6;
  font-size: 12px;
  line-height: 1.6;
}
.organize-load-status:empty {
  display: none;
}
.organize-toolbar button:disabled {
  cursor: wait;
  opacity: 0.65;
}
